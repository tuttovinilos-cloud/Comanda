<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Organizador de ideas</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>

<style>
:root{
  --azul:#153bff;
  --azulOsc:#0b1f7a;
  --azulClaro:#eef1ff;
  --fondo:#f0f2f9;
  --linea:#d9deea;
  --texto:#111827;
  --gris:#6b7280;
  --verde:#16a34a;
  --amarillo:#f59e0b;
  --rojo:#dc2626;
  --morado:#7c3aed;
  --card:#ffffff;
  --radius:16px;
  --head:'Montserrat',Arial,sans-serif;
  --body:'Inter',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--fondo);color:var(--texto);font-family:var(--body);min-height:100vh;padding-bottom:120px}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer}
.top{background:linear-gradient(135deg,var(--azul),var(--azulOsc));color:white;padding:16px;box-shadow:0 8px 24px rgba(21,59,255,.22)}
.top-inner{max-width:1080px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px}
.logo{font-family:var(--head);font-weight:900;letter-spacing:1.5px;text-transform:uppercase;font-size:18px}
.top-info{text-align:right;font-size:12px;line-height:1.45;opacity:.95}
.wrap{max-width:1080px;margin:18px auto;padding:0 14px}
.card{background:var(--card);border:1px solid var(--linea);border-radius:var(--radius);box-shadow:0 4px 18px rgba(0,0,0,.055);padding:18px;margin-bottom:16px}
.section-title{font-family:var(--head);font-size:12px;font-weight:900;color:var(--azul);letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--azulClaro)}
.dashboard{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.metric{background:var(--azulClaro);border:1px solid #dce3ff;border-radius:14px;padding:14px}
.metric span{display:block;font-size:10px;color:var(--gris);font-weight:900;text-transform:uppercase;letter-spacing:.5px}
.metric b{display:block;font-family:var(--head);font-size:24px;color:var(--azulOsc);margin-top:4px}
.project-list{display:grid;gap:10px}
.project-pill{border:1px solid var(--linea);border-radius:14px;background:#fff;padding:12px;display:grid;grid-template-columns:1.2fr 1fr auto;gap:12px;align-items:center}
.project-name{font-family:var(--head);font-weight:900;color:#111;font-size:14px}
.project-sub{font-size:11px;color:var(--gris);margin-top:3px}
.progress-wrap{height:10px;background:#eef0f6;border-radius:999px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--azul),var(--verde));width:0%}
.icons{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.ico{background:#f3f4f6;border:1px solid #e5e7eb;border-radius:999px;padding:5px 7px;font-size:13px;line-height:1}
.btn{min-height:42px;border-radius:12px;padding:11px 14px;font-family:var(--head);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.35px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn-blue{background:var(--azul);color:#fff}.btn-green{background:var(--verde);color:#fff}.btn-gray{background:#e5e7eb;color:#222}.btn-outline{background:#fff;color:var(--azul);border:2px solid var(--azul)}.btn-red{background:var(--rojo);color:#fff}.btn-mini{min-height:30px;padding:7px 9px;font-size:10px;border-radius:9px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.project-card{overflow:hidden;padding:0}
.project-head{background:linear-gradient(135deg,var(--azul),var(--azulOsc));color:white;padding:14px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.project-title-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.project-title-row input{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.35);color:white;border-radius:10px;padding:9px 10px;font-family:var(--head);font-weight:900;font-size:16px;outline:none;min-width:220px}
.project-title-row input::placeholder{color:rgba(255,255,255,.75)}
.project-body{padding:16px}
.project-meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.field label{display:block;font-size:10px;color:var(--gris);text-transform:uppercase;font-weight:900;letter-spacing:.35px;margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;min-height:42px;border:1.6px solid var(--linea);border-radius:12px;background:#fff;color:#111;outline:none;padding:10px 11px;font-size:14px}
.field textarea{min-height:72px;resize:vertical;line-height:1.4}
.icon-picker{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.icon-check{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--linea);border-radius:999px;padding:7px 9px;font-size:12px;background:#fff;font-weight:800;color:#333}
.icon-check input{width:15px;height:15px;accent-color:var(--azul)}
table{width:100%;border-collapse:collapse;min-width:760px;font-size:13px}th{background:var(--azulClaro);border:1px solid var(--linea);padding:10px 8px;font-family:var(--head);font-size:10px;font-weight:900;text-transform:uppercase;text-align:center}td{border:1px solid var(--linea);padding:7px;background:#fff}tbody tr:nth-child(even) td{background:#f8f9ff}td input,td select{width:100%;border:0;background:transparent;outline:0;padding:6px;font-size:14px}td select{font-weight:800}.table-wrap{overflow-x:auto;border:1px solid var(--linea);border-radius:12px}.num{width:48px;text-align:center;color:var(--rojo);font-family:var(--head);font-weight:900}.status{border-radius:999px;padding:7px 9px;text-align:center}.s-pendiente{color:var(--rojo)}.s-proceso{color:var(--amarillo)}.s-listo{color:var(--verde)}
.fixed{position:fixed;left:0;right:0;bottom:0;z-index:100;background:rgba(255,255,255,.98);border-top:1px solid var(--linea);box-shadow:0 -5px 24px rgba(0,0,0,.09);padding:10px 14px}.fixed-inner{max-width:1080px;margin:auto;display:flex;justify-content:space-between;gap:10px}.fixed-left{display:flex;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:14px;right:14px;bottom:82px;z-index:999;transform:translateY(30px);opacity:0;transition:.24s;background:#111;color:white;border-radius:13px;padding:13px 16px;text-align:center;font-family:var(--head);font-size:13px;font-weight:800;pointer-events:none}.toast.show{transform:translateY(0);opacity:1}.toast.ok{background:var(--verde)}.toast.err{background:var(--rojo)}
@media(max-width:380px){
  .logo{font-size:15px;letter-spacing:1px}
  .top{padding:12px}
  .dashboard{grid-template-columns:1fr}
  .fixed-left{grid-template-columns:1fr}
  body{padding-bottom:190px}
  td{grid-template-columns:78px 1fr}
}

@media(max-width:820px){.dashboard{grid-template-columns:1fr 1fr}.project-pill{grid-template-columns:1fr}.project-meta{grid-template-columns:1fr}.project-head{grid-template-columns:1fr}.fixed-inner{flex-direction:column}.fixed .btn{width:100%}.fixed-left{display:grid;grid-template-columns:1fr 1fr}.top-inner{align-items:flex-start;flex-direction:column}.top-info{text-align:left}}
@media(max-width:460px){
  body{padding-bottom:150px}
  .wrap{padding:0 8px;margin:10px auto}
  .card{padding:12px;border-radius:13px;margin-bottom:12px}
  .section-title{font-size:11px;margin-bottom:10px}
  .dashboard{grid-template-columns:1fr 1fr;gap:8px}
  .metric{padding:10px;border-radius:12px}
  .metric b{font-size:20px}
  .project-pill{padding:10px;gap:8px}
  .project-title-row input{min-width:100%;width:100%;font-size:15px}
  .project-body{padding:12px}
  .project-meta{gap:8px;margin-bottom:10px}
  .icon-picker{gap:6px}
  .icon-check{font-size:11px;padding:7px 8px}
  .actions{display:grid;grid-template-columns:1fr;gap:8px}
  .btn{width:100%;min-height:40px;font-size:10.5px;padding:10px 9px}
  .fixed{padding:8px 10px}
  .fixed-left{grid-template-columns:1fr 1fr;gap:8px}
  .fixed-inner{gap:8px}
  .table-wrap{border:0;overflow:visible}
  table{min-width:0;width:100%;display:block}
  thead{display:none}
  tbody{display:block}
  tr{display:block;border:1px solid var(--linea);border-radius:13px;background:#fff;margin-bottom:10px;overflow:hidden}
  td{display:grid;grid-template-columns:92px 1fr;align-items:center;border:0;border-bottom:1px solid var(--linea);padding:8px;background:#fff!important}
  td:last-child{border-bottom:0}
  td::before{font-family:var(--head);font-size:9px;font-weight:900;color:var(--gris);text-transform:uppercase;letter-spacing:.3px}
  td:nth-child(1)::before{content:'Ítem'}
  td:nth-child(2)::before{content:'Idea'}
  td:nth-child(3)::before{content:'Estado'}
  td:nth-child(4)::before{content:'Resp.'}
  td:nth-child(5)::before{content:'Borrar'}
  .num{width:auto;text-align:left;color:var(--azul)}
  td input,td select{font-size:14px;padding:8px 6px}
  .field textarea{min-height:110px}
}
@media print{.top,.actions,.fixed,.toast,.btn-red,.btn-mini{display:none!important}body{background:white;padding-bottom:0}.wrap{max-width:none;margin:0;padding:0}.card{box-shadow:none;border:0;border-radius:0}.project-head{background:#153bff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.table-wrap{overflow:visible}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div>
      <div class="logo">Organizador de ideas</div>
      <div style="font-size:12px;opacity:.9;margin-top:4px">Tuttovinilos · Proyectos internos · ideas · pendientes</div>
    </div>
    <div class="top-info">
      <div><b>Vista:</b> Dashboard + Proyectos</div>
      <div><b>PDF:</b> general o por proyecto</div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <div class="section-title">Dashboard general</div>
    <div class="dashboard">
      <div class="metric"><span>Proyectos</span><b id="mProjects">0</b></div>
      <div class="metric"><span>Ideas / tareas</span><b id="mTasks">0</b></div>
      <div class="metric"><span>Pendientes</span><b id="mPending">0</b></div>
      <div class="metric"><span>Listas</span><b id="mDone">0</b></div>
    </div>
    <div id="projectList" class="project-list"></div>
    <div class="actions">
      <button class="btn btn-blue" id="addProject">＋ Añadir proyecto</button>
      <button class="btn btn-outline" id="pdfDashboard">⬇ PDF Dashboard</button>
    </div>
  </section>

  <section id="projects"></section>
</main>

<nav class="fixed">
  <div class="fixed-inner">
    <div class="fixed-left">
      <button class="btn btn-blue" id="addProjectFixed">＋ Proyecto</button>
      <button class="btn btn-outline" id="printBtn">🖨 Imprimir</button>
    </div>
    <button class="btn btn-gray" id="saveBtn">💾 Guardar <script>
const $ = (id)=>document.getElementById(id);

/*
  CONFIGURACIÓN SUPABASE
  1) Pega aquí tu URL y ANON KEY.
  2) La tabla debe llamarse: organizador_ideas
  3) Si estos campos quedan vacíos, el archivo seguirá funcionando con localStorage.
*/
const SUPABASE_URL = "PEGA_AQUI_TU_SUPABASE_URL";
const SUPABASE_ANON_KEY = "PEGA_AQUI_TU_SUPABASE_ANON_KEY";
const SUPABASE_TABLE = "organizador_ideas";
const SUPABASE_ROW_ID = 1;

const hasSupabaseConfig =
  SUPABASE_URL &&
  SUPABASE_ANON_KEY &&
  !SUPABASE_URL.includes("PEGA_AQUI") &&
  !SUPABASE_ANON_KEY.includes("PEGA_AQUI");

const supabaseClient = hasSupabaseConfig
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

const ICONS = [
  {key:'cinta', label:'Cinta doble faz', icon:'🧷'},
  {key:'luz', label:'Iluminación', icon:'💡'},
  {key:'corte', label:'Corte', icon:'✂️'},
  {key:'impresion', label:'Impresión', icon:'🖨️'},
  {key:'instalacion', label:'Instalación', icon:'🛠️'},
  {key:'pintura', label:'Pintura', icon:'🎨'},
  {key:'material', label:'Material', icon:'📦'}
];

const RESPONSABLES = ['Chico','Carlos','Ricardo','Alejandro','Ruben','Miguel','Ana'];

const DEFAULT_DATA = {
  projects:[
    {
      name:'OWC',
      priority:1,
      notes:'Proyecto interno con ideas pendientes.',
      projectNotes:'',
      icons:['cinta','luz'],
      tasks:[
        {desc:'Colocar cinta doble faz', status:'Pendiente', responsible:'Chico'},
        {desc:'Definir iluminación', status:'En proceso', responsible:'Carlos'},
        {desc:'Revisar acabado final', status:'Pendiente', responsible:'Ricardo'}
      ]
    },
    {
      name:'Tijeraz',
      priority:2,
      notes:'Pendientes para revisar antes de producir.',
      projectNotes:'',
      icons:['corte','impresion'],
      tasks:[
        {desc:'Añadir corte', status:'Pendiente', responsible:'Alejandro'},
        {desc:'Preparar archivo de impresión', status:'Listo', responsible:'Ruben'}
      ]
    }
  ]
};

let data = structuredClone(DEFAULT_DATA);
let saveTimer = null;
let isLoading = true;

function html(v){
  return String(v||'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;');
}

function showToast(msg,type='ok'){
  const t=$('toast');
  t.textContent=msg;
  t.className='toast '+type+' show';
  setTimeout(()=>t.className='toast',2400);
}

function localBackup(){
  try{
    localStorage.setItem('tv_pendientes_v1', JSON.stringify(data));
  }catch(err){
    console.warn('No se pudo guardar respaldo local', err);
  }
}

function loadLocalBackup(){
  try{
    const raw = localStorage.getItem('tv_pendientes_v1');
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.projects)){
        data = parsed;
        return true;
      }
    }
  }catch(err){
    console.warn('No se pudo leer localStorage', err);
  }
  return false;
}

async function loadFromSupabase(){
  if(!supabaseClient){
    loadLocalBackup();
    isLoading = false;
    normalizeBlankTasks();
    render();
    showToast('Modo local: falta configurar Supabase', 'err');
    return;
  }

  try{
    const { data: row, error } = await supabaseClient
      .from(SUPABASE_TABLE)
      .select('data')
      .eq('id', SUPABASE_ROW_ID)
      .single();

    if(error){
      console.warn('Error cargando Supabase:', error);
      const hadLocal = loadLocalBackup();
      isLoading = false;
      normalizeBlankTasks();
      render();
      showToast(hadLocal ? 'Cargado respaldo local' : 'No cargó Supabase', 'err');
      return;
    }

    if(row && row.data && Array.isArray(row.data.projects)){
      data = row.data;
      localBackup();
    }else{
      data = structuredClone(DEFAULT_DATA);
      await saveToSupabaseNow();
    }

    isLoading = false;
    normalizeBlankTasks();
    render();
    showToast('Datos cargados desde Supabase', 'ok');
  }catch(err){
    console.error(err);
    loadLocalBackup();
    isLoading = false;
    normalizeBlankTasks();
    render();
    showToast('Error cargando Supabase', 'err');
  }
}

async function saveToSupabaseNow(){
  localBackup();

  if(!supabaseClient) return;

  const payload = {
    id: SUPABASE_ROW_ID,
    data: data,
    updated_at: new Date().toISOString()
  };

  const { error } = await supabaseClient
    .from(SUPABASE_TABLE)
    .upsert(payload, { onConflict:'id' });

  if(error){
    console.error('Error guardando Supabase:', error);
    throw error;
  }
}

function save(immediate=false, notify=false){
  clearTimeout(saveTimer);

  const run = async () => {
    if(isLoading) return;
    try{
      await saveToSupabaseNow();
      if(notify) showToast(hasSupabaseConfig ? 'Guardado en Supabase' : 'Guardado local', 'ok');
    }catch(err){
      showToast('Error guardando en Supabase', 'err');
    }
  };

  if(immediate) run();
  else saveTimer = setTimeout(run, 500);
}

function isTaskEmpty(t){
  return !String(t.desc||'').trim() && !String(t.responsible||'').trim() && (t.status||'Pendiente') === 'Pendiente';
}

function realTasks(p){
  return (p.tasks||[]).filter(t=>!isTaskEmpty(t));
}

function ensureBlankTask(pi){
  const p = data.projects[pi];
  if(!p.tasks) p.tasks = [];
  const last = p.tasks[p.tasks.length-1];

  if(!last || !isTaskEmpty(last)){
    p.tasks.push({desc:'',status:'Pendiente',responsible:''});
    save(true);
    render();
  }
}

function normalizeBlankTasks(){
  data.projects.forEach(p=>{
    if(!p.tasks) p.tasks = [];
    p.tasks = p.tasks.filter((t,i)=> !isTaskEmpty(t) || i === p.tasks.length-1);
    const last = p.tasks[p.tasks.length-1];
    if(!last || !isTaskEmpty(last)) p.tasks.push({desc:'',status:'Pendiente',responsible:''});
  });
}

function progress(p){
  const tasks = realTasks(p);
  const total = tasks.length || 0;
  if(!total) return 0;
  return Math.round((tasks.filter(t=>t.status==='Listo').length/total)*100);
}

function projectIcons(p){
  return (p.icons||[])
    .map(k=>ICONS.find(i=>i.key===k)?.icon)
    .filter(Boolean)
    .map(i=>`<span class="ico">${i}</span>`)
    .join('');
}

function render(){
  normalizeBlankTasks();

  const projects=[...data.projects].sort((a,b)=>Number(a.priority||99)-Number(b.priority||99));
  const allTasks=data.projects.flatMap(p=>realTasks(p));

  $('mProjects').textContent=data.projects.length;
  $('mTasks').textContent=allTasks.length;
  $('mPending').textContent=allTasks.filter(t=>t.status!=='Listo').length;
  $('mDone').textContent=allTasks.filter(t=>t.status==='Listo').length;

  $('projectList').innerHTML=projects.map((p)=>{
    const realIndex=data.projects.indexOf(p);
    const pr=progress(p);
    return `
      <div class="project-pill">
        <div>
          <div class="project-name">${html(p.name||'Proyecto sin nombre')}</div>
          <div class="project-sub">${realTasks(p).length} ideas · Prioridad ${p.priority||'-'} · ${pr}% listo</div>
          <div class="icons">${projectIcons(p)}</div>
        </div>
        <div>
          <div class="progress-wrap"><div class="progress-bar" style="width:${pr}%"></div></div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
          <button class="btn btn-gray btn-mini" onclick="moveProject(${realIndex},-1)">↑</button>
          <button class="btn btn-gray btn-mini" onclick="moveProject(${realIndex},1)">↓</button>
          <button class="btn btn-outline btn-mini" onclick="pdfProject(${realIndex})">PDF</button>
        </div>
      </div>`;
  }).join('');

  $('projects').innerHTML=projects.map((p)=>renderProject(p,data.projects.indexOf(p))).join('');
}

function renderProject(p,pi){
  const iconPicker=ICONS.map(ic=>`
    <label class="icon-check">
      <input type="checkbox" ${p.icons?.includes(ic.key)?'checked':''} onchange="toggleIcon(${pi},'${ic.key}',this.checked)">
      ${ic.icon} ${ic.label}
    </label>`).join('');

  const rows=p.tasks.map((t,ti)=>`
    <tr>
      <td class="num">${ti+1}</td>
      <td>
        <input value="${html(t.desc)}" placeholder="Idea o tarea pendiente" oninput="updateTaskSilent(${pi},${ti},'desc',this.value)" onblur="ensureBlankTask(${pi})">
      </td>
      <td>
        <select onchange="updateTask(${pi},${ti},'status',this.value)" class="status ${t.status==='Listo'?'s-listo':t.status==='En proceso'?'s-proceso':'s-pendiente'}">
          <option ${t.status==='Pendiente'?'selected':''}>Pendiente</option>
          <option ${t.status==='En proceso'?'selected':''}>En proceso</option>
          <option ${t.status==='Listo'?'selected':''}>Listo</option>
        </select>
      </td>
      <td>
        <select onchange="updateTaskSilent(${pi},${ti},'responsible',this.value); ensureBlankTask(${pi})">
          <option value="">Seleccionar</option>
          ${RESPONSABLES.map(r=>`<option value="${r}" ${t.responsible===r?'selected':''}>${r}</option>`).join('')}
        </select>
      </td>
      <td style="text-align:center">
        <button class="btn btn-red btn-mini" onclick="removeTask(${pi},${ti})">✕</button>
      </td>
    </tr>`).join('');

  return `
    <section class="card project-card">
      <div class="project-head">
        <div>
          <div class="project-title-row">
            <input value="${html(p.name)}" placeholder="Nombre del proyecto" oninput="updateProjectSilent(${pi},'name',this.value)">
            <span style="font-family:var(--head);font-weight:900">${progress(p)}% listo</span>
          </div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
          <button class="btn btn-green btn-mini" onclick="addTask(${pi})">＋ Añadir idea</button>
          <button class="btn btn-outline btn-mini" onclick="pdfProject(${pi})">PDF Proyecto</button>
          <button class="btn btn-red btn-mini" onclick="removeProject(${pi})">Eliminar</button>
        </div>
      </div>

      <div class="project-body">
        <div class="project-meta">
          <div class="field">
            <label>Prioridad</label>
            <input type="number" min="1" value="${html(p.priority)}" onchange="updateProject(${pi},'priority',Number(this.value||1))">
          </div>
          <div class="field">
            <label>Notas rápidas</label>
            <input value="${html(p.notes)}" placeholder="Resumen del proyecto" oninput="updateProjectSilent(${pi},'notes',this.value)">
          </div>
          <div class="field">
            <label>Vista previa de lo que incluye</label>
            <div class="icons">${projectIcons(p)||'<span class="ico">Sin iconos</span>'}</div>
          </div>
        </div>

        <div class="field">
          <label>Iconos del proyecto</label>
          <div class="icon-picker">${iconPicker}</div>
        </div>

        <div style="height:14px"></div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>#</th><th>Idea / pendiente</th><th>Estado</th><th>Responsable</th><th>✕</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>

        <div style="height:14px"></div>

        <div class="field">
          <label>Notas del proyecto</label>
          <textarea placeholder="Escribe notas, observaciones, detalles o recordatorios de este proyecto..." oninput="updateProjectSilent(${pi},'projectNotes',this.value)">${html(p.projectNotes || '')}</textarea>
        </div>

        <div class="actions">
          <button class="btn btn-blue" onclick="addTask(${pi})">＋ Añadir idea</button>
        </div>
      </div>
    </section>`;
}

function updateProject(pi,field,value){
  data.projects[pi][field]=value;
  save(true);
  render();
}

function updateTask(pi,ti,field,value){
  data.projects[pi].tasks[ti][field]=value;
  save(true);
  render();
}

function updateProjectSilent(pi,field,value){
  data.projects[pi][field]=value;
  save(false);
}

function updateTaskSilent(pi,ti,field,value){
  data.projects[pi].tasks[ti][field]=value;
  save(false);
}

function addProject(){
  data.projects.push({
    name:'Nuevo proyecto',
    priority:data.projects.length+1,
    notes:'',
    projectNotes:'',
    icons:[],
    tasks:[{desc:'',status:'Pendiente',responsible:''}]
  });
  save(true);
  render();
}

function removeProject(pi){
  if(!confirm('¿Eliminar este proyecto?')) return;
  data.projects.splice(pi,1);
  save(true);
  render();
}

function addTask(pi){
  data.projects[pi].tasks.push({desc:'',status:'Pendiente',responsible:''});
  save(true);
  render();
}

function removeTask(pi,ti){
  data.projects[pi].tasks.splice(ti,1);
  save(true);
  render();
}

function toggleIcon(pi,key,checked){
  const icons=data.projects[pi].icons||[];
  data.projects[pi].icons=checked ? [...new Set([...icons,key])] : icons.filter(i=>i!==key);
  save(true);
  render();
}

function moveProject(pi,dir){
  const ni=pi+dir;
  if(ni<0||ni>=data.projects.length) return;
  [data.projects[pi],data.projects[ni]]=[data.projects[ni],data.projects[pi]];
  data.projects.forEach((p,i)=>p.priority=i+1);
  save(true);
  render();
}

function pdfBase(title){
  if(!window.jspdf || !window.jspdf.jsPDF){
    showToast('No cargó la librería PDF', 'err');
    return null;
  }

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'letter'});
  const W=doc.internal.pageSize.getWidth();

  doc.setFillColor(21,59,255);
  doc.rect(0,0,W,28,'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold');
  doc.setFontSize(16);
  doc.text('TUTTO VINILOS',14,12);
  doc.setFontSize(10);
  doc.text(title,W-14,12,{align:'right'});
  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  doc.text('Ideas y pendientes internos',14,20);

  return doc;
}

function pdfDashboard(){
  const doc=pdfBase('DASHBOARD GENERAL');
  if(!doc) return;

  const rows=data.projects.map(p=>[
    p.name,
    p.priority||'',
    realTasks(p).length,
    progress(p)+'%',
    (p.icons||[]).map(k=>ICONS.find(i=>i.key===k)?.label).filter(Boolean).join(', ')
  ]);

  doc.autoTable({
    startY:38,
    head:[['Proyecto','Prioridad','Ideas','Progreso','Incluye']],
    body:rows,
    theme:'grid',
    styles:{fontSize:8,cellPadding:3},
    headStyles:{fillColor:[238,241,255],textColor:[17,17,17]}
  });

  doc.save('Dashboard_Pendientes_Tuttovinilos.pdf');
}

function pdfProject(pi){
  const p=data.projects[pi];
  const doc=pdfBase('PROYECTO: '+(p.name||''));
  if(!doc) return;

  let y=38;
  doc.setTextColor(17,17,17);
  doc.setFont('helvetica','bold');
  doc.setFontSize(12);
  doc.text(p.name||'Proyecto',14,y);

  doc.setFont('helvetica','normal');
  doc.setFontSize(9);
  doc.text('Prioridad: '+(p.priority||'-')+'   Progreso: '+progress(p)+'%',14,y+7);
  doc.text('Incluye: '+((p.icons||[]).map(k=>ICONS.find(i=>i.key===k)?.label).filter(Boolean).join(', ')||'—'),14,y+14);

  if(p.notes) doc.text(doc.splitTextToSize('Notas: '+p.notes,180),14,y+21);

  const start=p.notes ? y+34 : y+26;
  const rows=realTasks(p).map((t,i)=>[i+1,t.desc||'',t.status||'',t.responsible||'']);

  doc.autoTable({
    startY:start,
    head:[['#','Idea / pendiente','Estado','Responsable']],
    body:rows,
    theme:'grid',
    styles:{fontSize:8.5,cellPadding:3},
    headStyles:{fillColor:[238,241,255],textColor:[17,17,17]}
  });

  doc.save('Proyecto_'+(p.name||'sin_nombre').replace(/[^\wáéíóúÁÉÍÓÚñÑ-]+/g,'_')+'.pdf');
}

$('addProject').onclick=addProject;
$('addProjectFixed').onclick=addProject;
$('pdfDashboard').onclick=pdfDashboard;
$('printBtn').onclick=()=>window.print();
$('saveBtn').onclick=()=>save(true,true);

loadFromSupabase();
</script>
ck=()=>{save();showToast('Guardado en este navegador')};
render();
</script>
</body>
</html>
