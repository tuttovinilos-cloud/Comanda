<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nuevo Proyecto</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-10">

<script>
if (!localStorage.getItem("user")) {
  window.location.href = "login.html";
}
</script>

<div class="max-w-5xl mx-auto bg-white p-8 rounded-2xl shadow">

<h1 class="text-3xl font-bold mb-8">📋 Nuevo Proyecto</h1>

<form id="formProyecto">

<h2 class="text-xl font-semibold mb-4">Datos Básicos</h2>

<div class="grid grid-cols-3 gap-4 mb-6">
<div>
<label>Nombre Proyecto</label>
<input id="nombre" class="w-full border p-2 rounded" required>
</div>

<div>
<label>Cliente</label>
<input id="cliente" class="w-full border p-2 rounded" required>
</div>

<div>
<label>Teléfono</label>
<input id="telefono" class="w-full border p-2 rounded">
</div>
</div>

<h2 class="text-xl font-semibold mb-4">Tipo y Material</h2>

<div class="grid grid-cols-3 gap-4 mb-6">
<div>
<label>Tipo Proyecto</label>
<input class="w-full border p-2 rounded bg-gray-100"
value="Corpóreos" readonly>
</div>

<div>
<label>Material</label>
<input id="material" class="w-full border p-2 rounded"
placeholder="Ej: PVC 9mm + Acrílico">
</div>

<div>
<label>¿Lleva luz LED?</label>
<select id="luz" class="w-full border p-2 rounded">
<option>No</option>
<option>Si</option>
</select>
</div>
</div>

<h2 class="text-xl font-semibold mb-4">Fechas y Urgencia</h2>

<div class="grid grid-cols-3 gap-4 mb-6">
<div>
<label>Fecha Creación</label>
<input id="fechaCreacion" type="date"
class="w-full border p-2 rounded" readonly>
</div>

<div>
<label>Fecha Entrega</label>
<input id="fechaEntrega" type="date"
class="w-full border p-2 rounded" required>
</div>

<div>
<label>Urgencia</label>
<select id="urgencia" class="w-full border p-2 rounded">
<option>Baja</option>
<option>Media</option>
<option>Alta</option>
<option>URGENTE</option>
</select>
</div>
</div>

<h2 class="text-xl font-semibold mb-4">Archivos</h2>

<div class="mb-6">
<input type="file" id="archivos" multiple
class="w-full border p-2 rounded">
</div>

<div class="mb-6">
<label>Notas</label>
<textarea id="notas"
class="w-full border p-2 rounded h-24"></textarea>
</div>

<button type="submit"
class="bg-red-600 text-white w-full p-4 rounded-xl font-semibold">
✔ Crear Proyecto
</button>

</form>
</div>

<script>

const today = new Date().toISOString().split("T")[0];
document.getElementById("fechaCreacion").value = today;

document.getElementById("formProyecto").addEventListener("submit", function(e) {
e.preventDefault();

let proyecto = {
id: "PR-" + Date.now(),
nombre: nombre.value,
cliente: cliente.value,
telefono: telefono.value,
material: material.value,
luz: luz.value,
fechaCreacion: fechaCreacion.value,
fechaEntrega: fechaEntrega.value,
urgencia: urgencia.value,
estado: "Solicitud",
precio: 0,
archivos: [],
notas: notas.value
};

let files = archivos.files;
for (let i = 0; i < files.length; i++) {
proyecto.archivos.push(files[i].name);
}

let proyectos = JSON.parse(localStorage.getItem("proyectos")) || [];
proyectos.push(proyecto);
localStorage.setItem("proyectos", JSON.stringify(proyectos));

window.location.href = "proyectos-lista.html";
});

</script>

</body>
</html>
