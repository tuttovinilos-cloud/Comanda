<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Organizador de ideas · Comanda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0f14;--panel:#13161d;--panel2:#181c26;--border:#1e2330;--border2:#2a3048;--text:#e2e8f0;--muted:#64748b;--muted2:#94a3b8;--accent:#3b82f6;--accent2:#60a5fa;--green:#30D158;--red:#FF3B30;--head:'Barlow Condensed',sans-serif;--body:'Barlow',sans-serif}
body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;padding-bottom:90px}
#authTopbar{display:none!important}
.header{background:var(--panel);border-bottom:2px solid var(--accent);padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:58px;position:sticky;top:0;z-index:300;box-shadow:0 4px 24px #0009;flex-wrap:wrap}
.logo{font-family:var(--head);font-size:21px;font-weight:900;letter-spacing:3px;color:var(--accent2);text-transform:uppercase;white-space:nowrap}
.logo small{color:var(--muted);font-weight:400;font-size:11px;letter-spacing:1px;margin-left:6px}
.mobile-menu-btn{display:none;font-family:var(--head);font-size:12px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;padding:8px 12px;border:1px solid var(--border2);background:var(--panel2);color:var(--accent2);border-radius:7px;cursor:pointer;margin-left:auto}
.header-tabs{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap}
.tab-btn,.menu-status{font-family:var(--head);font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:7px 14px;border:1px solid var(--border2);background:transparent;color:var(--muted2);cursor:pointer;border-radius:6px;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px}
.tab-btn:hover{border-color:var(--accent);color:var(--accent2);background:#3b82f611}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 14px #3b82f644}
.toolbar{display:flex;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
.btn{font-family:var(--head);font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:9px 14px;background:var(--accent);color:#fff;border:none;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.secondary{background:transparent;color:var(--muted2);border:1px solid var(--border2)}
.layout{padding:16px;display:grid;gap:16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.metric{background:var(--panel);border:1px solid var(--border2);border-radius:10px;padding:12px}
.metric b{display:block;font-family:var(--head);font-size:24px;color:var(--accent2)}
.metric span{color:var(--muted2);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.card{background:var(--panel);border:1px solid var(--border2);border-radius:12px;overflow:hidden;box-shadow:0 10px 30px #0004;padding:14px}
.card-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
.project-name{background:var(--bg);border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:8px 10px;font-family:var(--head);font-size:18px;font-weight:900;letter-spacing:1px;width:100%}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.mini-btn{border:1px solid var(--border2);background:transparent;color:var(--muted2);border-radius:6px;padding:7px 10px;cursor:pointer;font-family:var(--head);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.mini-btn.del{background:#FF3B3011;border-color:#FF3B3044;color:#FF3B30}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.meta-grid label{display:flex;flex-direction:column;gap:6px;color:var(--muted2);font-size:11px;text-transform:uppercase}
input,select{background:var(--bg);border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:8px 10px;outline:none}
.table-wrap{overflow-x:auto;border:1px solid var(--border2);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:760px}
th{background:var(--panel2);color:var(--muted);font-family:var(--head);font-size:10px;letter-spacing:1px;text-transform:uppercase;text-align:left;padding:9px;border-bottom:1px solid var(--border2)}
td{padding:8px;border-bottom:1px solid var(--border)}
.empty{color:var(--muted);padding:20px;text-align:center;font-family:var(--head);letter-spacing:1px;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border2);padding:10px 14px;border-radius:10px;display:none}
.toast.show{display:block}
.toast.ok{color:#86efac;border-color:#166534}
.toast.warn{color:#fbbf24;border-color:#92400e}
@media(max-width:760px){.mobile-menu-btn{display:inline-flex;align-items:center;justify-content:center}.header-tabs{display:none;width:100%;margin-left:0;padding-top:10px;border-top:1px solid var(--border)}.header-tabs.open{display:grid;grid-template-columns:1fr;gap:8px}.tab-btn{width:100%}.grid{grid-template-columns:1fr 1fr}.meta-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header">
  <div class="logo">COMANDA<small>ORGANIZADOR</small></div>
  <button class="mobile-menu-btn" id="mobileMenuBtn" type="button">? Menú</button>
  <nav class="header-tabs" id="authMenu">
    <a class="tab-btn" href="index.html">?? Pedidos</a>
    <a class="tab-btn" href="clientes.html">?? Clientes</a>
    <a class="tab-btn" href="materiales.html">?? Materiales</a>
    <a class="tab-btn" href="estadisticas.html">?? Estadísticas</a>
    <a class="tab-btn" href="marketing.html">?? Marketing</a>
    <a class="tab-btn" href="Cotizador.html">?? Cotizador</a>
    <a class="tab-btn active" href="Organizador de ideas.html">?? Organizador</a>
    <a class="tab-btn" href="configuracion.html">?? Configuración</a>
    <button class="tab-btn" type="button" onclick="localStorage.removeItem('comanda_operador_actual'); location.href='login.html?logout=1';">Salir</button>
  </nav>
</header>

<div class="toolbar">
  <button class="btn" id="addProjectBtn">+ Proyecto</button>
  <button class="btn secondary" id="saveBtn">Guardar</button>
</div>

<main class="layout">
  <section class="grid">
    <div class="metric"><b id="mProjects">0</b><span>Proyectos</span></div>
    <div class="metric"><b id="mTasks">0</b><span>Tareas</span></div>
    <div class="metric"><b id="mPending">0</b><span>Pendientes</span></div>
    <div class="metric"><b id="mDone">0</b><span>Listas</span></div>
  </section>

  <section id="projects"></section>
</main>

<div class="toast" id="orgToast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=24"></script>
<script src="js/auth.js?v=24"></script>
<script src="js/organizador.js?v=24"></script>
<script>
document.addEventListener("DOMContentLoaded", function(){
  const btn = document.getElementById("mobileMenuBtn");
  const menu = document.getElementById("authMenu");
  if(btn && menu){ btn.addEventListener("click", function(){ menu.classList.toggle("open"); }); }
});
</script>
</body>
</html>
