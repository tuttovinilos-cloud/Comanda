<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TUTTOPROYECTO · Organizador</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:#153bff;
  --azul2:#0b1f7a;
  --bg:#f3f5fb;
  --card:#fff;
  --line:#dbe2f2;
  --line2:#c6d0e4;
  --text:#101827;
  --muted:#667085;
  --soft:#f1f4fa;
  --red:#dc2626;
  --redbg:#fee2e2;
  --green:#16a34a;
  --greenbg:#dcfce7;
  --yellow:#d97706;
  --yellowbg:#fef3c7;
  --black:#111827;
  --orange:#ff8616;
  --shadow:0 14px 35px rgba(15,23,42,.08);
  --head:'Montserrat',Arial,sans-serif;
  --body:'Inter',Arial,sans-serif;
  --mono:'Roboto Mono',monospace;
}
body{
  font-family:var(--body);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:90px;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

/* MENU */
.top{
  background:#fff;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 8px 24px rgba(15,23,42,.06);
}
.top-inner{
  max-width:1440px;
  margin:0 auto;
  padding:10px 16px;
  display:flex;
  align-items:center;
  gap:14px;
}
.logo img{
  height:42px;
  display:block;
}
.top-info{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  font-size:11px;
  color:var(--muted);
}
.app-menu-btn{
  display:none;
  margin-left:auto;
  border:none;
  background:var(--azul);
  color:#fff;
  border-radius:12px;
  padding:10px 12px;
  font-weight:900;
}
.app-menu{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:6px;
  overflow-x:auto;
}
.app-menu a,
.app-menu button{
  border:none;
  border-radius:999px;
  padding:8px 10px;
  background:#f1f4fa;
  color:var(--azul2);
  font-family:var(--head);
  font-size:9px;
  font-weight:900;
  text-transform:uppercase;
  white-space:nowrap;
}
.app-menu a.active{
  background:var(--azul);
  color:#fff;
}
.app-menu button{
  background:#111827;
  color:#fff;
}

/* LAYOUT */
.wrap{
  max-width:1440px;
  margin:0 auto;
  padding:10px 16px 16px;
}
.kpis{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
  margin-bottom:14px;
}
.kpi{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:14px;
  box-shadow:0 8px 24px rgba(15,23,42,.055);
  position:relative;
  overflow:hidden;
}
.kpi:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:5px;
  background:var(--azul);
}
.kpi.red:before{background:var(--red)}
.kpi.green:before{background:var(--green)}
.kpi.yellow:before{background:var(--yellow)}
.kpi.black:before{background:var(--black)}
.kpi.orange:before{background:var(--orange)}
.kpi small{
  display:block;
  color:var(--muted);
  font-family:var(--head);
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:5px;
}
.kpi strong{
  font-family:var(--head);
  font-size:28px;
  color:var(--azul2);
}

.toolbar{
  background:#fff;
  border:1px solid var(--line);
  border-radius:24px;
  padding:10px;
  box-shadow:var(--shadow);
  display:grid;
  grid-template-columns:1.5fr repeat(4,minmax(120px,.45fr));
  gap:8px;
  position:sticky;
  top:72px;
  z-index:900;
  margin-bottom:14px;
}
.field{
  width:100%;
  border:1px solid var(--line2);
  background:#fff;
  border-radius:14px;
  padding:11px 12px;
  color:var(--text);
  outline:none;
  font-size:13px;
}
.field:focus{
  border-color:var(--azul);
  box-shadow:0 0 0 3px rgba(21,59,255,.12);
}

.layout{
  display:grid;
  grid-template-columns:1fr 340px;
  gap:14px;
}
.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.panel-head{
  padding:14px 16px;
  background:linear-gradient(180deg,#fff,#f7f8ff);
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.panel-title{
  font-family:var(--head);
  font-size:20px;
  font-weight:900;
  color:var(--azul2);
}
.panel-sub{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}
.btn{
  border:none;
  border-radius:15px;
  padding:12px 14px;
  background:var(--azul);
  color:#fff;
  font-family:var(--head);
  font-weight:900;
  font-size:12px;
  box-shadow:0 10px 24px rgba(21,59,255,.18);
}
.btn.secondary{
  background:#fff;
  color:var(--azul2);
  border:1px solid var(--line2);
  box-shadow:none;
}
.btn.danger{background:var(--red)}
.btn.full{width:100%}

/* PROYECTOS */
.projects{
  padding:12px;
  display:grid;
  gap:12px;
}
.project{
  border:1px solid var(--line);
  border-radius:22px;
  background:#fff;
  overflow:hidden;
  transition:.2s;
}
.project.open{
  border-color:#b9c6ff;
  box-shadow:0 14px 36px rgba(21,59,255,.09);
}
.project-summary{
  display:grid;
  grid-template-columns:54px 1fr auto auto auto 42px;
  gap:12px;
  align-items:center;
  padding:13px;
  cursor:pointer;
}
.num{
  height:44px;
  width:44px;
  border-radius:15px;
  background:linear-gradient(135deg,var(--azul),var(--azul2));
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-family:var(--mono);
  font-size:13px;
  font-weight:800;
}
.project-name{min-width:0}
.project-name h2{
  font-family:var(--head);
  font-size:18px;
  font-weight:900;
  color:var(--text);
  line-height:1.1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.mini{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:7px;
}
.chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#f8f9ff;
  padding:5px 8px;
  font-size:11px;
  color:#475467;
  font-weight:700;
}
.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  padding:8px 10px;
  font-family:var(--head);
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  min-width:86px;
  border:1px solid transparent;
}
.st-solicitud{background:var(--redbg);color:var(--red);border-color:#fecaca}
.st-pendiente{background:#fff7ed;color:#ea580c;border-color:#fed7aa}
.st-curso{background:#111827;color:#fff;border-color:#111827}
.st-revision{background:var(--yellowbg);color:#92400e;border-color:#fde68a}
.st-listo{background:var(--greenbg);color:#166534;border-color:#bbf7d0}
.st-entregado{background:#e0f2fe;color:#075985;border-color:#bae6fd}
.st-bloqueado{background:#f3e8ff;color:#6d28d9;border-color:#ddd6fe}
.meter{width:104px}
.meter-label{
  font-family:var(--mono);
  font-size:11px;
  font-weight:800;
  color:var(--azul2);
  text-align:right;
  margin-bottom:5px;
}
.bar{
  height:9px;
  border-radius:999px;
  background:#e9edf7;
  overflow:hidden;
}
.bar span{
  height:100%;
  display:block;
  background:linear-gradient(90deg,var(--azul),#6d28d9);
  border-radius:999px;
}
.datebox{
  text-align:center;
  border:1px solid var(--line);
  border-radius:14px;
  padding:8px 10px;
  background:#f8f9ff;
  min-width:88px;
}
.datebox small{
  display:block;
  font-size:9px;
  color:var(--muted);
  font-weight:900;
  text-transform:uppercase;
}
.datebox strong{
  font-family:var(--mono);
  font-size:12px;
}
.toggle{
  width:38px;
  height:38px;
  border:1px solid var(--line2);
  border-radius:13px;
  background:#fff;
  color:var(--azul);
  font-weight:900;
  font-size:18px;
}
.project.open .toggle{transform:rotate(180deg)}

.detail{
  display:none;
  background:#f7f8ff;
  border-top:1px solid var(--line);
  padding:14px;
}
.project.open .detail{display:block}
.detail-grid{
  display:grid;
  grid-template-columns:350px 1fr;
  gap:12px;
}
.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:14px;
}
.card h3{
  font-family:var(--head);
  font-size:12px;
  font-weight:900;
  color:var(--azul);
  text-transform:uppercase;
  margin-bottom:10px;
  letter-spacing:.04em;
}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.form-grid .wide{grid-column:1/-1}
.label{
  font-size:10px;
  font-weight:900;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:4px;
  display:block;
}
.mini-input{
  width:100%;
  border:1px solid var(--line2);
  background:#fff;
  border-radius:12px;
  padding:9px 10px;
  font-size:12px;
  outline:none;
}
textarea.mini-input{
  min-height:74px;
  resize:vertical;
}
.tabs{
  display:flex;
  gap:6px;
  border-bottom:1px solid var(--line);
  margin:-2px -2px 12px;
  padding:0 2px;
  overflow-x:auto;
}
.tab{
  border:none;
  background:transparent;
  border-bottom:3px solid transparent;
  padding:10px 8px;
  font-family:var(--head);
  font-size:11px;
  font-weight:900;
  color:var(--muted);
  white-space:nowrap;
}
.tab.active{
  color:var(--azul);
  border-color:var(--azul);
}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ITEMS */
.items{
  display:grid;
  gap:12px;
}
.item{
  border:1px solid var(--line);
  background:#fff;
  border-radius:18px;
  padding:12px;
}
.item-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:10px;
}
.item-title{
  font-family:var(--head);
  font-size:15px;
  font-weight:900;
}
.item-sub{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}
.item-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.process-list{
  display:grid;
  gap:8px;
  margin-top:10px;
}
.process{
  display:grid;
  grid-template-columns:28px 1fr 150px auto;
  gap:8px;
  align-items:center;
  border:1px solid var(--line);
  border-radius:14px;
  background:#f8f9ff;
  padding:8px;
}
.process input[type="checkbox"]{
  width:18px;
  height:18px;
  accent-color:var(--azul);
}
.process.done .process-name{
  text-decoration:line-through;
  color:var(--muted);
}
.process-name{
  font-size:13px;
  font-weight:800;
}
.small-btn{
  border:none;
  border-radius:11px;
  background:var(--soft);
  color:var(--azul2);
  font-weight:900;
  padding:8px 9px;
  font-size:11px;
}
.small-btn.blue{
  background:var(--azul);
  color:#fff;
}
.small-btn.red{
  background:var(--redbg);
  color:var(--red);
}
.add-row{
  display:grid;
  grid-template-columns:1fr 150px auto;
  gap:8px;
  margin-top:10px;
  border:1px dashed var(--line2);
  border-radius:15px;
  background:#fff;
  padding:8px;
}
.notes{
  display:grid;
  gap:8px;
}
.note{
  border:1px solid var(--line);
  background:#fff;
  border-radius:14px;
  padding:11px;
  font-size:13px;
  color:#344054;
  line-height:1.4;
}

/* SIDE */
.side{
  display:grid;
  gap:14px;
  align-content:start;
}
.side .panel{
  position:sticky;
  top:132px;
}
.timeline{
  display:grid;
  gap:8px;
  padding:12px;
}
.tl{
  display:grid;
  grid-template-columns:32px 1fr;
  gap:8px;
  align-items:flex-start;
}
.tl-dot{
  width:28px;
  height:28px;
  border-radius:10px;
  background:#e9edff;
  color:var(--azul);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}
.tl strong{font-size:12px}
.tl p{
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}
.empty{
  padding:28px;
  text-align:center;
  color:var(--muted);
  font-weight:700;
}

/* DRAWER */
.drawer-backdrop{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.35);
  z-index:2000;
  display:none;
}
.drawer-backdrop.show{display:block}
.drawer{
  position:fixed;
  right:0;
  top:0;
  bottom:0;
  width:min(470px,94vw);
  background:#fff;
  z-index:2100;
  box-shadow:-20px 0 60px rgba(15,23,42,.25);
  transform:translateX(104%);
  transition:.22s;
  padding:16px;
  overflow:auto;
}
.drawer.show{transform:translateX(0)}
.drawer-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}
.drawer h2{
  font-family:var(--head);
  color:var(--azul2);
  font-size:20px;
}
.close{
  border:none;
  background:#f1f4fa;
  border-radius:12px;
  width:38px;
  height:38px;
  font-weight:900;
}
.fab{
  position:fixed;
  right:18px;
  bottom:18px;
  width:58px;
  height:58px;
  border:none;
  border-radius:50%;
  background:linear-gradient(135deg,var(--azul),var(--azul2));
  color:#fff;
  font-size:30px;
  box-shadow:0 18px 34px rgba(21,59,255,.3);
  z-index:1500;
}
.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%) translateY(30px);
  background:#111827;
  color:#fff;
  border-radius:999px;
  padding:12px 16px;
  font-size:12px;
  font-weight:800;
  opacity:0;
  pointer-events:none;
  transition:.22s;
  z-index:3000;
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media(max-width:1180px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .toolbar{grid-template-columns:1fr 1fr 1fr}
  .layout{grid-template-columns:1fr}
  .side{display:none}
  .detail-grid{grid-template-columns:1fr}
}
@media(max-width:760px){
  .top-inner{padding:8px 10px}
  .logo img{height:34px}
  .top-info{display:none}
  .app-menu-btn{display:block}
  .app-menu{
    display:none;
    position:absolute;
    left:10px;
    right:10px;
    top:58px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:18px;
    padding:10px;
    flex-direction:column;
    align-items:stretch;
    box-shadow:var(--shadow);
  }
  .app-menu.open{display:flex}
  .app-menu a,.app-menu button{
    text-align:left;
    font-size:11px;
    padding:11px 12px;
  }
  .wrap{padding:8px}
  .kpis{
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }
  .kpi{
    padding:10px 8px;
    border-radius:14px;
  }
  .kpi small{font-size:8px}
  .kpi strong{font-size:20px}
  .toolbar{
    top:58px;
    grid-template-columns:repeat(4,1fr);
    padding:8px;
    border-radius:18px;
  }
  .toolbar .search{grid-column:1/-1}
  .toolbar select{
    font-size:10px;
    padding:9px 6px;
  }
  .project-summary{
    grid-template-columns:44px 1fr 38px;
    gap:8px;
    padding:10px;
  }
  .project-summary>.badge,
  .project-summary>.meter,
  .project-summary>.datebox{display:none}
  .num{
    height:38px;
    width:38px;
    border-radius:13px;
    font-size:12px;
  }
  .project-name h2{font-size:16px}
  .mini .chip:nth-child(n+4){display:none}
  .detail{padding:10px}
  .form-grid,
  .item-grid{grid-template-columns:1fr}
  .process{
    grid-template-columns:28px 1fr;
  }
  .process select,
  .process button{
    grid-column:1/-1;
  }
  .add-row{grid-template-columns:1fr}
  .drawer{width:100vw}
  .fab{right:12px;bottom:12px}
}
</style>
</head>

<body>

<header class="top">
  <div class="top-inner">
    <div class="logo" aria-label="Tutto Vinilos">
      <img src="img/logo-tutto.svg?v=10" alt="Tutto Vinilos">
    </div>

    <div class="top-info">
      <div><b>Tel:</b> +58 414-4961122</div>
      <div><b>Email:</b> tuttovinilos@gmail.com</div>
      <div><b>RIF:</b> J-40218250-3</div>
    </div>

    <button class="app-menu-btn" id="mobileMenuBtn" type="button">☰ Menú</button>

    <nav class="app-menu" id="authMenu">
      <a href="index.html">📋 Pedidos</a>
      <a href="clientes.html">👤 Clientes</a>
      <a href="materiales.html">💲 Materiales</a>
      <a href="estadisticas.html">📊 Estadísticas</a>
      <a href="marketing.html">📣 Marketing</a>
      <a href="cotizador.html">🧾 Cotizador</a>
      <a class="active" href="Organizador%20de%20ideas.html">🚀 TUTTOPROYECTO</a>
      <a href="configuracion.html">⚙️ Configuración</a>
      <button type="button" onclick="localStorage.removeItem('comanda_operador_actual'); location.href='login.html?logout=1';">Salir</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <section class="kpis" id="kpis"></section>

  <section class="toolbar">
    <input id="q" class="field search" placeholder="Buscar proyecto, cliente, ítem, proceso o responsable..." oninput="render()" />
    <select id="filterStatus" class="field" onchange="render()"><option value="">Estados</option></select>
    <select id="filterResp" class="field" onchange="render()"><option value="">Responsables</option></select>
    <select id="filterLight" class="field" onchange="render()"><option value="">Luz</option><option>Sí</option><option>No</option><option>Por definir</option></select>
    <select id="sortBy" class="field" onchange="render()"><option value="entrega">Entrega</option><option value="estado">Estado</option><option value="progreso">Progreso</option><option value="nombre">Nombre</option></select>
  </section>

  <main class="layout">
    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">Proyectos activos</div>
      </div>
      <div class="projects" id="projects"></div>
    </section>

    <aside class="side">
      <section class="panel">
        <div class="panel-head">
          <div class="panel-title">Prioridades</div>
        </div>
        <div class="timeline" id="todayList"></div>
      </section>
    </aside>
  </main>
</div>

<div class="drawer-backdrop" id="backdrop" onclick="closeDrawer()"></div>

<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h2>Nuevo proyecto</h2>
    <button class="close" onclick="closeDrawer()">×</button>
  </div>

  <div class="form-grid">
    <div class="wide">
      <label class="label">Nombre del proyecto</label>
      <input id="np_nombre" class="mini-input" placeholder="Ej: Tijerazo">
    </div>

    <div>
      <label class="label">Cliente</label>
      <input id="np_cliente" class="mini-input" placeholder="Cliente">
    </div>

    <div>
      <label class="label">Estado</label>
      <select id="np_estado" class="mini-input"></select>
    </div>

    <div>
      <label class="label">Entrega</label>
      <input id="np_entrega" class="mini-input" type="date">
    </div>

    <div>
      <label class="label">Lugar</label>
      <input id="np_lugar" class="mini-input" placeholder="Lugar / instalación">
    </div>

    <div class="wide">
      <label class="label">Información adicional</label>
      <textarea id="np_info" class="mini-input" placeholder="Notas generales del proyecto"></textarea>
    </div>

    <div class="wide">
      <button class="btn full" onclick="createProject()">Guardar proyecto</button>
    </div>
  </div>
</aside>

<button class="fab" onclick="openDrawer()">+</button>
<div class="toast" id="toast">Guardado</div>

<script>
const STORAGE_KEY='tuttoproyecto_v3_items_procesos';
const STATUS=['Solicitud','Pendiente','En curso','En revisión','Listo','Entregado','Bloqueado'];
const RESPONSABLES=['Todos','Carlos','Chico','Rubén','Gabriela','Roberto','Ricardo','Por asignar'];
const MATERIALES=['PVC','PVC laminado','Acrílico','PVC + Acrílico','Frontlit','Otro'];
const FIJACIONES=['Ninguna','Chupones','Cinta doble faz fina','Cinta doble faz verde','Otra'];
const PLANTILLAS=['No','Sí - Cartón','Sí - Papel'];
const LUZ_TIPOS=['No','Sí - Módulos','Sí - Cinta LED'];
const LUZ_TEMP=['No aplica','Cálida','Media','Fría'];

let openProjects=new Set(['p1']);

const seed=[
  {
    id:'p1',
    nombre:'TIJERAZO',
    cliente:'Tijerazo',
    estado:'En curso',
    entrega:'2026-05-19',
    lugar:'Por confirmar',
    info:'Proyecto con letras, plantilla, chupones, prueba de luz y entrega con transformador.',
    items:[
      {
        id:'i1',
        nombre:'Letra E de Tijerazo',
        dimensiones:'Por confirmar',
        material:'PVC + Acrílico',
        iluminacion:'Sí - Módulos',
        temperatura:'Fría',
        fijacion:'Chupones',
        plantilla:'Sí - Cartón',
        instalacion:'Entregar con transformador de 30 amp',
        info:'Color negro + verde. Probar antes de embalar.',
        procesos:[]
      }
    ],
    notes:['Confirmar si todas las letras encienden antes de embalar.']
  },
  {
    id:'p2',
    nombre:'AVISOL',
    cliente:'Avisol',
    estado:'Pendiente',
    entrega:'2026-05-20',
    lugar:'Taller',
    info:'Trabajo de plantilla y doble faz.',
    items:[
      {
        id:'i1',
        nombre:'Plantilla Avisol',
        dimensiones:'Por definir',
        material:'PVC',
        iluminacion:'No',
        temperatura:'No aplica',
        fijacion:'Cinta doble faz verde',
        plantilla:'Sí - Cartón',
        instalacion:'',
        info:'Colocar doble faz para pegar Avisol.',
        procesos:[]
      }
    ],
    notes:['Revisar tipo de cinta doble faz antes de producción.']
  }
];

let data=load();

function load(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw)return JSON.parse(raw);
  }catch(e){}
  const d=structuredClone(seed);
  d.forEach(p=>p.items.forEach(i=>i.procesos=generateProcesses(i)));
  return d;
}

function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
  showToast('Guardado');
}

function uid(prefix){
  return prefix+Math.random().toString(36).slice(2,9);
}

function esc(v){
  return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
}

function statusClass(s){
  return {
    'Solicitud':'st-solicitud',
    'Pendiente':'st-pendiente',
    'En curso':'st-curso',
    'En revisión':'st-revision',
    'Listo':'st-listo',
    'Entregado':'st-entregado',
    'Bloqueado':'st-bloqueado'
  }[s]||'st-pendiente';
}

function generateProcesses(item){
  const list=[];

  if(item.material==='PVC'){
    list.push(proc('Cortar PVC','Carlos'));
  }

  if(item.material==='PVC laminado'){
    list.push(proc('Mandar a imprimir','Roberto'));
    list.push(proc('Imprimir','Rubén'));
    list.push(proc('Laminar','Rubén'));
    list.push(proc('Cortar PVC','Carlos'));
  }

  if(item.material==='Acrílico'){
    list.push(proc('Cortar acrílico','Carlos'));
  }

  if(item.material==='PVC + Acrílico'){
    list.push(proc('Cortar PVC','Carlos'));
    list.push(proc('Cortar acrílico','Carlos'));
    list.push(proc('Pegar PVC al acrílico','Chico'));
  }

  if(item.material==='Frontlit'){
    list.push(proc('Cortar PVC','Carlos'));
    list.push(proc('Cortar acrílico','Carlos'));
    list.push(proc('Doblar banda','Chico'));
    list.push(proc('Pegar banda al acrílico','Chico'));
  }

  if(item.iluminacion==='Sí - Módulos'){
    list.push(proc('Pegar módulos LED','Chico'));
    list.push(proc('Cablear iluminación','Chico'));
    list.push(proc('Probar iluminación','Todos'));
  }

  if(item.iluminacion==='Sí - Cinta LED'){
    list.push(proc('Pegar cinta LED','Chico'));
    list.push(proc('Cablear iluminación','Chico'));
    list.push(proc('Probar iluminación','Todos'));
  }

  if(item.plantilla==='Sí - Cartón'){
    list.push(proc('Cortar plantilla en cartón','Carlos'));
  }

  if(item.plantilla==='Sí - Papel'){
    list.push(proc('Mandar a imprimir plantilla','Rubén'));
  }

  if(item.fijacion==='Chupones'){
    list.push(proc('Pegar chupones','Carlos'));
    list.push(proc('Ubicar ramplug','Carlos'));
    list.push(proc('Preparar tornillos','Carlos'));
  }

  if(item.fijacion==='Cinta doble faz fina'){
    list.push(proc('Colocar cinta doble faz fina','Chico'));
  }

  if(item.fijacion==='Cinta doble faz verde'){
    list.push(proc('Colocar cinta doble faz verde','Chico'));
  }

  list.push(proc('Revisar calidad final','Todos'));
  list.push(proc('Tomar foto','Todos'));
  list.push(proc('Embalar','Todos'));

  return list;
}

function proc(nombre,responsable){
  return {
    id:uid('pr'),
    nombre,
    responsable,
    done:false
  };
}

function progress(p){
  const procesos=p.items.flatMap(i=>i.procesos||[]);
  if(!procesos.length)return ['Listo','Entregado'].includes(p.estado)?100:0;
  return Math.round((procesos.filter(x=>x.done).length/procesos.length)*100);
}

function isLate(p){
  if(!p.entrega||['Listo','Entregado'].includes(p.estado))return false;
  const today=new Date();today.setHours(0,0,0,0);
  const d=new Date(p.entrega+'T00:00:00');
  return d<today;
}

function daysLeft(p){
  if(!p.entrega)return 'Sin fecha';
  const today=new Date();today.setHours(0,0,0,0);
  const d=new Date(p.entrega+'T00:00:00');
  const diff=Math.ceil((d-today)/86400000);
  if(diff<0)return Math.abs(diff)+' días tarde';
  if(diff===0)return 'Hoy';
  if(diff===1)return 'Mañana';
  return diff+' días';
}

function render(){
  renderFilters();
  renderKpis();
  renderProjects();
  renderToday();
}

function renderFilters(){
  const fs=document.getElementById('filterStatus');
  const fr=document.getElementById('filterResp');
  const ns=document.getElementById('np_estado');

  if(fs.options.length===1)STATUS.forEach(s=>fs.add(new Option(s,s)));
  if(ns.options.length===0)STATUS.forEach(s=>ns.add(new Option(s,s)));
  if(fr.options.length===1)RESPONSABLES.forEach(r=>fr.add(new Option(r,r)));
}

function getFiltered(){
  const q=document.getElementById('q')?.value.toLowerCase().trim()||'';
  const st=document.getElementById('filterStatus')?.value||'';
  const resp=document.getElementById('filterResp')?.value||'';
  const luz=document.getElementById('filterLight')?.value||'';
  const sort=document.getElementById('sortBy')?.value||'entrega';

  let arr=data.filter(p=>{
    const blob=[
      p.nombre,p.cliente,p.estado,p.lugar,p.info,
      ...p.items.map(i=>[
        i.nombre,i.dimensiones,i.material,i.iluminacion,i.fijacion,i.plantilla,i.instalacion,i.info,
        ...(i.procesos||[]).map(pr=>pr.nombre+' '+pr.responsable)
      ].join(' '))
    ].join(' ').toLowerCase();

    const hasResp=!resp || p.items.some(i=>(i.procesos||[]).some(pr=>pr.responsable===resp));
    const hasLuz=!luz || p.items.some(i=>i.iluminacion.startsWith(luz));

    return (!q||blob.includes(q))&&(!st||p.estado===st)&&hasResp&&hasLuz;
  });

  arr.sort((a,b)=>{
    if(sort==='progreso')return progress(a)-progress(b);
    if(sort==='nombre')return a.nombre.localeCompare(b.nombre);
    if(sort==='estado')return a.estado.localeCompare(b.estado);
    return (a.entrega||'9999').localeCompare(b.entrega||'9999');
  });

  return arr;
}

function renderKpis(){
  const k=document.getElementById('kpis');
  const total=data.length;
  const curso=data.filter(p=>p.estado==='En curso').length;
  const pendiente=data.filter(p=>['Solicitud','Pendiente'].includes(p.estado)).length;
  const listo=data.filter(p=>['Listo','Entregado'].includes(p.estado)).length;
  const bloqueado=data.filter(p=>p.estado==='Bloqueado').length;
  const tarde=data.filter(isLate).length;

  k.innerHTML=`
    <div class="kpi"><small>Total proyectos</small><strong>${total}</strong></div>
    <div class="kpi black"><small>En curso</small><strong>${curso}</strong></div>
    <div class="kpi yellow"><small>Pendientes</small><strong>${pendiente}</strong></div>
    <div class="kpi green"><small>Listos</small><strong>${listo}</strong></div>
    <div class="kpi orange"><small>Bloqueados</small><strong>${bloqueado}</strong></div>
    <div class="kpi red"><small>Atrasados</small><strong>${tarde}</strong></div>
  `;
}

function renderProjects(){
  const box=document.getElementById('projects');
  const arr=getFiltered();

  if(!arr.length){
    box.innerHTML='<div class="empty">No hay proyectos con ese filtro.</div>';
    return;
  }

  box.innerHTML=arr.map((p,idx)=>projectHTML(p,idx)).join('');
}

function projectHTML(p,idx){
  const pr=progress(p);
  const open=openProjects.has(p.id)?'open':'';

  return `
  <article class="project ${open}">
    <div class="project-summary" onclick="toggleProject('${p.id}')">
      <div class="num">${String(idx+1).padStart(2,'0')}</div>

      <div class="project-name">
        <h2>${esc(p.nombre)}</h2>
        <div class="mini">
          <span class="chip">👤 ${esc(p.cliente)}</span>
          <span class="chip">📍 ${esc(p.lugar||'Sin lugar')}</span>
          <span class="chip">📦 ${p.items.length} ítem(s)</span>
          ${isLate(p)?'<span class="chip" style="color:var(--red);border-color:#fecaca;background:#fff1f2">⚠ Atrasado</span>':''}
        </div>
      </div>

      <span class="badge ${statusClass(p.estado)}">${esc(p.estado)}</span>

      <div class="meter">
        <div class="meter-label">${pr}%</div>
        <div class="bar"><span style="width:${pr}%"></span></div>
      </div>

      <div class="datebox">
        <small>Entrega</small>
        <strong>${p.entrega?formatDate(p.entrega):'S/F'}</strong>
      </div>

      <button class="toggle" type="button">⌄</button>
    </div>

    <div class="detail">
      <div class="detail-grid">
        <div class="card">
          <h3>Ficha técnica del proyecto</h3>
          ${projectForm(p)}
        </div>

        <div class="card">
          <div class="tabs">
            <button class="tab active" onclick="tab(event,'${p.id}','items')">Ítems</button>
            <button class="tab" onclick="tab(event,'${p.id}','notes')">Notas</button>
            <button class="tab" onclick="tab(event,'${p.id}','danger')">Opciones</button>
          </div>

          <div id="${p.id}-items" class="tab-panel active">${itemsHTML(p)}</div>
          <div id="${p.id}-notes" class="tab-panel">${notesHTML(p)}</div>
          <div id="${p.id}-danger" class="tab-panel">
            <button class="btn danger" onclick="deleteProject('${p.id}')">Eliminar proyecto</button>
          </div>
        </div>
      </div>
    </div>
  </article>
  `;
}

function projectForm(p){
  return `
  <div class="form-grid">
    <div class="wide">
      <label class="label">Nombre</label>
      <input class="mini-input" value="${esc(p.nombre)}" onchange="updateProject('${p.id}','nombre',this.value)">
    </div>

    <div>
      <label class="label">Cliente</label>
      <input class="mini-input" value="${esc(p.cliente)}" onchange="updateProject('${p.id}','cliente',this.value)">
    </div>

    <div>
      <label class="label">Estado</label>
      <select class="mini-input" onchange="updateProject('${p.id}','estado',this.value)">
        ${STATUS.map(s=>`<option ${p.estado===s?'selected':''}>${s}</option>`).join('')}
      </select>
    </div>

    <div>
      <label class="label">Entrega</label>
      <input type="date" class="mini-input" value="${esc(p.entrega)}" onchange="updateProject('${p.id}','entrega',this.value)">
    </div>

    <div>
      <label class="label">Lugar</label>
      <input class="mini-input" value="${esc(p.lugar)}" onchange="updateProject('${p.id}','lugar',this.value)">
    </div>

    <div class="wide">
      <label class="label">Información adicional</label>
      <textarea class="mini-input" onchange="updateProject('${p.id}','info',this.value)">${esc(p.info)}</textarea>
    </div>

    <div class="wide">
      <div class="note">
        <b>Entrega:</b> ${daysLeft(p)} · 
        <b>Progreso:</b> ${progress(p)}% · 
        <b>Ítems:</b> ${p.items.length}
      </div>
    </div>
  </div>
  `;
}

function itemsHTML(p){
  let html='<div class="items">';

  html+=p.items.map((i,index)=>`
    <div class="item">
      <div class="item-head">
        <div>
          <div class="item-title">Ítem ${index+1}: ${esc(i.nombre)}</div>
          <div class="item-sub">${esc(i.material)} · ${esc(i.iluminacion)} · ${esc(i.fijacion)} · ${esc(i.plantilla)}</div>
        </div>
        <button class="small-btn red" onclick="deleteItem('${p.id}','${i.id}')">Eliminar</button>
      </div>

      <div class="item-grid">
        <div>
          <label class="label">Nombre del ítem</label>
          <input class="mini-input" value="${esc(i.nombre)}" onchange="updateItem('${p.id}','${i.id}','nombre',this.value)">
        </div>

        <div>
          <label class="label">Dimensiones</label>
          <input class="mini-input" value="${esc(i.dimensiones)}" onchange="updateItem('${p.id}','${i.id}','dimensiones',this.value)">
        </div>

        <div>
          <label class="label">Materiales</label>
          <select class="mini-input" onchange="updateItemAndProcesses('${p.id}','${i.id}','material',this.value)">
            ${MATERIALES.map(m=>`<option ${i.material===m?'selected':''}>${m}</option>`).join('')}
          </select>
        </div>

        <div>
          <label class="label">Iluminación</label>
          <select class="mini-input" onchange="updateItemAndProcesses('${p.id}','${i.id}','iluminacion',this.value)">
            ${LUZ_TIPOS.map(x=>`<option ${i.iluminacion===x?'selected':''}>${x}</option>`).join('')}
          </select>
        </div>

        <div>
          <label class="label">Temperatura</label>
          <select class="mini-input" onchange="updateItem('${p.id}','${i.id}','temperatura',this.value)">
            ${LUZ_TEMP.map(x=>`<option ${i.temperatura===x?'selected':''}>${x}</option>`).join('')}
          </select>
        </div>

        <div>
          <label class="label">Fijación</label>
          <select class="mini-input" onchange="updateItemAndProcesses('${p.id}','${i.id}','fijacion',this.value)">
            ${FIJACIONES.map(x=>`<option ${i.fijacion===x?'selected':''}>${x}</option>`).join('')}
          </select>
        </div>

        <div>
          <label class="label">Plantilla</label>
          <select class="mini-input" onchange="updateItemAndProcesses('${p.id}','${i.id}','plantilla',this.value)">
            ${PLANTILLAS.map(x=>`<option ${i.plantilla===x?'selected':''}>${x}</option>`).join('')}
          </select>
        </div>

        <div>
          <label class="label">Instalación</label>
          <input class="mini-input" value="${esc(i.instalacion)}" onchange="updateItem('${p.id}','${i.id}','instalacion',this.value)">
        </div>

        <div style="grid-column:1/-1">
          <label class="label">Información adicional</label>
          <textarea class="mini-input" onchange="updateItem('${p.id}','${i.id}','info',this.value)">${esc(i.info)}</textarea>
        </div>
      </div>

      <h3 style="margin-top:14px">Procesos del ítem</h3>
      <div class="process-list">
        ${(i.procesos||[]).map(pr=>processHTML(p.id,i.id,pr)).join('')}
      </div>

      <div class="add-row">
        <input id="newProcess-${i.id}" class="mini-input" placeholder="+ Añadir proceso manual">
        <select id="newProcessResp-${i.id}" class="mini-input">
          ${RESPONSABLES.map(r=>`<option>${r}</option>`).join('')}
        </select>
        <button class="small-btn blue" onclick="addProcess('${p.id}','${i.id}')">Añadir proceso</button>
      </div>
    </div>
  `).join('');

  html+='</div>';

  html+=`
    <div class="add-row">
      <input id="newItem-${p.id}" class="mini-input" placeholder="+ Nuevo ítem">
      <button class="small-btn blue" onclick="addItem('${p.id}')">Añadir ítem</button>
    </div>
  `;

  return html;
}

function processHTML(pid,iid,pr){
  return `
  <div class="process ${pr.done?'done':''}">
    <input type="checkbox" ${pr.done?'checked':''} onchange="toggleProcess('${pid}','${iid}','${pr.id}',this.checked)">
    <div class="process-name">${esc(pr.nombre)}</div>
    <select class="mini-input" onchange="updateProcess('${pid}','${iid}','${pr.id}','responsable',this.value)">
      ${RESPONSABLES.map(r=>`<option ${pr.responsable===r?'selected':''}>${r}</option>`).join('')}
    </select>
    <button class="small-btn red" onclick="deleteProcess('${pid}','${iid}','${pr.id}')">×</button>
  </div>
  `;
}

function notesHTML(p){
  let html='<div class="notes">';

  html+=(p.notes||[]).map((n,idx)=>`
    <div class="note">
      <b>Nota ${idx+1}:</b> ${esc(n)}
      <button class="small-btn red" style="float:right" onclick="deleteNote('${p.id}',${idx})">×</button>
    </div>
  `).join('');

  html+='</div>';

  html+=`
    <div class="add-row">
      <input id="newNote-${p.id}" class="mini-input" placeholder="+ Nueva nota / bloqueo / comentario">
      <button class="small-btn blue" onclick="addNote('${p.id}')">Añadir nota</button>
    </div>
  `;

  return html;
}

function renderToday(){
  const box=document.getElementById('todayList');
  const arr=[...data]
    .filter(p=>!['Listo','Entregado'].includes(p.estado))
    .sort((a,b)=>(a.entrega||'9999').localeCompare(b.entrega||'9999'))
    .slice(0,6);

  box.innerHTML=arr.map((p,i)=>`
    <div class="tl">
      <div class="tl-dot">${i+1}</div>
      <div>
        <strong>${esc(p.nombre)}</strong>
        <p>${daysLeft(p)} · ${progress(p)}%</p>
      </div>
    </div>
  `).join('')||'<div class="empty">Nada pendiente.</div>';
}

function toggleProject(id){
  openProjects.has(id)?openProjects.delete(id):openProjects.add(id);
  renderProjects();
}

function tab(ev,id,name){
  ev.stopPropagation();
  const detail=ev.target.closest('.card');
  detail.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  ev.target.classList.add('active');
  detail.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(id+'-'+name).classList.add('active');
}

function findP(id){return data.find(p=>p.id===id)}
function findItem(pid,iid){return findP(pid).items.find(i=>i.id===iid)}
function findProcess(pid,iid,prid){return findItem(pid,iid).procesos.find(pr=>pr.id===prid)}

function updateProject(id,key,val){
  const p=findP(id);
  p[key]=val;
  save();
  render();
}

function updateItem(pid,iid,key,val){
  const i=findItem(pid,iid);
  i[key]=val;
  save();
  render();
}

function updateItemAndProcesses(pid,iid,key,val){
  const i=findItem(pid,iid);
  i[key]=val;
  i.procesos=generateProcesses(i);
  save();
  render();
}

function updateProcess(pid,iid,prid,key,val){
  const pr=findProcess(pid,iid,prid);
  pr[key]=val;
  save();
  render();
}

function toggleProcess(pid,iid,prid,done){
  const pr=findProcess(pid,iid,prid);
  pr.done=done;
  save();
  render();
}

function addProcess(pid,iid){
  const input=document.getElementById('newProcess-'+iid);
  const resp=document.getElementById('newProcessResp-'+iid);
  if(!input.value.trim())return;

  const i=findItem(pid,iid);
  i.procesos.push({
    id:uid('pr'),
    nombre:input.value.trim(),
    responsable:resp.value,
    done:false
  });

  save();
  render();
}

function deleteProcess(pid,iid,prid){
  const i=findItem(pid,iid);
  i.procesos=i.procesos.filter(pr=>pr.id!==prid);
  save();
  render();
}

function addItem(pid){
  const input=document.getElementById('newItem-'+pid);
  if(!input.value.trim())return;

  const item={
    id:uid('i'),
    nombre:input.value.trim(),
    dimensiones:'',
    material:'PVC',
    iluminacion:'No',
    temperatura:'No aplica',
    fijacion:'Ninguna',
    plantilla:'No',
    instalacion:'',
    info:'',
    procesos:[]
  };

  item.procesos=generateProcesses(item);
  findP(pid).items.push(item);

  save();
  render();
}

function deleteItem(pid,iid){
  if(!confirm('¿Eliminar este ítem?'))return;
  const p=findP(pid);
  p.items=p.items.filter(i=>i.id!==iid);
  save();
  render();
}

function addNote(pid){
  const p=findP(pid);
  const n=document.getElementById('newNote-'+pid);
  if(!n.value.trim())return;
  p.notes=p.notes||[];
  p.notes.push(n.value.trim());
  save();
  render();
}

function deleteNote(pid,idx){
  const p=findP(pid);
  p.notes.splice(idx,1);
  save();
  render();
}

function deleteProject(id){
  if(!confirm('¿Eliminar este proyecto completo?'))return;
  data=data.filter(p=>p.id!==id);
  openProjects.delete(id);
  save();
  render();
}

function openDrawer(){
  document.getElementById('backdrop').classList.add('show');
  document.getElementById('drawer').classList.add('show');
  setTimeout(()=>document.getElementById('np_nombre').focus(),80);
}

function closeDrawer(){
  document.getElementById('backdrop').classList.remove('show');
  document.getElementById('drawer').classList.remove('show');
}

function createProject(){
  const nombre=document.getElementById('np_nombre').value.trim();
  if(!nombre){
    showToast('Falta nombre del proyecto');
    return;
  }

  const p={
    id:uid('p'),
    nombre,
    cliente:document.getElementById('np_cliente').value.trim()||nombre,
    estado:document.getElementById('np_estado').value||'Solicitud',
    entrega:document.getElementById('np_entrega').value,
    lugar:document.getElementById('np_lugar').value.trim(),
    info:document.getElementById('np_info').value.trim(),
    items:[],
    notes:[]
  };

  data.unshift(p);
  openProjects.add(p.id);

  ['np_nombre','np_cliente','np_entrega','np_lugar','np_info'].forEach(id=>document.getElementById(id).value='');

  save();
  closeDrawer();
  render();
}

function formatDate(d){
  const [y,m,day]=d.split('-');
  return `${day}/${m}`;
}

let toastTimer;
function showToast(txt){
  const t=document.getElementById('toast');
  t.textContent=txt;
  clearTimeout(toastTimer);
  t.classList.add('show');
  toastTimer=setTimeout(()=>t.classList.remove('show'),1200);
}

document.getElementById("mobileMenuBtn")?.addEventListener("click",()=>{
  document.getElementById("authMenu")?.classList.toggle("open");
});

render();
</script>
