<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RED · Tuttovinilos</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:#0b0f15;
  color:#fff;
  font-family:Arial,sans-serif;
  padding:20px
}
.panel{
  width:min(560px,100%);
  background:#151b25;
  border:1px solid #293243;
  border-radius:22px;
  padding:20px
}
h1{margin:0 0 6px}
p{margin:0 0 18px;color:#98a2b3;font-size:14px}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}
button{
  min-height:150px;
  border:0;
  border-radius:20px;
  color:#fff;
  font-size:21px;
  font-weight:800;
  cursor:pointer;
  transition:.15s transform
}
button:active{transform:scale(.98)}
.green{background:#1fa75b}
.red{background:#d63d4c}
.blue{background:#3478e5}
.off{background:#333b49}
#status{
  margin-top:14px;
  padding:10px 12px;
  border-radius:12px;
  background:#0e131b;
  color:#aeb7c6;
  font-size:13px
}
@media(max-width:520px){
  .grid{grid-template-columns:1fr}
  button{min-height:110px}
}
</style>
</head>
<body>
<div class="panel">
  <h1>RED</h1>
  <p>Control remoto del ESP32 vía Supabase</p>

  <div class="grid">
    <button class="green" onclick="sendCommand('green')">VERDE</button>
    <button class="red" onclick="sendCommand('red')">ROJO</button>
    <button class="blue" onclick="sendCommand('blue')">AZUL</button>
    <button class="off" onclick="sendCommand('off')">APAGAR</button>
  </div>

  <div id="status">Listo.</div>
</div>

<script>
const SB_URL = "https://ujfdsabypflseijatxba.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqZmRzYWJ5cGZsc2VpamF0eGJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjcxNTIsImV4cCI6MjA5MTg0MzE1Mn0.Tyi_TeKaVG0PMA4R-aO8GPgP525GLZcqipB-tXmFq5c";
const DEVICE_ID = "esp32_01";

async function sendCommand(command) {
  const status = document.getElementById('status');
  status.textContent = 'Enviando: ' + command + '...';

  try {
    const r = await fetch(
      SB_URL + '/rest/v1/esp32_commands?device_id=eq.' + encodeURIComponent(DEVICE_ID),
      {
        method: 'PATCH',
        headers: {
          'apikey': SB_KEY,
          'Authorization': 'Bearer ' + SB_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify({
          command: command,
          updated_at: new Date().toISOString()
        })
      }
    );

    const txt = await r.text();

    if (!r.ok) {
      status.textContent = 'Error Supabase: ' + txt;
      return;
    }

    status.textContent = 'Comando enviado: ' + command;
  } catch (e) {
    status.textContent = 'Error de red: ' + e.message;
  }
}
</script>
</body>
</html>
