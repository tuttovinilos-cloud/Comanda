<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>RED · Wi‑Fi Manager</title>

<style>
:root{
  --bg:#0b0d12;
  --panel:#121621;
  --panel2:#181d2a;
  --line:#262d3d;
  --text:#f5f7fb;
  --muted:#8e98aa;
  --accent:#4f8cff;
  --good:#35c98f;
  --warn:#ffb84d;
  --bad:#ff6262;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.shell{
  max-width:1050px;
  margin:auto;
  padding:18px 14px 40px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:var(--accent);
  font-weight:bold;
}

.brand h1{
  margin:0;
  font-size:19px;
}

.brand p{
  margin:3px 0 0;
  font-size:12px;
  color:var(--muted);
}

.live{
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 10px;
  border-radius:999px;
  border:1px solid var(--line);
  color:var(--muted);
  font-size:12px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--good);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:14px;
}

.stat{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
}

.stat-label{
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
}

.stat-value{
  font-size:23px;
  font-weight:bold;
  margin-top:7px;
}

.stat-sub{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.main{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
}

.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
}

.panel-head{
  padding:15px 16px;
  border-bottom:1px solid var(--line);
}

.panel-title{
  font-size:14px;
  font-weight:bold;
}

.panel-sub{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

.toolbar{
  display:grid;
  grid-template-columns:1fr 150px auto;
  gap:8px;
  padding:12px 14px;
  border-bottom:1px solid var(--line);
}

input,select{
  width:100%;
  border:1px solid var(--line);
  background:#0e121b;
  color:var(--text);
  padding:11px 12px;
  border-radius:11px;
  outline:none;
}

input:focus,select:focus{
  border-color:var(--accent);
}

.refresh{
  width:46px;
  border:1px solid var(--line);
  background:#0e121b;
  color:var(--text);
  border-radius:10px;
  font-size:18px;
}

.refresh.spin{
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.networks{
  padding:8px;
}

.network{
  display:grid;
  grid-template-columns:minmax(0,1fr) 125px;
  gap:14px;
  align-items:center;
  padding:13px 11px;
  border-radius:13px;
  border:1px solid transparent;
}

.network:hover{
  background:var(--panel2);
  border-color:var(--line);
}

.net-name{
  font-size:14px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.net-info{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:5px;
  color:var(--muted);
  font-size:10px;
}

.signal-row{
  display:flex;
  justify-content:space-between;
  gap:6px;
  font-size:10px;
  color:var(--muted);
  margin-bottom:6px;
}

.track{
  height:8px;
  background:#252b37;
  border-radius:999px;
  overflow:hidden;
}

.bar{
  height:100%;
  border-radius:999px;
}

.good{background:var(--good)}
.mid{background:var(--warn)}
.bad{background:var(--bad)}

.empty{
  padding:38px 15px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

.status{
  padding:10px 14px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:11px;
}

@media(max-width:650px){
  .stats{
    grid-template-columns:1fr 1fr;
  }

  .toolbar{
    grid-template-columns:1fr auto;
  }

  .toolbar select{
    grid-column:1/2;
  }

  .network{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="shell">

  <div class="topbar">
    <div class="brand">
      <div class="logo">R</div>

      <div>
        <h1>RED</h1>
        <p>Monitor Wi‑Fi · ESP32‑S3</p>
      </div>
    </div>

    <div class="live">
      <span class="dot"></span>
      <span id="liveText">Conectado</span>
    </div>
  </div>

  <section class="stats">

    <div class="stat">
      <div class="stat-label">Redes</div>
      <div class="stat-value" id="count">0</div>
      <div class="stat-sub">detectadas</div>
    </div>

    <div class="stat">
      <div class="stat-label">Mejor señal</div>
      <div class="stat-value" id="bestRssi">--</div>
      <div class="stat-sub" id="bestName">Sin datos</div>
    </div>

    <div class="stat">
      <div class="stat-label">Estado</div>
      <div class="stat-value">AP</div>
      <div class="stat-sub">RED-ESP32 · 192.168.4.1</div>
    </div>

  </section>

  <section class="panel">

    <div class="panel-head">
      <div class="panel-title">Redes cercanas</div>
      <div class="panel-sub">
        Pulsa actualizar para realizar un nuevo escaneo
      </div>
    </div>

    <div class="toolbar">

      <input
        id="search"
        placeholder="Buscar red..."
        autocomplete="off"
      >

      <select id="sort">
        <option value="signal">Mejor señal</option>
        <option value="name">Nombre A-Z</option>
        <option value="channel">Canal</option>
      </select>

      <button
        id="refresh"
        class="refresh"
        type="button"
        title="Actualizar"
      >
        ↻
      </button>

    </div>

    <div id="networks" class="networks">
      <div class="empty">
        Cargando redes...
      </div>
    </div>

    <div id="status" class="status">
      Mostrando el último escaneo guardado.
    </div>

  </section>

</div>

<script>

const state = {
  networks: [],
  loading: false
};

const $ = id => document.getElementById(id);

function quality(rssi){

  if(rssi >= -50)
    return {label:'Excelente', cls:'good'};

  if(rssi >= -65)
    return {label:'Buena', cls:'good'};

  if(rssi >= -75)
    return {label:'Regular', cls:'mid'};

  if(rssi >= -85)
    return {label:'Débil', cls:'mid'};

  return {label:'Muy débil', cls:'bad'};
}

function percent(rssi){

  if(rssi >= -40) return 100;
  if(rssi <= -100) return 0;

  return Math.max(
    0,
    Math.min(
      100,
      Math.round(2 * (rssi + 100))
    )
  );
}

function distanceEstimate(rssi){

  const txPower = -45;
  const n = 3.0;

  const d =
    Math.pow(
      10,
      (txPower - rssi) / (10 * n)
    );

  if(d < 1)
    return d.toFixed(1) + ' m';

  if(d < 10)
    return d.toFixed(1) + ' m';

  return Math.round(d) + ' m';
}

function escapeHTML(str=''){

  return String(str)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'",'&#039;');
}

function updateStats(){

  $('count').textContent =
    state.networks.length;

  const best =
    [...state.networks]
    .sort((a,b)=>b.rssi-a.rssi)[0];

  if(best){

    $('bestRssi').textContent =
      best.rssi + ' dBm';

    $('bestName').textContent =
      best.ssid || '(oculta)';

  } else {

    $('bestRssi').textContent = '--';
    $('bestName').textContent = 'Sin datos';
  }
}

function getVisibleNetworks(){

  const text =
    $('search')
    .value
    .trim()
    .toLowerCase();

  const sort =
    $('sort').value;

  let list =
    state.networks.filter(
      n =>
      (n.ssid || '(oculta)')
      .toLowerCase()
      .includes(text)
    );

  if(sort === 'name'){

    list.sort(
      (a,b) =>
      (a.ssid || '')
      .localeCompare(b.ssid || '')
    );

  }else if(sort === 'channel'){

    list.sort(
      (a,b) =>
      (a.channel || 0) -
      (b.channel || 0)
    );

  }else{

    list.sort(
      (a,b) =>
      b.rssi - a.rssi
    );
  }

  return list;
}

function renderNetworks(){

  const list =
    getVisibleNetworks();

  const root =
    $('networks');

  if(!list.length){

    root.innerHTML =
      '<div class="empty">No se encontraron redes.</div>';

    return;
  }

  root.innerHTML =
    list.map(net => {

      const q =
        quality(net.rssi);

      const p =
        percent(net.rssi);

      const seguridad =
        net.secure
        ? 'Protegida'
        : 'Abierta';

      return `
        <div class="network">

          <div>

            <div class="net-name">
              ${escapeHTML(net.ssid || '(red oculta)')}
            </div>

            <div class="net-info">

              <span>
                ${net.rssi} dBm
              </span>

              <span>•</span>

              <span>
                ${q.label}
              </span>

              <span>•</span>

              <span>
                ≈ ${distanceEstimate(net.rssi)}
              </span>

              <span>•</span>

              <span>
                Canal ${net.channel ?? '--'}
              </span>

              <span>•</span>

              <span>
                ${seguridad}
              </span>

            </div>

          </div>

          <div>

            <div class="signal-row">

              <span>Señal</span>

              <span>
                ${p}%
              </span>

            </div>

            <div class="track">

              <div
                class="bar ${q.cls}"
                style="width:${p}%">
              </div>

            </div>

          </div>

        </div>
      `;

    }).join('');
}

async function loadNetworks(){

  try{

    const response =
      await fetch(
        '/api/networks?t=' +
        Date.now(),
        {
          cache:'no-store'
        }
      );

    if(!response.ok)
      throw new Error();

    const data =
      await response.json();

    state.networks =
      Array.isArray(data)
      ? data
      : [];

    updateStats();
    renderNetworks();

    $('liveText').textContent =
      'Conectado';

  }catch(e){

    $('liveText').textContent =
      'Error';

    $('networks').innerHTML =
      '<div class="empty">No se pudo leer /api/networks</div>';
  }
}

async function rescan(){

  if(state.loading)
    return;

  state.loading = true;

  $('refresh')
    .classList
    .add('spin');

  $('status').textContent =
    'Escaneando redes... la conexión puede pausarse unos segundos.';

  try{

    await fetch(
      '/api/rescan',
      {
        method:'POST'
      }
    );

    await new Promise(
      resolve =>
      setTimeout(resolve, 3500)
    );

    await loadNetworks();

    $('status').textContent =
      'Escaneo actualizado.';

  }catch(e){

    $('status').textContent =
      'No se pudo actualizar el escaneo.';

  }finally{

    $('refresh')
      .classList
      .remove('spin');

    state.loading = false;
  }
}

$('search')
  .addEventListener(
    'input',
    renderNetworks
  );

$('sort')
  .addEventListener(
    'change',
    renderNetworks
  );

$('refresh')
  .addEventListener(
    'click',
    rescan
  );

loadNetworks();

</script>

</body>
</html>
