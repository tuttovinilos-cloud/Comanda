<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analizador SVG Tuttovinilos</title>

<style>
:root{
--bg:#06101e;
--card:#0c1b2f;
--line:#254b70;
--text:#eef7ff;
--muted:#92abc4;
--blue:#1688ff;
--orange:#ff8616;
--green:#22c783;
--red:#ff4d5e;
}

*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#06101e;
color:var(--text);
}

header{
padding:15px;
background:linear-gradient(135deg,#06305f,#0b5dab,#ff7b00);
}

header h1{
margin:0;
font-size:18px;
}

.wrap{
padding:15px;
max-width:1200px;
margin:auto;
}

.card{
background:#0c1b2f;
border:1px solid var(--line);
border-radius:16px;
padding:14px;
margin-bottom:14px;
}

.card h2{
margin-top:0;
font-size:16px;
}

input,select,button{
width:100%;
padding:10px;
border-radius:10px;
border:none;
margin-bottom:10px;
font-size:14px;
}

input,select{
background:#06111f;
border:1px solid #244b72;
color:white;
}

button{
background:linear-gradient(135deg,#1688ff,#0057c8);
color:white;
font-weight:bold;
cursor:pointer;
}

button.orange{
background:linear-gradient(135deg,#ff8616,#c65300);
}

#preview{
background:white;
border-radius:12px;
padding:10px;
overflow:auto;
min-height:300px;
}

#preview svg{
max-width:100%;
height:auto;
display:block;
margin:auto;
}

.kpis{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.kpi{
background:#08192c;
padding:12px;
border-radius:12px;
border:1px solid #214161;
}

.kpi b{
display:block;
font-size:22px;
}

.kpi span{
font-size:12px;
color:var(--muted);
}

table{
width:100%;
border-collapse:collapse;
font-size:12px;
}

th,td{
padding:7px;
border-bottom:1px solid #1d3958;
text-align:left;
}

.small{
font-size:12px;
color:var(--muted);
}

@media(max-width:700px){
.kpis{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<header>
<h1>📐 Analizador SVG · Tuttovinilos</h1>
</header>

<div class="wrap">

<div class="card">
<h2>Subir SVG</h2>

<input type="file" id="fileInput" accept=".svg">

<label class="small">Unidad de trabajo</label>
<select id="unit">
<option value="mm">mm</option>
<option value="cm" selected>cm</option>
<option value="m">m</option>
<option value="in">in</option>
</select>

<label class="small">Ancho real del diseño</label>
<input id="realWidth" type="number" value="60" placeholder="Ancho real">

<button onclick="analizarSVG()">Analizar SVG</button>
<button class="orange" onclick="cargarDemo()">Demo HOLA 60cm</button>
</div>

<div class="card">
<h2>Vista previa</h2>
<div id="preview"></div>
</div>

<div class="card">
<h2>Resultados</h2>

<div class="kpis">
<div class="kpi">
<b id="kPiezas">0</b>
<span>Piezas</span>
</div>

<div class="kpi">
<b id="kAncho">0</b>
<span>Ancho real</span>
</div>

<div class="kpi">
<b id="kAlto">0</b>
<span>Alto real</span>
</div>

<div class="kpi">
<b id="kPerimetro">0</b>
<span>Perímetro</span>
</div>

<div class="kpi">
<b id="kAreaSel">0</b>
<span>Área selección</span>
</div>

<div class="kpi">
<b id="kAreaVisual">0</b>
<span>Área visual aprox.</span>
</div>
</div>

<br>

<table id="tabla">
<tr>
<th>#</th>
<th>Tipo</th>
<th>Ancho</th>
<th>Alto</th>
<th>Perímetro</th>
</tr>
</table>

</div>

</div>

<script>

let svgDoc = null;

document.getElementById("fileInput").addEventListener("change", async function(e){

const file = e.target.files[0];

if(!file) return;

const text = await file.text();

document.getElementById("preview").innerHTML = text;

svgDoc = document.querySelector("#preview svg");

if(svgDoc){
svgDoc.removeAttribute("width");
svgDoc.removeAttribute("height");
svgDoc.style.maxWidth = "100%";
svgDoc.style.height = "auto";
}

});

function cargarDemo(){

const demo = `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250">
<path d="M40 215 L40 30 L95 30 L95 95 C120 60 180 65 190 125 L190 215 L135 215 L135 130 C135 108 100 108 100 130 L100 215 Z" fill="#111"/>
<circle cx="280" cy="145" r="75" fill="#111"/>
<circle cx="280" cy="145" r="38" fill="white"/>
<rect x="380" y="30" width="55" height="185" fill="#111"/>
<path d="M490 110 C500 60 585 65 585 130 L585 215 L535 215 L530 195 C510 220 450 220 450 170 C450 120 520 135 530 120 C535 105 510 100 505 120 L450 120 C450 120 450 115 490 110 Z M530 160 C500 165 500 190 530 180 Z" fill="#111"/>
</svg>
`;

document.getElementById("preview").innerHTML = demo;

svgDoc = document.querySelector("#preview svg");

document.getElementById("realWidth").value = 60;

analizarSVG();

}

function analizarSVG(){

if(!svgDoc){
alert("Sube un SVG");
return;
}

let vb;

if(svgDoc.viewBox && svgDoc.viewBox.baseVal && svgDoc.viewBox.baseVal.width > 0){
vb = svgDoc.viewBox.baseVal;
}else{
try{
const box = svgDoc.getBBox();
vb = {x:box.x, y:box.y, width:box.width, height:box.height};
}catch(e){
alert("El SVG no tiene viewBox válido.");
return;
}
}

const unit = document.getElementById("unit").value;
const realWidth = Number(document.getElementById("realWidth").value || 1);

const factor = realWidth / vb.width;

const unitToMeters = {
mm:0.001,
cm:0.01,
m:1,
in:0.0254
}[unit];

const factorToMeters = factor * unitToMeters;

const elementos = svgDoc.querySelectorAll("path,rect,circle,ellipse,polygon,polyline,line");

let totalPerimetroUnit = 0;

let tabla = `
<tr>
<th>#</th>
<th>Tipo</th>
<th>Ancho ${unit}</th>
<th>Alto ${unit}</th>
<th>Perímetro ${unit}</th>
</tr>
`;

elementos.forEach((el,index)=>{

let bbox;

try{
bbox = el.getBBox();
}catch(e){
return;
}

let per = 0;

try{
if(el.getTotalLength){
per = el.getTotalLength();
}
}catch(e){}

if(per === 0){
per = perimetroBasico(el);
}

const ancho = bbox.width * factor;
const alto = bbox.height * factor;

const perReal = per * factor;

totalPerimetroUnit += perReal;

tabla += `
<tr>
<td>${index+1}</td>
<td>${el.tagName}</td>
<td>${ancho.toFixed(2)}</td>
<td>${alto.toFixed(2)}</td>
<td>${perReal.toFixed(2)}</td>
</tr>
`;

});

const anchoReal = vb.width * factor;
const altoReal = vb.height * factor;

const totalPerimetroM = totalPerimetroUnit * unitToMeters;

const areaSelUnit = anchoReal * altoReal;
const areaSelM2 = areaSelUnit * Math.pow(unitToMeters, 2);

// Área visual aproximada rápida.
// Para precisión real avanzada habría que rasterizar y contar pixeles.
const areaVisualM2 = areaSelM2 * 0.62;

document.getElementById("kPiezas").innerText = elementos.length;

document.getElementById("kAncho").innerText = anchoReal.toFixed(2) + " " + unit;

document.getElementById("kAlto").innerText = altoReal.toFixed(2) + " " + unit;

document.getElementById("kPerimetro").innerText =
totalPerimetroM.toFixed(2) + " m";

document.getElementById("kAreaSel").innerText =
areaSelM2.toFixed(3) + " m²";

document.getElementById("kAreaVisual").innerText =
areaVisualM2.toFixed(3) + " m²";

document.getElementById("tabla").innerHTML = tabla;

}

function perimetroBasico(el){

const tag = el.tagName.toLowerCase();

if(tag === "rect"){
const w = Number(el.getAttribute("width") || 0);
const h = Number(el.getAttribute("height") || 0);
return 2 * (w + h);
}

if(tag === "circle"){
const r = Number(el.getAttribute("r") || 0);
return 2 * Math.PI * r;
}

if(tag === "ellipse"){
const rx = Number(el.getAttribute("rx") || 0);
const ry = Number(el.getAttribute("ry") || 0);
return Math.PI * (3*(rx+ry) - Math.sqrt((3*rx+ry)*(rx+3*ry)));
}

if(tag === "line"){
const x1 = Number(el.getAttribute("x1") || 0);
const y1 = Number(el.getAttribute("y1") || 0);
const x2 = Number(el.getAttribute("x2") || 0);
const y2 = Number(el.getAttribute("y2") || 0);
return Math.hypot(x2-x1,y2-y1);
}

return 0;

}

</script>

</body>
</html>
