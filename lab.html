<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LAB · Previsualizador</title>
<style>
*{box-sizing:border-box}
:root{
  --azul:#172bd8;
  --verde:#16a34a;
  --fondo:#f1f3f9;
  --panel:#fff;
  --borde:#dbe1ec;
  --texto:#111827;
  --muted:#64748b;
  --sombra:0 14px 36px rgba(15,23,42,.12);
}
html,body{
  margin:0;
  min-height:100%;
  background:var(--fondo);
  color:var(--texto);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
body{padding:16px}
button,textarea{font:inherit}
.app{width:min(1600px,100%);margin:auto;display:grid;gap:14px}
.header{
  background:var(--azul);
  color:#fff;
  border-radius:17px;
  padding:16px 18px;
  box-shadow:0 10px 26px rgba(23,43,216,.24);
}
.header h1{margin:0;font-size:20px;font-weight:950}
.header p{margin:4px 0 0;color:#dbe3ff;font-size:11px}
.card{
  background:var(--panel);
  border:1px solid var(--borde);
  border-radius:17px;
  box-shadow:var(--sombra);
  overflow:hidden;
}
.card-head{
  padding:12px 14px;
  border-bottom:1px solid var(--borde);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.card-head strong{font-size:12px}
.estado{color:var(--muted);font-size:10px}
textarea{
  display:block;
  width:100%;
  min-height:330px;
  resize:vertical;
  border:0;
  outline:0;
  padding:16px;
  background:#0f172a;
  color:#e2e8f0;
  font:12px/1.55 "Roboto Mono",Consolas,monospace;
  tab-size:2;
}
.actions{
  padding:11px 14px;
  border-top:1px solid var(--borde);
  display:flex;
  justify-content:flex-end;
  gap:8px;
}
.btn{
  border:1px solid var(--borde);
  background:#fff;
  color:var(--texto);
  border-radius:10px;
  padding:10px 14px;
  font-size:10px;
  font-weight:900;
  cursor:pointer;
}
.btn.run{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.full{background:var(--azul);border-color:var(--azul);color:#fff}
.preview-wrap{padding:12px;background:#d9dee8}
iframe{
  display:block;
  width:100%;
  height:820px;
  border:0;
  border-radius:11px;
  background:#fff;
  box-shadow:0 8px 24px rgba(15,23,42,.12);
}
.fullscreen{
  position:fixed!important;
  inset:0!important;
  z-index:999!important;
  width:100vw!important;
  height:100vh!important;
  border-radius:0!important;
}
.fullscreen .preview-wrap{height:calc(100vh - 49px);padding:0}
.fullscreen iframe{height:100%;border-radius:0}
@media(max-width:700px){
  body{padding:9px}
  .card-head{align-items:flex-start;flex-direction:column}
  .actions{display:grid;grid-template-columns:1fr 1fr}
  iframe{height:650px}
}
</style>
</head>
<body>
<main class="app">

<header class="header">
  <h1>LAB</h1>
  <p>Pega el código que te envíe y presiona Previsualizar.</p>
</header>

<section class="card">
  <div class="card-head">
    <strong>Código HTML + CSS + JavaScript</strong>
    <span class="estado" id="estado">Sin previsualizar</span>
  </div>

  <textarea
    id="codigo"
    spellcheck="false"
    placeholder="Pega aquí el código completo del letrero..."></textarea>

  <div class="actions">
    <button class="btn" id="limpiar">Limpiar</button>
    <button class="btn run" id="ejecutar">Previsualizar</button>
  </div>
</section>

<section class="card" id="previewCard">
  <div class="card-head">
    <strong>Previsualización</strong>
    <button class="btn full" id="ampliar">Pantalla completa</button>
  </div>

  <div class="preview-wrap">
    <iframe
      id="visor"
      title="Previsualización del código"
      sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
  </div>
</section>

</main>

<script>
'use strict';

const codigo = document.getElementById('codigo');
const visor = document.getElementById('visor');
const estado = document.getElementById('estado');
const previewCard = document.getElementById('previewCard');
const ampliar = document.getElementById('ampliar');
const STORAGE_KEY = 'lab_codigo_pegado_v1';

function paginaVacia(){
  return `<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{
  margin:0;
  min-height:100%;
  display:grid;
  place-items:center;
  background:#f1f3f9;
  color:#64748b;
  font-family:Arial,sans-serif;
}
</style>
</head>
<body>Pega el código y presiona Previsualizar.</body>
</html>`;
}

function normalizar(texto){
  const limpio = String(texto || '').trim();

  if(!limpio){
    return paginaVacia();
  }

  if(/<!doctype|<html[\s>]/i.test(limpio)){
    return limpio;
  }

  return `<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;min-height:100%}</style>
</head>
<body>
${limpio}
</body>
</html>`;
}

function previsualizar(){
  visor.srcdoc = normalizar(codigo.value);
  localStorage.setItem(STORAGE_KEY,codigo.value);
  estado.textContent = 'Previsualizado';
}

codigo.addEventListener('input',()=>{
  localStorage.setItem(STORAGE_KEY,codigo.value);
  estado.textContent = 'Cambios pendientes';
});

codigo.addEventListener('keydown',evento=>{
  if(evento.key === 'Tab'){
    evento.preventDefault();
    const inicio = codigo.selectionStart;
    const fin = codigo.selectionEnd;
    codigo.value =
      codigo.value.substring(0,inicio) +
      '  ' +
      codigo.value.substring(fin);
    codigo.selectionStart = codigo.selectionEnd = inicio + 2;
  }

  if((evento.ctrlKey || evento.metaKey) && evento.key === 'Enter'){
    evento.preventDefault();
    previsualizar();
  }
});

document.getElementById('ejecutar').addEventListener('click',previsualizar);

document.getElementById('limpiar').addEventListener('click',()=>{
  if(!confirm('¿Limpiar el código pegado?')) return;
  codigo.value = '';
  localStorage.removeItem(STORAGE_KEY);
  previsualizar();
});

ampliar.addEventListener('click',()=>{
  const activa = previewCard.classList.toggle('fullscreen');
  ampliar.textContent = activa ? 'Cerrar pantalla completa' : 'Pantalla completa';
  document.body.style.overflow = activa ? 'hidden' : '';
});

const guardado = localStorage.getItem(STORAGE_KEY);

if(guardado){
  codigo.value = guardado;
  previsualizar();
}else{
  visor.srcdoc = paginaVacia();
}
</script>
</body>
</html>
