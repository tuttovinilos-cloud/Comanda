<!DOCTYPE html>
<html lang="es" class="loading-menu">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&family=Roboto+Mono:wght@500;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
:root{
  --bg:#f0f2f9;--card:#fff;--soft:#f8f9ff;--line:#d9deea;--line2:#cbd3e6;
  --text:#111827;--muted:#6b7280;--muted2:#475569;--blue:#153bff;--blue2:#0b1f7a;
  --header:#172bd8;--green:#16a34a;--red:#dc2626;--amber:#b77900;--orange:#ea580c;
  --violet:#6d28d9;--head:'Montserrat',Inter,Arial,sans-serif;--body:'Inter',Arial,sans-serif;
  --mono:'Roboto Mono',ui-monospace,monospace;--r:15px;--pill:999px;
  --sh:0 1px 2px rgba(15,23,42,.04),0 6px 18px rgba(15,23,42,.06);
}
html,body{margin:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--text)}
body{font-family:var(--body);font-size:13.5px;line-height:1.35;padding-bottom:40px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.header{position:sticky;top:0;z-index:900;display:grid;grid-template-columns:155px 44px minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;min-height:58px;height:58px;padding:10px 16px;background:var(--header);box-shadow:0 8px 20px rgba(21,59,255,.18)}
.logo{grid-column:1;grid-row:1;width:155px;height:38px;display:flex;align-items:center;overflow:hidden}.logo img{height:34px;max-width:138px;object-fit:contain}
.noti-btn{grid-column:2;grid-row:1;position:relative;display:inline-flex;align-items:center;justify-content:center;width:38px;height:34px;border-radius:var(--pill);border:1px solid rgba(255,255,255,.30);background:rgba(255,255,255,.12);color:#fff}
.noti-count{position:absolute;right:-4px;top:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:var(--pill);background:#e5e7eb;color:#64748b;font-family:var(--mono);font-size:8px;font-weight:900;display:flex;align-items:center;justify-content:center}
.header-tabs{grid-column:3;grid-row:1}.mobile-menu-btn{grid-column:4;grid-row:1}
.wrap{max-width:1460px;margin:0 auto;padding:14px 16px 0}
.hero{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:15px 17px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.eyebrow{font-family:var(--head);font-size:9px;font-weight:900;letter-spacing:1.3px;text-transform:uppercase;color:var(--blue)}
.hero h1{font-family:var(--head);font-size:22px;line-height:1.05;margin:4px 0 0}.hero p{margin:5px 0 0;color:var(--muted);font-size:12px}
.hero-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line2);background:#fff;color:#334155;min-height:38px;padding:8px 12px;border-radius:11px;font-family:var(--head);font-size:10.5px;font-weight:900;letter-spacing:.2px}
.btn:hover{border-color:#aeb8d0}.btn.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));border-color:transparent;color:#fff}.btn.soft{background:#eef3ff;color:var(--blue);border-color:#d5e1ff}.btn.green{background:#ecfdf3;color:#15803d;border-color:#bbf7d0}.btn.red{background:#fff1f2;color:var(--red);border-color:#fecdd3}.btn.sm{min-height:31px;padding:6px 9px;border-radius:9px;font-size:9.5px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.sum{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;min-width:0}
.sum span{color:var(--muted);font-size:9.5px;font-weight:900;text-transform:uppercase;letter-spacing:.4px}.sum b{font-family:var(--mono);font-size:18px}
.tools{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--sh);display:grid;grid-template-columns:minmax(240px,1fr) auto auto;gap:9px;align-items:center}
.search{height:40px;border:1px solid var(--line2);border-radius:11px;display:flex;align-items:center;padding:0 11px;gap:8px;background:#fff}.search input{border:0;outline:0;width:100%;font-weight:650;color:var(--text)}
.filters,.view-toggle{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;color:#536076;border-radius:var(--pill);min-height:31px;padding:6px 10px;font-size:9.5px;font-weight:900}.chip.active{background:#eef3ff;color:var(--blue);border-color:#cddcff}.view-toggle .chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.workspace{display:grid;grid-template-columns:390px minmax(0,1fr);gap:10px;margin-top:10px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:var(--sh);overflow:hidden}
.panel-head{padding:12px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fbfcff}
.panel-head h2{font-family:var(--head);font-size:12px;margin:0}.panel-head small{color:var(--muted);font-size:9.5px;font-weight:700}
.orders{max-height:calc(100vh - 240px);overflow:auto;padding:7px}
.order-card{border:1px solid var(--line);border-radius:13px;padding:11px;margin-bottom:7px;background:#fff;cursor:pointer;transition:.16s ease}.order-card:hover{border-color:#b8c4df;transform:translateY(-1px)}.order-card.active{border-color:#9db0ff;box-shadow:0 0 0 3px rgba(21,59,255,.08);background:#fbfcff}
.order-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.order-num{font-family:var(--mono);font-size:11px;font-weight:900;color:var(--blue2)}.order-client{font-family:var(--head);font-weight:900;font-size:13px;margin-top:4px}.order-project{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress-pill{min-width:51px;height:28px;padding:0 8px;border-radius:10px;background:#eef3ff;color:var(--blue);font-family:var(--mono);font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center}
.order-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 7px;border-radius:var(--pill);background:#f4f6fb;border:1px solid #e0e5f0;color:#546074;font-size:8.7px;font-weight:850}.tag.bad{background:#fff1f2;border-color:#fecdd3;color:#be123c}.tag.warn{background:#fff8e8;border-color:#fde3a3;color:#9a6700}.tag.ok{background:#ecfdf3;border-color:#bbf7d0;color:#15803d}.tag.blue{background:#eef3ff;border-color:#d7e2ff;color:var(--blue)}
.detail-empty{padding:55px 20px;text-align:center;color:var(--muted)}.detail-empty b{display:block;color:#26324a;font-family:var(--head);font-size:15px;margin-bottom:5px}
.detail{min-height:430px}.detail-header{padding:14px 15px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.detail-title{font-family:var(--head);font-size:18px;font-weight:900}.detail-sub{font-size:11px;color:var(--muted);margin-top:3px}.detail-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.jobs{padding:9px}.job{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:11px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;background:#fff}
.thumb{width:78px;height:70px;border-radius:11px;background:#f2f4f9;border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;color:#9aa4b5;font-size:24px}.thumb img{width:100%;height:100%;object-fit:cover}
.job-name{font-family:var(--head);font-size:13px;font-weight:900}.job-type{font-size:10px;color:var(--muted);margin-top:2px}.job-now{margin-top:7px;font-size:10px;font-weight:800;color:#334155}.job-now b{color:var(--blue)}.job-next{font-size:9.5px;color:#67748a;margin-top:2px}
.bar{height:5px;background:#e8ecf5;border-radius:99px;overflow:hidden;margin-top:7px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#4c6fff);border-radius:99px}
.job-side{min-width:115px;text-align:right}.pct{font-family:var(--mono);font-size:17px;font-weight:900;color:var(--blue2)}.state{display:inline-flex;margin-top:5px;padding:5px 8px;border-radius:var(--pill);font-size:8.5px;font-weight:900;text-transform:uppercase;border:1px solid}.state.pendiente{background:#f7f8fb;color:#64748b;border-color:#e1e5ed}.state.produccion{background:#eef3ff;color:var(--blue);border-color:#d1ddff}.state.bloqueado{background:#fff1f2;color:#be123c;border-color:#fecdd3}.state.instalacion{background:#f3eefe;color:#6d28d9;border-color:#ddd0ff}.state.listo{background:#ecfdf3;color:#15803d;border-color:#bbf7d0}.state.cancelado{background:#f8fafc;color:#94a3b8;border-color:#e2e8f0}
.job-actions{margin-top:7px;display:flex;gap:5px;justify-content:flex-end}
.step-board{margin-top:10px;display:flex;gap:9px;overflow:auto;padding:1px 1px 12px}.step-col{flex:0 0 280px;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--sh);overflow:hidden}.step-col-head{padding:10px 11px;border-bottom:1px solid var(--line);background:#fbfcff;display:flex;align-items:center;justify-content:space-between}.step-col-head b{font-family:var(--head);font-size:10.5px}.step-col-head span{font-family:var(--mono);font-size:10px;color:var(--muted)}.step-col-body{padding:7px;min-height:120px}.step-card{border:1px solid var(--line);border-radius:11px;padding:9px;margin-bottom:6px}.step-card b{display:block;font-size:11px}.step-card small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.step-card .mini{margin-top:7px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.modal-back{position:fixed;inset:0;z-index:1200;background:rgba(15,23,42,.46);display:none;align-items:center;justify-content:center;padding:16px}.modal-back.show{display:flex}.modal{width:min(820px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;border:1px solid var(--line);box-shadow:0 24px 70px rgba(15,23,42,.25)}.modal.wide{width:min(1050px,100%)}.modal-head{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line);padding:13px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}.modal-head h3{font-family:var(--head);font-size:14px;margin:0}.x{width:31px;height:31px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:900}.modal-body{padding:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:9px;font-weight:900;color:#667085;text-transform:uppercase;letter-spacing:.35px}.input,.select,.textarea{width:100%;min-height:39px;border:1px solid var(--line2);border-radius:10px;background:#fff;padding:9px 10px;outline:none;color:var(--text);font-weight:650}.textarea{min-height:72px;resize:vertical}.input:focus,.select:focus,.textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(21,59,255,.08)}
.switch-row{display:flex;gap:8px;flex-wrap:wrap}.toggle{display:flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:10px;font-weight:850;background:#fafbfe}.toggle input{accent-color:var(--blue)}
.modal-foot{padding:12px 14px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:#fbfcff}
.workflow{display:flex;flex-direction:column;gap:7px}.wstep{display:grid;grid-template-columns:32px minmax(0,1fr) 145px;gap:9px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:9px}.windex{width:28px;height:28px;border-radius:9px;background:#eef3ff;color:var(--blue);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;font-weight:900}.wname{font-weight:900;font-size:11px}.wsubs{font-size:9px;color:var(--muted);margin-top:4px}.wstatus{width:100%;min-height:34px;border:1px solid var(--line2);border-radius:9px;background:#fff;font-size:9.5px;font-weight:850;padding:6px 8px}
.section-title{font-family:var(--head);font-size:11px;margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--line)}.section-title:first-child{margin-top:0;padding-top:0;border-top:0}
.toast{position:fixed;z-index:2000;right:16px;bottom:16px;max-width:360px;background:#111827;color:#fff;border-radius:12px;padding:10px 12px;font-size:10px;font-weight:750;box-shadow:0 15px 40px rgba(0,0,0,.22);display:none}.toast.show{display:block}
.loading{padding:30px;text-align:center;color:var(--muted);font-weight:800}
@media(max-width:1050px){.workspace{grid-template-columns:330px minmax(0,1fr)}.job{grid-template-columns:64px minmax(0,1fr) auto}.thumb{width:64px;height:62px}}
@media(max-width:850px){
  .header{grid-template-columns:140px 40px 1fr auto;height:auto;min-height:58px;overflow:visible}.logo{width:140px}.header-tabs{grid-column:1/-1;grid-row:2}
  .wrap{padding:10px 10px 0}.hero{grid-template-columns:1fr}.hero-actions{justify-content:flex-start}.summary{grid-template-columns:repeat(2,1fr)}
  .tools{grid-template-columns:1fr}.filters,.view-toggle{overflow:auto;flex-wrap:nowrap;padding-bottom:2px}.workspace{grid-template-columns:1fr}.orders{max-height:none}.detail{display:none}.detail.mobile-show{display:block}
  .job{grid-template-columns:58px minmax(0,1fr)}.thumb{width:58px;height:58px}.job-side{grid-column:2;text-align:left;display:flex;align-items:center;gap:7px;flex-wrap:wrap}.job-actions{margin:0}
  .grid,.grid.three{grid-template-columns:1fr}.wstep{grid-template-columns:30px minmax(0,1fr)}.wstatus{grid-column:2}
}
</style>
</head>
<body>
<header class="header">
  <div class="logo"><img src="img/logo-tutto.svg" alt="Tuttovinilos"></div>
  <button class="noti-btn" id="notiBtnGlobal" type="button" title="Notificaciones">🔔<span class="noti-count empty" id="notiCountGlobal">0</span></button>
  <nav id="authMenu" class="header-tabs" data-auth-menu></nav>
</header>

<main class="wrap">
  <section class="hero">
    <div>
      <div class="eyebrow">COMANDA · PRODUCCIÓN</div>
      <h1>Corpóreos</h1>
      <p>Pedido → trabajos → flujo de fabricación → instalación → listo.</p>
    </div>
    <div class="hero-actions">
      <button class="btn soft" id="refreshBtn">↻ Actualizar</button>
      <button class="btn primary" id="newJobBtn">＋ Nuevo trabajo</button>
    </div>
  </section>

  <section class="summary">
    <div class="sum"><span>Pedidos activos</span><b id="sOrders">0</b></div>
    <div class="sum"><span>Trabajos activos</span><b id="sJobs">0</b></div>
    <div class="sum"><span>Requieren atención</span><b id="sAttention">0</b></div>
    <div class="sum"><span>Listos</span><b id="sReady">0</b></div>
  </section>

  <section class="tools">
    <div class="search">⌕<input id="searchInput" placeholder="Buscar cliente, pedido, proyecto, trabajo o tipo..."></div>
    <div class="filters" id="filters">
      <button class="chip active" data-filter="todos">Todos</button>
      <button class="chip" data-filter="atencion">Atención</button>
      <button class="chip" data-filter="produccion">Producción</button>
      <button class="chip" data-filter="instalacion">Instalación</button>
      <button class="chip" data-filter="listo">Listos</button>
    </div>
    <div class="view-toggle" id="viewToggle">
      <button class="chip active" data-view="pedidos">Por pedido</button>
      <button class="chip" data-view="etapas">Por etapa</button>
    </div>
  </section>

  <section id="ordersView" class="workspace">
    <aside class="panel">
      <div class="panel-head"><div><h2>Pedidos</h2><small id="ordersCount">0 encontrados</small></div></div>
      <div class="orders" id="ordersList"><div class="loading">Cargando…</div></div>
    </aside>

    <section class="panel detail" id="detailPanel">
      <div class="detail-empty" id="detailEmpty"><b>Selecciona un pedido</b>Verás sus trabajos y el avance de cada uno.</div>
      <div id="detailContent" class="hidden"></div>
    </section>
  </section>

  <section id="stepsView" class="hidden">
    <div class="step-board" id="stepBoard"></div>
  </section>
</main>

<div class="modal-back" id="newModal">
  <div class="modal">
    <div class="modal-head"><h3>Nuevo trabajo de corpóreo</h3><button class="x" data-close="newModal">✕</button></div>
    <form id="newForm">
      <div class="modal-body">
        <div class="grid">
          <div class="field full">
            <label>Pedido de Comanda</label>
            <input class="input" id="orderSearch" placeholder="Filtra por número, cliente o proyecto…">
            <select class="select" id="orderSelect" required size="5"></select>
          </div>
          <div class="field"><label>Nombre del trabajo</label><input class="input" id="jobName" required placeholder="Ej. Logo principal"></div>
          <div class="field"><label>Tipo de letrero / fabricación</label><select class="select" id="typeSelect" required></select></div>
          <div class="field"><label>Cantidad</label><input class="input" id="jobQty" type="number" min="1" value="1"></div>
          <div class="field"><label>Responsable</label><select class="select" id="jobResponsible"></select></div>
          <div class="field"><label>Fecha objetivo</label><input class="input" id="jobDate" type="date"></div>
          <div class="field"><label>Prioridad</label><select class="select" id="jobPriority"><option value="normal">Normal</option><option value="alta">Alta</option><option value="urgente">Urgente</option><option value="baja">Baja</option></select></div>
          <div class="field full"><label>Descripción / alcance</label><textarea class="textarea" id="jobDesc" placeholder="Lo particular de este trabajo; no repitas el manual técnico."></textarea></div>
          <div class="field full">
            <div class="switch-row">
              <label class="toggle"><input type="checkbox" id="jobInstall"> Requiere instalación</label>
              <label class="toggle"><input type="checkbox" id="jobLight"> Requiere iluminación</label>
            </div>
          </div>
          <div class="field"><label>Medidas</label><input class="input" id="specMeasures" placeholder="Ej. 120 × 45 cm"></div>
          <div class="field"><label>Material / espesor</label><input class="input" id="specMaterial" placeholder="Ej. PVC 15 mm"></div>
          <div class="field"><label>Acabado / color</label><input class="input" id="specFinish" placeholder="Ej. Gris mate"></div>
          <div class="field"><label>Luz</label><input class="input" id="specLight" placeholder="Ej. 3000K"></div>
          <div class="field"><label>Superficie</label><input class="input" id="specSurface" placeholder="Ej. ACM / bloque"></div>
          <div class="field"><label>Fijación</label><input class="input" id="specFix" placeholder="Ej. Chupón / tornillo"></div>
          <div class="field full"><label>Imagen / referencia</label><input class="input" id="jobImage" type="file" accept="image/*"></div>
        </div>
      </div>
      <div class="modal-foot"><button type="button" class="btn" data-close="newModal">Cancelar</button><button class="btn primary" id="saveNewBtn">Crear trabajo</button></div>
    </form>
  </div>
</div>

<div class="modal-back" id="jobModal">
  <div class="modal wide">
    <div class="modal-head"><h3 id="jobModalTitle">Trabajo</h3><button class="x" data-close="jobModal">✕</button></div>
    <div class="modal-body" id="jobModalBody"></div>
    <div class="modal-foot"><button class="btn" data-close="jobModal">Cerrar</button><button class="btn primary" id="saveJobBtn">Guardar ficha</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/auth.js?v=29"></script>
<script src="js/supabase.js?v=2"></script>
<script src="js/menu.js?v=45"></script>
<script src="js/notificaciones.js?v=1"></script>
<script>
(() => {
  const state = {
    trabajos: [], tipos: [], pedidos: [], operadores: [],
    filter: 'todos', view: 'pedidos', selectedPedido: null, currentJob: null
  };
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));

  function norm(v){
    return String(v ?? '').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').trim();
  }
  function esc(v){
    return String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function toast(msg, bad=false){
    const el=$('#toast'); el.textContent=msg; el.style.background=bad?'#b91c1c':'#111827'; el.classList.add('show');
    clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2600);
  }
  function localDate(v){
    if(!v) return '';
    const d = new Date(String(v).length===10 ? v+'T12:00:00' : v);
    if(Number.isNaN(d.getTime())) return String(v);
    return d.toLocaleDateString('es-VE',{day:'2-digit',month:'short'});
  }
  function currentOperator(){
    try{
      if(typeof window.getSesionOperador==='function') return window.getSesionOperador();
      return JSON.parse(localStorage.getItem('comanda_operador_actual')||'null');
    }catch{return null}
  }
  async function waitDb(){
    for(let i=0;i<80;i++){
      if(window.supabaseClient) return window.supabaseClient;
      await new Promise(r=>setTimeout(r,100));

  function renderOrderSelect(){

  function grouped(){
    const map=new Map();
    filteredJobs().forEach(j=>{
      if(!map.has(j.pedido_id)) map.set(j.pedido_id,{pedido_id:j.pedido_id,cliente:j.cliente,pedido_descripcion:j.pedido_descripcion,pedido_fecha_entrega:j.pedido_fecha_entrega,pedido_operador:j.pedido_operador,jobs:[]});
      map.get(j.pedido_id).jobs.push(j);
    });
    return [...map.values()];
  }
  function isOverdue(j){
    const v=j.fecha_entrega||j.pedido_fecha_entrega; if(!v || j.estado==='listo' || j.estado==='cancelado') return false;
    const d=new Date(String(v).slice(0,10)+'T23:59:59'); return d < new Date();
  }
  function filteredJobs(){
    const q=norm($('#searchInput')?.value);
    return state.trabajos.filter(j=>{
      const text=norm(`${j.pedido_id} ${j.cliente} ${j.pedido_descripcion} ${j.nombre} ${j.tipo_nombre} ${j.responsable} ${j.paso_activo} ${j.siguiente_paso}`);
      if(q && !text.includes(q)) return false;
      if(state.filter==='atencion') return j.estado==='bloqueado' || isOverdue(j);
      if(state.filter==='produccion') return j.estado==='produccion' || j.estado==='pendiente';
      if(state.filter==='instalacion') return j.estado==='instalacion';
      if(state.filter==='listo') return j.estado==='listo';
      return j.estado!=='cancelado';
    });
  }

  function orderProgress(order){
    const js=order.jobs.filter(x=>x.estado!=='cancelado'); if(!js.length) return 0;
    return Math.round(js.reduce((a,j)=>a+(Number(j.porcentaje)||0),0)/js.length);
  }
  function orderAttention(order){ return order.jobs.filter(j=>j.estado==='bloqueado'||isOverdue(j)).length; }
  function nextOfOrder(order){
    const blocked=order.jobs.find(j=>j.estado==='bloqueado');
    if(blocked) return blocked.bloqueo || blocked.paso_activo || 'Bloqueado';
    const active=order.jobs.find(j=>j.paso_activo);
    if(active) return active.paso_activo;
    const next=order.jobs.find(j=>j.siguiente_paso);
    return next?.siguiente_paso || (order.jobs.every(j=>j.estado==='listo')?'Listo':'Pendiente');
  }

  function render(keepSelection=true){
    const allActive=state.trabajos.filter(j=>j.estado!=='cancelado');
    const orderIds=new Set(allActive.filter(j=>j.estado!=='listo').map(j=>j.pedido_id));
    $('#sOrders').textContent=orderIds.size;
    $('#sJobs').textContent=allActive.filter(j=>j.estado!=='listo').length;
    $('#sAttention').textContent=allActive.filter(j=>j.estado==='bloqueado'||isOverdue(j)).length;
    $('#sReady').textContent=allActive.filter(j=>j.estado==='listo').length;

    const orders=grouped();
    $('#ordersCount').textContent=`${orders.length} encontrados`;
    if(!keepSelection || !orders.some(o=>o.pedido_id===state.selectedPedido)) state.selectedPedido=orders[0]?.pedido_id||null;

    $('#ordersList').innerHTML=orders.length?orders.map(o=>{
      const pct=orderProgress(o), att=orderAttention(o), due=o.jobs.map(j=>j.fecha_entrega).find(Boolean)||o.pedido_fecha_entrega;
      return `<article class="order-card ${o.pedido_id===state.selectedPedido?'active':''}" data-order="${o.pedido_id}">
        <div class="order-top"><div><div class="order-num">PEDIDO #${o.pedido_id}</div><div class="order-client">${esc(o.cliente||'Sin cliente')}</div><div class="order-project">${esc(o.pedido_descripcion||'Sin descripción')}</div></div><div class="progress-pill">${pct}%</div></div>
        <div class="order-meta"><span class="tag blue">${o.jobs.length} trabajo${o.jobs.length===1?'':'s'}</span>${att?`<span class="tag bad">${att} atención</span>`:''}${due?`<span class="tag ${new Date(String(due).slice(0,10)+'T23:59:59')<new Date()?'bad':''}">Entrega ${esc(localDate(due))}</span>`:''}<span class="tag">→ ${esc(nextOfOrder(o))}</span></div>
      </article>`;
    }).join(''):'<div class="detail-empty"><b>No hay trabajos</b>Crea el primer trabajo de corpóreo.</div>';

    $$('.order-card').forEach(el=>el.onclick=()=>{state.selectedPedido=Number(el.dataset.order);render(true)});
    renderDetail(orders.find(o=>o.pedido_id===state.selectedPedido));
    renderStepBoard();
  }

  function renderDetail(order){

  function jobCard(j){
    const img=j.imagen_url||j.pedido_imagen_url;

  function stateLabel(v){ return ({pendiente:'Pendiente',produccion:'En producción',bloqueado:'Bloqueado',instalacion:'Instalación',listo:'Listo',cancelado:'Cancelado'})[v]||v||'Pendiente'; }

  function renderStepBoard(){
    const jobs=filteredJobs();
    const groups=new Map();
    jobs.forEach(j=>{
      let k;
      if(j.estado==='bloqueado') k='⚠ Bloqueados';
      else if(j.estado==='listo') k='✓ Listos';
      else k=j.paso_activo||j.siguiente_paso||'Pendientes';
      if(!groups.has(k)) groups.set(k,[]);
      groups.get(k).push(j);
    });
    const sorted=[...groups.entries()].sort((a,b)=>{
      const aw=a[0].includes('Bloque')?-10:a[0].includes('Listo')?10:0;
      const bw=b[0].includes('Bloque')?-10:b[0].includes('Listo')?10:0;
      return aw-bw || a[0].localeCompare(b[0]);
    });
    $('#stepBoard').innerHTML=sorted.length?sorted.map(([name,js])=>`<section class="step-col"><div class="step-col-head"><b>${esc(name)}</b><span>${js.length}</span></div><div class="step-col-body">${js.map(j=>`<article class="step-card"><b>${esc(j.nombre)}</b><small>#${j.pedido_id} · ${esc(j.cliente||'')} · ${esc(j.tipo_nombre||'')}</small><div class="mini"><span class="state ${esc(j.estado)}">${esc(stateLabel(j.estado))}</span><button class="btn soft sm" data-job="${j.id}">Abrir</button></div></article>`).join('')}</div></section>`).join(''):'<div class="detail-empty"><b>Sin resultados</b>No hay trabajos para este filtro.</div>';
    $$('#stepBoard [data-job]').forEach(b=>b.onclick=()=>openJob(b.dataset.job));
  }

  async function createJob(ev){
    ev.preventDefault();
    const pedidoId=Number($('#orderSelect').value); const tipoId=$('#typeSelect').value;
    if(!pedidoId || !tipoId || !$('#jobName').value.trim()) return toast('Completa pedido, nombre y tipo.',true);
    const op=currentOperator();
    const specs={
      medidas:$('#specMeasures').value.trim(), material:$('#specMaterial').value.trim(),
      acabado:$('#specFinish').value.trim(), luz:$('#specLight').value.trim(),
      superficie:$('#specSurface').value.trim(), fijacion:$('#specFix').value.trim()
    };
    Object.keys(specs).forEach(k=>{if(!specs[k]) delete specs[k]});
    const payload={
      pedido_id:pedidoId,tipo_id:tipoId,nombre:$('#jobName').value.trim(),cantidad:Number($('#jobQty').value)||1,
      descripcion:$('#jobDesc').value.trim()||null,responsable:$('#jobResponsible').value||null,
      fecha_entrega:$('#jobDate').value||null,prioridad:$('#jobPriority').value,
      requiere_instalacion:$('#jobInstall').checked,requiere_iluminacion:$('#jobLight').checked,
      especificaciones:specs,creado_por:op?.nombre||null,actualizado_por:op?.nombre||null
    };
    try{
      const db=await waitDb(); $('#saveNewBtn').disabled=true; $('#saveNewBtn').textContent='Creando…';
      const {data,error}=await db.from('corp_trabajos').insert(payload).select('id').single();
      if(error) throw error;
      const file=$('#jobImage').files?.[0];
      if(file){
        const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
        const path=`corporeos/${pedidoId}/${data.id}-${Date.now()}-${safe}`;
        const up=await db.storage.from('adjuntos-pedidos').upload(path,file,{upsert:false,contentType:file.type||undefined});
        if(!up.error){
          const pub=db.storage.from('adjuntos-pedidos').getPublicUrl(path);
          await db.from('corp_trabajos').update({imagen_url:pub.data.publicUrl}).eq('id',data.id);
        }
      }
      closeModal('newModal'); toast('Trabajo creado con su flujo automático.'); await loadAll(false); state.selectedPedido=pedidoId; render(true);
    }catch(e){console.error(e);toast('No se pudo crear: '+(e.message||e),true)}
    finally{$('#saveNewBtn').disabled=false;$('#saveNewBtn').textContent='Crear trabajo'}
  }

  async function updateStep(stepId,status){
    try{
      const db=await waitDb(); const now=new Date().toISOString();
      const patch={estado:status};
      if(status==='proceso') patch.iniciado_at=now;
      if(status==='listo') patch.completado_at=now;
      const {error}=await db.from('corp_trabajo_pasos').update(patch).eq('id',stepId); if(error) throw error;
      await syncJobState(state.currentJob.id);
      await loadAll(true);
      const refreshed=state.trabajos.find(x=>x.id===state.currentJob.id);
      if(refreshed) state.currentJob={...state.currentJob,...refreshed};
      toast('Avance actualizado.');
    }catch(e){console.error(e);toast('No se pudo actualizar el paso.',true)}
  }

  async function syncJobState(jobId){
    const db=await waitDb();
    const {data,error}=await db.from('corp_trabajo_pasos').select('estado,nombre,categoria,orden').eq('trabajo_id',jobId).order('orden');
    if(error) throw error;
    const steps=data||[]; let estado='pendiente';
    if(steps.some(s=>s.estado==='bloqueado')) estado='bloqueado';
    else if(steps.length && steps.every(s=>s.estado==='listo'||s.estado==='omitido')) estado='listo';
    else{
      const active=steps.find(s=>s.estado==='proceso');
      if(active && norm(`${active.nombre} ${active.categoria}`).includes('instal')) estado='instalacion';
      else if(active || steps.some(s=>s.estado==='listo')) estado='produccion';
    }
    await db.from('corp_trabajos').update({estado,actualizado_por:currentOperator()?.nombre||null}).eq('id',jobId);
  }

  async function saveCurrentJob(){
    const j=state.currentJob; if(!j) return;
    const specs={...(j.especificaciones||{}),medidas:$('#editMeasures').value.trim(),material:$('#editMaterial').value.trim(),acabado:$('#editFinish').value.trim(),luz:$('#editLight').value.trim(),superficie:$('#editSurface').value.trim(),fijacion:$('#editFix').value.trim()};
    Object.keys(specs).forEach(k=>{if(specs[k]==='') delete specs[k]});
    const patch={nombre:$('#editName').value.trim(),responsable:$('#editResponsible').value||null,fecha_entrega:$('#editDate').value||null,descripcion:$('#editDesc').value.trim()||null,bloqueo:$('#editBlock').value.trim()||null,especificaciones:specs,actualizado_por:currentOperator()?.nombre||null};
    try{
      const db=await waitDb(); const {error}=await db.from('corp_trabajos').update(patch).eq('id',j.id); if(error) throw error;
      if(patch.bloqueo) await db.from('corp_trabajos').update({estado:'bloqueado'}).eq('id',j.id);
      else await syncJobState(j.id);
      closeModal('jobModal'); toast('Ficha guardada.'); await loadAll(true);
    }catch(e){console.error(e);toast('No se pudo guardar.',true)}
  }

\/script></body></html>`);

  $('#refreshBtn').onclick=()=>loadAll(true);
  $('#newForm').onsubmit=createJob;
  $('#orderSearch').oninput=renderOrderSelect;
  $('#saveJobBtn').onclick=saveCurrentJob;
  $('#searchInput').oninput=()=>render(true);
  $('#filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;state.filter=b.dataset.filter;$$('#filters .chip').forEach(x=>x.classList.toggle('active',x===b));render(true)};
  $('#viewToggle').onclick=e=>{const b=e.target.closest('[data-view]');if(!b)return;state.view=b.dataset.view;$$('#viewToggle .chip').forEach(x=>x.classList.toggle('active',x===b));$('#ordersView').classList.toggle('hidden',state.view!=='pedidos');$('#stepsView').classList.toggle('hidden',state.view!=='etapas');renderStepBoard()};
  $$('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));
  $$('.modal-back').forEach(m=>m.addEventListener('click',e=>{if(e.target===m) closeModal(m.id)}));
  addEventListener('keydown',e=>{if(e.key==='Escape') $$('.modal-back.show').forEach(m=>closeModal(m.id))});

  async function boot(){
    const op=currentOperator();
    if(!op || op.activo===false){ location.href='login.html'; return; }
    const isRoberto=norm(op.nombre)==='roberto';
    if(!isRoberto && op.puede_organizador!==true){ location.href='index.html'; return; }
    replaceMenuItem();
    await loadAll(false);
  }
  boot();
})();
</script>
</body>
</html>
