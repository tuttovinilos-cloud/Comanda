<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CAT · Tuttovinilos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#172bd8;--blue2:#0b1f7a;--orange:#ff7a18;--bg:#eef1f8;--card:#fff;--text:#111827;--muted:#64748b;--border:#d9deea;--green:#16a34a}
body{font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:96px}button,input,select,textarea{font:inherit}button{cursor:pointer}
.header{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:14px 16px;box-shadow:0 8px 24px rgba(23,43,216,.22)}
.header-row{max-width:780px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:1000;font-size:21px}.brand span{color:var(--orange)}.header small{display:block;font-size:10px;opacity:.75;margin-top:2px;font-weight:800}
.main{max-width:780px;margin:auto;padding:12px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.tab{border:1px solid var(--border);background:#fff;color:var(--blue);border-radius:15px;padding:12px 8px;font-weight:900}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.search{width:100%;border:1px solid var(--border);background:#fff;border-radius:15px;padding:14px;font-size:15px;font-weight:800;outline:none;margin-bottom:12px}.section-title{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:1000;margin:14px 2px 8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{border:1px solid var(--border);background:var(--card);border-radius:18px;padding:13px;box-shadow:0 4px 14px rgba(15,23,42,.055);display:flex;flex-direction:column;gap:8px}.card h3{font-size:14px;line-height:1.2;font-weight:1000}.card p{font-size:11px;color:var(--muted);line-height:1.4;font-weight:700}.badges{display:flex;gap:5px;flex-wrap:wrap}.badge{font-size:9px;border-radius:999px;padding:5px 7px;background:#eef1ff;color:var(--blue);font-weight:900}.badge.orange{background:#fff1e8;color:#c2410c}.card button{margin-top:auto;border:0;border-radius:11px;padding:10px;background:var(--blue);color:#fff;font-size:11px;font-weight:900}
.empty{background:#fff;border:1px solid var(--border);border-radius:16px;padding:28px;text-align:center;color:var(--muted);font-weight:800}.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:500;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(780px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:16px;box-shadow:0 -16px 50px rgba(0,0,0,.22)}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}.sheet h2{font-size:20px;font-weight:1000;color:var(--blue2)}.sheet-sub{font-size:11px;color:var(--muted);font-weight:800;margin-top:4px}.close{border:0;background:#eef1f8;width:36px;height:36px;border-radius:50%;font-size:18px;font-weight:900}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field.full{grid-column:1/-1}label{display:block;font-size:10px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px;background:#fff;outline:none}textarea{min-height:70px;resize:vertical}
.result{margin-top:14px;border:1px solid #bbf7d0;background:#f0fdf4;border-radius:16px;padding:14px}.result small{display:block;color:#166534;font-weight:900;text-transform:uppercase;font-size:9px}.result strong{display:block;color:#15803d;font-size:26px;margin-top:4px}.result p{font-size:11px;color:#166534;margin-top:5px;line-height:1.4;font-weight:700}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{border:0;border-radius:12px;padding:12px;font-weight:900}.btn.primary{background:var(--blue);color:#fff}.btn.orange{background:var(--orange);color:#fff}.note{margin-top:10px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:10px;font-size:11px;line-height:1.4;font-weight:750}.saved{margin-top:18px}.saved-item{background:#fff;border:1px solid var(--border);border-radius:14px;padding:11px;margin-top:8px}.saved-item b{font-size:12px}.saved-item small{display:block;color:var(--muted);margin-top:4px}
.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:90}.footer-inner{max-width:780px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}.footer button{border:0;border-radius:13px;padding:12px;font-weight:900}.footer .light{background:#eef1ff;color:var(--blue)}.footer .dark{background:var(--blue);color:#fff}
@media(max-width:520px){.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<header class="header"><div class="header-row"><div><div class="brand">C<span>A</span>T</div><small>CATÁLOGO Y COTIZADOR · TUTTOVINILOS</small></div><div style="font-size:11px;font-weight:900">Versión prueba</div></div></header>
<main class="main">
<div class="tabs"><button class="tab active" data-group="impresion" onclick="setGroup('impresion')">Impresión</button><button class="tab" data-group="letreros" onclick="setGroup('letreros')">Letreros</button></div>
<input id="search" class="search" placeholder="Buscar producto..." oninput="renderCatalog()">
<div id="catalog"></div>
<section class="saved"><div class="section-title">Cotizaciones guardadas</div><div id="savedQuotes"></div></section>
</main>
<div class="modal" id="quoteModal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="sheet-head"><div><h2 id="qTitle">Producto</h2><div class="sheet-sub" id="qSub"></div></div><button class="close" onclick="closeModal()">×</button></div>
<div class="form-grid"><div class="field" id="fAncho"><label>Ancho (cm)</label><input id="qAncho" type="number" min="0" step="0.01" value="100" oninput="calculate()"></div><div class="field" id="fAlto"><label>Alto (cm)</label><input id="qAlto" type="number" min="0" step="0.01" value="100" oninput="calculate()"></div><div class="field"><label>Cantidad</label><input id="qCant" type="number" min="1" step="1" value="1" oninput="calculate()"></div><div class="field"><label>Variante</label><select id="qVariant" onchange="calculate()"></select></div><div class="field full"><label>Extras</label><select id="qExtra" onchange="calculate()"></select></div><div class="field full"><label>Observación</label><textarea id="qNote" placeholder="Color, instalación, ubicación, detalles..."></textarea></div></div>
<div class="result"><small>Precio estimado</small><strong id="qTotal">$0</strong><p id="qDetail"></p></div><div class="note" id="qWarning"></div><div class="actions"><button class="btn primary" onclick="saveQuote()">Guardar prueba</button><button class="btn orange" onclick="copyQuote()">Copiar resumen</button></div></div></div>
<footer class="footer"><div class="footer-inner"><button class="light" onclick="document.getElementById('search').focus()">Buscar</button><button class="dark" onclick="showAll()">Ver todo</button></div></footer>
<script>
const products=[
{id:'vinil_blanco',group:'impresion',cat:'Viniles',name:'Vinil blanco mate',desc:'Impresión UV normal o con barniz.',mode:'area',base:18,variants:['Normal','Con barniz','Blanco para textura + color'],extras:['Sin extra'],warning:'Precio de prueba. Debe conectarse con el listado real.'},
{id:'vinil_clear',group:'impresion',cat:'Viniles',name:'Vinil clear',desc:'Base blanca o base blanca + color.',mode:'area',base:24,variants:['Base blanca','Base blanca + color'],extras:['Sin extra'],warning:'Confirmar uso interior o exterior.'},
{id:'vinil_holo',group:'impresion',cat:'Viniles',name:'Vinil holográfico / dorado',desc:'Normal, con barniz o con blanco.',mode:'area',base:28,variants:['Normal','Con barniz','Con blanco'],extras:['Sin extra'],warning:'Precio de prueba.'},
{id:'petfilm',group:'impresion',cat:'Impresión',name:'PET film',desc:'Impresión normal. Ancho máximo 105 cm.',mode:'area',base:14,variants:['Normal'],extras:['Sin extra'],warning:'Si supera 105 cm de ancho debe dividirse o consultarse.'},
{id:'sulfato',group:'impresion',cat:'Papelería',name:'Sulfato reverso',desc:'Una cara o tiro y retiro.',mode:'area',base:20,variants:['Una cara','Tiro y retiro','Con barniz'],extras:['Hendido, pegado y armado','Sin extra'],warning:'El corte láser se usa solo como último recurso.'},
{id:'lona',group:'impresion',cat:'Lona',name:'Lona blockout 13 oz',desc:'Ancho máximo de impresión 160 cm.',mode:'area',base:13,variants:['Impresión normal'],extras:['Sin ojales','Con ojales'],warning:'Si supera 160 cm de ancho debe dividirse o consultarse.'},
{id:'canvas',group:'impresion',cat:'Cuadros',name:'Cuadro canvas',desc:'Marco de PVC 15 mm y lona tipo lienzo tensada.',mode:'area',base:42,variants:['Canvas'],extras:['Gancho incluido'],warning:'Precio estimado por área. Revisar medidas muy grandes.'},
{id:'cuadro_vinil',group:'impresion',cat:'Cuadros',name:'Cuadro con vinil',desc:'Estructura en PVC, frente y laterales rotulados.',mode:'area',base:52,variants:['PVC frontal 3 mm','PVC frontal 5 mm'],extras:['Gancho incluido'],warning:'Para más de 80 × 80 cm se recomienda PVC frontal de 5 mm.'},
{id:'hangtag_pet',group:'impresion',cat:'Hangtags',name:'Hangtag PET film',desc:'PET film de 0,25 mm, impreso y cortado con láser.',mode:'area',base:30,variants:['Forma personalizada'],extras:['Cordón / cadena','Sin extra'],warning:'El precio final depende también de la cantidad y forma.'},
{id:'llavero',group:'impresion',cat:'POP',name:'Llavero personalizado',desc:'Acrílico 3 mm, vinil y barniz protector.',mode:'standard',base:3,variants:['Una cara','Dos caras'],extras:['Argolla incluida'],warning:'Las medidas son referenciales. Para formas especiales debe revisarse el archivo.'},
{id:'pvc_lam',group:'letreros',cat:'Letreros planos',name:'PVC laminado con vinil',desc:'PVC 3, 5, 9 o 15 mm con vinil frontal.',mode:'area',base:60,variants:['PVC 3 mm','PVC 5 mm','PVC 9 mm','PVC 15 mm'],extras:['Sin instalación','Con instalación'],warning:'Diseños con muchas piezas o trazos pequeños pueden necesitar revisión SVG.'},
{id:'pvc_acrilico',group:'letreros',cat:'Letreros planos',name:'PVC con acrílico',desc:'Base PVC 15 mm y frente acrílico.',mode:'complex',base:95,variants:['Acrílico sólido 3 mm','Acrílico sólido 5 mm','Acrílico transparente + vinil'],extras:['Canto crudo','Canto pintado','Con instalación'],warning:'El precio real depende de piezas, perímetro, color y tipo de acrílico.'},
{id:'pvc_pintura',group:'letreros',cat:'Letreros planos',name:'PVC con pintura automotriz',desc:'Acabado premium mate o brillante.',mode:'complex',base:125,variants:['PVC 9 mm','PVC 15 mm','PVC 30 mm'],extras:['Mate','Brillante','Con instalación'],warning:'Proceso lento. No fijar tiempo sin revisar cantidad y acabado.'},
{id:'frontlit',group:'letreros',cat:'Corpóreos',name:'Frontlit',desc:'Canto de aluminio y frente acrílico.',mode:'complex',base:180,variants:['Sin iluminación','Iluminación frontal','Iluminación posterior'],extras:['Canto 4 cm','Canto 6 cm','Canto 10 cm','Con instalación'],warning:'Debe analizarse el SVG para piezas, perímetro y consumo real.'},
{id:'neon',group:'letreros',cat:'Iluminados',name:'Neón LED sobre acrílico',desc:'Acrílico 8 mm, cinta LED 12 V y goma siliconada.',mode:'complex',base:160,variants:['Acrílico transparente','Acrílico con imagen'],extras:['Transformador incluido','Pernos decorativos'],warning:'Solo interior. Detalles pequeños pueden no ser fabricables.'},
{id:'caja_luz',group:'letreros',cat:'Iluminados',name:'Caja de luz',desc:'Caja normal de cortes rectos.',mode:'complex',base:145,variants:['Frente acrílico','Frente con vinil clear','PET film intercambiable'],extras:['Interior','Exterior','Con instalación'],warning:'El precio real depende de profundidad, iluminación, estructura e instalación.'},
{id:'cartelera',group:'letreros',cat:'Acrílicos',name:'Cartelera fiscal',desc:'Base acrílica y bolsillos de 10 × 13 cm.',mode:'standard',base:85,variants:['9 bolsillos','12 bolsillos','16 bolsillos','20 bolsillos','24 bolsillos'],extras:['Vinil frontal','Vinil posterior','Pernos incluidos'],warning:'Medidas distintas de bolsillo deben consultarse.'},
{id:'pizarra',group:'letreros',cat:'Acrílicos',name:'Pizarra acrílica',desc:'Acrílico con pernos separadores.',mode:'area',base:55,variants:['Acrílico 3 mm','Acrílico 5 mm'],extras:['Pernos incluidos'],warning:'El precio depende de medida y espesor.'},
{id:'slim',group:'letreros',cat:'Reventa',name:'Caja slim',desc:'Producto comprado para reventa.',mode:'standard',base:100,variants:['85 × 60 cm','120 × 75 cm'],extras:['Sin extra'],warning:'Precio y disponibilidad deben actualizarse manualmente.'},
{id:'chupeta',group:'letreros',cat:'Reventa',name:'Chupeta circular',desc:'Producto comprado para reventa.',mode:'standard',base:90,variants:['40 cm','60 cm','80 cm'],extras:['Sin extra'],warning:'Precio y disponibilidad deben actualizarse manualmente.'}
];
let currentGroup='impresion',currentProduct=null;
function setGroup(group){currentGroup=group;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.group===group));renderCatalog()}
function showAll(){document.getElementById('search').value='';renderCatalog(true)}
function renderCatalog(all=false){const q=(document.getElementById('search').value||'').toLowerCase().trim();const list=products.filter(p=>(all||p.group===currentGroup)&&(!q||`${p.name} ${p.cat} ${p.desc}`.toLowerCase().includes(q)));const groups={};list.forEach(p=>(groups[p.cat]??=[]).push(p));const root=document.getElementById('catalog');if(!list.length){root.innerHTML='<div class="empty">No se encontraron productos.</div>';return}root.innerHTML=Object.entries(groups).map(([cat,items])=>`<section><div class="section-title">${cat}</div><div class="grid">${items.map(p=>`<article class="card"><h3>${p.name}</h3><p>${p.desc}</p><div class="badges"><span class="badge">${p.mode==='area'?'Ancho × alto':p.mode==='standard'?'Precio estándar':'Cotización guiada'}</span><span class="badge orange">${p.variants.length} variante(s)</span></div><button onclick="openQuote('${p.id}')">Cotizar</button></article>`).join('')}</div></section>`).join('')}
function openQuote(id){currentProduct=products.find(p=>p.id===id);if(!currentProduct)return;document.getElementById('qTitle').textContent=currentProduct.name;document.getElementById('qSub').textContent=currentProduct.desc;document.getElementById('qVariant').innerHTML=currentProduct.variants.map(v=>`<option>${v}</option>`).join('');document.getElementById('qExtra').innerHTML=currentProduct.extras.map(v=>`<option>${v}</option>`).join('');const hide=currentProduct.mode==='standard';document.getElementById('fAncho').style.display=hide?'none':'block';document.getElementById('fAlto').style.display=hide?'none':'block';document.getElementById('qWarning').textContent=currentProduct.warning;document.getElementById('quoteModal').classList.add('show');calculate()}
function closeModal(){document.getElementById('quoteModal').classList.remove('show')}
function calculate(){if(!currentProduct)return;const w=Number(document.getElementById('qAncho').value||0),h=Number(document.getElementById('qAlto').value||0),c=Math.max(1,Number(document.getElementById('qCant').value||1)),v=document.getElementById('qVariant').selectedIndex,e=document.getElementById('qExtra').selectedIndex;let total=0,detail='';if(currentProduct.mode==='area'){const area=Math.max(.01,(w*h)/10000);total=currentProduct.base*area*c*(1+v*.15)+(e*.08*currentProduct.base);detail=`Área: ${area.toFixed(4)} m² · Cantidad: ${c}.`}else if(currentProduct.mode==='standard'){total=currentProduct.base*c*(1+v*.25)+(e*.08*currentProduct.base);detail=`Precio estándar de prueba · Cantidad: ${c}.`}else{const area=Math.max(.01,(w*h)/10000);total=currentProduct.base*Math.pow(area,.86)*c*(1+v*.18)+(e*.10*currentProduct.base);detail='Estimación guiada por área. Requiere revisar SVG, piezas y perímetro.'}document.getElementById('qTotal').textContent='$'+Math.ceil(total);document.getElementById('qDetail').textContent=detail}
function quoteData(){return{id:Date.now(),product:currentProduct.name,variant:document.getElementById('qVariant').value,extra:document.getElementById('qExtra').value,width:Number(document.getElementById('qAncho').value||0),height:Number(document.getElementById('qAlto').value||0),qty:Number(document.getElementById('qCant').value||1),total:document.getElementById('qTotal').textContent,note:document.getElementById('qNote').value.trim(),date:new Date().toLocaleString('es-VE')}}
function saveQuote(){const arr=JSON.parse(localStorage.getItem('cat_quotes')||'[]');arr.unshift(quoteData());localStorage.setItem('cat_quotes',JSON.stringify(arr.slice(0,20)));renderSaved();closeModal()}
async function copyQuote(){const q=quoteData();const txt=`${q.product}\nVariante: ${q.variant}\nExtra: ${q.extra}\nMedida: ${q.width} × ${q.height} cm\nCantidad: ${q.qty}\nEstimado: ${q.total}\n${q.note?`Nota: ${q.note}`:''}`;try{await navigator.clipboard.writeText(txt);alert('Resumen copiado')}catch(e){prompt('Copia el resumen:',txt)}}
function renderSaved(){const arr=JSON.parse(localStorage.getItem('cat_quotes')||'[]');document.getElementById('savedQuotes').innerHTML=arr.length?arr.map(q=>`<div class="saved-item"><b>${q.product} · ${q.total}</b><small>${q.variant} · ${q.qty} unidad(es) · ${q.date}</small></div>`).join(''):'<div class="empty">Todavía no hay cotizaciones guardadas.</div>'}
renderCatalog();renderSaved();
</script>
</body>
</html>
