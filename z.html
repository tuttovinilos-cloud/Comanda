<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#07111f"/>
<title>Tuttovinilos · Optimizer</title>

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#07111f;
  --surface:#0d1b2f;
  --surface2:#10233d;
  --border:#23415f;

  --text:#f4f7fb;
  --muted:#8ea4ba;
  --muted2:#5f7188;

  --orange:#ff8a1c;
  --blue:#1da1ff;

  --font-display:'Bricolage Grotesque',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --font-serif:'Instrument Serif',serif;
}

html,body{
  width:100%;
  overflow-x:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-display);
}

body{
  min-height:100vh;
  max-width:560px;
  margin:auto;

  padding:14px 10px calc(40px + env(safe-area-inset-bottom));

  background-image:
    radial-gradient(circle at 15% 0%, rgba(29,161,255,.16), transparent 38%),
    radial-gradient(circle at 100% 100%, rgba(255,138,28,.12), transparent 46%),
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);

  background-size:auto,auto,24px 24px,24px 24px;
}

/* HEADER */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;

  padding:6px 2px 16px;

  border-bottom:1px dashed var(--border);

  margin-bottom:18px;
}

.brand{
  min-width:0;
}

.brand-mark{
  display:block;
  font-weight:800;
  font-size:22px;
  letter-spacing:-.03em;
  white-space:nowrap;
}

.brand-mark::after{
  content:"";
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--orange);
  margin-left:5px;
  vertical-align:3px;
  box-shadow:0 0 16px var(--orange);
}

.brand-sub{
  display:block;

  font-family:var(--font-mono);
  font-size:9px;
  letter-spacing:.13em;
  text-transform:uppercase;

  color:var(--muted);

  white-space:nowrap;
}

.version{
  flex-shrink:0;

  font-family:var(--font-mono);
  font-size:9px;

  color:var(--muted2);
}

/* SECTION */
section{
  margin-bottom:18px;
}

.section-label{
  display:flex;
  align-items:center;
  gap:8px;

  margin-bottom:8px;

  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:.16em;
  text-transform:uppercase;

  color:var(--muted);
}

.section-label::before{
  content:"";
  width:15px;
  height:1px;
  background:var(--muted2);
  flex-shrink:0;
}

.num{
  color:var(--orange);
}

/* FORMAT */
.formats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.format-btn{
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);

  border-radius:14px;

  min-height:72px;

  padding:12px 4px;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:5px;

  text-align:center;

  font-size:14px;
  font-weight:700;

  cursor:pointer;
}

.format-btn .dim{
  font-family:var(--font-mono);
  font-size:9px;
  color:var(--muted);
}

.format-btn[aria-pressed="true"]{
  background:linear-gradient(135deg,var(--blue),#0069cf);
  border-color:var(--blue);
  box-shadow:0 0 0 2px rgba(29,161,255,.18);
}

.format-btn[aria-pressed="true"] .dim{
  color:rgba(255,255,255,.75);
}

/* INPUTS */
.input-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  width:100%;
}

.input-field{
  background:var(--surface);
  border:1px solid var(--border);

  border-radius:14px;

  padding:12px;

  min-width:0;
  overflow:hidden;
}

.input-field:focus-within{
  border-color:var(--orange);
  box-shadow:0 0 0 3px rgba(255,138,28,.12);
}

.input-field label{
  display:block;

  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;

  color:var(--muted);
}

.control{
  display:flex;
  align-items:flex-end;
  gap:5px;

  margin-top:8px;

  width:100%;
  min-width:0;
}

.input-field input{
  flex:1 1 auto;
  min-width:0;
  width:0;

  background:transparent;
  border:none;
  outline:none;

  color:var(--text);

  font-family:var(--font-mono);
  font-size:26px;
  line-height:1;
}

.unit{
  flex:0 0 auto;

  font-family:var(--font-mono);
  font-size:11px;

  color:var(--muted);

  white-space:nowrap;
}

/* HERO */
.hero{
  background:linear-gradient(135deg,var(--surface),#091426);

  border:1px solid var(--border);
  border-radius:18px;

  padding:16px;

  overflow:hidden;
  position:relative;
}

.hero::before{
  content:"";
  position:absolute;
  inset:0;

  background:
  radial-gradient(circle at 95% 0%, rgba(255,138,28,.18), transparent 46%),
  radial-gradient(circle at 0% 100%, rgba(29,161,255,.12), transparent 48%);
}

.hero-head,
.hero-total,
.grid-info{
  position:relative;
}

.hero-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;

  margin-bottom:12px;
}

.lbl{
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:.16em;
  text-transform:uppercase;

  color:var(--muted);
}

.badge{
  flex-shrink:0;

  font-family:var(--font-mono);
  font-size:9px;

  padding:6px 9px;

  border-radius:999px;
  border:1px solid var(--border);

  display:flex;
  align-items:center;
  gap:6px;
}

.badge.normal{
  background:rgba(255,138,28,.14);
  color:var(--orange);
  border-color:rgba(255,138,28,.45);
}

.badge.rotated{
  background:rgba(29,161,255,.14);
  color:var(--blue);
  border-color:rgba(29,161,255,.45);
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:currentColor;
}

.hero-total{
  display:flex;
  align-items:flex-end;
  gap:10px;
}

.total-num{
  font-weight:800;
  font-size:clamp(54px,17vw,78px);
  line-height:.9;
  letter-spacing:-.05em;
}

.total-label{
  font-family:var(--font-serif);
  font-style:italic;
  font-size:18px;

  color:var(--muted);

  line-height:1.05;
  padding-bottom:4px;
}

.grid-info{
  margin-top:14px;
  padding-top:14px;

  border-top:1px dashed var(--border);

  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;

  font-family:var(--font-mono);
  font-size:12px;

  color:var(--muted);
}

.grid-info b{
  color:var(--text);
}

#orientNote{
  margin-left:auto;
  font-size:10px;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;

  margin-top:12px;
}

.stat{
  background:var(--surface);
  border:1px solid var(--border);

  border-radius:14px;

  padding:10px 7px;

  min-width:0;
  overflow:hidden;
}

.stat-lbl{
  font-family:var(--font-mono);
  font-size:8px;
  letter-spacing:.11em;
  text-transform:uppercase;

  color:var(--muted);
}

.stat-val{
  margin-top:6px;

  font-family:var(--font-mono);
  font-size:15px;
  font-weight:700;

  white-space:nowrap;
}

.stat-unit{
  margin-left:2px;

  font-size:10px;

  color:var(--muted);
}

.utilization .stat-val{
  color:var(--blue);
}

.waste .stat-val{
  color:var(--orange);
}

.util-bar{
  margin-top:8px;

  height:5px;

  background:var(--surface2);

  border-radius:999px;

  overflow:hidden;
}

.util-bar span{
  display:block;
  height:100%;

  background:linear-gradient(90deg,var(--blue),var(--orange));
}

/* PREVIEW */
.preview-wrap{
  background:var(--surface);
  border:1px solid var(--border);

  border-radius:18px;

  padding:12px;
}

.preview-canvas{
  width:100%;

  border-radius:12px;
  border:1px solid var(--border);

  overflow:hidden;

  background:#07111f;
}

.preview-meta{
  display:flex;
  flex-direction:column;
  gap:4px;

  margin-top:8px;

  font-family:var(--font-mono);
  font-size:10px;

  color:var(--muted);
}

/* SUGGESTIONS */
.suggestions{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.suggestion{
  background:linear-gradient(135deg, rgba(255,138,28,.12), rgba(29,161,255,.06));

  border:1px solid rgba(255,138,28,.28);

  border-radius:16px;

  padding:12px;

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.title{
  font-size:13px;
  font-weight:700;
  line-height:1.3;
}

.title b{
  color:var(--orange);
  font-family:var(--font-mono);
}

.meta{
  margin-top:4px;

  font-family:var(--font-mono);
  font-size:9px;
  line-height:1.35;

  color:var(--muted);
}

.arrow{
  flex-shrink:0;

  font-size:24px;

  color:var(--orange);
}

.suggestion-empty{
  background:var(--surface);

  border:1px dashed var(--border);
  border-radius:14px;

  padding:14px;

  text-align:center;

  font-family:var(--font-mono);
  font-size:11px;

  color:var(--muted);
}

footer{
  margin-top:22px;

  text-align:center;

  font-family:var(--font-mono);
  font-size:9px;
  letter-spacing:.16em;

  color:var(--muted2);
}

footer span{
  color:var(--orange);
}

.empty-hint{
  color:var(--muted2);

  font-family:var(--font-serif);
  font-style:italic;
}

@media(max-width:340px){

  body{
    padding-left:8px;
    padding-right:8px;
  }

  .brand-mark{
    font-size:19px;
  }

  .brand-sub{
    font-size:8px;
  }

  .version{
    font-size:8px;
  }

  .format-btn{
    font-size:12px;
    min-height:68px;
    padding:10px 3px;
  }

  .format-btn .dim{
    font-size:8px;
  }

  .input-grid{
    gap:6px;
  }

  .input-field{
    padding:10px 9px;
  }

  .input-field label{
    font-size:9px;
    letter-spacing:.09em;
  }

  .input-field input{
    font-size:24px;
  }

  .unit{
    font-size:10px;
  }

  .hero{
    padding:14px;
  }

  .total-label{
    font-size:16px;
  }

  .stat{
    padding:9px 5px;
  }

  .stat-val{
    font-size:13px;
  }

  .stat-lbl{
    font-size:7.5px;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">tuttovinilos</span>
    <span class="brand-sub">label optimizer</span>
  </div>

  <span class="version">v0.4</span>
</header>

<section>

  <div class="section-label">
    <span class="num">01</span>
    Formato del material
  </div>

  <div class="formats">

    <button class="format-btn" data-format="rollo127" aria-pressed="true">
      Rollo 127
      <span class="dim">1270×780</span>
    </button>

    <button class="format-btn" data-format="rollo137" aria-pressed="false">
      Rollo 137
      <span class="dim">1370×740</span>
    </button>

    <button class="format-btn" data-format="pliego" aria-pressed="false">
      Pliego
      <span class="dim">700×820</span>
    </button>

  </div>

</section>
