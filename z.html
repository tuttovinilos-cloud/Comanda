<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Etiquetas - Tuttovinilos</title>

<style>
  body{
    font-family: Arial, sans-serif;
    background:#f4f6f8;
    margin:0;
    padding:15px;
    color:#222;
  }

  .app{
    max-width:900px;
    margin:auto;
    background:white;
    border-radius:18px;
    padding:18px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
  }

  h1{
    font-size:22px;
    margin:0 0 15px;
    color:#0b4f9c;
  }

  label{
    font-weight:bold;
    font-size:14px;
    margin-top:10px;
    display:block;
  }

  input, select{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    box-sizing:border-box;
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  .result{
    margin-top:18px;
    background:#eef6ff;
    padding:15px;
    border-radius:14px;
    font-size:15px;
  }

  .result b{
    color:#0b4f9c;
  }

  .canvas-wrap{
    margin-top:18px;
    overflow:auto;
    background:#ddd;
    border-radius:14px;
    padding:10px;
  }

  canvas{
    background:white;
    border-radius:10px;
    display:block;
    margin:auto;
  }

  .note{
    font-size:13px;
    color:#666;
    margin-top:10px;
  }

  button{
    width:100%;
    margin-top:15px;
    padding:14px;
    background:#0b4f9c;
    color:white;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
  }

  @media(max-width:600px){
    .grid{
      grid-template-columns:1fr;
    }

    h1{
      font-size:20px;
    }
  }
</style>
</head>

<body>

<div class="app">
  <h1>Calculadora de etiquetas por material</h1>

  <label>Material</label>
  <select id="material">
    <option value="137">Rollo 137 cm de ancho</option>
    <option value="127">Rollo 127 cm de ancho</option>
    <option value="70x82">Pliego 70 x 82 cm</option>
  </select>

  <div class="grid">
    <div>
      <label>Ancho de etiqueta (cm)</label>
      <input id="etqAncho" type="number" value="8" step="0.1">
    </div>

    <div>
      <label>Alto de etiqueta (cm)</label>
      <input id="etqAlto" type="number" value="6" step="0.1">
    </div>
  </div>

  <div class="grid">
    <div>
      <label>Separación entre etiquetas</label>
      <input value="0.3 cm / 3 mm" disabled>
    </div>

    <div>
      <label>Marco lateral</label>
      <input value="1 cm por lado" disabled>
    </div>
  </div>

  <button onclick="calcular()">Calcular</button>

  <div class="result" id="resultado"></div>

  <div class="canvas-wrap">
    <canvas id="canvas" width="700" height="450"></canvas>
  </div>

  <div class="note">
    Nota: en rollos se calcula usando 1 m² de material. En pliego se calcula con la medida fija 70 x 82 cm.
  </div>
</div>

<script>
function calcular(){
  const material = document.getElementById("material").value;
  let etiquetaW = parseFloat(document.getElementById("etqAncho").value);
  let etiquetaH = parseFloat(document.getElementById("etqAlto").value);

  const separacion = 0.3; // 3 mm
  const marcoLateral = 1; // 1 cm por lado

  let materialW, materialH, areaMaterial;

  if(material === "70x82"){
    materialW = 70;
    materialH = 82;
    areaMaterial = (materialW * materialH) / 10000;
  } else {
    materialW = parseFloat(material);
    areaMaterial = 1;
    materialH = 10000 / materialW;
  }

  function calcularOpcion(w, h){
    const anchoUtil = materialW - (marcoLateral * 2);

    const columnas = Math.floor((anchoUtil + separacion) / (w + separacion));
    const filas = Math.floor((materialH + separacion) / (h + separacion));
    const total = columnas * filas;

    const anchoUsado = columnas * w + Math.max(0, columnas - 1) * separacion;
    const altoUsado = filas * h + Math.max(0, filas - 1) * separacion;

    const areaEtiquetas = (total * w * h) / 10000;
    const desperdicio = areaMaterial - areaEtiquetas;

    return {
      w, h, columnas, filas, total,
      anchoUsado, altoUsado, areaEtiquetas, desperdicio
    };
  }

  const normal = calcularOpcion(etiquetaW, etiquetaH);
  const girada = calcularOpcion(etiquetaH, etiquetaW);

  const mejor = girada.total > normal.total ? girada : normal;
  const orientacion = girada.total > normal.total ? "Etiqueta girada" : "Etiqueta normal";

  document.getElementById("resultado").innerHTML = `
    <b>Material:</b> ${material === "70x82" ? "Pliego 70 x 82 cm" : "Rollo " + materialW + " cm"}<br>
    <b>Área calculada:</b> ${areaMaterial.toFixed(3)} m²<br><br>

    <b>Mejor orientación:</b> ${orientacion}<br>
    <b>Etiqueta usada:</b> ${mejor.w} x ${mejor.h} cm<br>
    <b>Columnas:</b> ${mejor.columnas}<br>
    <b>Filas:</b> ${mejor.filas}<br>
    <b>Total etiquetas:</b> ${mejor.total}<br><br>

    <b>Área real de etiquetas:</b> ${mejor.areaEtiquetas.toFixed(3)} m²<br>
    <b>Desperdicio aproximado:</b> ${Math.max(0, mejor.desperdicio).toFixed(3)} m²<br>
    <b>Uso del material:</b> ${((mejor.areaEtiquetas / areaMaterial) * 100).toFixed(1)}%
  `;

  dibujar(materialW, materialH, mejor, marcoLateral, separacion);
}

function dibujar(materialW, materialH, data, marco, separacion){
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  ctx.clearRect(0,0,canvas.width,canvas.height);

  const padding = 35;
  const scaleX = (canvas.width - padding*2) / materialW;
  const scaleY = (canvas.height - padding*2) / materialH;
  const scale = Math.min(scaleX, scaleY);

  const startX = (canvas.width - materialW * scale) / 2;
  const startY = (canvas.height - materialH * scale) / 2;

  ctx.fillStyle = "#fff";
  ctx.fillRect(startX, startY, materialW*scale, materialH*scale);

  ctx.strokeStyle = "#111";
  ctx.lineWidth = 2;
  ctx.strokeRect(startX, startY, materialW*scale, materialH*scale);

  // Marco lateral
  ctx.fillStyle = "rgba(255,0,0,0.08)";
  ctx.fillRect(startX, startY, marco*scale, materialH*scale);
  ctx.fillRect(startX + (materialW-marco)*scale, startY, marco*scale, materialH*scale);

  // Etiquetas
  ctx.fillStyle = "#60a5fa";
  ctx.strokeStyle = "#0b4f9c";
  ctx.lineWidth = 1;

  const usableStartX = startX + marco * scale;

  for(let y=0; y<data.filas; y++){
    for(let x=0; x<data.columnas; x++){
      const px = usableStartX + x * (data.w + separacion) * scale;
      const py = startY + y * (data.h + separacion) * scale;

      ctx.fillRect(px, py, data.w*scale, data.h*scale);
      ctx.strokeRect(px, py, data.w*scale, data.h*scale);
    }
  }

  ctx.fillStyle = "#111";
  ctx.font = "14px Arial";
  ctx.fillText(`${materialW.toFixed(1)} cm`, startX + 10, startY - 10);
  ctx.fillText(`${materialH.toFixed(1)} cm`, startX + materialW*scale + 8, startY + 20);
}

calcular();
</script>

</body>
</html>
