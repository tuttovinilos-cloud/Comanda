<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>COMANDA · Producción</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f14;
  --panel:#13161d;
  --panel2:#181c26;
  --border:#1e2330;
  --border2:#2a3048;
  --text:#e2e8f0;
  --muted:#64748b;
  --muted2:#94a3b8;
  --accent:#3b82f6;
  --accent2:#60a5fa;
  --red:#FF3B30;
  --yellow:#FFD60A;
  --green:#30D158;
  --orange:#FF9F0A;
  --mono:'Share Tech Mono',monospace;
  --head:'Barlow Condensed',sans-serif;
  --body:'Barlow',sans-serif;
  --sticky-head-top:58px;
  --sticky-quick-top:96px;
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--body);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:110px;
}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
/* HEADER */
.header{
  background:var(--panel);
  border-bottom:2px solid var(--accent);
  padding:10px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  min-height:58px;
  position:sticky;
  top:0;
  z-index:300;
  box-shadow:0 4px 24px #0009;
  flex-wrap:wrap;
}
.logo{
  font-family:var(--head);
  font-size:21px;
  font-weight:900;
  letter-spacing:3px;
  color:var(--accent2);
  text-transform:uppercase;
  white-space:nowrap;
}
.logo small{
  color:var(--muted);
  font-weight:400;
  font-size:11px;
  letter-spacing:1px;
  margin-left:6px;
}
.header-tabs{
  display:flex;
  gap:6px;
  margin-left:auto;
  align-items:center;
  flex-wrap:wrap;
}
.tab-btn{
  font-family:var(--head);
  font-size:12px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  padding:7px 14px;
  border:1px solid var(--border2);
  background:transparent;
  color:var(--muted2);
  cursor:pointer;
  border-radius:6px;
  transition:all .2s;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
.tab-btn:hover{
  border-color:var(--accent);
  color:var(--accent2);
  background:#3b82f611;
}
.tab-btn.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
  box-shadow:0 0 14px #3b82f644;
}
.mobile-menu-btn{
  display:none;
  font-family:var(--head);
  font-size:12px;
  font-weight:900;
  letter-spacing:1.5px;
  text-transform:uppercase;
  padding:8px 12px;
  border:1px solid var(--border2);
  background:var(--panel2);
  color:var(--accent2);
  border-radius:7px;
  cursor:pointer;
  margin-left:auto;
}
.mobile-menu-extra{display:none}
.menu-action-btn{width:100%}
/* TOOLBAR */
.toolbar{
  display:flex;
  gap:8px;
  padding:12px 16px;
  flex-wrap:wrap;
  border-bottom:1px solid var(--border);
  align-items:center;
  background:var(--bg);
  position:relative;
  z-index:50;
}
.search-wrap{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--panel);
  border:1px solid var(--border2);
  border-radius:7px;
  padding:9px 12px;
  flex:1;
  min-width:260px;
  min-height:40px;
}
.search-wrap input{
  background:none;
  border:none;
  outline:none;
  color:var(--text);
  font-family:var(--mono);
  font-size:13px;
  width:100%;
}
.search-wrap input::placeholder{color:var(--muted)}
.filter-sel{
  background:var(--panel);
  border:1px solid var(--border2);
  color:var(--text);
  font-family:var(--head);
  font-size:12px;
  font-weight:700;
  letter-spacing:1px;
  padding:8px 10px;
  border-radius:7px;
  outline:none;
  cursor:pointer;
  min-height:40px;
}
.btn-add{
  font-family:var(--head);
  font-size:12px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  padding:9px 14px;
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:7px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  white-space:nowrap;
  transition:all .2s;
  text-decoration:none;
  min-height:40px;
}
.btn-add:hover{filter:brightness(1.1)}
.btn-add.secondary{
  background:transparent;
  color:var(--muted2);
  border:1px solid var(--border2);
}
.storage-badge{
  display:flex;
  align-items:center;
  gap:6px;
  background:var(--panel);
  border:1px solid var(--border2);
  border-radius:7px;
  padding:8px 10px;
  white-space:nowrap;
  min-height:40px;
}
.storage-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--yellow);
}
.storage-badge.ok .storage-dot{background:var(--green)}
.storage-badge span{
  font-family:var(--head);
  font-size:11px;
  font-weight:700;
  letter-spacing:1px;
  color:var(--muted2);
  text-transform:uppercase;
}
.desktop-only{display:flex}
/* TABLE */
.table-wrap{
  overflow-x:auto;
  margin-top:0;
  padding:0 0 130px;
  -webkit-overflow-scrolling:touch;
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:1180px;
}
thead tr{
  border-bottom:2px solid var(--border2);
  background:var(--panel);
}
th{
  position:static;
  top:auto;
  z-index:40;
  background:var(--panel);
  font-family:var(--head);
  font-size:10px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--muted);
  padding:10px;
  text-align:left;
  white-space:nowrap;
}
td{
  padding:10px;
  font-size:13px;
  vertical-align:middle;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
tbody tr{
  transition:background .12s;
  cursor:pointer;
}
tbody tr:nth-child(even){background:rgba(255,255,255,0.015)}
tbody tr:hover{background:rgba(59,130,246,0.08)}
tbody::before{
  content:"";
  display:block;
  height:6px;
}
#orderTableBody td:nth-child(2){
  color:#7f8ea3;
  font-size:12px;
  font-family:var(--mono);
}
#orderTableBody td:nth-child(3){
  font-weight:700;
  font-family:var(--head);
  letter-spacing:.5px;
  color:#8ec5ff;
}
#orderTableBody td:nth-child(4){
  color:#5ea8ff;
  font-weight:700;
}
#orderTableBody td:nth-child(5){
  color:#e5edf8;
  line-height:1.25;
}
.cell-edit,
.cell-select,
.quick-input,
.quick-select,
.quick-btn{
  width:100%;
  background:var(--bg);
  border:1px solid var(--border2);
  color:var(--text);
  border-radius:7px;
  padding:7px 8px;
  font-family:var(--body);
  font-size:12px;
  outline:none;
}
.cell-edit:focus,
.cell-select:focus,
.quick-input:focus,
.quick-select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 2px #3b82f622;
}
.cell-select option,
.quick-select option{
  background:var(--panel);
  color:var(--text);
}
.cell-edit:disabled,
.quick-input:disabled,
.quick-select:disabled{
  opacity:.55;
  cursor:not-allowed;
}
.quick-entry-row th{
  background:var(--panel2);
  padding:6px;
  border-bottom:1px solid var(--border2);
  position:static;
  top:auto;
  z-index:20;
}
.quick-btn{
  font-family:var(--head);
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
  background:var(--accent);
  border-color:var(--accent);
  cursor:pointer;
  color:#fff;
  min-height:34px;
}
.quick-btn.secondary{
  background:transparent;
  color:var(--muted2);
  border-color:var(--border2);
}
.quick-textarea{
  min-height:34px;
  resize:vertical;
  line-height:1.25;
}
.quick-textarea:focus{min-height:90px}
.quick-hint{
  font-size:10px;
  color:var(--muted);
  margin-top:2px;
  text-align:left;
}
.quick-mini-btn{
  width:34px;
  min-width:34px;
  height:34px;
  border-radius:7px;
  border:1px dashed var(--border2);
  background:transparent;
  color:var(--accent2);
  cursor:pointer;
  font-weight:700;
}
.quick-mini-btn:hover{
  border-color:var(--accent);
  background:#3b82f611;
}
.add-symbol-btn{
  font-size:24px;
  font-weight:900;
  line-height:1;
  padding:4px 8px;
  width:70%;
  min-width:34px;
  margin-inline:auto;
}
/* STATUS */
.status-solicitud{color:var(--red);border-color:#FF3B3044;background:#FF3B3011}
.status-revisado{color:var(--yellow);border-color:#FFD60A44;background:#FFD60A11}
.status-listo{color:var(--green);border-color:#30D15844;background:#30D15811}
.pago-pendiente{color:var(--red);border-color:#FF3B3044;background:#FF3B3011}
.pago-abonado{color:var(--orange);border-color:#FF9F0A44;background:#FF9F0A11}
.pago-pagado{color:var(--green);border-color:#30D15844;background:#30D15811}
.empty{
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
  font-family:var(--head);
  font-size:15px;
  letter-spacing:2px;
}
.file-link-chip,
.quick-attach-link{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  border:1px solid var(--border2);
  border-radius:7px;
  background:transparent;
  color:var(--accent2);
  cursor:pointer;
  font-family:var(--head);
  font-size:11px;
  letter-spacing:1px;
  text-transform:uppercase;
  text-decoration:none;
  transition:all .2s;
}
.file-link-chip:hover,
.quick-attach-link:hover{
  border-color:var(--accent);
  background:#3b82f611;
}
/* MODAL */
.backdrop{
  position:fixed;
  inset:0;
  background:#000b;
  z-index:500;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  backdrop-filter:blur(3px);
  padding:0;
}
.modal{
  background:var(--panel);
  border:1px solid var(--border2);
  width:100%;
  max-width:560px;
  max-height:94vh;
  overflow-y:auto;
  border-radius:14px 14px 0 0;
  box-shadow:0 -8px 60px #000c;
  animation:slideUp .22s ease;
}
@keyframes slideUp{
  from{transform:translateY(50px);opacity:0}
  to{transform:none;opacity:1}
}
.modal-handle{
  width:36px;
  height:4px;
  background:var(--border2);
  border-radius:2px;
  margin:10px auto 0;
}
.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 20px;
  border-bottom:1px solid var(--border);
}
.modal-title{
  font-family:var(--head);
  font-size:18px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
}
.modal-close{
  width:32px;
  height:32px;
  border-radius:7px;
  border:1px solid var(--border2);
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all .2s;
}
.modal-close:hover{
  border-color:var(--red);
  color:var(--red);
}
.modal-body{
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.modal-footer{
  padding:14px 20px;
  border-top:1px solid var(--border);
  display:flex;
  gap:8px;
  justify-content:flex-end;
  flex-wrap:wrap;
}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.form-full{grid-column:1/-1}
.field{
  display:flex;
  flex-direction:column;
  gap:5px;
}
.field label{
  font-family:var(--head);
  font-size:10px;
  font-weight:700;
  letter-spacing:2px;
  color:var(--muted);
  text-transform:uppercase;
}
.field input,
.field select,
.field textarea{
  background:var(--bg);
  border:1px solid var(--border2);
  color:var(--text);
  border-radius:8px;
  padding:10px 12px;
  font-family:var(--body);
  font-size:14px;
  outline:none;
  transition:border .2s;
  width:100%;
}
.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 2px #3b82f622;
}
.field input:disabled,
.field select:disabled,
.field textarea:disabled{
  opacity:.55;
  cursor:not-allowed;
}
.field textarea{
  resize:vertical;
  min-height:76px;
}
.field select option{background:var(--panel)}
.file-drop{
  border:2px dashed var(--border2);
  border-radius:10px;
  padding:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  transition:border-color .2s,background .2s;
  min-height:90px;
}
.file-drop:hover{
  border-color:var(--accent);
  background:#3b82f611;
}
.file-preview-box{
  border:1px solid var(--border2);
  border-radius:10px;
  overflow:hidden;
  position:relative;
  background:var(--bg);
  min-height:90px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.file-remove-btn{
  position:absolute;
  top:6px;
  right:6px;
  width:28px;
  height:28px;
  border-radius:50%;
  background:#0009;
  border:1px solid #ffffff22;
  color:#fff;
  font-size:12px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}
.file-remove-btn:hover{background:#FF3B30cc}
#rowFileInput{display:none}
.toast{
  position:fixed;
  left:50%;
  bottom:84px;
  transform:translateX(-50%);
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border2);
  border-radius:10px;
  padding:10px 16px;
  z-index:999999;
  display:none;
  box-shadow:0 12px 35px #0008;
  font-family:var(--head);
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
  max-width:90vw;
  text-align:center;
}
/* DESKTOP MODAL */
@media(min-width:600px){
  .backdrop{
    align-items:center;
    padding:16px;
  }
  .modal{
    border-radius:12px;
    animation:popIn .18s ease;
  }
  @keyframes popIn{
    from{transform:scale(.96) translateY(10px);opacity:0}
    to{transform:none;opacity:1}
  }
}
/* TABLET */
@media(max-width:980px){
  .header{
    align-items:center;
  }
  .header-tabs{
    width:100%;
    margin-left:0;
  }
  .tab-btn{
    flex:1 1 calc(50% - 6px);
    justify-content:center;
    font-size:11px;
    padding:9px 8px;
  }
}
/* MOBILE */
@media(max-width:760px){
  body{
    padding-bottom:130px;
  }
  .header{
    padding:10px 12px;
    align-items:center;
  }
  .logo{
    font-size:19px;
  }
  .mobile-menu-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  .header-tabs{
    display:none;
    width:100%;
    margin-left:0;
    padding-top:8px;
    border-top:1px solid var(--border);
  }
  .header-tabs.open{
    display:grid;
    grid-template-columns:1fr;
    gap:7px;
  }
  .tab-btn{
    width:100%;
    justify-content:center;
    font-size:11px;
    min-height:38px;
    padding:8px 6px;
  }
  .toolbar{
    padding:10px;
    gap:7px;
  }
  .search-wrap{
    min-width:100%;
    flex:1 1 100%;
    order:1;
  }
  #filterStatus,
  #filterPago,
  #filterFechaDesde,
  #filterFechaHasta,
  #filterOperador{
    flex:1 1 calc(20% - 7px);
    min-width:0;
    order:2;
    font-size:8.5px;
    padding:7px 2px;
  }
  .desktop-only{
    display:none !important;
  }
  .mobile-menu-extra{
    display:flex;
    flex-direction:column;
    gap:7px;
    grid-column:1 / -1;
    padding-top:8px;
    border-top:1px solid var(--border);
  }
  .mobile-menu-extra .storage-badge{
    width:100%;
    justify-content:center;
  }
  .mobile-menu-extra .btn-add{
    width:100%;
  }
  .add-symbol-btn{
    width:70%;
    max-width:42px;
    min-width:38px;
  }
  th{
    position:static;
    top:auto;
  }
  .quick-entry-row th{
    position:static;
    top:auto;
  }
  thead tr:first-child th{
    position:sticky;
    top:0;
    z-index:40;
  }
  .table-wrap{
    margin-top:0;
    padding-bottom:140px;
  }
  tbody::before{
    height:8px;
  }
  table{
    min-width:1050px;
  }
  .quick-input,
  .quick-select,
  .quick-btn{
    min-height:36px;
  }
}
/* IPHONE SE */
@media(max-width:430px){
  .header-tabs.open{
    grid-template-columns:1fr;
  }
  .logo small{
    display:none;
  }
  #filterStatus,
  #filterPago,
  #filterFechaDesde,
  #filterFechaHasta,
  #filterOperador{
    flex:1 1 calc(20% - 7px);
    min-width:0;
    font-size:8px;
    padding:7px 2px;
  }
  .quick-input,
  .quick-select,
  .quick-btn{
    font-size:11px;
    padding:7px 6px;
  }
  .modal-body{
    padding:16px;
  }
  .form-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>
<header class="header">
  <div class="logo">COMANDA<small>Producción</small></div>
  <nav class="header-tabs" data-auth-menu id="authMenu"></nav>
</header>
<div class="toolbar">
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/>
      <path d="m21 21-4.35-4.35"/>
    </svg>
    <input id="searchInput" type="text" placeholder="Nombre, teléfono o descripción..." oninput="onSearch()"/>
  </div>
  <select class="filter-sel" id="filterStatus" onchange="onSearch()">
    <option value="">Solicitud</option>
    <option value="Solicitud">🔴 Solicitud</option>
    <option value="Revisado">🟡 Revisado</option>
    <option value="Listo">🟢 Listo</option>
  </select>
  <select class="filter-sel" id="filterPago" onchange="onSearch()">
    <option value="">Pago</option>
    <option value="Pendiente">Pendiente</option>
    <option value="Abonado">Abonado</option>
    <option value="Pagado">Pagado</option>
  </select>
  <input class="filter-sel" id="filterFechaDesde" type="date" onchange="onSearch()" title="Desde"/>
  <input class="filter-sel" id="filterFechaHasta" type="date" onchange="onSearch()" title="Hasta"/>
  <select class="filter-sel" id="filterOperador" onchange="onSearch()">
    <option value="">Operador</option>
  </select>
  <div class="storage-badge desktop-only" id="storageBadge">
    <div class="storage-dot"></div>
    <span id="storageBadgeText">Local</span>
  </div>
</div>
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Fecha</th>
        <th>Operador</th>
        <th>Cliente</th>
        <th>Descripción</th>
        <th>Cantidad</th>
        <th>Material</th>
        <th>Impresión</th>
        <th>Precio</th>
        <th>Estatus</th>
        <th>Pago</th>
        <th>Entrega</th>
        <th>Archivo</th>
      </tr>
      <tr class="quick-entry-row">
        <th>
          <button class="quick-btn secondary" type="button" onclick="clearQuickEntry()">✕</button>
        </th>
        <th>
          <input class="quick-input" id="q_fecha" type="date"/>
        </th>
        <th>

<script src="js/supabase.js?v=21"></script>
<script>
window.logout = window.logout || function(){
  localStorage.removeItem("comanda_operador_actual");
  location.href = "login.html?logout=1";
};
function marcarSupabaseSiListo(){
  const badgeText = document.getElementById("storageBadgeText");
  const badgeBox = document.getElementById("storageBadge");
  if(window.supabaseClient){
    if(badgeText) badgeText.textContent = "SUPABASE";
    if(badgeBox) badgeBox.classList.add("ok");
  }
}

function updateStickyOffsets(){
  document.documentElement.style.setProperty("--sticky-head-top", `0px`);
  document.documentElement.style.setProperty("--sticky-quick-top", `0px`);
}
(function(){
  const AUTH_KEY = "comanda_operador_actual";
  const links = [
    { page:"index.html", label:"📋 Pedidos", permission:"puede_pedidos" },
    { page:"clientes.html", label:"👤 Clientes", permission:"puede_clientes" },
    { page:"materiales.html", label:"💲 Materiales", permission:"puede_materiales" },
    { page:"estadisticas.html", label:"📊 Estadísticas", permission:"puede_estadisticas" },
    { page:"marketing.html", label:"📣 Marketing", permission:"puede_marketing" },
    { page:"Cotizador.html", label:"🧾 Cotizador", permission:"puede_cotizador" },
    { page:"Organizador de ideas.html", label:"💡 Organizador", permission:"puede_organizador" },
    { page:"configuracion.html", label:"⚙️ Configuración", permission:"puede_configuracion" }
  ];
  function getOp(){
    try{
      return JSON.parse(localStorage.getItem(AUTH_KEY) || "null");
    }catch(e){
      return null;
    }
  }
  function isRoberto(op){
    return String(op && op.nombre || "").trim().toLowerCase() === "roberto";
  }
  function hasPermission(op, perm){
    if(!op || op.activo === false) return false;
    if(isRoberto(op)) return true;
    return op[perm] === true;
  }
  function firstAllowed(op){
    if(isRoberto(op)) return "index.html";
    const item = links.find(l => op && op[l.permission] === true);
    return item ? item.page : "login.html";
  }
  function renderFallbackMenu(){
    const op = getOp();
    if(!op || op.activo === false){
      location.href = "login.html";
      return;
    }
    const menu = document.getElementById("authMenu");
    if(!menu) return;
    if(!menu.querySelector(".tab-btn")){
      links.forEach(item => {
        const a = document.createElement("a");
        a.href = item.page;
        a.textContent = item.label;
        a.className = "tab-btn";
        if(item.page.toLowerCase() === "index.html"){
          a.classList.add("active");
        }
        menu.appendChild(a);
      });
      const logoutBtn = document.createElement("button");
      logoutBtn.type = "button";
      logoutBtn.className = "tab-btn";
      logoutBtn.textContent = "Salir";
      logoutBtn.onclick = function(){
        localStorage.removeItem("comanda_operador_actual");
        location.href = "login.html?logout=1";
      };
      menu.appendChild(logoutBtn);
    }
    const extra = document.getElementById("mobileMenuExtra");
    if(extra && extra.parentElement !== menu){
      menu.appendChild(extra);
    }
    if(!hasPermission(op, "puede_pedidos")){
      location.href = firstAllowed(op);
    }
  }
  function setupMobileMenu(){
    const header = document.querySelector(".header");
    const menu = document.getElementById("authMenu");
    if(!header || !menu) return;
    if(!document.getElementById("mobileMenuBtn")){
      const btn = document.createElement("button");
      btn.id = "mobileMenuBtn";
      btn.className = "mobile-menu-btn";
      btn.type = "button";
      btn.textContent = "☰ Menú";
      btn.onclick = function(){
        menu.classList.toggle("open");
        updateStickyOffsets();
      };
      header.insertBefore(btn, menu);
    }
    if(!document.getElementById("mobileMenuExtra")){
      const extra = document.createElement("div");
      extra.id = "mobileMenuExtra";
      extra.className = "mobile-menu-extra";
      extra.innerHTML = `
        <div class="storage-badge" id="storageBadgeMobile">
          <div class="storage-dot"></div>
          <span id="storageBadgeTextMobile">Local</span>
        </div>
      `;
      menu.appendChild(extra);
    }
  }
  function syncStorageBadge(){
    const desktopText = document.getElementById("storageBadgeText");
    const mobileText = document.getElementById("storageBadgeTextMobile");
    const desktopBadge = document.getElementById("storageBadge");
    const mobileBadge = document.getElementById("storageBadgeMobile");
    if(desktopText && mobileText){
      mobileText.textContent = desktopText.textContent;
    }
    if(desktopBadge && mobileBadge){
      mobileBadge.className = desktopBadge.className.replace("desktop-only", "").trim();
    }
  }
  function setSelectOptions(select, operadores, placeholder){
    if(!select) return;
    const current = select.value;
    select.innerHTML = `<option value="">${placeholder}</option>`;
    operadores.forEach(op => {
      const opt = document.createElement("option");
      opt.value = op.nombre;
      opt.textContent = op.nombre;
      select.appendChild(opt);
    });
    if(current){
      select.value = current;
    }
  }
  async function cargarOperadoresEnComanda(){
    const fallback = [
      { nombre:"Roberto" },
      { nombre:"Ricardo" },
      { nombre:"Chico" },
      { nombre:"Carlos" },
      { nombre:"Alejandro" },
      { nombre:"Ruben" },
      { nombre:"Ana" },
      { nombre:"Miguel" }
    ];
    let operadores = fallback;
    try{
      if(window.supabaseClient){
        const { data, error } = await window.supabaseClient
          .from("operadores")
          .select("nombre, activo")
          .eq("activo", true)
          .order("nombre", { ascending:true });
        if(!error && Array.isArray(data) && data.length){
          operadores = data;
        }
      }
    }catch(e){
      console.warn("No se pudieron cargar operadores desde Supabase:", e);
    }
    setSelectOptions(document.getElementById("q_operador"), operadores, "Operador");
    setSelectOptions(document.getElementById("f_operador"), operadores, "Seleccionar…");
    setSelectOptions(document.getElementById("filterOperador"), operadores, "Operador");
    const opActual = getOp();
    if(opActual && opActual.nombre){
      const puedeCambiarOperador = isRoberto(opActual) || opActual.puede_modificar_operador === true;
      ["q_operador", "f_operador"].forEach(id => {
        const el = document.getElementById(id);
        if(!el) return;
        if(!puedeCambiarOperador){
          el.value = opActual.nombre;
          el.disabled = true;
        }else{
          el.value = opActual.nombre;
        }
      });
    }
  }
  document.addEventListener("DOMContentLoaded", function(){
    marcarSupabaseSiListo();
    setupMobileMenu();
    renderFallbackMenu();
    updateStickyOffsets();
    cargarOperadoresEnComanda();
    syncStorageBadge();
    window.addEventListener("resize", updateStickyOffsets);
    setInterval(syncStorageBadge, 600);
    setTimeout(function(){
      marcarSupabaseSiListo();
      setupMobileMenu();
      renderFallbackMenu();
      updateStickyOffsets();
      cargarOperadoresEnComanda();
      syncStorageBadge();
    }, 700);
  });
  window.cargarOperadoresEnComanda = cargarOperadoresEnComanda;
})();
</script>
<script src="js/auth.js?v=23"></script>
<script src="js/app.js?v=23"></script>
<script>
(function(){
  const SUPABASE_URL_FALLBACK = "https://ujfdsabypflseijatxba.supabase.co";
  const SUPABASE_KEY_FALLBACK = "sb_publishable_CiZo8xFKkaT7mdRrQUYxuQ_48F6Vx3w";

  function esc(v){
    return String(v ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  async function fallbackCargarPedidosSiVacio(){
    const tbody = document.getElementById("orderTableBody");
    const empty = document.getElementById("emptyState");
    if(!tbody) return;

    const yaHayFilas = tbody.querySelector("tr td");
    if(yaHayFilas) return;

    try{
      const res = await fetch(
        `${SUPABASE_URL_FALLBACK}/rest/v1/pedidos?select=*&order=id.desc&limit=500`,
        {
          headers:{
            apikey: SUPABASE_KEY_FALLBACK,
            Authorization: `Bearer ${SUPABASE_KEY_FALLBACK}`
          }
        }
      );

      if(!res.ok){
        throw new Error(`HTTP ${res.status}`);
      }

      const data = await res.json();
      tbody.innerHTML = "";

      if(!Array.isArray(data) || !data.length){
        if(empty) empty.style.display = "block";
        return;
      }

      if(empty) empty.style.display = "none";

      data.forEach(p => {
        const archivo = p.archivo_url
          ? `<a class="file-link-chip" href="${esc(p.archivo_url)}" target="_blank">📎 ${esc(p.archivo_nombre || "Archivo")}</a>`
          : "—";

        tbody.insertAdjacentHTML("beforeend", `
          <tr>
            <td>${esc(p.id)}</td>
            <td>${esc(p.fecha)}</td>
            <td>${esc(p.operador)}</td>
            <td>${esc(p.cliente)}</td>
            <td>${esc(p.descripcion)}</td>
            <td>${esc(p.cantidad)}</td>
            <td>${esc(p.material)}</td>
            <td>${esc(p.tipo_impresion)}</td>
            <td>${esc(p.precio)}</td>
            <td>${esc(p.estatus_trabajo)}</td>
            <td>${esc(p.estatus_pago)}</td>
            <td>${esc(p.fecha_entrega || "—")}</td>
            <td>${archivo}</td>
          </tr>
        `);
      });
    }catch(err){
      console.error("Fallback pedidos error:", err);
      if(empty){
        empty.style.display = "block";
        empty.textContent = "NO SE PUDIERON CARGAR PEDIDOS";
      }
    }
  }

  window.addEventListener("load", function(){
    setTimeout(fallbackCargarPedidosSiVacio, 1200);
  });
})();
</script>
