<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Cortar · Escalar · Medir</title>

<style>
:root{
  --bg:#f1f4fb;
  --panel:#ffffff;
  --line:#d7dfef;
  --blue:#1b4dff;
  --orange:#ff7b00;
  --text:#111827;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  font-family:Arial;
  color:var(--text);
  overflow:hidden;
}

.top{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:100;
  background:white;
  border-bottom:1px solid var(--line);
  padding:10px;
}

.tools{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

button,input{
  height:44px;
  border:none;
  border-radius:12px;
  font-size:14px;
}

button{
  background:var(--blue);
  color:white;
  font-weight:bold;
}

input{
  border:1px solid var(--line);
  padding:10px;
}

.viewer{
  position:fixed;
  top:150px;
  left:0;
  right:0;
  bottom:0;
  overflow:hidden;
}

.canvasWrap{
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  touch-action:none;
  position:relative;
}

#img{
  position:absolute;
  max-width:1200px;
  max-height:1200px;
  transform-origin:center center;
  user-select:none;
  pointer-events:none;
}

.corner{
  position:absolute;
  width:28px;
  height:28px;
  border-radius:50%;
  background:var(--orange);
  border:3px solid white;
  z-index:20;
  touch-action:none;
}

#line{
  position:absolute;
  border:2px dashed var(--orange);
  z-index:10;
}

.measurePoint{
  position:absolute;
  width:22px;
  height:22px;
  border-radius:50%;
  background:var(--blue);
  border:3px solid white;
  z-index:40;
}

#measureLine{
  position:absolute;
  height:2px;
  background:var(--blue);
  transform-origin:left center;
  z-index:35;
}

.info{
  position:fixed;
  bottom:10px;
  left:10px;
  right:10px;
  background:white;
  border-radius:16px;
  padding:12px;
  z-index:100;
  border:1px solid var(--line);
  font-weight:bold;
  text-align:center;
}

@media(max-width:520px){

  .top{
    padding:8px;
  }

  .tools{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<div class="top">

<div class="tools">

<input type="file" id="file">

<input type="number" id="realWidth" placeholder="Ancho real cm">

<button onclick="applyScale()">Aplicar escala</button>

<button onclick="cropImage()">Cortar imagen</button>

<button onclick="enableMeasure()">Medir</button>

<button onclick="resetView()">Centrar</button>

</div>

</div>

<div class="viewer">

<div class="canvasWrap" id="wrap">

<img id="img">

<div id="line"></div>

<div class="corner" id="c1"></div>
<div class="corner" id="c2"></div>
<div class="corner" id="c3"></div>
<div class="corner" id="c4"></div>

<div class="measurePoint" id="m1" style="display:none"></div>
<div class="measurePoint" id="m2" style="display:none"></div>

<div id="measureLine" style="display:none"></div>

</div>

</div>

<div class="info" id="info">
Sin imagen
</div>

<script>

const wrap=document.getElementById("wrap")
const img=document.getElementById("img")
const info=document.getElementById("info")

let scale=1
let posX=0
let posY=0

let startX=0
let startY=0

let moving=false

let realCm=0
let pxToCm=1

let measuring=false
let measureClicks=[]

document.getElementById("file").addEventListener("change",e=>{

  const file=e.target.files[0]
  if(!file)return

  img.src=URL.createObjectURL(file)

  img.onload=()=>{

    resetView()

    const w=wrap.clientWidth
    const h=wrap.clientHeight

    const size=Math.min(w,h)*0.7

    const left=(w-size)/2
    const top=(h-size)/2

    setCorner("c1",left,top)
    setCorner("c2",left+size,top)
    setCorner("c3",left+size,top+size)
    setCorner("c4",left,top+size)

    updateCrop()

  }

})

function resetView(){

  scale=1
  posX=0
  posY=0

  updateTransform()

}

function updateTransform(){

  img.style.transform=
  `translate(${posX}px,${posY}px) scale(${scale})`

}

wrap.addEventListener("touchstart",e=>{

  if(e.touches.length===1){

    moving=true

    startX=e.touches[0].clientX-posX
    startY=e.touches[0].clientY-posY

  }

})

wrap.addEventListener("touchmove",e=>{

  e.preventDefault()

  if(e.touches.length===1 && moving){

    posX=e.touches[0].clientX-startX
    posY=e.touches[0].clientY-startY

    updateTransform()

  }

  if(e.touches.length===2){

    const dx=
    e.touches[0].clientX-
    e.touches[1].clientX

    const dy=
    e.touches[0].clientY-
    e.touches[1].clientY

    const dist=Math.sqrt(dx*dx+dy*dy)

    if(!window.lastDist){
      window.lastDist=dist
    }

    const delta=dist-window.lastDist

    scale+=delta*0.003

    if(scale<0.2)scale=0.2
    if(scale>15)scale=15

    updateTransform()

    window.lastDist=dist

  }

})

wrap.addEventListener("touchend",()=>{

  moving=false
  window.lastDist=null

})

function setCorner(id,x,y){

  const el=document.getElementById(id)

  el.style.left=(x-14)+"px"
  el.style.top=(y-14)+"px"

}

function getCorner(id){

  const el=document.getElementById(id)

  return{
    x:parseFloat(el.style.left)+14,
    y:parseFloat(el.style.top)+14
  }

}

function updateCrop(){

  const p1=getCorner("c1")
  const p3=getCorner("c3")

  const line=document.getElementById("line")

  line.style.left=p1.x+"px"
  line.style.top=p1.y+"px"
  line.style.width=(p3.x-p1.x)+"px"
  line.style.height=(p3.y-p1.y)+"px"

}

;["c1","c2","c3","c4"].forEach(id=>{

  const el=document.getElementById(id)

  let drag=false

  el.addEventListener("touchstart",e=>{

    drag=true
    e.stopPropagation()

  })

  el.addEventListener("touchmove",e=>{

    if(!drag)return

    e.preventDefault()

    const x=e.touches[0].clientX
    const y=e.touches[0].clientY

    setCorner(id,x,y)

    syncCorners(id,x,y)

    updateCrop()

  })

  el.addEventListener("touchend",()=>{

    drag=false

  })

})

function syncCorners(id,x,y){

  if(id==="c1"){

    setCorner("c2",getCorner("c2").x,y)
    setCorner("c4",x,getCorner("c4").y)

  }

  if(id==="c2"){

    setCorner("c1",getCorner("c1").x,y)
    setCorner("c3",x,getCorner("c3").y)

  }

  if(id==="c3"){

    setCorner("c2",x,getCorner("c2").y)
    setCorner("c4",getCorner("c4").x,y)

  }

  if(id==="c4"){

    setCorner("c1",x,getCorner("c1").y)
    setCorner("c3",getCorner("c3").x,y)

  }

}

function applyScale(){

  realCm=parseFloat(document.getElementById("realWidth").value)

  if(!realCm)return

  const p1=getCorner("c1")
  const p2=getCorner("c2")

  const px=Math.abs(p2.x-p1.x)

  pxToCm=realCm/px

  info.innerHTML=
  "Escala aplicada: "+
  pxToCm.toFixed(4)+
  " cm por pixel"

}

function enableMeasure(){

  measuring=true
  measureClicks=[]

  document.getElementById("m1").style.display="none"
  document.getElementById("m2").style.display="none"
  document.getElementById("measureLine").style.display="none"

  info.innerHTML="Toca 2 puntos"

}

wrap.addEventListener("click",e=>{

  if(!measuring)return

  measureClicks.push({
    x:e.clientX,
    y:e.clientY
  })

  if(measureClicks.length===1){

    showPoint("m1",e.clientX,e.clientY)

  }

  if(measureClicks.length===2){

    showPoint("m2",e.clientX,e.clientY)

    drawMeasure()

    measuring=false

  }

})

function showPoint(id,x,y){

  const p=document.getElementById(id)

  p.style.display="block"

  p.style.left=(x-11)+"px"
  p.style.top=(y-11)+"px"

}

function drawMeasure(){

  const a=measureClicks[0]
  const b=measureClicks[1]

  const dx=b.x-a.x
  const dy=b.y-a.y

  const distPx=Math.sqrt(dx*dx+dy*dy)

  const distCm=distPx*pxToCm

  const line=document.getElementById("measureLine")

  line.style.display="block"
  line.style.left=a.x+"px"
  line.style.top=a.y+"px"
  line.style.width=distPx+"px"

  const angle=Math.atan2(dy,dx)*180/Math.PI

  line.style.transform=`rotate(${angle}deg)`

  info.innerHTML=
  "Distancia: "+
  distCm.toFixed(2)+
  " cm"

}

function cropImage(){

  info.innerHTML="Corte visual aplicado"

}

</script>

</body>
</html>
