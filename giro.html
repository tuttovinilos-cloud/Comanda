<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba de Parpadeo</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f16;color:#fff;font-family:Arial,Helvetica,sans-serif}
.app{width:min(620px,calc(100% - 24px));background:#131a24;border:1px solid #273142;border-radius:22px;padding:22px}
h1{margin:0 0 4px;font-size:22px}.sub{color:#8895a7;font-size:13px;margin-bottom:22px}
.stage{min-height:360px;display:grid;place-items:center;background:#070a0f;border-radius:18px;border:1px solid #222b38;margin-bottom:22px}
.bulbWrap{display:grid;place-items:center;gap:12px}
.bulb{position:relative;width:150px;height:150px;border-radius:50%;background:#252b35;border:3px solid #343d4a;transition:background .01s linear,box-shadow .01s linear}
.bulb.on{background:#fff7c4;border-color:#fff3a1;box-shadow:0 0 30px rgba(255,239,130,.9),0 0 75px rgba(255,225,90,.65),0 0 140px rgba(255,212,55,.35)}
.base{width:68px;height:74px;margin-top:-18px;background:linear-gradient(#aab2bd,#66717f);border-radius:10px 10px 22px 22px;position:relative}
.base:before,.base:after{content:"";position:absolute;left:8px;right:8px;height:5px;background:#424c59;border-radius:5px}
.base:before{top:20px}.base:after{top:38px}
.status{font-size:13px;color:#9aa6b5}
.controls{display:grid;gap:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
label{font-size:14px;font-weight:700}.value{font-size:28px;font-weight:900}.value small{font-size:12px;color:#8b97a7;font-weight:700}
input[type=range]{width:100%;accent-color:#5b7cff}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.quick button,.buttons button{min-height:42px;border:1px solid #344052;background:#192230;color:#fff;border-radius:10px;font-weight:800;cursor:pointer}
.info{padding:12px 14px;background:#0d131c;border:1px solid #273240;border-radius:12px;font-size:12px;line-height:1.5;color:#98a4b3}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.buttons .primary{background:#5b7cff;border-color:#5b7cff}
@media(max-width:480px){.app{padding:14px}.stage{min-height:300px}.bulb{width:125px;height:125px}.quick{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
  <h1>Prueba de parpadeo</h1>
  <div class="sub">Ajusta cuántas veces por segundo se enciende y apaga el bombillo.</div>

  <div class="stage">
    <div class="bulbWrap">
      <div id="bulb" class="bulb on"></div>
      <div class="base"></div>
      <div id="status" class="status">Encendido</div>
    </div>
  </div>

  <div class="controls">
    <div>
      <div class="row">
        <label for="hz">Frecuencia</label>
        <div class="value"><span id="hzValue">1</span><small> Hz</small></div>
      </div>
      <input id="hz" type="range" min="0.2" max="120" step="0.1" value="1">
    </div>

    <div class="quick">
      <button type="button" data-hz="1">1 Hz</button>
      <button type="button" data-hz="10">10 Hz</button>
      <button type="button" data-hz="30">30 Hz</button>
      <button type="button" data-hz="60">60 Hz</button>
      <button type="button" data-hz="100">100 Hz</button>
    </div>

    <div class="info">
      <b id="periodText">1 ciclo cada 1000 ms</b><br>
      Cada ciclo tiene una fase encendida y una apagada.
    </div>

    <div class="buttons">
      <button id="stopBtn" type="button">Detener</button>
      <button id="resumeBtn" class="primary" type="button">Continuar</button>
    </div>
  </div>
</div>

<script>
const bulb=document.getElementById("bulb");
const hzInput=document.getElementById("hz");
const hzValue=document.getElementById("hzValue");
const periodText=document.getElementById("periodText");
const statusText=document.getElementById("status");
let running=true;
let startTime=performance.now();

function updateInfo(){
  const hz=Number(hzInput.value);
  hzValue.textContent=hz<10?hz.toFixed(1).replace(".0",""):hz.toFixed(0);
  const period=1000/hz;
  periodText.textContent="1 ciclo cada "+(period>=100?period.toFixed(0):period.toFixed(1))+" ms";
}

function animate(now){
  const hz=Number(hzInput.value);
  if(running){
    const elapsed=(now-startTime)/1000;
    const phase=(elapsed*hz)%1;
    const on=phase<0.5;
    bulb.classList.toggle("on",on);
    statusText.textContent=on?"Encendido":"Apagado";
  }
  requestAnimationFrame(animate);
}

hzInput.addEventListener("input",()=>{startTime=performance.now();updateInfo();});
document.querySelectorAll("[data-hz]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    hzInput.value=btn.dataset.hz;
    startTime=performance.now();
    updateInfo();
  });
});
document.getElementById("stopBtn").addEventListener("click",()=>{running=false;bulb.classList.remove("on");statusText.textContent="Detenido";});
document.getElementById("resumeBtn").addEventListener("click",()=>{running=true;startTime=performance.now();});

updateInfo();
requestAnimationFrame(animate);
</script>
</body>
</html>
