<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121a2b">
<title>Tuto CRM · Tuttovinilos</title>
<style>
:root{
  --bg:#f5f7fb;--panel:#fff;--ink:#162033;--muted:#748096;--line:#e8ecf3;
  --blue:#2947e8;--blue-bg:#eef2ff;--nav:#121a2b;--nav-muted:#9aa6bc;
  --green:#17845b;--green-bg:#eaf7f0;--amber:#a76512;--amber-bg:#fff4df;
  --red:#b64343;--red-bg:#fff0ef;--purple:#6f55cb;--purple-bg:#f1efff;--gray-bg:#f1f3f7;
  --wa:#1f8f5f;--wa-bg:#e7f6ee;--wa-bubble:#d9fdd3;--note:#fff6d6;--note-line:#f1dc94;
  --shadow:0 7px 24px rgba(24,39,75,.055);--r:14px;
  --font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

/* ===== Sidebar ===== */
.sidebar{position:fixed;inset:0 auto 0 0;width:228px;background:var(--nav);color:#fff;padding:20px 13px 14px;display:flex;flex-direction:column;z-index:6;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px}
.brand-mark{width:35px;height:35px;border-radius:11px;background:linear-gradient(145deg,#6e86ff,#2947e8);display:grid;place-items:center;font-weight:900;font-size:12px;flex:none;box-shadow:0 5px 16px rgba(41,71,232,.32)}
.brand-name{font-weight:780;font-size:15px}
.brand-sub{font-size:10px;color:#9ca9bf;letter-spacing:.08em;text-transform:uppercase;margin-top:1px}
.nav{display:grid;gap:2px}
.nav-label{font-size:10px;color:#73819a;letter-spacing:.11em;text-transform:uppercase;padding:0 10px;margin:12px 0 5px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;border:0;background:none;color:var(--nav-muted);font-size:13px;font-weight:560;text-align:left;width:100%;white-space:nowrap}
.nav-item:hover{background:#1b263a;color:#fff}
.nav-item.active{background:#263653;color:#fff;box-shadow:inset 3px 0 #8498ff}
.nav-item.inbox.active{box-shadow:inset 3px 0 #3ccf86}
.nav-icon{width:18px;text-align:center;flex:none}
.nav-count{margin-left:auto;background:#35435c;color:#cbd5e1;border-radius:20px;padding:1px 7px;font-size:10px;font-weight:700}
.nav-count.wa{background:#25b36b;color:#fff}
.sidebar-bottom{margin-top:auto;border-top:1px solid #293247;padding:12px 8px 0}
.account-user{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#35466a;color:#e5ebff;font-size:11px;font-weight:800}
.user-name{font-size:12px;font-weight:650}
.user-role{font-size:10px;color:#8e9bb2}
.reset{margin-top:10px;width:100%;border:1px solid #344056;background:none;color:#acb8ca;border-radius:8px;padding:7px 9px;font-size:11px;text-align:left}
.reset:hover{color:#fff;border-color:#4b5872}

/* ===== Main / top ===== */
.main{margin-left:228px;min-height:100vh}
.topbar{height:58px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.86);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5;backdrop-filter:blur(10px);gap:10px}
.breadcrumb{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.breadcrumb strong{color:#39445a}
.top-right{display:flex;align-items:center;gap:8px}
.pill-top{font-size:11px;color:#56627a;background:#fff;border:1px solid var(--line);border-radius:30px;padding:5px 10px;white-space:nowrap}
.demo-pill{font-size:10px;letter-spacing:.06em;font-weight:750;color:#6a56b5;background:#f0edff;border:1px solid #e4ddff;border-radius:30px;padding:5px 10px;text-transform:uppercase;white-space:nowrap}
.sim{border:0;background:#25b36b;color:#fff;border-radius:20px;padding:8px 13px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 4px 12px rgba(37,179,107,.28)}
.sim:active{transform:scale(.97)}
main.content{max-width:1500px;margin:auto;padding:24px 26px 40px}
main.content.full{max-width:none;padding:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#8290a6;font-weight:750;margin-bottom:5px}
h1{font-size:24px;line-height:1.2;letter-spacing:-.04em;margin:0;font-weight:760}
.subtitle{color:var(--muted);font-size:13px;margin:5px 0 0}
.footer-note{font-size:10px;color:#9aa4b4;text-align:center;margin-top:22px}

/* ===== Generic ===== */
.btn{border:0;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 5px 12px rgba(41,71,232,.16)}
.btn.wa{background:var(--wa);color:#fff}
.btn.ghost{background:#fff;color:#38445a;border:1px solid var(--line)}
.btn.soft-wa{background:var(--wa-bg);color:var(--wa);border:1px solid #cfeadb}
.link{border:0;background:none;color:#4054d7;font-size:11px;font-weight:700;padding:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0;overflow:hidden}
.card-head{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-head h3{font-size:13px;margin:0}
.card-head span{font-size:10px;color:#8b96a7}
.card-body{padding:11px 15px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 13px;box-shadow:var(--shadow);min-width:0}
.kpi-head{display:flex;align-items:center;justify-content:space-between;color:#7d899c;font-size:9px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;gap:6px}
.kpi-icon{width:24px;height:24px;display:grid;place-items:center;border-radius:8px;background:#eff2ff;color:#5267de;font-size:11px;flex:none}
.kpi-icon.wa{background:var(--wa-bg);color:var(--wa)}
.kpi-value{font-size:20px;font-weight:760;letter-spacing:-.04em;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-foot{font-size:10px;color:#8994a5;margin-top:1px}
.badge{display:inline-flex;align-items:center;padding:3px 7px;border-radius:20px;font-size:9px;font-weight:750;white-space:nowrap}
.badge.blue{background:var(--blue-bg);color:#4558c8}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.amber{background:var(--amber-bg);color:var(--amber)}
.badge.red{background:var(--red-bg);color:var(--red)}
.badge.purple{background:var(--purple-bg);color:var(--purple)}
.badge.gray{background:var(--gray-bg);color:#5f6b80}
.empty{padding:18px 12px;text-align:center;color:#8994a6;font-size:12px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid transparent;background:transparent;color:#6f7b90;padding:5px 9px;border-radius:7px;font-size:11px;font-weight:650}
.chip:hover{background:#f2f4f9}
.chip.active{color:#3348c8;background:#eef1ff;border-color:#dfe5ff}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.search-wrap{position:relative}
.search-icon{position:absolute;left:11px;top:8px;color:#8c97a9;font-size:14px}
.search-input{height:35px;width:100%;border-radius:9px;border:1px solid #e3e8f0;padding:0 10px 0 32px;outline:none;background:#fbfcfe;font-size:12px}
.search-input:focus{border-color:#aebcff;box-shadow:0 0 0 3px #eef1ff}
.toolbar .search-wrap{width:260px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.table-wrap.flat{border:0;border-radius:0}
table{border-collapse:collapse;width:100%;min-width:680px}
th{text-align:left;font-size:9px;color:#8893a5;background:#fafbfe;text-transform:uppercase;letter-spacing:.06em;padding:10px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
td{font-size:12px;padding:9px 11px;border-bottom:1px solid #f0f2f6;color:#56637a;vertical-align:top}
tr:last-child td{border-bottom:0}
td strong{color:#27334a}
th.r,td.r{text-align:right;white-space:nowrap}
tfoot td{background:#fafbfe;font-weight:700;color:#27334a;border-top:1px solid var(--line)}
.sub{display:block;font-size:10px;color:#8994a6;margin-top:2px}
.money-in{color:var(--green)!important;font-weight:700}
.money-out{color:#a65d35!important;font-weight:700}
.due{color:#b05a2a;font-weight:700}
.ok-text{color:var(--green);font-weight:700}
.toast{position:fixed;top:68px;left:50%;transform:translate(-50%,-10px);padding:10px 15px;background:#172238;color:#fff;border-radius:11px;font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;z-index:60;box-shadow:0 8px 24px #17223844;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.stage{display:inline-flex;align-items:center;font-size:9px;font-weight:750;padding:2px 7px;border-radius:20px;white-space:nowrap}
.s-nuevo{background:var(--amber-bg);color:var(--amber)}
.s-atencion,.s-prep{background:var(--gray-bg);color:#56637a}
.s-enviada,.s-seg{background:var(--blue-bg);color:#4558c8}
.s-ganada{background:var(--green-bg);color:var(--green)}
.s-perdida{background:var(--red-bg);color:var(--red)}
.note-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#fafbfe;border:1px solid var(--line);color:#5f6b80;font-size:12px}

/* ===== Dashboard pieces ===== */
.funnel-row{display:grid;grid-template-columns:150px 1fr 125px;gap:10px;align-items:center;padding:5px 0;font-size:11px}
.funnel-label{color:#4d5a70;font-weight:600}
.funnel-bar{height:8px;background:#eef0f5;border-radius:9px;overflow:hidden}
.funnel-bar i{display:block;height:100%;background:#6b7ded;border-radius:9px}
.funnel-bar i.won{background:#3aa173}.funnel-bar i.lost{background:#d27d7d}
.funnel-val{text-align:right;color:#56637a;white-space:nowrap}
.row-btn{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;text-align:left;padding:9px 6px;border-radius:9px;border-bottom:1px solid #f1f3f6}
.row-btn:last-child{border-bottom:0}
.row-btn:hover{background:#f7f8fc}
.date-chip{flex:none;width:42px;text-align:center;border:1px solid var(--line);border-radius:9px;padding:4px 0;font-size:9px;color:#7d899b;text-transform:uppercase;line-height:1.2}
.date-chip b{display:block;font-size:15px;color:#27334a}
.row-main{flex:1;min-width:0}
.row-main strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main small{display:block;font-size:10px;color:#8994a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-side{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.row-side small{font-size:10px;color:#8994a6}
.checks,.issues{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:12px;color:#4d5a70}
.checks{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.checks li{display:flex;gap:8px;align-items:center}
.ok{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#e2f3e9;color:#278257;font-weight:800;font-size:10px;flex:none}
.ok.bad{background:var(--red-bg);color:var(--red)}
.issues{margin-top:12px;color:var(--red)}

/* ===== Timeline ===== */
.timeline{position:relative;margin:2px 0 0 8px;padding-left:20px;border-left:1px solid #e6eaf2}
.tl-item{position:relative;padding:0 0 14px 4px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-25px;top:3px;width:9px;height:9px;border-radius:50%;background:#7184ed;border:2px solid #fff;box-shadow:0 0 0 1px #dce2ff}
.tl-dot.pago{background:#48a879}.tl-dot.cotizacion{background:#9a84e6}.tl-dot.nota{background:#d9b23a}.tl-dot.recordatorio{background:#e08a3c}.tl-dot.cliente,.tl-dot.ficha{background:#25b36b}.tl-dot.etapa{background:#5b8def}
.tl-date{font-size:10px;color:#8792a4}
.tl-title{font-size:12px;font-weight:650;margin-top:2px;color:#2d394f}

/* ===== Clientes ===== */
.crm-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.client-panel,.detail-panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.client-panel{overflow:hidden;position:sticky;top:74px}
.client-panel-head{padding:15px 14px 11px;border-bottom:1px solid var(--line)}
.client-panel-title{display:flex;justify-content:space-between;align-items:center}
.client-panel-title h2{font-size:14px;margin:0}
.pill{font-size:10px;color:#738096;background:#f2f4f8;border-radius:20px;padding:3px 8px}
.client-panel .search-wrap{margin:11px 0 9px}
.client-list{padding:6px;max-height:calc(100vh - 260px);overflow:auto}
.client-row{width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:10px;display:flex;gap:10px;align-items:flex-start}
.client-row:hover{background:#f7f8fc}
.client-row.selected{background:#f0f3ff;box-shadow:inset 2px 0 #4058eb}
.client-avatar{flex:none;width:34px;height:34px;border-radius:10px;background:#edf0f7;color:#58657c;display:grid;place-items:center;font-size:10px;font-weight:800}
.client-row.selected .client-avatar{background:#dce4ff;color:#3b51d4}
.client-info{min-width:0;flex:1}
.client-name{display:block;font-size:12px;font-weight:700;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.client-meta{display:block;color:#8994a6;font-size:10px;margin-top:2px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.client-meta.hit{color:#4054d7;font-weight:650}
.client-side{text-align:right;flex:none;max-width:115px}
.client-balance{display:block;font-size:10px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client-balance.due{color:#b05a2a}.client-balance.credit{color:var(--green)}.client-balance.ok{color:#8691a4;font-weight:600}
.client-side .stage{margin-top:4px}
.detail-panel{padding:18px 20px 20px;min-width:0}
.profile-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding-bottom:14px;border-bottom:1px solid var(--line)}
.profile-main{display:flex;gap:13px;align-items:center;min-width:0}
.profile-avatar{width:50px;height:50px;border-radius:15px;background:linear-gradient(145deg,#e8edff,#d7e0ff);color:#3b50cc;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.profile-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.profile-name h2{font-size:18px;letter-spacing:-.03em;margin:0}
.profile-sub{font-size:11px;color:#7b879a;margin-top:3px}
.profile-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.profile-meta{display:flex;gap:8px 18px;flex-wrap:wrap;padding:11px 0;color:#6f7b8e;font-size:11px;border-bottom:1px solid var(--line)}
.profile-meta b{color:#364158;font-weight:650}
.opp-strip{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr .9fr 1.2fr;gap:9px;padding:11px 13px;margin-top:12px;background:#fafbff;border:1px solid #e9ecf7;border-radius:11px}
.opp-field{min-width:0}
.opp-field label{display:block;color:#929caf;font-size:9px;text-transform:uppercase;letter-spacing:.06em;font-weight:750;margin-bottom:3px}
.opp-field strong{display:block;color:#38445a;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prob{display:flex;align-items:center;gap:6px;font-size:10px;color:#69768b}
.prob-bar{height:5px;border-radius:9px;background:#e7eaf2;flex:1;min-width:24px;overflow:hidden}
.prob-bar i{height:100%;display:block;background:#6b7ded}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:4px 0 15px;overflow:auto}
.tab{border:0;background:none;color:#7b8798;padding:12px 1px 10px;font-size:12px;font-weight:680;white-space:nowrap;position:relative}
.tab.active{color:#3047d2}
.tab.active:after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:2px;border-radius:2px;background:#4058eb}
.account-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.account-card{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 13px;min-width:0}
.account-card.primary{background:#f8f9ff;border-color:#e6eaff}
.account-top{display:flex;justify-content:space-between;align-items:center;color:#68758b;font-size:10px;font-weight:700}
.account-value{font-size:20px;font-weight:760;letter-spacing:-.04em;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.account-value .minor{font-size:12px;letter-spacing:0;color:#7a8799;font-weight:600}
.account-card.credit .account-value{color:var(--green)}
.account-caption{font-size:10px;color:#8994a5;margin-top:3px}
.split-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:12px;align-items:start}
.subcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;min-width:0}
.subcard-head{padding:10px 13px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:#fbfcfe}
.subcard-head h3{font-size:12px;margin:0}
.subcard-head span{font-size:10px;color:#8b96a7;text-align:right}
.pad{padding:0 12px}
.item{padding:10px 0;border-bottom:1px solid #f0f2f6}
.item:last-child{border-bottom:0}
.item-line{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item-title{font-size:12px;font-weight:720}
.item-id{font-size:10px;color:#8792a4;margin-left:5px;font-weight:550}
.item-sub{font-size:10px;color:#7d899b;margin-top:2px}
.item-right{text-align:right;white-space:nowrap}
.item-right strong{font-size:12px}
.item-right small{display:block;font-size:10px;color:#8d98a8;margin-top:2px}
.breakdown{margin-top:7px;padding:7px 9px;background:#f8f9fc;border-radius:8px}
.break-row{display:flex;justify-content:space-between;gap:10px;font-size:10px;color:#69768b;padding:1px 0}
.break-row strong{color:#374258}
.break-row.credit strong{color:var(--green)}
.ledger{margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ledger-summary{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.ledger-account{padding:11px 14px;font-size:11px;color:#4d5a70}
.ledger-account+.ledger-account{border-left:1px solid var(--line)}
.ledger-label{font-size:9px;color:#7d899b;font-weight:750;margin-bottom:4px;letter-spacing:.04em}
.minus{color:#bb6334}.plus{color:#248257}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.contact-box{padding:14px;border:1px solid var(--line);border-radius:12px}
.contact-box h3{font-size:12px;margin:0 0 8px}
.contact-field{margin-top:8px}
.contact-field label{display:block;color:#8994a6;font-size:10px}
.contact-field span{font-size:12px;color:#354157;font-weight:600}
.person{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid #f0f2f6}
.person:last-child{border-bottom:0}
.initial{width:30px;height:30px;flex:none;border-radius:9px;background:#edf1ff;color:#5669d5;display:grid;place-items:center;font-size:10px;font-weight:800}
.person strong{display:block;font-size:12px}
.person small{display:block;color:#8490a2;font-size:10px;margin-top:1px;overflow-wrap:anywhere}

/* ===== Kanban ===== */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(225px,1fr);gap:11px;overflow-x:auto;padding-bottom:8px}
.kcol{background:#eef1f6;border-radius:13px;padding:10px;min-height:200px}
.kcol-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:750;color:#37435a}
.kcol-head b{background:#fff;border-radius:20px;padding:1px 8px;font-size:10px;color:#5d6a80}

/* ------------------------------------------------------------------ */
/*  BASE DE DATOS: carga, guardado y reloj simulado                     */
/* ------------------------------------------------------------------ */
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null;}catch(e){return null;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
let DB = load() || seed();
function isoOf(d){const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes());}
function tick(){const d=new Date(DB.reloj);d.setMinutes(d.getMinutes()+1);DB.reloj=isoOf(d);return DB.reloj;}
const today = () => DB.reloj.slice(0,10);

/* ------------------------------------------------------------------ */
/*  Utilidades y consultas (como SELECT sobre las tablas)               */
/* ------------------------------------------------------------------ */
const $ = id => document.getElementById(id);
const sum = (a,f) => a.reduce((s,x)=>s+f(x),0);
const nf = new Intl.NumberFormat("es-VE",{minimumFractionDigits:2,maximumFractionDigits:2});
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function money(v,m){return (m==="BS"?"Bs ":"$")+nf.format(Number(v)||0);}
function accName(m){return m==="BS"?"BCV":"DIVISA";}
function fd(iso){if(!iso)return "—";const p=iso.slice(0,10).split("-");return p[2]+" "+MONTHS[+p[1]-1]+" "+p[0];}
function fdShort(iso){if(!iso)return "—";const p=iso.slice(0,10).split("-");return (+p[2])+" "+MONTHS[+p[1]-1];}
function hm(iso){return iso.slice(11,16);}
function fdt(iso){return fd(iso)+(iso.length>10?" · "+hm(iso):"");}
function daysFrom(iso){return Math.round((new Date(iso.slice(0,10)+"T00:00")-new Date(today()+"T00:00"))/86400000);}
function dayLabel(iso){const n=daysFrom(iso);return n===0?"Hoy":n===-1?"Ayer":fdShort(iso);}
function shortTime(iso){return daysFrom(iso)===0?hm(iso):dayLabel(iso);}
function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
function fmtPhone(e){const m=String(e||"").match(/^\+58(\d{3})(\d{3})(\d{4})$/);return m?"+58 "+m[1]+"-"+m[2]+"-"+m[3]:e;}
const byDesc = k => (a,b)=>String(b[k]).localeCompare(String(a[k]));

const cli = id => DB.clientes.find(c=>c.id===+id);
const contactsOf = cid => DB.contactos.filter(x=>x.clienteId===+cid);
const primaryOf = cid => {const cs=contactsOf(cid);return cs.find(x=>x.principal)||cs[0];};
const convById = id => DB.conversaciones.find(v=>v.id===+id);
const convOfClient = cid => DB.conversaciones.find(v=>v.clienteId===+cid);
function clientName(c){if(c.nombre)return c.nombre;const p=primaryOf(c.id);return p?(p.nombre||fmtPhone(p.wa)):"Sin nombre";}
function contactName(ct){return ct.nombre||fmtPhone(ct.wa);}
function initials(t){const w=String(t||"?").replace(/^Dra?\.\s*/,"").replace(/[^\p{L}\s]/gu,"").trim().split(/\s+/).filter(Boolean);return (w.length?w.slice(0,2).map(x=>x[0]).join(""):"?").toUpperCase();}

function paidOf(o){return sum(DB.pagos,p=>sum(p.aplicaciones.filter(a=>a.pedidoId===o.id),a=>a.monto));}
function dueOf(o){return Math.max(o.total-paidOf(o),0);}
function appliedOf(p){return sum(p.aplicaciones,a=>a.monto);}
function creditOf(p){return Math.max(p.recibido-appliedOf(p),0);}
/* Cuenta de un cliente en UNA moneda: USD y Bs nunca se mezclan ni se convierten */
function account(cid,m){
  const os=DB.pedidos.filter(o=>o.clienteId===+cid&&o.moneda===m);
  const ps=DB.pagos.filter(p=>p.clienteId===+cid&&p.moneda===m);
  const issued=sum(os,o=>o.total),applied=sum(os,paidOf),credit=sum(ps,creditOf),open=issued-applied;
  return {issued,applied,open,credit,net:open-credit,orders:os.length,payments:ps.length};
}
function netLabel(a,m){return a.net>=0?money(a.net,m):"a favor "+money(-a.net,m);}
function mainOpp(cid){
  const os=DB.oportunidades.filter(o=>o.clienteId===+cid);
  return os.filter(o=>OPEN.includes(o.etapa)).sort((a,b)=>String(a.proximo).localeCompare(String(b.proximo)))[0]
      || os.filter(o=>o.etapa==="Ganada").sort((a,b)=>b.id-a.id)[0] || os.sort((a,b)=>b.id-a.id)[0];
}
function stageOf(cid){const o=mainOpp(cid);return o?o.etapa:"—";}
function followItems(){return DB.oportunidades.filter(o=>o.proximo&&o.etapa!=="Perdida").sort((a,b)=>a.proximo.localeCompare(b.proximo));}
function unreadTotal(){return sum(DB.conversaciones,v=>v.noLeidos);}
function lastMsg(v){const ms=DB.mensajes.filter(m=>m.conversacionId===v.id);return ms.sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.id-b.id)[ms.length-1];}
function lastActivity(v){const m=lastMsg(v);return m?m.fecha:"";}

function addEvent(cid,tipo,texto,autor){DB.eventos.push({id:++DB.seq.evento,clienteId:+cid,fecha:tick(),tipo,texto,autor:autor||ME});}
function addMsg(vid,dir,texto,adjunto){const m={id:++DB.seq.mensaje,conversacionId:+vid,dir,fecha:tick(),texto};if(adjunto)m.adjunto=adjunto;DB.mensajes.push(m);return m;}
function ensureOpp(cid){
  let o=DB.oportunidades.find(x=>x.clienteId===+cid&&OPEN.includes(x.etapa));
  if(!o){o={id:++DB.seq.oportunidad,clienteId:+cid,titulo:"Nueva oportunidad",etapa:"En atención",origen:"WhatsApp",responsable:ME,monto:0,prob:25,proximo:null,cotizacionId:null};DB.oportunidades.push(o);}
  return o;
}
const DEFAULT_PROB={"Cliente nuevo":10,"En atención":25,"Cotización en preparación":35,"Cotización enviada":50,"Seguimiento":60,"Ganada":100,"Perdida":0};
function setStage(cid,etapa,silent){
  const o=ensureOpp(cid);const prev=o.etapa;if(prev===etapa)return null;
  o.etapa=etapa;if(etapa==="Ganada"||etapa==="Perdida"||o.prob<DEFAULT_PROB[etapa])o.prob=DEFAULT_PROB[etapa];
  if(!silent)addEvent(cid,"etapa","Etapa: "+prev+" → "+etapa);
  return prev;
}

const CHECKS=[
  {code:"dup",label:"Identificadores de pedido únicos"},
  {code:"over_payment",label:"Ningún pago distribuye más de lo recibido"},
  {code:"over_order",label:"Ningún pedido recibe más que su total"},
  {code:"mix",label:"Pagos y pedidos en la misma moneda y cliente"},
  {code:"credit",label:"Saldo a favor solo si no hay pedidos pendientes"},
  {code:"orphan",label:"Todo mensaje y evento pertenece a un cliente"}
];
function audit(){
  const out=[],seen={};
  DB.pedidos.forEach(o=>{if(seen[o.id])out.push({code:"dup",msg:"ID de pedido duplicado: "+o.id});seen[o.id]=1;if(paidOf(o)>o.total)out.push({code:"over_order",msg:o.id+" recibe más que su total"});});
  DB.pagos.forEach(p=>{
    if(appliedOf(p)>p.recibido)out.push({code:"over_payment",msg:p.id+" distribuye más de lo recibido"});
    p.aplicaciones.forEach(a=>{const o=DB.pedidos.find(x=>x.id===a.pedidoId);
      if(!o)out.push({code:"mix",msg:p.id+" apunta a un pedido inexistente"});
      else{if(o.moneda!==p.moneda)out.push({code:"mix",msg:p.id+" mezcla monedas con "+o.id});if(o.clienteId!==p.clienteId)out.push({code:"mix",msg:p.id+" aplicado a pedido de otro cliente"});}});
  });
  DB.clientes.forEach(c=>["USD","BS"].forEach(m=>{const a=account(c.id,m);if(a.credit>0&&a.open>0)out.push({code:"credit",msg:clientName(c)+": "+money(a.credit,m)+" a favor sin aplicar con pedidos pendientes"});}));
  DB.mensajes.forEach(m=>{const v=convById(m.conversacionId);if(!v||!cli(v.clienteId))out.push({code:"orphan",msg:"Mensaje "+m.id+" sin conversación/cliente"});});
  DB.eventos.forEach(e=>{if(!cli(e.clienteId))out.push({code:"orphan",msg:"Evento "+e.id+" sin cliente"});});
  return out;
}

function inboxList(){
  return DB.conversaciones.slice().sort((a,b)=>lastActivity(b).localeCompare(lastActivity(a))).filter(v=>{
    const c=cli(v.clienteId);
    if(state.ifilter==="unread")return v.noLeidos>0;
    if(state.ifilter==="new")return stageOf(c.id)==="Cliente nuevo"||c.nuevo;
    if(state.ifilter==="balance"){const u=account(c.id,"USD"),b=account(c.id,"BS");return u.net>0||b.net>0;}
    return true;
  });
}
function chatTimeline(v){
  const items=DB.mensajes.filter(m=>m.conversacionId===v.id).map(m=>({k:"m",f:m.fecha,o:m.id,x:m}))
    .concat(DB.eventos.filter(e=>e.clienteId===v.clienteId).map(e=>({k:"e",f:e.fecha,o:e.id+0.5,x:e})));
  return items.sort((a,b)=>a.f.localeCompare(b.f)||a.o-b.o);
}

function kpis(){
  const open=DB.oportunidades.filter(o=>OPEN.includes(o.etapa));
  let usd=0,bs=0,withBal=0,credUsd=0;
  DB.clientes.forEach(c=>{const u=account(c.id,"USD"),b=account(c.id,"BS");if(u.net>0)usd+=u.net;if(b.net>0)bs+=b.net;if(u.net<0)credUsd+=-u.net;if(u.net>0||b.net>0)withBal++;});
  const todayPays=DB.pagos.filter(p=>p.fecha.slice(0,10)===today());
  return {openCount:open.length,pipeline:sum(open,o=>o.monto),weighted:sum(open,o=>o.monto*o.prob/100),usd,bs,withBal,credUsd,
    active:DB.pedidos.filter(o=>o.estado!=="Entregado").length,fups:followItems().filter(o=>daysFrom(o.proximo)<=7).length,
    unread:unreadTotal(),convs:DB.conversaciones.length,newToday:DB.eventos.filter(e=>e.tipo==="cliente"&&e.fecha.slice(0,10)===today()).length,
    paidTodayUsd:sum(todayPays.filter(p=>p.moneda==="USD"),p=>p.recibido)};
}

function funnel(){
  const rows=STAGES.map(s=>{const os=DB.oportunidades.filter(o=>o.etapa===s);return {s,n:os.length,amt:sum(os,o=>o.monto)};});
  const max=Math.max(...rows.map(r=>r.amt),1);
  return rows.map(r=>'<div class="funnel-row"><span class="funnel-label">'+r.s+'</span><span class="funnel-bar"><i class="'+(r.s==="Ganada"?"won":r.s==="Perdida"?"lost":"")+'" style="width:'+(r.amt/max*100)+'%"></i></span><span class="funnel-val">'+r.n+' · '+money(r.amt,"USD")+'</span></div>').join("");
}

function clientMatch(c,q){
  if(!q)return {ok:true};
  const nq=norm(q);
  if(norm([c.nombre,c.rif,c.rif.replace(/-/g,""),c.telefono,c.correo,c.direccion].join(" ")).includes(nq))return {ok:true};
  const hit=contactsOf(c.id).find(x=>norm([x.nombre,x.cargo,x.wa,fmtPhone(x.wa),x.correo].join(" ")).includes(nq));
  return hit?{ok:true,via:contactName(hit)}:{ok:false};
}
function filterOk(c){
  const u=account(c.id,"USD"),b=account(c.id,"BS");
  switch(state.cfilter){
    case "balance":return u.net>0||b.net>0;
    case "opportunity":return DB.oportunidades.some(o=>o.clienteId===c.id&&OPEN.includes(o.etapa));
    case "prospect":return c.relacion==="Prospecto";
    case "credit":return u.net<0||b.net<0;
    default:return true;
  }
}
function balanceLabel(c){
  const u=account(c.id,"USD"),b=account(c.id,"BS"),parts=[];
  if(u.net>0)parts.push(money(u.net,"USD"));if(b.net>0)parts.push(money(b.net,"BS"));
  if(parts.length)return {text:parts.join(" · "),cls:"due"};
  if(u.net<0)return {text:"A favor "+money(-u.net,"USD"),cls:"credit"};
  if(b.net<0)return {text:"A favor "+money(-b.net,"BS"),cls:"credit"};
  return {text:"Al día",cls:"ok"};
}
function clientList(){
  const rows=DB.clientes.map(c=>({c,m:clientMatch(c,state.q)})).filter(r=>r.m.ok&&filterOk(r.c));
  const html=rows.length?rows.map(r=>{
    const c=r.c,bal=balanceLabel(c),p=primaryOf(c.id);
    const meta=r.m.via?'<span class="client-meta hit">Contacto: '+esc(r.m.via)+'</span>':'<span class="client-meta">'+esc(p?contactName(p):"—")+' · '+esc(c.relacion)+'</span>';
    return '<button class="client-row '+(c.id===state.clientId?"selected":"")+'" data-client="'+c.id+'"><span class="client-avatar">'+esc(initials(clientName(c)))+'</span><span class="client-info"><span class="client-name">'+esc(clientName(c))+'</span>'+meta+'</span><span class="client-side"><span class="client-balance '+bal.cls+'">'+bal.text+'</span>'+stageChip(stageOf(c.id))+'</span></button>';
  }).join(""):empty("No hay coincidencias.");
  return {count:rows.length,html};
}

function parsePayment(text){
  if(!/(\$|usd|bs\.?\s|zelle|pago m[oó]vil|transfer|abono|pagu[eé]|te hice)/i.test(text))return null;
  if(/datos para|me pasan|c[oó]mo hacemos/i.test(text))return null;   // preguntas, no pagos
  let moneda="USD",monto=null,m;
  if((m=text.match(/(?:\$|usd\s?)\s?([\d.]+(?:,\d{1,2})?)/i)))monto=parseFloat(m[1].replace(/\./g,"").replace(",","."));
  else if((m=text.match(/bs\.?\s?([\d.]+(?:,\d{1,2})?)/i))){moneda="BS";monto=parseFloat(m[1].replace(/\./g,"").replace(",","."));}
  const r=text.match(/ref\.?\s*:?\s*([A-Z0-9-]{4,})/i);
  const metodo=/zelle/i.test(text)?"Zelle":/m[oó]vil/i.test(text)?"Pago móvil":/efectivo/i.test(text)?"Efectivo USD":"Transferencia";
  return {moneda,monto,ref:r?r[1]:"",metodo};
}
function simulate(){
  if(DB.simIdx>=INCOMING.length){toast("No hay más mensajes simulados. Usa «Reiniciar datos de prueba» para repetir.");return;}
  const inc=INCOMING[DB.simIdx++];
  let ct=DB.contactos.find(x=>x.wa===inc.wa),v,isNew=false;
  if(!ct){
    // Número desconocido → INSERT en clientes, contactos, conversaciones y oportunidades
    isNew=true;
    const c={id:++DB.seq.cliente,nombre:"",tipo:"Por definir",relacion:"Prospecto",rif:"",telefono:fmtPhone(inc.wa),correo:"",direccion:"",nota:"",nuevo:true};
    DB.clientes.push(c);
    ct={id:++DB.seq.contacto,clienteId:c.id,nombre:"",cargo:"",wa:inc.wa,correo:"",principal:true};DB.contactos.push(ct);
    DB.oportunidades.push({id:++DB.seq.oportunidad,clienteId:c.id,titulo:"Consulta por WhatsApp",etapa:"Cliente nuevo",origen:"WhatsApp",responsable:ME,monto:0,prob:10,proximo:today(),cotizacionId:null});
  }
  v=DB.conversaciones.find(x=>x.contactoId===ct.id);   // cada contacto tiene su propio chat
  if(!v){v={id:++DB.seq.conversacion,clienteId:ct.clienteId,contactoId:ct.id,noLeidos:0,sugerencia:null};DB.conversaciones.push(v);}
  const m=addMsg(v.id,"in",inc.texto,inc.adjunto);state.animId="m"+m.id;
  if(isNew)addEvent(ct.clienteId,"cliente","Número desconocido → cliente creado automáticamente · Etapa: Cliente nuevo","Tuto CRM (automático)");
  v.sugerencia=parsePayment(inc.texto);
  const viewing=state.view==="bandeja"&&state.convId===v.id&&(state.pane!=="list"||window.innerWidth>900);
  if(!viewing)v.noLeidos++;
  save();
  toast("📲 WhatsApp de "+contactName(ct)+": "+inc.texto.slice(0,46)+(inc.texto.length>46?"…":""));
  render();
}

      const first=pending.find(o=>o.id===f.pedido);
      const order=first?[first].concat(pending.filter(o=>o!==first)):pending;
      order.forEach(o=>{if(left<=0)return;const a=Math.min(left,dueOf(o));if(a>0){apps.push({pedidoId:o.id,monto:a});left=Math.round((left-a)*100)/100;}});
    }
    const id="PG-2026-0"+(DB.seq.pago++);
    DB.pagos.push({id,clienteId:cid,fecha:tick(),metodo:f.metodo,ref:f.ref.trim(),moneda:m,recibido:monto,aplicaciones:apps});
    addEvent(cid,"pago","Pago "+id+" · "+money(monto,m)+" · "+f.metodo+" · Ref. "+f.ref.trim()+(apps.length?" → "+apps.map(a=>a.pedidoId+" ("+money(a.monto,m)+")").join(" + "):"")+(left>0?" · a favor "+money(left,m):""));
    if(v&&f.confirmar)addMsg(v.id,"out","✅ Recibimos su pago de "+money(monto,m)+" (Ref. "+f.ref.trim()+"). ¡Gracias!");
    if(v)v.sugerencia=null;
    return done("Pago guardado: actualiza la ficha, Pagos, Conciliación y el Panel");
  }
  if(kind==="quote"){
    const monto=parseFloat(f.monto);if(!(monto>0))return err("Indica un monto válido.");
    const enviar=!!f.enviar;
    DB.cotizaciones.push({id:f.id,clienteId:cid,fecha:today(),titulo:f.titulo,moneda:f.moneda,monto,estado:enviar?"Enviada":"En preparación",vigencia:enviar?addDays(today(),7):null,responsable:ME});
    DB.seq.cotizacion++;
    const o=ensureOpp(cid);o.cotizacionId=f.id;if(!o.monto&&f.moneda==="USD")o.monto=monto;if(o.titulo==="Consulta por WhatsApp"||o.titulo==="Nueva oportunidad")o.titulo=f.titulo;
    const prev=setStage(cid,enviar?"Cotización enviada":"Cotización en preparación",true);
    if(enviar&&v)addMsg(v.id,"out","📄 Cotización "+f.id+" · "+f.titulo+" · "+money(monto,f.moneda)+". Quedamos atentos a sus comentarios.");
    addEvent(cid,"cotizacion","Cotización "+f.id+" "+(enviar?"enviada":"creada")+" · "+money(monto,f.moneda)+(prev?" · Etapa: "+prev+" → "+o.etapa:""));
    return done("Cotización guardada");
  }
  if(kind==="order"){
    const total=parseFloat(f.total);if(!(total>0))return err("Indica un total válido.");
    DB.pedidos.push({id:f.id,clienteId:cid,fecha:today(),nombre:f.nombre,detalle:f.detalle||"",estado:"En cola",moneda:f.moneda,total,cotizacionId:f.cotizacionId||null});
    DB.seq.pedido++;
    if(f.cotizacionId){const q=DB.cotizaciones.find(x=>x.id===f.cotizacionId);if(q)q.estado="Aprobada";}
    const o=ensureOpp(cid);if(!o.monto&&f.moneda==="USD")o.monto=total;
    const prev=setStage(cid,"Ganada",true);
    const cl=cli(cid);if(cl.relacion==="Prospecto")cl.relacion="Cliente activo";
    addEvent(cid,"pedido","Pedido "+f.id+" creado · "+f.nombre+" · "+money(total,f.moneda)+(prev?" · Etapa: "+prev+" → Ganada":""));
    return done("Pedido creado y vinculado al cliente");
  }
  if(kind==="remind"){
    const o=ensureOpp(cid);o.proximo=f.fecha;o.responsable=f.responsable;
    addEvent(cid,"recordatorio","Recordatorio "+fdShort(f.fecha)+": "+f.texto+" · "+f.responsable);
    return done("Recordatorio guardado en Seguimientos");
  }
  if(kind==="note"){
    if(!f.texto.trim())return err("Escribe la nota.");
    addEvent(cid,"nota",f.texto.trim());return done("Nota guardada");
  }
  if(kind==="profile"){
    c.nombre=f.empresa.trim();c.rif=f.rif.trim();c.nuevo=false;c.tipo="Empresa";
    const ct=primaryOf(cid);ct.nombre=f.contacto.trim();
    const o=ensureOpp(cid);o.responsable=f.responsable;
    addEvent(cid,"ficha","Ficha completada · "+ct.nombre+" · "+c.nombre+" · Responsable: "+f.responsable);
    return done("Ficha guardada");
  }
  if(kind==="newclient"){
    const wa="+"+f.wa.replace(/\D/g,"");
    if(DB.contactos.some(x=>x.wa===wa))return err("Ese WhatsApp ya pertenece a otro contacto.");
    const nc={id:++DB.seq.cliente,nombre:f.empresa.trim(),tipo:"Empresa",relacion:"Prospecto",rif:f.rif.trim(),telefono:fmtPhone(wa),correo:"",direccion:"",nota:"",nuevo:false};
    DB.clientes.push(nc);
    DB.contactos.push({id:++DB.seq.contacto,clienteId:nc.id,nombre:f.contacto.trim(),cargo:"Principal",wa,correo:"",principal:true});
    DB.oportunidades.push({id:++DB.seq.oportunidad,clienteId:nc.id,titulo:"Nueva oportunidad",etapa:"Cliente nuevo",origen:f.origen,responsable:ME,monto:0,prob:10,proximo:today(),cotizacionId:null});
    addEvent(nc.id,"cliente","Cliente creado manualmente · origen "+f.origen);
    state.clientId=nc.id;state.tab="account";
    return done("Cliente creado");
  }
}
function addDays(iso,n){const d=new Date(iso+"T12:00");d.setDate(d.getDate()+n);return isoOf(d).slice(0,10);}

/* ================================================================== */
/*  RENDER Y EVENTOS                                                    */
/* ================================================================== */
function buildNav(){
  let html="",g="";
  Object.keys(VIEWS).forEach(k=>{const v=VIEWS[k];
    if(v.group!==g){g=v.group;html+='<div class="nav-label">'+g+'</div>';}
    html+='<button class="nav-item '+(k==="bandeja"?"inbox":"")+'" data-view="'+k+'"><span class="nav-icon">'+v.icon+'</span><span>'+v.label+'</span><span class="nav-count" id="count-'+k+'" hidden></span></button>';});
  $("nav").innerHTML=html;
}
function setCount(k,n,cls){const el=$("count-"+k);if(!el)return;el.hidden=!n;el.textContent=n;el.className="nav-count"+(cls?" "+cls:"");}
function render(){
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active",b.dataset.view===state.view));
  $("crumb").textContent=VIEWS[state.view].label;
  $("clockPill").textContent="Reloj demo · "+fdShort(DB.reloj)+" "+hm(DB.reloj);
  const content=$("content");
  content.classList.toggle("full",!!VIEWS[state.view].full);
  content.innerHTML=VIEWS[state.view].fn();
  setCount("bandeja",unreadTotal(),"wa");
  setCount("clientes",DB.clientes.length);
  setCount("seguimientos",followItems().filter(o=>daysFrom(o.proximo)<=7).length);
  const box=$("msgs");if(box)box.scrollTop=box.scrollHeight;
  state.animId=null;
}
function go(view){state.view=view;render();window.scrollTo(0,0);}
function openConv(id){
  const v=convById(id);if(!v)return;
  if(state.convId!==v.id){state.draft="";state.mode="reply";}
  state.convId=v.id;v.noLeidos=0;state.pane="chat";state.view="bandeja";save();render();window.scrollTo(0,0);
}

document.addEventListener("click",e=>{
  if(e.target.id==="overlay"){closeModal();return;}
  const t=e.target.closest("button,a");if(!t)return;
  const d=t.dataset;
  if(t.tagName==="A"&&t.getAttribute("href")==="#")e.preventDefault();
  if(d.sim!==undefined){simulate();return;}
  if(d.close!==undefined){closeModal();return;}
  if(d.doreset!==undefined){DB=seed();save();closeModal();Object.assign(state,{convId:1,pane:window.innerWidth>900?"chat":"list",clientId:1,tab:"account",draft:""});render();toast("Datos de prueba reiniciados");return;}
  if(d.export!==undefined){try{const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="tuto-crm-base-de-datos.json";document.body.appendChild(a);a.click();a.remove();}catch(x){toast("No se pudo exportar en este navegador");}return;}
  if(d.open){openModal(d.open,d.cid);return;}
  if(d.stage){const cid=modalCid;if(setStage(cid,d.stage)!==null){save();}closeModal();render();toast("Etapa actualizada en Oportunidades");return;}
  if(d.view){go(d.view);return;}
  if(d.conv){openConv(d.conv);return;}
  if(d.startchat){
    const cid=+d.startchat,ct=primaryOf(cid);
    if(!ct){toast("Este cliente no tiene contacto con WhatsApp");return;}
    const v={id:++DB.seq.conversacion,clienteId:cid,contactoId:ct.id,noLeidos:0,sugerencia:null};DB.conversaciones.push(v);
    state.draft="";save();openConv(v.id);return;
  }
  if(d.client){
    const id=+d.client,changed=id!==state.clientId||state.view!=="clientes";
    state.clientId=id;if(changed)state.tab="account";
    const from=state.view;state.view="clientes";render();
    if(from!=="clientes")window.scrollTo(0,0);else if(window.innerWidth<900){const x=$("detail");if(x)x.scrollIntoView({behavior:"smooth",block:"start"});}
    return;
  }
  if(d.pane){state.pane=d.pane;const ib=$("inbox");if(ib)ib.dataset.pane=state.pane;if(d.pane==="chat"){const b=$("msgs");if(b)b.scrollTop=b.scrollHeight;}return;}
  if(d.mode){state.mode=d.mode;render();const i=$("draft");if(i)i.focus();return;}
  if(d.dismiss!==undefined){const v=convById(state.convId);if(v){v.sugerencia=null;save();}render();return;}
  if(d.ifilter){state.ifilter=d.ifilter;render();return;}
  if(d.tab){state.tab=d.tab;render();return;}
  if(d.cfilter){state.cfilter=d.cfilter;render();return;}
  if(d.ofilter){state.ofilter=d.ofilter;render();return;}
  if(d.hkind){state.hkind=d.hkind;render();return;}
  if(d.dbtable){state.dbTable=d.dbtable;render();return;}
});
document.addEventListener("input",e=>{
  if(e.target.id==="draft")state.draft=e.target.value;
  if(e.target.id==="clientSearch"){state.q=e.target.value;const r=clientList();$("clientList").innerHTML=r.html;$("clientCount").textContent=r.count+" "+(r.count===1?"registro":"registros");}
  if(e.target.id==="orderSearch"){state.oq=e.target.value;$("ordersBody").innerHTML=ordersBody();}
});
document.addEventListener("change",e=>{if(e.target.id==="payAcc"&&modalCid)$("payOrder").innerHTML=orderOptions(modalCid,e.target.value);});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="composer"){
    const text=state.draft.trim();if(!text)return;
    const v=convById(state.convId);if(!v)return;
    if(state.mode==="note"){addEvent(v.clienteId,"nota",text);state.animId="e"+DB.seq.evento;}
    else{const m=addMsg(v.id,"out",text);state.animId="m"+m.id;}
    state.draft="";save();render();const i=$("draft");if(i&&window.innerWidth>900)i.focus();
    if(state.mode==="reply")toast("Mensaje simulado: no se envió a WhatsApp");
    return;
  }
  if(e.target.id==="mform")submitModal(e.target);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("overlay").hidden)closeModal();});

buildNav();
if(window.innerWidth>900){state.pane="chat";}
render();
setTimeout(()=>toast("Toca «📲 Simular mensaje» para recibir un WhatsApp"),700);
</script>
