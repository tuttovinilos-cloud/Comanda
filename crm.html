<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121a2b">
<title>Tuto CRM · Bandeja de WhatsApp</title>
<style>
:root{
  --bg:#f3f5f9;--panel:#fff;--ink:#162033;--muted:#738096;--line:#e6eaf1;
  --blue:#2947e8;--blue-bg:#eef2ff;--nav:#121a2b;
  --green:#17845b;--green-bg:#e9f7ef;--wa:#1f8f5f;--wa-bubble:#d9fdd3;
  --amber:#a76512;--amber-bg:#fff4df;--red:#b64343;--red-bg:#fff0ef;--purple:#6f55cb;--purple-bg:#f1efff;
  --note:#fff6d6;--note-line:#f1dc94;
  --font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

/* ---------- Top bar ---------- */
.top{height:56px;background:var(--nav);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,#6e86ff,#2947e8);display:grid;place-items:center;font-weight:900;font-size:11px;flex:none}
.brand b{font-size:15px;white-space:nowrap}
.brand small{display:block;font-size:10px;color:#9ca9bf;white-space:nowrap}
.top-right{display:flex;align-items:center;gap:8px}
.demo{font-size:10px;font-weight:750;letter-spacing:.05em;color:#cfc6ff;border:1px solid #3a3f6b;border-radius:20px;padding:4px 9px;white-space:nowrap}
.sim{border:0;background:#25b36b;color:#fff;border-radius:20px;padding:8px 13px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 4px 12px rgba(37,179,107,.3)}
.sim:active{transform:scale(.97)}

/* ---------- Layout ---------- */
.layout{display:grid;grid-template-columns:310px minmax(0,1fr) 330px;height:calc(100vh - 56px);height:calc(100dvh - 56px)}
.pane{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--panel)}
.list{border-right:1px solid var(--line)}
.info{border-left:1px solid var(--line);overflow:auto;background:#fbfcfe}

/* ---------- Chat list ---------- */
.list-head{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.list-head h2{font-size:16px;margin:0 0 9px;display:flex;justify-content:space-between;align-items:center}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid transparent;background:#f1f3f7;color:#5f6b80;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:650}
.chip.active{background:var(--green-bg);color:var(--wa);border-color:#cdeedb}
.list-body{overflow:auto;flex:1}
.ci{display:flex;gap:10px;padding:12px 14px;border:0;background:none;width:100%;text-align:left;border-bottom:1px solid #f0f2f6;align-items:center}
.ci:hover{background:#f7faf8}
.ci.active{background:#eef7f2}
.av{width:42px;height:42px;border-radius:50%;background:#d8efe3;color:#1f7a50;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.av.new{background:#fff0cf;color:#a76512}
.ci-main{flex:1;min-width:0}
.ci-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ci-top strong{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-top time{font-size:10px;color:#8994a6;flex:none}
.ci-top time.unread{color:#25b36b;font-weight:700}
.ci-prev{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:2px}
.ci-prev span{font-size:12px;color:#7b8798;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge-un{background:#25b36b;color:#fff;border-radius:20px;min-width:19px;height:19px;display:grid;place-items:center;font-size:10px;font-weight:800;padding:0 5px;flex:none}
.stage{display:inline-flex;align-items:center;font-size:9px;font-weight:750;padding:2px 7px;border-radius:20px;white-space:nowrap;margin-top:4px}
.s-nuevo{background:var(--amber-bg);color:var(--amber)}
.s-atencion,.s-prep{background:#f1f3f7;color:#56637a}
.s-enviada,.s-seg{background:var(--blue-bg);color:#4558c8}
.s-ganada{background:var(--green-bg);color:var(--green)}
.s-perdida{background:var(--red-bg);color:var(--red)}

/* ---------- Conversation ---------- */
.chat-head{padding:9px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:#fff}
.back{display:none;border:0;background:none;font-size:20px;padding:2px 6px;color:#4d5a70}
.chat-head .who{flex:1;min-width:0}
.chat-head .who strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .who small{display:block;font-size:11px;color:#7b8798;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info-btn{display:none;border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 11px;font-size:12px;font-weight:650}
.actions{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:#fafbfd;overflow-x:auto;scrollbar-width:none}
.actions::-webkit-scrollbar{display:none}
.act{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font-size:12px;font-weight:650;white-space:nowrap;color:#38445a}
.act:hover{border-color:#b9c4ff;background:#f7f8ff}
.act.pay{border-color:#cdeedb;color:var(--wa)}
.msgs{flex:1;overflow:auto;padding:14px 16px;background:#efeae2;background-image:radial-gradient(#e2dccf 1px,transparent 1px);background-size:18px 18px}
.day{text-align:center;margin:10px 0}
.day span{background:#fff;font-size:10px;padding:3px 9px;border-radius:8px;color:#6b7a86;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.b{max-width:72%;width:fit-content;padding:7px 10px 5px;border-radius:10px;margin:5px 0;font-size:13.5px;box-shadow:0 1px 1px rgba(0,0,0,.07);overflow-wrap:anywhere;animation:pop .18s ease-out}
.b.in{background:#fff;border-top-left-radius:2px}
.b.out{background:var(--wa-bubble);margin-left:auto;border-top-right-radius:2px}
.b time{display:block;text-align:right;font-size:10px;color:#7d8a80;margin-top:2px}
.b .from{display:block;font-size:10px;font-weight:750;color:#1f7a50;margin-bottom:1px}
.attach{display:flex;align-items:center;gap:8px;background:#f1f4f2;border-radius:8px;padding:8px 10px;margin-bottom:5px;font-size:12px;color:#44524a}
.attach i{font-style:normal;font-size:20px}
.note{max-width:78%;margin:8px auto;background:var(--note);border:1px dashed var(--note-line);border-radius:10px;padding:7px 11px;font-size:12.5px;color:#5c4a12;animation:pop .18s ease-out}
.note small{display:block;font-size:10px;font-weight:750;color:#8a6d12;margin-bottom:2px}
.ev{display:flex;justify-content:center;margin:8px 0;animation:pop .18s ease-out}
.ev span{background:rgba(255,255,255,.92);border:1px solid #dfe3ea;border-radius:9px;padding:5px 10px;font-size:11.5px;color:#3d4a60;text-align:center;max-width:88%}
.ev span small{display:block;font-size:10px;color:#8a95a6;margin-top:1px}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.suggest{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#fff8e6;border-top:1px solid #f3e2b3;font-size:12px;color:#6b5113}
.suggest span{flex:1}
.suggest button{border:0;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:750}
.suggest .yes{background:var(--wa);color:#fff}
.suggest .no{background:transparent;color:#8a6d12}
.composer{border-top:1px solid var(--line);background:#f7f8fa;padding:8px 10px 10px}
.modes{display:flex;gap:6px;margin-bottom:7px}
.mode{border:0;background:transparent;color:#6f7b90;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.mode.active{background:#fff;color:#27334a;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.mode.active.note-mode{background:var(--note);color:#7a5c0c}
.compose-row{display:flex;gap:8px;align-items:center}
.compose-row input{flex:1;min-width:0;height:42px;border-radius:21px;border:1px solid var(--line);padding:0 15px;background:#fff;outline:none}
.compose-row input:focus{border-color:#9fd7b9}
.composer.is-note .compose-row input{background:var(--note);border-color:var(--note-line)}
.send{width:42px;height:42px;border-radius:50%;border:0;background:var(--wa);color:#fff;font-size:16px;flex:none}
.composer.is-note .send{background:#c49a1c}
.empty-chat{flex:1;display:grid;place-items:center;text-align:center;color:#8994a6;padding:30px;background:#f7f8fa}

/* ---------- Info panel ---------- */
.info-inner{padding:16px}
.info-back{display:none;border:0;background:none;color:#4054d7;font-weight:700;font-size:13px;padding:0 0 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:12px}
.card h4{margin:0 0 9px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#7d899c;display:flex;justify-content:space-between;align-items:center}
.card h4 button{border:0;background:none;color:#4054d7;font-size:11px;font-weight:700;text-transform:none;letter-spacing:0}
.profile{display:flex;gap:11px;align-items:center}
.profile .av{width:48px;height:48px;font-size:14px;border-radius:14px}
.profile strong{display:block;font-size:15px}
.profile small{display:block;font-size:11px;color:#7b8798}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:4px 0;color:#5f6b80}
.kv b{color:#27334a;font-weight:650;text-align:right}
.money{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.money div{background:#f8f9fc;border-radius:10px;padding:9px 10px}
.money label{display:block;font-size:9px;font-weight:750;color:#7d899c;letter-spacing:.05em}
.money strong{display:block;font-size:16px;letter-spacing:-.02em;margin-top:2px}
.money .due{color:#b05a2a}.money .zero{color:#9aa4b4}.money .fav{color:var(--green)}
.row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #f0f2f6;font-size:12px}
.row:last-child{border-bottom:0}
.row small{display:block;font-size:10px;color:#8994a6}
.row .r{text-align:right;white-space:nowrap}
.r .due{color:#b05a2a;font-weight:700}.r .ok{color:var(--green);font-weight:700}
.log{list-style:none;margin:0;padding:0}
.log li{font-size:12px;padding:6px 0;border-bottom:1px solid #f0f2f6;color:#3d4a60}
.log li:last-child{border-bottom:0}
.log small{display:block;font-size:10px;color:#8994a6}
.warn{background:#fff8e6;border:1px solid #f3e2b3;color:#6b5113;border-radius:12px;padding:11px 12px;font-size:12px;margin-bottom:12px}
.warn button{margin-top:8px}
.legend{font-size:11px;color:#6f7b8e;display:grid;gap:6px}
.legend i{display:inline-block;width:22px;height:12px;border-radius:4px;vertical-align:middle;margin-right:7px}
.btn{border:0;border-radius:9px;padding:8px 12px;font-size:12px;font-weight:700}
.btn.primary{background:var(--blue);color:#fff}
.btn.wa{background:var(--wa);color:#fff}
.btn.ghost{background:#f1f3f7;color:#38445a}
.empty{font-size:12px;color:#97a1b2;text-align:center;padding:8px 0}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(18,26,43,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.overlay[hidden]{display:none}
.modal{background:#fff;border-radius:16px;width:100%;max-width:420px;max-height:90vh;overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .15s ease-out}
.modal h3{margin:0 0 3px;font-size:17px}
.mhint{font-size:12px;color:#7b8798;margin:0 0 14px}
.modal label{display:block;font-size:11px;font-weight:700;color:#5f6b80;margin-bottom:10px}
.modal input,.modal select,.modal textarea{display:block;width:100%;margin-top:4px;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 11px;background:#fbfcfe;font-size:14px;outline:none}
.modal textarea{height:70px;padding:9px 11px;resize:vertical}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:#aebcff;box-shadow:0 0 0 3px #eef1ff}
.modal .check{display:flex;gap:8px;align-items:center;font-weight:600}
.modal .check input{width:auto;height:auto;margin:0}
.mactions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.merr{color:var(--red);font-size:12px;margin:-4px 0 10px;min-height:0}
.stage-grid{display:grid;gap:7px}
.stage-opt{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;text-align:left;font-weight:650;display:flex;justify-content:space-between;align-items:center}
.stage-opt.cur{border-color:#9fb0ff;background:#f4f6ff}
.toast{position:fixed;top:66px;left:50%;transform:translate(-50%,-10px);padding:10px 14px;background:#172238;color:#fff;border-radius:11px;font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;z-index:50;box-shadow:0 8px 24px #17223844;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Responsive: una pantalla a la vez en móvil ---------- */
@media(max-width:1100px){.layout{grid-template-columns:290px minmax(0,1fr) 300px}}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .layout .pane{display:none}
  .layout[data-pane="list"] .list,.layout[data-pane="chat"] .chat,.layout[data-pane="info"] .info{display:flex}
  .back,.info-btn,.info-back{display:inline-block}
  .demo{display:none}
  .b{max-width:85%}
}
@media(max-width:420px){.brand small{display:none}.sim{padding:7px 10px;font-size:11px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="brand-mark">TV</div><div><b>Tuto CRM</b><small>Bandeja de WhatsApp · Tuttovinilos</small></div></div>

<div class="overlay" id="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

const nf = new Intl.NumberFormat("es-VE",{minimumFractionDigits:2,maximumFractionDigits:2});
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function money(v,acc){return (acc==="BS"?"Bs ":"$")+nf.format(Number(v)||0);}
function hm(d){return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function dayLabel(d){if(sameDay(d,clock))return "Hoy";const y=new Date(clock);y.setDate(y.getDate()-1);if(sameDay(d,y))return "Ayer";return d.getDate()+" "+MONTHS[d.getMonth()];}
function shortTime(d){return sameDay(d,clock)?hm(d):dayLabel(d);}
function isoLabel(iso){if(!iso)return "—";const p=iso.split("-");return +p[2]+" "+MONTHS[+p[1]-1];}
function initials(c){if(!c.name)return "?";return c.name.replace(/^Dra?\.\s*/,"").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();}
function displayName(c){return c.name||c.phone;}
function due(o){return Math.max(o.total-o.paid,0);}
function balance(c,acc){return c.orders.filter(o=>o.acc===acc).reduce((s,o)=>s+due(o),0);}
const activeChat = () => chats.find(c=>c.id===state.active);
const clientOf = ch => clients[ch.clientId];
const lastAt = ch => ch.msgs[ch.msgs.length-1].at;
function lastConv(ch){for(let i=ch.msgs.length-1;i>=0;i--){const m=ch.msgs[i];if(m.type==="in"||m.type==="out")return m;}return null;}
function stageChip(s){return '<span class="stage '+(STAGE_CLASS[s]||"")+'">'+esc(s)+'</span>';}
function toast(msg){const el=$("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),2600);}

/* Registro que crea el CRM al tocar un botón */
function logEvent(ch,icon,text,by){ch.msgs.push({type:"event",at:tick(),icon,text,by:by||ME});}
function sendOut(ch,text){ch.msgs.push({type:"out",at:tick(),text});}

/* ---------------- Render: lista ---------------- */
function renderList(){
  const list=chats.slice().sort((a,b)=>lastAt(b)-lastAt(a)).filter(ch=>{
    const c=clientOf(ch);
    if(state.filter==="unread")return ch.unread>0;
    if(state.filter==="balance")return balance(c,"USD")>0||balance(c,"BS")>0;
    if(state.filter==="new")return c.stage==="Cliente nuevo";
    return true;
  });
  const totalUnread=chats.reduce((s,c)=>s+c.unread,0);
  const f=[["all","Todos"],["unread","No leídos"],["new","Nuevos"],["balance","Con saldo"]];
  $("list").innerHTML='<div class="list-head"><h2>Chats '+(totalUnread?'<span class="badge-un">'+totalUnread+'</span>':"")+'</h2><div class="chips">'+
    f.map(x=>'<button class="chip '+(state.filter===x[0]?"active":"")+'" data-filter="'+x[0]+'">'+x[1]+'</button>').join("")+'</div></div>'+
    '<div class="list-body">'+(list.length?list.map(ch=>{
      const c=clientOf(ch),m=lastConv(ch);
      const prev=m?(m.type==="out"?"✓✓ ":"")+m.text:"";
      return '<button class="ci '+(ch.id===state.active?"active":"")+'" data-chat="'+ch.id+'"><span class="av '+(c.isNew?"new":"")+'">'+esc(initials(c))+'</span><span class="ci-main"><span class="ci-top"><strong>'+esc(displayName(c))+'</strong><time class="'+(ch.unread?"unread":"")+'">'+shortTime(lastAt(ch))+'</time></span><span class="ci-prev"><span>'+esc(prev)+'</span>'+(ch.unread?'<span class="badge-un">'+ch.unread+'</span>':"")+'</span>'+stageChip(c.stage)+'</span></button>';
    }).join(""):'<div class="empty" style="padding:24px">No hay chats con este filtro.</div>')+'</div>';
}

/* ---------------- Render: conversación ---------------- */
function renderChat(){
  const ch=activeChat();
  if(!ch){$("chat").innerHTML='<div class="empty-chat">Selecciona un chat</div>';return;}
  const c=clientOf(ch);
  let last=null;
  const body=ch.msgs.map(m=>{
    let sep="";
    if(!last||!sameDay(last,m.at)){sep='<div class="day"><span>'+dayLabel(m.at)+'</span></div>';}
    last=m.at;
    if(m.type==="in")return sep+'<div class="b in">'+(m.attach?'<div class="attach"><i>🖼</i>'+esc(m.attach)+'</div>':"")+esc(m.text)+'<time>'+hm(m.at)+'</time></div>';
    if(m.type==="out")return sep+'<div class="b out">'+esc(m.text)+'<time>'+hm(m.at)+' ✓✓</time></div>';
    if(m.type==="note")return sep+'<div class="note"><small>📝 Nota interna · '+esc(m.by)+' · '+hm(m.at)+' · el cliente no la ve</small>'+esc(m.text)+'</div>';
    return sep+'<div class="ev"><span>'+m.icon+' '+esc(m.text)+'<small>Registrado en Tuto CRM · '+esc(m.by)+' · '+hm(m.at)+'</small></span></div>';
  }).join("");
  const sug=ch.suggest?'<div class="suggest"><span>💡 Este mensaje parece un pago'+(ch.suggest.amount?' de <b>'+money(ch.suggest.amount,ch.suggest.acc)+'</b>':"")+'. ¿Lo registras?</span><button class="no" data-dismiss>Ignorar</button><button class="yes" data-open="pay">Registrar pago</button></div>':"";
  const note=state.mode==="note";
  $("chat").innerHTML=
    '<div class="chat-head"><button class="back" data-pane="list" aria-label="Volver">←</button><span class="av '+(c.isNew?"new":"")+'">'+esc(initials(c))+'</span><div class="who"><strong>'+esc(displayName(c))+'</strong><small>'+esc(c.company||"Contacto nuevo · sin ficha")+' · '+esc(c.phone)+'</small></div>'+stageChip(c.stage)+'<button class="info-btn" data-pane="info">Ficha ⓘ</button></div>'+
    '<div class="actions">'+
      '<button class="act" data-open="stage">🏷 Etapa</button>'+
      '<button class="act pay" data-open="pay">💵 Registrar pago</button>'+
      '<button class="act" data-open="quote">📄 Cotización</button>'+
      '<button class="act" data-open="order">📦 Pedido</button>'+
      '<button class="act" data-open="remind">⏰ Recordarme</button>'+
      '<button class="act" data-mode="note">📝 Nota interna</button>'+
    '</div>'+
    '<div class="msgs" id="msgs">'+body+'</div>'+sug+
    '<form class="composer '+(note?"is-note":"")+'" id="composer"><div class="modes"><button type="button" class="mode '+(!note?"active":"")+'" data-mode="reply">💬 Responder por WhatsApp</button><button type="button" class="mode note-mode '+(note?"active":"")+'" data-mode="note">📝 Nota interna</button></div>'+
    '<div class="compose-row"><input id="draft" autocomplete="off" placeholder="'+(note?"Nota solo para tu equipo…":"Escribe un mensaje…")+'" value="'+esc(state.draft)+'"><button class="send" aria-label="Enviar">'+(note?"✎":"➤")+'</button></div></form>';
  const box=$("msgs");box.scrollTop=box.scrollHeight;
}

/* ---------------- Mensajes entrantes simulados ---------------- */
function parsePayment(text){
  if(!/(\$|usd|bs\.?\s|zelle|pago m[oó]vil|transfer|abono|pagu[eé]|te hice)/i.test(text))return null;
  let acc="USD",amount=null,m;
  if((m=text.match(/(?:\$|usd\s?)\s?([\d.]+(?:,\d{1,2})?)/i)))amount=parseFloat(m[1].replace(/\./g,"").replace(",","."));
  else if((m=text.match(/bs\.?\s?([\d.]+(?:,\d{1,2})?)/i))){acc="BS";amount=parseFloat(m[1].replace(/\./g,"").replace(",","."));}
  const r=text.match(/ref\.?\s*:?\s*([A-Z0-9-]{4,})/i);
  const method=/zelle/i.test(text)?"Zelle":/m[oó]vil/i.test(text)?"Pago móvil":/efectivo/i.test(text)?"Efectivo USD":"Transferencia";
  return {acc,amount,ref:r?r[1]:"",method};
}
function simulate(){
  if(incomingIdx>=incoming.length){toast("No hay más mensajes simulados. Recarga la página para repetir.");return;}
  const inc=incoming[incomingIdx++];
  let c=Object.values(clients).find(x=>x.phone===inc.phone);
  let ch;
  if(!c){
    const id="c"+(newSeq++);
    c=clients[id]={id,name:"",company:"",phone:inc.phone,stage:"Cliente nuevo",owner:ME,next:null,credit:{USD:0,BS:0},orders:[],quotes:[],isNew:true};
    ch={id:"ch"+id,clientId:id,unread:0,suggest:null,msgs:[]};
    chats.push(ch);
    ch.msgs.push({type:"in",at:tick(),text:inc.text,attach:inc.attach});
    logEvent(ch,"✨","Número desconocido → contacto creado automáticamente · Etapa: Cliente nuevo","Tuto CRM (automático)");
  }else{
    ch=chats.find(x=>x.clientId===c.id);
    ch.msgs.push({type:"in",at:tick(),text:inc.text,attach:inc.attach});
  }
  ch.suggest=parsePayment(inc.text);
  const viewing=ch.id===state.active&&(state.pane!=="list"||window.innerWidth>900);
  if(!viewing)ch.unread++;
  toast("📲 Nuevo WhatsApp de "+displayName(c)+": "+inc.text.slice(0,48)+(inc.text.length>48?"…":""));
  renderAll();
}

}

      '<label>Moneda<select name="acc"><option value="USD">Divisa (USD)</option><option value="BS">BCV (Bs)</option></select></label>'+
      '<label>Monto<input name="amount" type="number" step="0.01" min="0.01" required></label>'+

function closeModal(){$("overlay").hidden=true;$("modal").innerHTML="";}
function err(msg){const e=$("merr");if(e)e.textContent=msg;}

function setStage(ch,stage,auto){
  const c=clientOf(ch);if(c.stage===stage)return;
  const prev=c.stage;c.stage=stage;
  if(!auto)logEvent(ch,"🏷","Etapa: "+prev+" → "+stage);
  return prev;
}
function submitModal(form){
  const ch=activeChat(),c=clientOf(ch),f=Object.fromEntries(new FormData(form).entries()),kind=form.dataset.kind;
  if(kind==="pay"){
    const amount=parseFloat(f.amount),acc=f.acc;
    if(!(amount>0))return err("Indica un monto válido.");
    let text="Pago registrado · "+money(amount,acc)+" · "+f.method+" · Ref. "+f.ref;
    if(f.order==="credit"){c.credit[acc]+=amount;text+=" → saldo a favor";}
    else{
      const o=c.orders.find(x=>x.id===f.order);
      if(!o||o.acc!==acc)return err("Ese pedido no está en la moneda elegida.");
      const apply=Math.min(amount,due(o)),rest=amount-apply;
      o.paid+=apply;text+=" → "+o.id+" ("+money(apply,acc)+")";
      if(rest>0){
        // si sobra, se aplica a otros pedidos pendientes de la misma moneda antes de dejar crédito
        let left=rest;
        c.orders.filter(x=>x.acc===acc&&due(x)>0&&x!==o).forEach(x=>{if(left<=0)return;const a=Math.min(left,due(x));x.paid+=a;left-=a;text+=" + "+x.id+" ("+money(a,acc)+")";});
        if(left>0){c.credit[acc]+=left;text+=" · a favor "+money(left,acc);}
      }
    }
    logEvent(ch,"💵",text);
    if(f.confirm)sendOut(ch,"✅ Recibimos su pago de "+money(amount,acc)+" (Ref. "+f.ref+"). ¡Gracias!");
    ch.suggest=null;closeModal();renderAll();toast("Pago guardado en la cuenta del cliente");return;
  }
  if(kind==="quote"){
    const amount=parseFloat(f.amount);if(!(amount>0))return err("Indica un monto válido.");
    c.quotes.unshift({id:f.id,name:f.name,acc:f.acc,amount,status:f.send?"Enviada":"En preparación"});quoteSeq++;
    if(f.send){sendOut(ch,"📄 Cotización "+f.id+" · "+f.name+" · "+money(amount,f.acc)+". Quedamos atentos a sus comentarios.");}
    const prev=f.send?setStage(ch,"Cotización enviada",true):null;
    logEvent(ch,"📄","Cotización "+f.id+" "+(f.send?"enviada":"creada")+" · "+money(amount,f.acc)+(prev?" · Etapa: "+prev+" → Cotización enviada":""));
    closeModal();renderAll();toast("Cotización guardada");return;
  }
  if(kind==="order"){
    const total=parseFloat(f.total);if(!(total>0))return err("Indica un total válido.");
    c.orders.unshift({id:f.id,name:f.name,acc:f.acc,total,paid:0});orderSeq++;
    const prev=setStage(ch,"Ganada",true);
    logEvent(ch,"📦","Pedido "+f.id+" creado · "+f.name+" · "+money(total,f.acc)+(prev?" · Etapa: "+prev+" → Ganada":""));
    closeModal();renderAll();toast("Pedido creado y vinculado al cliente");return;
  }
  if(kind==="remind"){
    c.next=f.date;logEvent(ch,"⏰","Recordatorio "+isoLabel(f.date)+": "+f.text);
    closeModal();renderAll();toast("Recordatorio guardado");return;
  }
  if(kind==="profile"){
    c.name=f.name.trim();c.company=f.company.trim();c.owner=f.owner;c.isNew=false;
    logEvent(ch,"🗂","Ficha completada · "+c.name+(c.company?" · "+c.company:"")+" · Responsable: "+c.owner);
    closeModal();renderAll();toast("Ficha guardada");return;
  }
}

/* ---------------- Eventos ---------------- */
document.addEventListener("click",e=>{
  if(e.target.id==="overlay"){closeModal();return;}
  const t=e.target.closest("button");if(!t)return;
  const d=t.dataset;
  if(t.id==="simBtn"){simulate();return;}
  if(d.close!==undefined){closeModal();return;}
  if(d.filter){state.filter=d.filter;renderList();return;}
  if(d.chat){
    if(state.active!==d.chat){state.draft="";state.mode="reply";}
    state.active=d.chat;state.pane="chat";
    const ch=activeChat();ch.unread=0;renderAll();return;
  }
  if(d.pane){state.pane=d.pane;$("layout").dataset.pane=state.pane;if(d.pane==="chat"){const b=$("msgs");if(b)b.scrollTop=b.scrollHeight;}return;}
  if(d.mode){state.mode=d.mode;renderChat();const i=$("draft");if(i)i.focus();return;}
  if(d.open){openModal(d.open);return;}
  if(d.dismiss!==undefined){activeChat().suggest=null;renderChat();return;}
  if(d.stage){setStage(activeChat(),d.stage);closeModal();renderAll();toast("Etapa actualizada");return;}
});
document.addEventListener("input",e=>{if(e.target.id==="draft")state.draft=e.target.value;});
document.addEventListener("change",e=>{
  if(e.target.id==="payAcc"){const c=clientOf(activeChat());$("payOrder").innerHTML=orderOptions(c,e.target.value);}
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="composer"){
    const text=state.draft.trim();if(!text)return;
    const ch=activeChat();
    if(state.mode==="note")ch.msgs.push({type:"note",at:tick(),text,by:ME});
    else sendOut(ch,text);
    state.draft="";renderAll();const i=$("draft");if(i)i.focus();
    if(state.mode==="reply")toast("Mensaje simulado: no se envió a WhatsApp");
    return;
  }
  if(e.target.id==="mform")submitModal(e.target);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("overlay").hidden)closeModal();});

/* En escritorio se abre directo el primer chat */
if(window.innerWidth>900)state.pane="chat";
renderAll();
setTimeout(()=>toast("Toca «📲 Simular mensaje» para recibir un WhatsApp"),600);
</script>
</body>
</html>
