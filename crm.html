<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121a2b">
<title>CRM · Tuttovinilos</title>
<style>
:root{
  --bg:#f5f7fb;--panel:#fff;--ink:#162033;--muted:#748096;--line:#e8ecf3;
  --blue:#2947e8;--blue-bg:#eef2ff;--nav:#121a2b;--nav-muted:#9aa6bc;
  --green:#17845b;--green-bg:#eaf7f0;--amber:#a76512;--amber-bg:#fff4df;
  --red:#b64343;--red-bg:#fff0ef;--purple:#6f55cb;--purple-bg:#f1efff;--gray-bg:#f1f3f7;
  --wa:#1f8f5f;--wa-bg:#e7f6ee;--shadow:0 7px 24px rgba(24,39,75,.055);--r:14px;
  --font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- Sidebar ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:232px;background:var(--nav);color:#fff;padding:22px 14px 16px;display:flex;flex-direction:column;z-index:5;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 20px}
.brand-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,#6e86ff,#2947e8);display:grid;place-items:center;font-weight:900;font-size:12px;box-shadow:0 5px 16px rgba(41,71,232,.32);flex:none}
.brand-name{font-weight:750;font-size:15px;letter-spacing:-.02em}
.brand-sub{font-size:10px;color:#9ca9bf;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.nav-label{font-size:10px;color:#73819a;letter-spacing:.11em;text-transform:uppercase;padding:0 10px;margin:12px 0 6px}
.nav{display:grid;gap:3px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;border:0;background:none;color:var(--nav-muted);font-size:13px;font-weight:560;text-align:left;width:100%;white-space:nowrap}
.nav-item:hover{background:#1b263a;color:#fff}
.nav-item.active{background:#263653;color:#fff;box-shadow:inset 3px 0 #8498ff}
.nav-icon{width:18px;text-align:center;flex:none}
.nav-count{margin-left:auto;background:#35435c;color:#cbd5e1;border-radius:20px;padding:1px 7px;font-size:10px;font-weight:700}
.nav-count.wa{background:var(--wa);color:#fff}
.sidebar-bottom{margin-top:auto;border-top:1px solid #293247;padding:14px 8px 0}
.account-user{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#35466a;color:#e5ebff;font-size:11px;font-weight:800}
.user-name{font-size:12px;font-weight:650}
.user-role{font-size:10px;color:#8e9bb2}
.local-chip{margin-top:12px;border:1px solid #344056;color:#acb8ca;border-radius:8px;padding:7px 9px;font-size:10px;display:flex;align-items:center;gap:7px}
.local-dot{width:7px;height:7px;background:#7bd6a8;border-radius:50%}

/* ---------- Main ---------- */
.main{margin-left:232px;min-height:100vh}
.topbar{height:58px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.82);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:4;backdrop-filter:blur(10px);gap:12px}
.breadcrumb{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.breadcrumb strong{color:#39445a}
.top-right{display:flex;align-items:center;gap:10px}
.demo-pill{font-size:10px;letter-spacing:.06em;font-weight:750;color:#6a56b5;background:#f0edff;border:1px solid #e4ddff;border-radius:30px;padding:5px 10px;text-transform:uppercase;white-space:nowrap}
.today-pill{font-size:11px;color:#56627a;background:#fff;border:1px solid var(--line);border-radius:30px;padding:5px 10px;white-space:nowrap}
main.content{max-width:1500px;margin:auto;padding:26px 30px 40px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#8290a6;font-weight:750;margin-bottom:5px}
h1{font-size:25px;line-height:1.2;letter-spacing:-.04em;margin:0;font-weight:760}
.subtitle{color:var(--muted);font-size:13px;margin:6px 0 0}
.primary-btn,.secondary-btn,.wa-btn{border:0;border-radius:10px;padding:9px 13px;font-weight:680;font-size:12px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.primary-btn{background:var(--blue);color:#fff;box-shadow:0 5px 12px rgba(41,71,232,.18)}
.primary-btn:hover{background:#1e3bd3}
.secondary-btn{background:#fff;color:#38445a;border:1px solid var(--line)}
.wa-btn{background:var(--wa-bg);color:var(--wa);border:1px solid #cfeadb}
.link{border:0;background:none;color:#4054d7;font-size:11px;font-weight:700;padding:0}
.footer-note{font-size:10px;color:#9aa4b4;text-align:center;margin-top:22px}

/* ---------- Generic ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0;overflow:hidden}
.card-head{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-head h3{font-size:13px;margin:0;letter-spacing:-.01em}
.card-head span{font-size:10px;color:#8b96a7}
.card-body{padding:12px 15px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:11px;margin-bottom:16px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 14px;box-shadow:var(--shadow);min-width:0}
.kpi-head{display:flex;align-items:center;justify-content:space-between;color:#7d899c;font-size:9px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;gap:6px}
.kpi-icon{width:24px;height:24px;display:grid;place-items:center;border-radius:8px;background:#eff2ff;color:#5267de;font-size:11px;flex:none}
.kpi-value{font-size:20px;font-weight:760;letter-spacing:-.04em;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-foot{font-size:10px;color:#8994a5;margin-top:2px}
.badge{display:inline-flex;align-items:center;padding:3px 7px;border-radius:20px;font-size:9px;font-weight:750;white-space:nowrap}
.badge.blue{background:var(--blue-bg);color:#4558c8}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.amber{background:var(--amber-bg);color:var(--amber)}
.badge.red{background:var(--red-bg);color:var(--red)}
.badge.purple{background:var(--purple-bg);color:var(--purple)}
.badge.gray{background:var(--gray-bg);color:#5f6b80}
.empty{padding:20px 12px;text-align:center;color:#8994a6;font-size:12px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid transparent;background:transparent;color:#6f7b90;padding:5px 9px;border-radius:7px;font-size:11px;font-weight:650}
.chip:hover{background:#f2f4f9}
.chip.active{color:#3348c8;background:#eef1ff;border-color:#dfe5ff}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.search-wrap{position:relative}
.search-icon{position:absolute;left:11px;top:8px;color:#8c97a9;font-size:14px}
.search-input{height:35px;width:100%;border-radius:9px;border:1px solid #e3e8f0;padding:0 10px 0 32px;outline:none;background:#fbfcfe;font-size:12px}
.search-input:focus{border-color:#aebcff;box-shadow:0 0 0 3px #eef1ff}
.toolbar .search-wrap{width:260px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.table-wrap.flat{border:0;border-radius:0}
table{border-collapse:collapse;width:100%;min-width:680px}
th{text-align:left;font-size:9px;color:#8893a5;background:#fafbfe;text-transform:uppercase;letter-spacing:.06em;padding:10px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
td{font-size:12px;padding:10px 11px;border-bottom:1px solid #f0f2f6;color:#56637a;vertical-align:top}
tr:last-child td{border-bottom:0}
td strong{color:#27334a}
th.r,td.r{text-align:right;white-space:nowrap}
tfoot td{background:#fafbfe;font-weight:700;color:#27334a;border-top:1px solid var(--line)}
.sub{display:block;font-size:10px;color:#8994a6;margin-top:2px}
.money-in{color:var(--green)!important;font-weight:700}
.money-out{color:#a65d35!important;font-weight:700}
.due{color:#b05a2a;font-weight:700}
.ok-text{color:var(--green);font-weight:700}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);padding:11px 15px;background:#172238;color:#fff;border-radius:10px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:30;box-shadow:0 8px 24px #17223833;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Dashboard pieces ---------- */
.funnel-row{display:grid;grid-template-columns:150px 1fr 130px;gap:10px;align-items:center;padding:6px 0;font-size:11px}
.funnel-label{color:#4d5a70;font-weight:600}
.funnel-bar{height:8px;background:#eef0f5;border-radius:9px;overflow:hidden}
.funnel-bar i{display:block;height:100%;background:#6b7ded;border-radius:9px}
.funnel-bar i.won{background:#3aa173}.funnel-bar i.lost{background:#d27d7d}
.funnel-val{text-align:right;color:#56637a;white-space:nowrap}
.row-btn{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;text-align:left;padding:9px 6px;border-radius:9px;border-bottom:1px solid #f1f3f6}
.row-btn:last-child{border-bottom:0}
.row-btn:hover{background:#f7f8fc}
.date-chip{flex:none;width:42px;text-align:center;border:1px solid var(--line);border-radius:9px;padding:4px 0;font-size:9px;color:#7d899b;text-transform:uppercase;line-height:1.2}
.date-chip b{display:block;font-size:15px;color:#27334a}
.row-main{flex:1;min-width:0}
.row-main strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main small{display:block;font-size:10px;color:#8994a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-side{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.row-side small{font-size:10px;color:#8994a6}
.checks,.issues{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:12px;color:#4d5a70}
.checks{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.checks li{display:flex;gap:8px;align-items:center}
.ok{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#e2f3e9;color:#278257;font-weight:800;font-size:10px;flex:none}
.ok.bad{background:var(--red-bg);color:var(--red)}
.issues{margin-top:12px;color:var(--red)}

/* ---------- Timeline ---------- */
.timeline{position:relative;margin:2px 0 0 8px;padding-left:20px;border-left:1px solid #e6eaf2}
.tl-item{position:relative;padding:0 0 15px 4px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-25px;top:3px;width:9px;height:9px;border-radius:50%;background:#7184ed;border:2px solid #fff;box-shadow:0 0 0 1px #dce2ff}
.tl-dot.payment{background:#48a879;box-shadow:0 0 0 1px #d6efe0}
.tl-dot.quote{background:#9a84e6;box-shadow:0 0 0 1px #e6defc}
.tl-dot.whatsapp{background:#25b36b;box-shadow:0 0 0 1px #cdeedb}
.tl-date{font-size:10px;color:#8792a4}
.tl-title{font-size:12px;font-weight:700;margin-top:2px}
.tl-detail{font-size:11px;color:#7b8798;margin-top:2px}

/* ---------- Clientes ---------- */
.crm-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.client-panel,.detail-panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.client-panel{overflow:hidden;position:sticky;top:74px}
.client-panel-head{padding:16px 15px 12px;border-bottom:1px solid var(--line)}
.client-panel-title{display:flex;justify-content:space-between;align-items:center}
.client-panel-title h2{font-size:14px;margin:0}
.pill{font-size:10px;color:#738096;background:#f2f4f8;border-radius:20px;padding:3px 8px}
.client-panel .search-wrap{margin:12px 0 10px}
.client-list{padding:6px;max-height:calc(100vh - 260px);overflow:auto}
.client-row{width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:10px;display:flex;gap:10px;align-items:flex-start}
.client-row:hover{background:#f7f8fc}
.client-row.selected{background:#f0f3ff;box-shadow:inset 2px 0 #4058eb}
.client-avatar{flex:none;width:34px;height:34px;border-radius:10px;background:#edf0f7;color:#58657c;display:grid;place-items:center;font-size:10px;font-weight:800}
.client-row.selected .client-avatar{background:#dce4ff;color:#3b51d4}
.client-info{min-width:0;flex:1}
.client-name{display:block;font-size:12px;font-weight:700;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.client-meta{display:block;color:#8994a6;font-size:10px;margin-top:2px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.client-meta.hit{color:#4054d7;font-weight:650}
.client-side{text-align:right;flex:none;max-width:110px}
.client-balance{display:block;font-size:10px;font-weight:750;white-space:nowrap}
.client-balance.due{color:#b05a2a}.client-balance.credit{color:var(--green)}.client-balance.ok{color:#8691a4;font-weight:600}
.client-state{display:block;font-size:9px;margin-top:3px;color:#8691a4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-panel{padding:18px 20px 20px;min-width:0}
.profile-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding-bottom:15px;border-bottom:1px solid var(--line)}
.profile-main{display:flex;gap:13px;align-items:center;min-width:0}
.profile-avatar{width:50px;height:50px;border-radius:15px;background:linear-gradient(145deg,#e8edff,#d7e0ff);color:#3b50cc;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.profile-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.profile-name h2{font-size:18px;letter-spacing:-.03em;margin:0}
.profile-sub{font-size:11px;color:#7b879a;margin-top:3px}
.profile-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.profile-actions button{padding:8px 10px;font-size:11px}
.profile-meta{display:flex;gap:8px 18px;flex-wrap:wrap;padding:12px 0;color:#6f7b8e;font-size:11px;border-bottom:1px solid var(--line)}
.profile-meta b{color:#364158;font-weight:650}
.opp-strip{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr .9fr 1.2fr;gap:9px;padding:11px 13px;margin-top:12px;background:#fafbff;border:1px solid #e9ecf7;border-radius:11px}
.opp-field{min-width:0}
.opp-field label{display:block;color:#929caf;font-size:9px;text-transform:uppercase;letter-spacing:.06em;font-weight:750;margin-bottom:3px}
.opp-field strong{display:block;color:#38445a;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prob{display:flex;align-items:center;gap:6px;font-size:10px;color:#69768b}
.prob-bar{height:5px;border-radius:9px;background:#e7eaf2;flex:1;min-width:24px;overflow:hidden}
.prob-bar i{height:100%;display:block;background:#6b7ded}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:4px 0 16px;overflow:auto}
.tab{border:0;background:none;color:#7b8798;padding:12px 1px 10px;font-size:12px;font-weight:680;white-space:nowrap;position:relative}
.tab.active{color:#3047d2}
.tab.active:after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:2px;border-radius:2px;background:#4058eb}
.account-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.account-card{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 13px;min-width:0}
.account-card.primary{background:#f8f9ff;border-color:#e6eaff}
.account-top{display:flex;justify-content:space-between;align-items:center;color:#68758b;font-size:10px;font-weight:700}
.account-value{font-size:20px;font-weight:760;letter-spacing:-.04em;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.account-value .minor{font-size:12px;letter-spacing:0;color:#7a8799;font-weight:600}
.account-card.credit .account-value{color:var(--green)}
.account-caption{font-size:10px;color:#8994a5;margin-top:3px}
.split-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:12px;align-items:start}
.subcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;min-width:0}
.subcard-head{padding:11px 13px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:#fbfcfe}
.subcard-head h3{font-size:12px;margin:0}
.subcard-head span{font-size:10px;color:#8b96a7;text-align:right}
.pad{padding:0 12px}
.item{padding:11px 0;border-bottom:1px solid #f0f2f6}
.item:last-child{border-bottom:0}
.item-line{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item-title{font-size:12px;font-weight:720}
.item-id{font-size:10px;color:#8792a4;margin-left:5px;font-weight:550}
.item-sub{font-size:10px;color:#7d899b;margin-top:2px}
.item-right{text-align:right;white-space:nowrap}
.item-right strong{font-size:12px}
.item-right small{display:block;font-size:10px;color:#8d98a8;margin-top:2px}
.breakdown{margin-top:8px;padding:7px 9px;background:#f8f9fc;border-radius:8px}
.break-row{display:flex;justify-content:space-between;gap:10px;font-size:10px;color:#69768b;padding:1px 0}
.break-row strong{color:#374258}
.break-row.credit strong{color:var(--green)}
.ledger{margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ledger-summary{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.ledger-account{padding:11px 14px;font-size:11px;color:#4d5a70}
.ledger-account+.ledger-account{border-left:1px solid var(--line)}
.ledger-label{font-size:9px;color:#7d899b;font-weight:750;margin-bottom:4px;letter-spacing:.04em}
.minus{color:#bb6334}.plus{color:#248257}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.contact-box{padding:14px;border:1px solid var(--line);border-radius:12px}
.contact-box h3{font-size:12px;margin:0 0 8px}
.contact-field{margin-top:8px}
.contact-field label{display:block;color:#8994a6;font-size:10px}
.contact-field span{font-size:12px;color:#354157;font-weight:600}
.person{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid #f0f2f6}
.person:last-child{border-bottom:0}
.initial{width:30px;height:30px;flex:none;border-radius:9px;background:#edf1ff;color:#5669d5;display:grid;place-items:center;font-size:10px;font-weight:800}
.person strong{display:block;font-size:12px}
.person small{display:block;color:#8490a2;font-size:10px;margin-top:1px;overflow-wrap:anywhere}
.note-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#fafbfe;border:1px solid var(--line);color:#5f6b80;font-size:12px}

/* ---------- Kanban ---------- */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:11px;overflow-x:auto;padding-bottom:8px}
.kcol{background:#eef1f6;border-radius:13px;padding:10px;min-height:200px}
.kcol-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:750;color:#37435a}
.kcol-head b{background:#fff;border-radius:20px;padding:1px 8px;font-size:10px;color:#5d6a80}
.kcol-sum{font-size:10px;color:#7d899b;margin:2px 0 9px}
.kcard{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:8px;box-shadow:0 2px 6px rgba(24,39,75,.04)}
.kcard:hover{border-color:#c9d2ff}
.kcard .kc-client{font-size:12px;font-weight:720}
.kcard .kc-title{font-size:11px;color:#6f7b8e;margin-top:2px}
.kcard .kc-amount{font-size:15px;font-weight:760;margin:7px 0 5px;letter-spacing:-.03em}
.kcard .kc-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:8px;font-size:10px;color:#7d899b}

/* ---------------- Utilidades ---------------- */
const $ = id => document.getElementById(id);
const sum = (arr,f) => arr.reduce((s,x)=>s+f(x),0);
const nf = new Intl.NumberFormat("es-VE",{minimumFractionDigits:2,maximumFractionDigits:2});
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function money(v,acc){return (acc==="BS"?"Bs ":"$")+nf.format(Number(v)||0);}
function accName(acc){return acc==="BS"?"BCV":"DIVISA";}
function fd(iso){if(!iso)return "—";const p=iso.slice(0,10).split("-");return p[2]+" "+MONTHS[+p[1]-1]+" "+p[0];}
function fdt(iso){return fd(iso)+(iso&&iso.length>10?" · "+iso.slice(11,16):"");}
function daysFrom(iso){return Math.round((new Date(iso.slice(0,10)+"T00:00:00")-new Date(TODAY+"T00:00:00"))/86400000);}
function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
const client = id => clients.find(c=>c.id===Number(id));
const primary = c => c.contacts.find(x=>x.primary)||c.contacts[0];
const byDesc = key => (a,b)=>String(b[key]).localeCompare(String(a[key]));
function empty(t){return '<div class="empty">'+esc(t)+'</div>';}

function paidOf(o){return sum(payments,p=>sum(p.allocations.filter(a=>a[0]===o.id),a=>a[1]));}
function dueOf(o){return Math.max(o.total-paidOf(o),0);}
function appliedOf(p){return sum(p.allocations,a=>a[1]);}
function creditOf(p){return Math.max(p.received-appliedOf(p),0);}

/* Cuenta de un cliente en UNA moneda. Nunca se convierten ni se mezclan. */
function account(cid,acc){
  const os=orders.filter(o=>o.clientId===cid&&o.account===acc);
  const ps=payments.filter(p=>p.clientId===cid&&p.account===acc);
  const issued=sum(os,o=>o.total), applied=sum(os,paidOf), credit=sum(ps,creditOf);
  const open=issued-applied;
  return {issued,applied,open,credit,net:open-credit,orders:os.length,payments:ps.length};
}
function netLabel(a,acc){return a.net>=0?money(a.net,acc):"a favor "+money(-a.net,acc);}

function kpis(){
  const open=opportunities.filter(o=>OPEN_STAGES.includes(o.stage));
  let usd=0,bs=0,withBal=0,credUsd=0,credBs=0;
  clients.forEach(c=>{
    const u=account(c.id,"USD"),b=account(c.id,"BS");
    if(u.net>0)usd+=u.net; if(b.net>0)bs+=b.net;
    if(u.net<0)credUsd+=-u.net; if(b.net<0)credBs+=-b.net;
    if(u.net>0||b.net>0)withBal++;
  });
  return {
    openCount:open.length,
    pipeline:sum(open,o=>o.amount),
    weighted:sum(open,o=>o.amount*o.probability/100),
    usd,bs,withBal,credUsd,credBs,
    active:orders.filter(o=>o.status!=="Entregado").length,
    fups:followItems().filter(o=>daysFrom(o.next)<=7).length
  };
}

/* Controles de integridad (lo que debería validar la base real) */
const CHECKS=[
  {code:"dup",label:"Identificadores de pedido únicos"},
  {code:"over_payment",label:"Ningún pago distribuye más de lo recibido"},
  {code:"over_order",label:"Ningún pedido recibe más que su total"},
  {code:"mix",label:"Pagos y pedidos en la misma moneda y cliente"},
  {code:"credit",label:"Saldo a favor solo si no hay pedidos pendientes"}
];
function audit(){
  const out=[],seen={};
  orders.forEach(o=>{
    if(seen[o.id])out.push({code:"dup",msg:"ID de pedido duplicado: "+o.id});
    seen[o.id]=1;
    if(paidOf(o)>o.total)out.push({code:"over_order",msg:o.id+" tiene abonos mayores a su total"});
  });
  payments.forEach(p=>{
    if(appliedOf(p)>p.received)out.push({code:"over_payment",msg:p.id+" distribuye más de lo recibido"});
    p.allocations.forEach(a=>{
      const o=orders.find(x=>x.id===a[0]);
      if(!o)out.push({code:"mix",msg:p.id+" apunta a un pedido inexistente ("+a[0]+")"});
      else{
        if(o.account!==p.account)out.push({code:"mix",msg:p.id+" mezcla monedas con "+o.id});
        if(o.clientId!==p.clientId)out.push({code:"mix",msg:p.id+" está aplicado a un pedido de otro cliente"});
      }
    });
  });
  clients.forEach(c=>["USD","BS"].forEach(acc=>{
    const a=account(c.id,acc);
    if(a.credit>0&&a.open>0)out.push({code:"credit",msg:c.name+": "+money(a.credit,acc)+" a favor sin aplicar mientras hay pedidos pendientes"});
  }));
  return out;
}

function followItems(){return opportunities.filter(o=>o.next&&o.stage!=="Perdida").sort((a,b)=>a.next.localeCompare(b.next));}
function mainOpp(cid){
  const os=opportunities.filter(o=>o.clientId===cid);
  return os.filter(o=>OPEN_STAGES.includes(o.stage)).sort((a,b)=>a.next.localeCompare(b.next))[0]||os.filter(o=>o.stage==="Ganada")[0]||os[0];
}

function clientMatch(c,q){
  if(!q)return {ok:true};
  const nq=norm(q);
  const base=norm([c.name,c.rif,c.rif.replace(/-/g,""),c.phone,c.email,c.address].join(" "));
  if(base.includes(nq))return {ok:true};
  const hit=c.contacts.find(x=>norm([x.name,x.role,x.phone,x.email].join(" ")).includes(nq));
  return hit?{ok:true,via:hit.name}:{ok:false};
}
function filterOk(c){
  const u=account(c.id,"USD"),b=account(c.id,"BS");
  switch(state.cfilter){
    case "balance":return u.net>0||b.net>0;
    case "opportunity":return opportunities.some(o=>o.clientId===c.id&&OPEN_STAGES.includes(o.stage));
    case "prospect":return c.relation==="Prospecto";
    case "credit":return u.net<0||b.net<0;
    default:return true;
  }
}
function balanceLabel(c){
  const u=account(c.id,"USD"),b=account(c.id,"BS"),parts=[];
  if(u.net>0)parts.push(money(u.net,"USD"));
  if(b.net>0)parts.push(money(b.net,"BS"));
  if(parts.length)return {text:parts.join(" · "),cls:"due"};
  if(u.net<0)return {text:"A favor "+money(-u.net,"USD"),cls:"credit"};
  if(b.net<0)return {text:"A favor "+money(-b.net,"BS"),cls:"credit"};
  return {text:"Al día",cls:"ok"};
}

/* ---------- WhatsApp ---------- */
function windowInfo(chat){
  const ins=chat.messages.filter(m=>m.dir==="in");
  if(!ins.length)return {open:false,left:0};
  const hrs=(clock-new Date(ins[ins.length-1].at))/3600000;
  return {open:hrs<24,left:Math.max(0,24-hrs)};
}
function timeShort(iso){return iso.slice(0,10)===TODAY?iso.slice(11,16):fd(iso).slice(0,6);}
function vWhatsApp(){
  const list=chats.slice().sort((a,b)=>b.messages[b.messages.length-1].at.localeCompare(a.messages[a.messages.length-1].at));
  const chat=chats.find(c=>c.id===state.chatId)||list[0];
  const c=client(chat.clientId),w=windowInfo(chat),o=mainOpp(c.id),bal=balanceLabel(c);
  let last="";
  const msgs=chat.messages.map(m=>{
    const day=m.at.slice(0,10);let sep="";
    if(day!==last){last=day;sep='<div class="day-sep"><span>'+(day===TODAY?"Hoy":fd(day))+'</span></div>';}
    return sep+'<div class="bubble '+m.dir+'">'+(m.template?'<span class="tpl">Plantilla · '+esc(m.template)+'</span>':"")+esc(m.text)+'<time>'+m.at.slice(11,16)+(m.dir==="out"?" ✓✓":"")+'</time></div>';
  }).join("");
  const composer=w.open
    ? '<div class="quick"><button type="button" data-quick="Gracias, quedamos atentos.">Gracias, quedamos atentos</button><button type="button" data-quick="¿Le parece si coordinamos una visita para tomar medidas?">Coordinar visita</button><button type="button" data-quick="Le comparto la cotización actualizada en un momento.">Cotización actualizada</button></div>'+
      '<form class="wa-compose" id="waForm"><input id="waInput" placeholder="Escribe un mensaje (simulado)" autocomplete="off"><button class="send" aria-label="Enviar">➤</button></form>'
    : '<div class="wa-hint">Ventana de 24 h cerrada: solo se pueden enviar plantillas aprobadas hasta que el cliente responda.</div>'+
      '<form class="wa-compose" id="waForm"><select id="waTemplate">'+templates.map(t=>'<option value="'+t.id+'">'+esc(t.label)+'</option>').join("")+'</select><button class="send" aria-label="Enviar plantilla">➤</button></form>';
  return head("Mensajería","WhatsApp","Bandeja de muestra enlazada a la ficha del cliente. No está conectada a WhatsApp y no envía mensajes.")+
  '<div class="wa"><aside class="wa-list"><div class="wa-list-head">Chats <span class="pill">'+chats.length+'</span></div>'+
  list.map(ch=>{const lm=ch.messages[ch.messages.length-1];const cc=client(ch.clientId);return '<button class="wa-item '+(ch.id===chat.id?"active":"")+'" data-chat="'+ch.id+'"><span class="wa-avatar">'+esc(cc.initials)+'</span><span class="wa-info"><strong>'+esc(ch.contact)+'</strong><small>'+(lm.dir==="out"?"Tú: ":"")+esc(lm.text)+'</small></span><span class="wa-meta">'+timeShort(lm.at)+(ch.unread?'<span class="wa-unread">'+ch.unread+'</span>':"")+'</span></button>';}).join("")+
  '</aside><section class="wa-conv"><div class="wa-head"><div class="wa-head-main"><span class="wa-avatar">'+esc(c.initials)+'</span><div><strong>'+esc(chat.contact)+'</strong><small>'+esc(chat.phone)+' · '+clientLink(c.id)+'</small></div></div><span class="window '+(w.open?"open":"closed")+'">'+(w.open?"Ventana abierta · "+Math.floor(w.left)+" h":"Ventana cerrada")+'</span></div>'+
  '<div class="wa-context"><span><b>Etapa</b> '+esc(o?o.stage:"—")+'</span><span><b>Cotización</b> '+esc(o?o.quote:"—")+'</span><span><b>Seguimiento</b> '+(o&&o.next?fd(o.next):"—")+'</span><span><b>Saldo</b> '+bal.text+'</span></div>'+
  '<div class="wa-msgs" id="waMsgs">'+msgs+'</div>'+composer+'</section></div>'+FOOT;
}
function fillTemplate(t,chat){
  const c=client(chat.clientId),o=mainOpp(c.id),u=account(c.id,"USD"),b=account(c.id,"BS");
  const saldo=[u.net>0?money(u.net,"USD"):"",b.net>0?money(b.net,"BS"):""].filter(Boolean).join(" y ")||money(0,"USD");
  return t.text.replace("{nombre}",chat.contact.replace(/^Dra?\.\s*/,"").split(" ")[0]).replace("{cotizacion}",o?o.quote:"").replace("{saldo}",saldo);
}
function tick(){clock=new Date(clock.getTime()+60000);const p=n=>String(n).padStart(2,"0");return clock.getFullYear()+"-"+p(clock.getMonth()+1)+"-"+p(clock.getDate())+"T"+p(clock.getHours())+":"+p(clock.getMinutes());}
function sendMessage(){
  const chat=chats.find(c=>c.id===state.chatId);if(!chat)return;
  const w=windowInfo(chat);let text,tpl=null;
  if(w.open){const inp=$("waInput");text=inp.value.trim();if(!text)return;}
  else{const t=templates.find(x=>x.id===$("waTemplate").value);text=fillTemplate(t,chat);tpl=t.label;}
  const at=tick();
  chat.messages.push({dir:"out",at,text,template:tpl});
  history.push({clientId:chat.clientId,at,kind:"whatsapp",title:"WhatsApp enviado a "+chat.contact+" (simulado)",detail:(tpl?"Plantilla "+tpl+": ":"")+text});
  render();
  toast("Mensaje simulado: queda solo mientras la página esté abierta.");
}

/* ---------- Seguimientos ---------- */
function vFollow(){
  const items=followItems();
  const groups=[["Vencidos",o=>daysFrom(o.next)<0],["Hoy",o=>daysFrom(o.next)===0],["Próximos 7 días",o=>{const n=daysFrom(o.next);return n>0&&n<=7;}],["Más adelante",o=>daysFrom(o.next)>7]];
  return head("Agenda comercial","Seguimientos","Próximas fechas de contacto por oportunidad, ordenadas por urgencia.")+
  '<div class="grid-2">'+groups.map(g=>{const xs=items.filter(g[1]);return '<section class="card"><div class="card-head"><h3>'+g[0]+'</h3><span>'+xs.length+'</span></div><div class="card-body">'+(xs.length?xs.map(followRow).join(""):empty("Nada pendiente."))+'</div></section>';}).join("")+'</div>'+
  '<section class="card"><div class="card-head"><h3>Cotizaciones por vencer</h3><span>enviadas o en seguimiento</span></div><div class="card-body">'+
  (quotes.filter(q=>q.valid&&(q.status==="Enviada"||q.status==="En seguimiento")).sort((a,b)=>a.valid.localeCompare(b.valid)).map(q=>'<button class="row-btn" data-client="'+q.clientId+'"><span class="date-chip"><b>'+q.valid.slice(8)+'</b>'+MONTHS[+q.valid.slice(5,7)-1]+'</span><span class="row-main"><strong>'+esc(q.number)+' · '+esc(client(q.clientId).name)+'</strong><small>'+esc(q.title)+' · '+money(q.amount,q.account)+'</small></span><span class="row-side">'+whenBadge(q.valid)+'</span></button>').join("")||empty("Sin cotizaciones por vencer."))+
  '</div></section>'+FOOT;
}

/* ---------- Historial ---------- */
function vHistory(){
  const kinds=[["all","Todo"],["payment","Pagos"],["order","Pedidos"],["quote","Cotizaciones"],["whatsapp","WhatsApp"]];
  const items=sortedHistory().filter(h=>state.hkind==="all"||h.kind===state.hkind);
  return head("Actividad","Historial","Eventos de cotizaciones, pagos, pedidos y mensajes, del más reciente al más antiguo.")+
  '<div class="toolbar"><div class="chips">'+kinds.map(k=>'<button class="chip '+(state.hkind===k[0]?"active":"")+'" data-hkind="'+k[0]+'">'+k[1]+'</button>').join("")+'</div><span class="pill">'+items.length+' eventos</span></div>'+
  '<section class="card"><div class="card-body" style="padding:18px 20px">'+timeline(items,true)+'</div></section>'+FOOT;
}

/* ---------------- Render y eventos ---------------- */
function buildNav(){
  let html="",g="";
  Object.keys(VIEWS).forEach(k=>{
    const v=VIEWS[k];
    if(v.group!==g){g=v.group;html+='<div class="nav-label">'+g+'</div>';}
    html+='<button class="nav-item" data-view="'+k+'"><span class="nav-icon">'+v.icon+'</span><span>'+v.label+'</span><span class="nav-count" id="count-'+k+'" hidden></span></button>';
  });
  $("nav").innerHTML=html;
}
function setCount(k,n,cls){const el=$("count-"+k);if(!el)return;el.hidden=!n;el.textContent=n;el.className="nav-count"+(cls?" "+cls:"");}
function updateCounts(){
  setCount("clientes",clients.length);
  setCount("whatsapp",sum(chats,c=>c.unread),"wa");
  setCount("seguimientos",followItems().filter(o=>daysFrom(o.next)<=7).length);
}
function render(){
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active",b.dataset.view===state.view));
  $("crumb").textContent=VIEWS[state.view].label;
  $("content").innerHTML=VIEWS[state.view].fn();
  updateCounts();
  const box=$("waMsgs");if(box)box.scrollTop=box.scrollHeight;
}
function go(view){state.view=view;render();window.scrollTo(0,0);}
function toast(msg){const el=$("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),2600);}

document.addEventListener("click",e=>{
  const t=e.target.closest("button,a");if(!t)return;
  const d=t.dataset;
  if(t.tagName==="A"&&t.getAttribute("href")==="#")e.preventDefault();
  if(d.toast){toast(d.toast);return;}
  if(d.view){go(d.view);return;}
  if(d.client){
    const id=+d.client,changed=id!==state.clientId||state.view!=="clientes";
    state.clientId=id;if(changed)state.tab="account";
    const from=state.view;state.view="clientes";render();
    if(from!=="clientes")window.scrollTo(0,0);
    else if(window.innerWidth<900)$("detail").scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }
  if(d.tab){state.tab=d.tab;render();return;}
  if(d.cfilter){state.cfilter=d.cfilter;render();return;}
  if(d.ofilter){state.ofilter=d.ofilter;render();return;}
  if(d.hkind){state.hkind=d.hkind;render();return;}
  if(d.chat){state.chatId=d.chat;const ch=chats.find(c=>c.id===d.chat);if(ch)ch.unread=0;render();return;}
  if(d.chatClient){const ch=chats.find(c=>c.clientId===+d.chatClient);if(ch){state.chatId=ch.id;ch.unread=0;go("whatsapp");}return;}
  if(d.quick){const inp=$("waInput");if(inp){inp.value=d.quick;inp.focus();}return;}
});
document.addEventListener("input",e=>{
  if(e.target.id==="clientSearch"){state.q=e.target.value;const r=clientList();$("clientList").innerHTML=r.html;$("clientCount").textContent=r.count+" "+(r.count===1?"registro":"registros");}
  if(e.target.id==="orderSearch"){state.oq=e.target.value;$("ordersBody").innerHTML=ordersBody();}
});
document.addEventListener("submit",e=>{if(e.target.id==="waForm"){e.preventDefault();sendMessage();}});

buildNav();
render();
</script>
</body>
</html>
