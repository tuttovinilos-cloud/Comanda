<script>
// =========================================================
// ORGANIZADOR DE IDEAS · VISTA INDEX-LIKE
// Base: no rompe app.js porque esta página maneja sus propias funciones.
// Guarda localmente y, si existe tabla Supabase "ideas", sincroniza.
// =========================================================
const KEY = 'tutto_organizador_ideas_index_v1';
const REMOTE_TABLE = 'ideas';
const PAGE_SIZE = 40;

const ESTADOS = ['Idea','Analizando','En proceso','Aprobada','Pausada','Descartada','Lista'];
const PRIORIDADES = ['Alta','Media','Baja'];
const CATEGORIAS = ['Diseño','Producción','Web / Sistema','Compra','Marketing','Cliente','Mejora interna','Laser / CNC','Impresión','Instalación','Otra'];
const RESPONSABLES = ['Roberto','Chico','Carlos','Alejandro','Rubén','Gabriela'];

let ideas = [];
let filteredIdeas = [];
let currentPage = 1;
let currentView = 'activas';
let editingIdeaId = null;
let online = false;
let remoteEnabled = false;

const $ = id => document.getElementById(id);
const today = () => new Date().toISOString().slice(0,10);
const esc = v => String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const norm = v => String(v || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const uid = () => {
  if(typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'id_' + Date.now() + '_' + Math.random().toString(16).slice(2);
};

function toast(msg){
  const t = $('toast');
  if(!t){ console.log(msg); return; }
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(()=>{ t.style.display = 'none'; }, 2200);
}

function bdClick(e,id){ if(e && e.target && e.target.id === id) closeModal(id); }
function closeModal(id){ const el=$(id); if(el) el.style.display='none'; }

function getSupabase(){ return window.supabaseClient || window.db || null; }

function localLoad(){
  try{ return JSON.parse(localStorage.getItem(KEY) || '[]'); }
  catch(e){ return []; }
}
function localSave(){ localStorage.setItem(KEY, JSON.stringify(ideas)); }

function demoIdeas(){
  return [
    {id:uid(),fecha:today(),responsable:'Roberto',titulo:'Organizar ideas estilo index',descripcion:'Simplificar la vista previa para trabajar más rápido desde una tabla parecida a pedidos.',categoria:'Web / Sistema',prioridad:'Alta',estado:'En proceso',cliente:'Tuttovinilos',referencia:'ideas.html',accion:'Probar flujo',notas:'Versión con carga rápida y edición por modal.',archivado:false,created_at:new Date().toISOString()},
    {id:uid(),fecha:today(),responsable:'Chico',titulo:'Ideas para marketing emocional',descripcion:'Guardar conceptos de campañas, frases, imágenes de referencia y próximos pasos.',categoria:'Marketing',prioridad:'Media',estado:'Idea',cliente:'',referencia:'',accion:'Crear boceto',notas:'',archivado:false,created_at:new Date().toISOString()},
    {id:uid(),fecha:today(),responsable:'Rubén',titulo:'Mejora de producción',descripcion:'Lista de mejoras internas que se pueden convertir luego en tarea o proyecto.',categoria:'Mejora interna',prioridad:'Baja',estado:'Analizando',cliente:'',referencia:'',accion:'Revisar en reunión',notas:'',archivado:false,created_at:new Date().toISOString()}
  ];
}

function remoteToIdea(r){
  return {
    id:r.id || uid(),
    fecha:r.fecha || String(r.created_at || today()).slice(0,10),
    responsable:r.responsable || '',
    titulo:r.titulo || r.nombre || 'Sin título',
    descripcion:r.descripcion || '',
    categoria:r.categoria || 'Otra',
    prioridad:r.prioridad || 'Media',
    estado:r.estado || 'Idea',
    cliente:r.cliente || r.cliente_nombre || '',
    referencia:r.referencia || r.link || '',
    accion:r.accion || r.proxima_accion || '',
    notas:r.notas || '',
    archivado:r.archivado === true,
    fecha_archivado:r.fecha_archivado || '',
    created_at:r.created_at || new Date().toISOString()
  };
}
function ideaToRemote(i){
  return {
    id:i.id,
    fecha:i.fecha || today(),
    responsable:i.responsable || '',
    titulo:i.titulo || '',
    descripcion:i.descripcion || '',
    categoria:i.categoria || 'Otra',
    prioridad:i.prioridad || 'Media',
    estado:i.estado || 'Idea',
    cliente_nombre:i.cliente || '',
    referencia:i.referencia || '',
    accion:i.accion || '',
    notas:i.notas || '',
    archivado:!!i.archivado,
    fecha_archivado:i.fecha_archivado || null,
    updated_at:new Date().toISOString()
  };
}

async function loadAll(manual=false){
  populateAllSelects();
  const sb = getSupabase();
  if(!sb){
    online = false; remoteEnabled = false;
    ideas = localLoad();
    if(!ideas.length){ ideas = demoIdeas(); localSave(); }
    setStorage(false,'Local');
    renderTable();
    if(manual) toast('Trabajando local');
    return;
  }

  try{
    const { data, error } = await sb.from(REMOTE_TABLE).select('*').order('created_at',{ascending:false});
    if(error) throw error;
    ideas = (data || []).map(remoteToIdea);
    if(!ideas.length){ ideas = localLoad(); if(!ideas.length) ideas = demoIdeas(); }
    online = true; remoteEnabled = true;
    localSave();
    setStorage(true,'Supabase');
    renderTable();
    if(manual) toast('Ideas actualizadas');
  }catch(e){
    console.warn('Supabase ideas no disponible, usando local:', e);
    online = !!sb; remoteEnabled = false;
    ideas = localLoad();
    if(!ideas.length){ ideas = demoIdeas(); localSave(); }
    setStorage(false,'Local');
    renderTable();
    if(manual) toast('Modo local: tabla ideas no disponible');
  }
}

function setStorage(ok,text){
  const b=$('storageBadge'), t=$('storageBadgeText');
  if(b) b.classList.toggle('ok',!!ok);
  if(t) t.textContent = text || (ok?'Supabase':'Local');
}

async function saveRemoteIdea(i){
  localSave();
  if(!remoteEnabled) return;
  const sb=getSupabase();
  if(!sb) return;
  const { error } = await sb.from(REMOTE_TABLE).upsert(ideaToRemote(i));
  if(error){ console.warn(error); remoteEnabled=false; setStorage(false,'Local'); toast('Guardado local: revisa tabla ideas'); }
}
async function deleteRemoteIdea(id){
  localSave();
  if(!remoteEnabled) return;
  const sb=getSupabase();
  if(!sb) return;
  const { error } = await sb.from(REMOTE_TABLE).delete().eq('id',id);
  if(error){ console.warn(error); remoteEnabled=false; setStorage(false,'Local'); }
}

function populateOptions(id, arr, selected=''){
  const el=$(id); if(!el) return;
  el.innerHTML = arr.map(v=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(v)}</option>`).join('');
}
function populateFilter(id, label, arr){
  const el=$(id); if(!el) return;
  const old=el.value;
  el.innerHTML = `<option value="">${label}</option>` + arr.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');
  if([...el.options].some(o=>o.value===old)) el.value=old;
}
function populateAllSelects(){
  populateFilter('filterEstado','Estado',ESTADOS);
  populateFilter('filterPrioridad','Prioridad',PRIORIDADES);
  populateFilter('filterCategoria','Categoría',CATEGORIAS);
  const responsables = [...new Set([...RESPONSABLES, ...ideas.map(i=>i.responsable).filter(Boolean)])];
  populateFilter('filterResponsable','Responsable',responsables);

  populateOptions('q_responsable',responsables,'Roberto');
  populateOptions('q_categoria',CATEGORIAS,'Web / Sistema');
  populateOptions('q_prioridad',PRIORIDADES,'Media');
  populateOptions('q_estado',ESTADOS,'Idea');

  populateOptions('f_responsable',responsables,'Roberto');
  populateOptions('f_categoria',CATEGORIAS,'Web / Sistema');
  populateOptions('f_prioridad',PRIORIDADES,'Media');
  populateOptions('f_estado',ESTADOS,'Idea');
}

function clearQuickIdea(){
  $('q_fecha').value = today();
  $('q_responsable').value = 'Roberto';
  $('q_titulo').value = '';
  $('q_descripcion').value = '';
  $('q_categoria').value = 'Web / Sistema';
  $('q_prioridad').value = 'Media';
  $('q_estado').value = 'Idea';
  $('q_cliente').value = '';
  $('q_referencia').value = '';
  $('q_accion').value = '';
}

async function saveQuickIdea(){
  const row=$('quickEntryRow');
  const titulo=($('q_titulo').value || '').trim();
  const desc=($('q_descripcion').value || '').trim();
  if(!titulo && !desc){ toast('Coloca título o descripción'); return; }

  if(row){ row.classList.remove('guardado','error-guardado'); row.classList.add('guardando'); }
  try{
    const idea={
      id:uid(),
      fecha:$('q_fecha').value || today(),
      responsable:$('q_responsable').value || 'Roberto',
      titulo:titulo || desc.slice(0,45) || 'Idea sin título',
      descripcion:desc,
      categoria:$('q_categoria').value || 'Otra',
      prioridad:$('q_prioridad').value || 'Media',
      estado:$('q_estado').value || 'Idea',
      cliente:$('q_cliente').value || '',
      referencia:$('q_referencia').value || '',
      accion:$('q_accion').value || '',
      notas:'',
      archivado:false,
      fecha_archivado:'',
      created_at:new Date().toISOString()
    };
    if(idea.estado === 'Lista' || idea.estado === 'Descartada'){
      // No se archiva automáticamente: igual que pedidos, se mueve con botón 📁.
      idea.archivado = false;
    }
    ideas.unshift(idea);
    localSave();
    await saveRemoteIdea(idea);
    clearQuickIdea();
    renderTable();
    if(row){ row.classList.remove('guardando','error-guardado'); row.classList.add('guardado'); setTimeout(()=>row.classList.remove('guardado'),1200); }
    toast('Idea agregada ✅');
  }catch(e){
    if(row){ row.classList.remove('guardando','guardado'); row.classList.add('error-guardado'); setTimeout(()=>row.classList.remove('error-guardado'),1200); }
    console.error(e);
    toast('Error guardando idea');
  }
}

function onSearch(){ currentPage=1; renderTable(); window.scrollTo({top:0,behavior:'auto'}); }
function setView(v,btn){
  currentView = v;
  currentPage = 1;
  document.querySelectorAll('.view-tab').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  renderTable();
}

function isArchivada(i){ return i.archivado === true; }
function filterData(){
  const q=norm($('searchInput').value);
  const fe=$('filterEstado').value;
  const fp=$('filterPrioridad').value;
  const fc=$('filterCategoria').value;
  const fr=$('filterResponsable').value;
  const fd=$('filterFechaDesde').value;

  return ideas.filter(i=>{
    if(currentView === 'archivo' && !isArchivada(i)) return false;
    if(currentView !== 'archivo' && isArchivada(i)) return false;
    const text = norm([i.titulo,i.descripcion,i.categoria,i.prioridad,i.estado,i.responsable,i.cliente,i.referencia,i.accion,i.notas].join(' '));
    return (!q || text.includes(q))
      && (!fe || i.estado === fe)
      && (!fp || i.prioridad === fp)
      && (!fc || i.categoria === fc)
      && (!fr || i.responsable === fr)
      && (!fd || String(i.fecha || '') >= fd);
  }).sort((a,b)=>String(b.created_at || b.fecha || '').localeCompare(String(a.created_at || a.fecha || '')));
}

function renderStats(dataAll){
  const active = ideas.filter(i=>!isArchivada(i));
  const html = [
    ['Ideas', active.length, 'blue'],
    ['Alta prioridad', active.filter(i=>i.prioridad==='Alta').length, 'red'],
    ['En proceso', active.filter(i=>i.estado==='En proceso').length, 'yellow'],
    ['Aprobadas', active.filter(i=>i.estado==='Aprobada').length, 'violet'],
    ['Listas', active.filter(i=>i.estado==='Lista').length, 'green'],
    ['Archivo', ideas.filter(isArchivada).length, 'gray']
  ].map(s=>`<div class="stat"><span class="stat-dot ${s[2]}"></span><div><span class="stat-label">${esc(s[0])}</span><span class="stat-num">${s[1]}</span></div></div>`).join('');
  $('statsBar').innerHTML = html;
}

function estadoClass(e){
  const n=norm(e);
  if(n==='idea') return 'status-solicitud';
  if(n==='analizando') return 'status-analizando';
  if(n==='en proceso') return 'status-proceso';
  if(n==='aprobada') return 'status-aprobada';
  if(n==='lista') return 'status-lista';
  if(n==='pausada') return 'status-pausada';
  if(n==='descartada') return 'status-descartada';
  return 'status-solicitud';
}
function prioridadClass(p){ return 'badge-priority ' + norm(p).replace(/\s+/g,'-'); }
function estadoSelect(i){
  return `<select class="status-select ${estadoClass(i.estado)}" onclick="event.stopPropagation()" onchange="quickEstado('${i.id}',this.value)">${ESTADOS.map(e=>`<option value="${esc(e)}" ${i.estado===e?'selected':''}>${esc(e)}</option>`).join('')}</select>`;
}
function actionButtons(i){
  const canArch = !isArchivada(i) && (i.estado === 'Lista' || i.estado === 'Descartada');
  return `<button class="btn-icon" onclick="event.stopPropagation();openIdeaModal('${i.id}')" title="Editar">✎</button>
  <button class="btn-icon" onclick="event.stopPropagation();duplicateIdea('${i.id}')" title="Duplicar">⧉</button>
  <button class="btn-icon arch" onclick="event.stopPropagation();archiveIdea('${i.id}')" title="${isArchivada(i)?'Sacar del archivo':'Mover a archivo'}">${isArchivada(i)?'↩':'📁'}</button>
  <button class="btn-icon del" onclick="event.stopPropagation();deleteIdea('${i.id}')" title="Eliminar">×</button>`;
}
function refCell(i){
  const r=String(i.referencia || '').trim();
  if(!r) return '—';
  if(/^https?:\/\//i.test(r)) return `<a href="${esc(r)}" target="_blank" onclick="event.stopPropagation()" class="badge badge-cat">Abrir</a>`;
  return esc(r);
}
function rowHTML(i,idx){
  return `<tr onclick="openIdeaModal('${i.id}')">
    <td class="td-id">#${idx}</td>
    <td class="td-date">${esc(i.fecha || '—')}</td>
    <td class="td-resp">${esc(i.responsable || '—')}</td>
    <td class="td-title" onclick="event.stopPropagation();openDesc('${i.id}')">${esc(i.titulo || 'Sin título')}</td>
    <td class="td-desc" title="${esc(i.descripcion || '')}" onclick="event.stopPropagation();openDesc('${i.id}')">${esc(i.descripcion || 'Sin descripción')}</td>
    <td><span class="badge badge-cat">${esc(i.categoria || 'Otra')}</span></td>
    <td><span class="badge ${prioridadClass(i.prioridad || 'Media')}">${esc(i.prioridad || 'Media')}</span></td>
    <td>${estadoSelect(i)}</td>
    <td class="td-client">${esc(i.cliente || '—')}</td>
    <td>${refCell(i)}</td>
    <td>${esc(i.accion || '—')}</td>
    <td>${actionButtons(i)}</td>
  </tr>`;
}
function groupedHTML(data){
  const groups={};
  data.forEach(i=>{ const k=i.categoria || 'Otra'; (groups[k]=groups[k]||[]).push(i); });
  let n=1;
  return Object.keys(groups).sort().map(cat=>{
    const arr=groups[cat];
    const altas=arr.filter(i=>i.prioridad==='Alta').length;
    return `<tr class="group-row"><td colspan="12">${esc(cat)} <span class="group-pill">${arr.length} idea(s)</span>${altas?`<span class="group-pill">${altas} alta(s)</span>`:''}</td></tr>` + arr.map(i=>rowHTML(i,n++)).join('');
  }).join('');
}
function renderTable(){
  populateAllSelects();
  renderStats();
  const data = filterData();
  filteredIdeas = data;
  const total = data.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(currentPage > pages) currentPage = pages;
  const start = (currentPage - 1) * PAGE_SIZE;
  const slice = data.slice(start, start + PAGE_SIZE);

  $('emptyState').style.display = total ? 'none' : 'block';
  if(currentView === 'agrupadas') $('ideasTableBody').innerHTML = groupedHTML(data);
  else $('ideasTableBody').innerHTML = slice.map((i,k)=>rowHTML(i,start+k+1)).join('');

  $('paginationBar').innerHTML = total ? `
    <button class="page-btn" onclick="changePage(-1)" ${currentPage===1?'disabled':''}>← Anterior</button>
    <span class="page-info">Pág ${currentPage} / ${pages} · ${total} idea${total!==1?'s':''}</span>
    <button class="page-btn" onclick="changePage(1)" ${currentPage>=pages?'disabled':''}>Siguiente →</button>
  ` : `<span class="page-info">0 ideas</span>`;
}
function changePage(d){ currentPage += d; renderTable(); window.scrollTo(0,0); }

async function quickEstado(id,estado){
  const i=ideas.find(x=>x.id===id); if(!i) return;
  i.estado=estado;
  localSave();
  await saveRemoteIdea(i);
  renderTable();
  toast('Estado actualizado');
}

function openIdeaModal(id=null){
  editingIdeaId = id;
  const i = id ? ideas.find(x=>x.id===id) : null;
  $('ideaModalTitle').textContent = i ? 'EDITAR IDEA' : 'NUEVA IDEA';
  $('deleteIdeaBtn').style.display = i ? '' : 'none';
  populateAllSelects();
  $('f_fecha').value = i ? (i.fecha || today()) : today();
  $('f_responsable').value = i ? (i.responsable || 'Roberto') : 'Roberto';
  $('f_titulo').value = i ? (i.titulo || '') : '';
  $('f_descripcion').value = i ? (i.descripcion || '') : '';
  $('f_categoria').value = i ? (i.categoria || 'Otra') : 'Web / Sistema';
  $('f_prioridad').value = i ? (i.prioridad || 'Media') : 'Media';
  $('f_estado').value = i ? (i.estado || 'Idea') : 'Idea';
  $('f_cliente').value = i ? (i.cliente || '') : '';
  $('f_referencia').value = i ? (i.referencia || '') : '';
  $('f_accion').value = i ? (i.accion || '') : '';
  $('f_notas').value = i ? (i.notas || '') : '';
  $('ideaBackdrop').style.display = 'flex';
}

async function saveIdea(){
  const data={
    id:editingIdeaId || uid(),
    fecha:$('f_fecha').value || today(),
    responsable:$('f_responsable').value || 'Roberto',
    titulo:($('f_titulo').value || 'Idea sin título').trim(),
    descripcion:$('f_descripcion').value || '',
    categoria:$('f_categoria').value || 'Otra',
    prioridad:$('f_prioridad').value || 'Media',
    estado:$('f_estado').value || 'Idea',
    cliente:$('f_cliente').value || '',
    referencia:$('f_referencia').value || '',
    accion:$('f_accion').value || '',
    notas:$('f_notas').value || '',
    archivado:false,
    fecha_archivado:'',
    created_at:new Date().toISOString()
  };
  if(editingIdeaId){
    const old=ideas.find(x=>x.id===editingIdeaId) || {};
    data.created_at = old.created_at || data.created_at;
    data.archivado = !!old.archivado;
    data.fecha_archivado = old.fecha_archivado || '';
    const idx=ideas.findIndex(x=>x.id===editingIdeaId);
    if(idx>=0) ideas[idx]=data;
  }else{
    ideas.unshift(data);
  }
  localSave();
  await saveRemoteIdea(data);
  closeModal('ideaBackdrop');
  renderTable();
  toast(editingIdeaId ? 'Idea actualizada' : 'Idea creada');
  editingIdeaId=null;
}
function deleteCurrentIdea(){ if(editingIdeaId) deleteIdea(editingIdeaId); }
async function deleteIdea(id){
  const i=ideas.find(x=>x.id===id);
  if(!i) return;
  if(!confirm('¿Eliminar esta idea?')) return;
  ideas=ideas.filter(x=>x.id!==id);
  localSave();
  await deleteRemoteIdea(id);
  closeModal('ideaBackdrop');
  renderTable();
  toast('Idea eliminada');
}
async function duplicateIdea(id){
  const base=ideas.find(x=>x.id===id); if(!base) return;
  const copy={...JSON.parse(JSON.stringify(base)),id:uid(),fecha:today(),titulo:(base.titulo || 'Idea')+' copia',estado:'Idea',archivado:false,fecha_archivado:'',created_at:new Date().toISOString()};
  ideas.unshift(copy);
  localSave();
  await saveRemoteIdea(copy);
  renderTable();
  toast('Idea duplicada');
}
async function archiveIdea(id){
  const i=ideas.find(x=>x.id===id); if(!i) return;
  i.archivado = !i.archivado;
  i.fecha_archivado = i.archivado ? today() : '';
  localSave();
  await saveRemoteIdea(i);
  renderTable();
  toast(i.archivado ? 'Idea movida al archivo' : 'Idea restaurada');
}
function openDesc(id){
  const i=ideas.find(x=>x.id===id); if(!i) return;
  $('descTitle').textContent = i.titulo || 'DESCRIPCIÓN';
  $('descText').textContent = [i.descripcion || 'Sin descripción.', i.notas ? '\nNotas:\n'+i.notas : '', i.accion ? '\nPróxima acción:\n'+i.accion : ''].join('');
  $('descEditBtn').onclick = function(){ closeModal('descBackdrop'); openIdeaModal(id); };
  $('descBackdrop').style.display='flex';
}

function instalarMenuMovil(){
  const btn=$('mobileMenuBtn');
  const nav=$('authMenu');
  if(btn && nav){ btn.addEventListener('click',()=>nav.classList.toggle('open')); }
}

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    closeModal('ideaBackdrop');
    closeModal('descBackdrop');
    closeModal('notiBackdrop');
  }
});
document.addEventListener('DOMContentLoaded',()=>{
  instalarMenuMovil();
  clearQuickIdea();
  loadAll();
});
</script>
