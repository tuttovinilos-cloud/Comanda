<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f9;--panel:#fff;--panel2:#f8f9ff;--border:#d9deea;--border2:#cbd3e6;
  --text:#111827;--muted:#6b7280;--muted2:#475569;--accent:#153bff;--accent2:#0b1f7a;
  --red:#dc2626;--yellow:#f59e0b;--green:#16a34a;--orange:#ff8616;
  --mono:'Roboto Mono',monospace;--head:'Montserrat',Arial,sans-serif;--body:'Inter',Arial,sans-serif
}
html{scroll-behavior:smooth;background:var(--bg);color-scheme:light}
body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;-webkit-tap-highlight-color:transparent;padding-bottom:90px;font-size:14px;line-height:1.35}
button,input,select,textarea{font:inherit;color-scheme:light} button{touch-action:manipulation}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:#eef1ff}::-webkit-scrollbar-thumb{background:#cbd3e6;border-radius:4px}

/* HEADER = INDEX */
.header{
  position:sticky;top:0;z-index:900;display:grid;grid-template-columns:155px 44px minmax(0,1fr);
  align-items:center;gap:8px;width:100%;min-height:58px;height:58px;padding:10px 16px;overflow:hidden;
  background:#172bd8;box-shadow:0 8px 20px rgba(21,59,255,.18)
}
.logo{grid-column:1;grid-row:1;width:155px;min-width:155px;max-width:155px;height:38px;display:flex;align-items:center;justify-content:flex-start;overflow:hidden;font-family:var(--head);font-weight:900;color:#fff;letter-spacing:2px}
.logo img{display:block;width:auto;height:34px;max-width:138px;max-height:34px;object-fit:contain}
.logo-fallback{font-size:19px}
.noti-btn{grid-column:2;grid-row:1;position:relative;display:inline-flex;align-items:center;justify-content:center;width:38px;min-width:38px;height:34px;border-radius:999px;border:1px solid rgba(255,255,255,.30);background:rgba(255,255,255,.12);color:#fff;font-size:13px;cursor:pointer}
.noti-count{position:absolute;right:-4px;top:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:#e5e7eb;color:#64748b;font-size:8px;font-weight:900;border:1px solid rgba(255,255,255,.45);display:inline-flex;align-items:center;justify-content:center}
.header-tabs{grid-column:3;grid-row:1;display:flex;align-items:center;justify-content:flex-end;gap:5px;width:100%;min-width:0;height:36px;overflow:hidden;flex-wrap:nowrap}
.tab-btn,.storage-pill{flex:0 1 auto;height:30px;min-height:30px;padding:0 9px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.10);color:#fff;font-family:var(--head);font-size:9.5px;font-weight:900;letter-spacing:.25px;line-height:1;text-transform:uppercase;text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.tab-btn:hover{background:rgba(255,255,255,.18)}
.tab-btn.active{background:#fff;color:#153bff;border-color:#fff}
.mobile-menu-btn{display:none;margin-left:auto;min-height:31px;height:31px;padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.30);background:rgba(255,255,255,.12);color:#fff;font-family:var(--head);font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase;cursor:pointer}

/* TOOLBAR = INDEX */
.toolbar{
  position:sticky;top:58px;z-index:700;display:grid;
  grid-template-columns:minmax(340px,1fr) 120px 120px 135px 135px 120px;
  gap:8px;align-items:center;width:100%;padding:10px 14px;background:#fff;border-bottom:1px solid #d9deea;
  box-shadow:0 4px 18px rgba(0,0,0,.045)
}
.search-wrap{width:100%;min-width:0;min-height:42px;display:flex;align-items:center;gap:8px;border-radius:14px;background:#fff;border:1px solid #d9deea;padding:9px 12px}
.search-wrap input{width:100%;min-width:0;background:none;border:none;outline:none;color:#111827;font-family:var(--mono);font-size:13px}
.search-wrap input::placeholder{color:#8a94a6}
.filter-sel{width:100%;min-width:0;min-height:42px;height:42px;border-radius:12px;border:1px solid #d9deea;background:#fff;color:#153bff;font-family:var(--head);font-size:11px;font-weight:900;padding:8px 10px;outline:none;cursor:pointer}
.mobile-new-order-btn{display:none}

/* TABLE = INDEX */
.table-wrap{overflow-x:auto;margin-top:0;padding:0 0 110px;-webkit-overflow-scrolling:touch;background:#f0f2f9;position:relative;z-index:1}
table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:1260px;background:#fff}
thead tr{border-bottom:1px solid #d9deea;background:#eef1ff}
th{background:#eef1ff;font-family:var(--head);font-size:10px;font-weight:900;letter-spacing:.35px;text-transform:uppercase;color:#5b6474;padding:10px;text-align:left;white-space:nowrap}
td{padding:10px;font-size:12px;line-height:1.25;vertical-align:middle;border-bottom:1px solid #e4e8f2;color:#111827;background:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tbody tr{cursor:pointer} tbody tr:nth-child(even) td{background:#fbfcff} tbody tr:hover td{background:#f3f6ff} tbody::before{content:"";display:block;height:6px}

th:nth-child(1),td:nth-child(1){width:44px;text-align:center}
th:nth-child(2),td:nth-child(2){width:90px}
th:nth-child(3),td:nth-child(3){width:110px}
th:nth-child(4),td:nth-child(4){width:155px}
th:nth-child(5),td:nth-child(5){width:240px}
th:nth-child(6),td:nth-child(6){width:95px}
th:nth-child(7),td:nth-child(7){width:150px}
th:nth-child(8),td:nth-child(8){width:125px}
th:nth-child(9),td:nth-child(9){width:120px;text-align:center}
th:nth-child(10),td:nth-child(10){width:120px}
th:nth-child(11),td:nth-child(11){width:110px;text-align:center}
th:nth-child(12),td:nth-child(12){width:78px;text-align:center}

#orderTableBody td:nth-child(2){color:#4b5563;font-size:11px;font-family:var(--mono)}
#orderTableBody td:nth-child(3){font-size:12px;color:#111827;font-weight:700}
#orderTableBody td:nth-child(4){font-size:12px;color:#0b1f7a;font-weight:800}
#orderTableBody td:nth-child(5){font-size:12px;color:#111827;line-height:1.3}
#orderTableBody td{height:44px;max-height:44px}

/* CONTROLS */
.cell-edit,.cell-select,.quick-input,.quick-select,.quick-btn{
  width:100%;background:#fff;border:1px solid #d9deea;color:#111827;border-radius:10px;padding:7px 8px;
  font-family:var(--body);font-size:12px;outline:none
}
.cell-edit:focus,.cell-select:focus,.quick-input:focus,.quick-select:focus{border-color:#153bff;box-shadow:0 0 0 3px rgba(21,59,255,.10)}
.quick-entry-row th{background:#f8f9ff;padding:6px;border-bottom:1px solid #d9deea}
.quick-btn,.btn-add{font-family:var(--head);font-size:12px;font-weight:900;letter-spacing:.35px;text-transform:uppercase;background:#153bff;border:1px solid #153bff;cursor:pointer;color:#fff;min-height:34px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.quick-btn.secondary,.btn-add.secondary,.modal-close{background:#fff;color:#153bff;border-color:#cbd3e6}
.quick-textarea{min-height:38px;max-height:54px;resize:vertical;line-height:1.25}
.quick-textarea:focus{min-height:78px;max-height:120px}
.add-symbol-btn{width:52px;min-width:52px;height:38px;min-height:38px;font-size:25px;font-weight:900;line-height:1;padding:4px 8px;border-radius:14px;margin-inline:auto;display:flex}
.action-btn{width:38px;height:34px;border:1px solid #cbd3e6;background:#fff;color:#153bff;border-radius:10px;cursor:pointer;font-weight:900}
.action-btn:hover{border-color:#153bff;background:#eef1ff}

/* STATUS */
.estado-solicitud{color:#dc2626!important;border-color:#fecaca!important;background:#fee2e2!important;font-weight:800!important}
.estado-en-curso{color:#fff!important;border-color:#111827!important;background:#111827!important;font-weight:800!important}
.estado-revisado{color:#92400e!important;border-color:#fde68a!important;background:#fef3c7!important;font-weight:800!important}
.estado-listo{color:#166534!important;border-color:#86efac!important;background:#dcfce7!important;font-weight:800!important}
.pago-pendiente{color:#dc2626!important;border-color:#fecaca!important;background:#fee2e2!important;font-weight:800!important}
.pago-abonado{color:#92400e!important;border-color:#fde68a!important;background:#fef3c7!important;font-weight:800!important}
.pago-pagado{color:#166534!important;border-color:#86efac!important;background:#dcfce7!important;font-weight:800!important}
.cell-select.estado-solicitud,.cell-select.estado-en-curso,.cell-select.estado-revisado,.cell-select.estado-listo,
.cell-select.pago-pendiente,.cell-select.pago-abonado,.cell-select.pago-pagado{
  border-radius:999px!important;text-align:center!important;text-align-last:center!important;padding-right:26px!important
}

/* MODAL */
.backdrop{position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:1000;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.modal{background:#fff;border:1px solid #d9deea;width:100%;max-width:620px;max-height:94vh;overflow-y:auto;border-radius:14px 14px 0 0;box-shadow:0 24px 80px rgba(17,24,39,.22)}
.modal-handle{width:36px;height:4px;background:#cbd3e6;border-radius:2px;margin:10px auto 0}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #d9deea;background:#fff}
.modal-title{font-family:var(--head);font-size:18px;font-weight:900;letter-spacing:.35px;color:#153bff;text-transform:uppercase}
.modal-close{width:32px;height:32px;border-radius:7px;border:1px solid #cbd3e6;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:14px}
.modal-footer{padding:14px 20px;border-top:1px solid #d9deea;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:#fff}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:var(--head);font-size:10px;font-weight:700;letter-spacing:.35px;color:#6b7280;text-transform:uppercase}
.field input,.field select,.field textarea{background:#fff;border:1px solid #d9deea;color:#111827;border-radius:8px;padding:10px 12px;font-family:var(--body);font-size:14px;outline:none;width:100%}
.field textarea{resize:vertical;min-height:80px}
.empty{text-align:center;padding:60px 20px;color:#6b7280;font-family:var(--head);font-size:15px;letter-spacing:2px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#111827;color:#fff;border-radius:10px;padding:10px 16px;z-index:999999;display:none;box-shadow:0 12px 35px #0008;font-family:var(--head);font-size:13px;font-weight:800;letter-spacing:.35px;text-transform:uppercase;max-width:90vw;text-align:center}

/* RESPONSIVE */
@media(min-width:600px){.backdrop{align-items:center;padding:16px}.modal{border-radius:12px}}
@media(max-width:1280px){
  .header{grid-template-columns:130px 42px minmax(0,1fr);padding:10px 12px}.logo{width:130px;min-width:130px;max-width:130px}
  .logo img{max-width:118px;height:31px}.header-tabs{gap:4px}.header-tabs .tab-btn{font-size:8.7px;padding:0 7px}
  .toolbar{grid-template-columns:minmax(300px,1fr) 112px 112px 128px 128px 112px}
}
@media(max-width:980px){
  body{padding-bottom:50px}
  .header{grid-template-columns:1fr 36px auto;height:auto;min-height:48px;overflow:visible;padding:7px 9px;gap:6px}
  .logo{grid-column:1;grid-row:1;width:118px;min-width:118px;max-width:118px;height:31px}.logo img{height:26px;max-width:112px}
  .noti-btn{grid-column:2;grid-row:1;width:32px;min-width:32px;height:31px}
  .mobile-menu-btn{grid-column:3;grid-row:1;display:inline-flex;align-items:center;justify-content:center}
  .header-tabs{grid-column:1/-1;grid-row:2;display:none;width:100%;height:auto;margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.22);overflow:visible;grid-template-columns:1fr 1fr;gap:6px}
  .header-tabs.open{display:grid}.header-tabs .tab-btn{width:100%;min-height:31px;height:31px;font-size:8.5px;padding:0 7px;border-radius:7px;letter-spacing:.8px}
  .toolbar{position:relative;top:auto;z-index:500;grid-template-columns:1fr 1fr;padding:7px 9px;gap:6px}
  .search-wrap{grid-column:1/-1;min-height:32px;height:32px;padding:5px 8px;border-radius:10px}.search-wrap input{font-size:10px}
  #filterFechaDesde,#filterFechaHasta{display:none}.filter-sel{min-height:32px;height:32px;font-size:9px;padding:5px 7px;border-radius:9px}
  #filterOperador{grid-column:1/-1}
}
@media(max-width:720px){
  .toolbar{grid-template-columns:1fr 1fr!important;gap:6px!important;padding:7px 8px!important;background:#f8f9ff!important}
  .toolbar .search-wrap{grid-column:1/-1!important;min-height:38px!important;height:38px!important}
  .toolbar #filterStatus,.toolbar #filterPago{min-height:36px!important;height:36px!important;font-size:9px!important}
  .toolbar #filterOperador{grid-column:1/-1!important;min-height:36px!important;height:36px!important}
  .mobile-new-order-btn{grid-column:1/-1;display:flex!important;align-items:center;justify-content:center;gap:7px;width:100%;min-height:40px;border:0;border-radius:11px;background:#153bff;color:#fff;font-family:var(--head);font-size:10px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;box-shadow:0 5px 14px rgba(21,59,255,.18)}
  .table-wrap{width:100%!important;margin:0!important;padding:0 6px 22px!important;overflow-x:hidden!important;background:var(--bg)!important}
  body .table-wrap table{width:100%!important;min-width:0!important;max-width:100%!important;table-layout:fixed!important;border-collapse:separate!important;border-spacing:0 5px!important;background:transparent!important}
  body .table-wrap .quick-entry-row{display:none!important}
  body .table-wrap table th:nth-child(1),body .table-wrap table td:nth-child(1),
  body .table-wrap table th:nth-child(2),body .table-wrap table td:nth-child(2),
  body .table-wrap table th:nth-child(3),body .table-wrap table td:nth-child(3),
  body .table-wrap table th:nth-child(7),body .table-wrap table td:nth-child(7),
  body .table-wrap table th:nth-child(8),body .table-wrap table td:nth-child(8),
  body .table-wrap table th:nth-child(10),body .table-wrap table td:nth-child(10){display:none!important}
  body .table-wrap table th:nth-child(4),body .table-wrap table td:nth-child(4){display:table-cell!important;width:22%!important;min-width:0!important}
  body .table-wrap table th:nth-child(5),body .table-wrap table td:nth-child(5){display:table-cell!important;width:28%!important;min-width:0!important}
  body .table-wrap table th:nth-child(6),body .table-wrap table td:nth-child(6){display:table-cell!important;width:9%!important;min-width:0!important}
  body .table-wrap table th:nth-child(9),body .table-wrap table td:nth-child(9){display:table-cell!important;width:16%!important;min-width:0!important}
  body .table-wrap table th:nth-child(11),body .table-wrap table td:nth-child(11){display:table-cell!important;width:17%!important;min-width:0!important}
  body .table-wrap table th:nth-child(12),body .table-wrap table td:nth-child(12){display:table-cell!important;width:8%!important;min-width:0!important}
  body .table-wrap th{height:24px!important;padding:4px 2px!important;border:0!important;background:#e9edff!important;color:#64748b!important;font-size:6px!important;text-align:center!important}

  body .table-wrap #orderTableBody td{height:52px!important;max-height:52px!important;padding:4px 3px!important;background:#fff!important;border-top:1px solid #e2e6f0!important;border-bottom:1px solid #e2e6f0!important;vertical-align:middle!important;overflow:hidden!important;white-space:normal!important}
  body .table-wrap #orderTableBody td:nth-child(4){border-left:1px solid #e2e6f0!important;border-radius:9px 0 0 9px!important;padding-left:5px!important;color:#0b1f7a!important;font-family:var(--head)!important;font-size:8.5px!important;font-weight:900!important;line-height:1.12!important}
  body .table-wrap #orderTableBody td:nth-child(5){color:#334155!important;font-size:8px!important;line-height:1.15!important}

  body .table-wrap #orderTableBody .cell-select{width:100%!important;height:30px!important;min-height:30px!important;padding:2px 12px 2px 2px!important;border-radius:999px!important;font-size:6.4px!important}
  .backdrop{align-items:flex-end!important;padding:0!important}.modal{width:100%!important;max-width:none!important;max-height:92dvh!important;border-radius:17px 17px 0 0!important}
  .form-grid{grid-template-columns:1fr!important}
}
</style>
</head>

        <th><input class="quick-input" id="q_cliente" type="text" placeholder="Cliente"/></th>
        <th><textarea class="quick-input quick-textarea" id="q_descripcion" placeholder="Descripción"></textarea></th>
        <th><input class="quick-input" id="q_cantidad" type="text" value="1"/></th>
        <th>
          <select class="quick-select" id="q_corporeo"></select>
        </th>
        <th>
          <select class="quick-select" id="q_instalacion">
            <option>Por definir</option>
            <option>Sí</option>
            <option>No</option>
          </select>
        </th>
        <th>
          <select class="quick-select" id="q_estatus">
            <option>Solicitud</option>
            <option>En curso</option>
            <option>Revisado</option>
            <option>Listo</option>
          </select>
        </th>
        <th><input class="quick-input" id="q_entrega" type="date"/></th>
        <th>
          <select class="quick-select" id="q_pago">
            <option>Pendiente</option>
            <option>Abonado</option>
            <option>Pagado</option>
          </select>
        </th>
        <th><button class="quick-btn add-symbol-btn" type="button" onclick="saveQuick()">+</button></th>
      </tr>
    </thead>

    <tbody id="orderTableBody"></tbody>
  </table>

  <div id="emptyState" class="empty" style="display:none">— SIN PEDIDOS —</div>
</div>

<div class="backdrop" id="orderBackdrop" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">NUEVO PEDIDO</span>
      <button class="modal-close" type="button" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field"><label>Fecha</label><input type="date" id="f_fecha"/></div>
        <div class="field"><label>Operador</label><select id="f_operador"></select></div>
      </div>

      <div class="field"><label>Cliente</label><input type="text" id="f_cliente"/></div>
      <div class="field"><label>Descripción</label><textarea id="f_descripcion"></textarea></div>

      <div class="form-grid">
        <div class="field"><label>Cantidad</label><input type="text" id="f_cantidad" value="1"/></div>
        <div class="field"><label>Corpóreo</label><select id="f_corporeo"></select></div>
        <div class="field"><label>Instalación</label>
          <select id="f_instalacion"><option>Por definir</option><option>Sí</option><option>No</option></select>
        </div>
        <div class="field"><label>Estatus</label>
          <select id="f_estatus"><option>Solicitud</option><option>En curso</option><option>Revisado</option><option>Listo</option></select>
        </div>
        <div class="field"><label>Fecha entrega</label><input type="date" id="f_entrega"/></div>
        <div class="field"><label>Pago</label>
          <select id="f_pago"><option>Pendiente</option><option>Abonado</option><option>Pagado</option></select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-add secondary" type="button" onclick="closeModal()">Cancelar</button>
      <button class="btn-add" type="button" onclick="saveModal()">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY="tutto_corporeos_prototipo_v1";
const CORPOREOS=[
"ACRILICO 3MM","ACRILICO 5MM","ACRILICO 8MM","ACRILICO LAMINADO",
"AUTOMOTRIZ 15MM","AUTOMOTRIZ 15MM BACKLIGHT","AUTOMOTRIZ 30MM","AUTOMOTRIZ 30MM BACKLIGHT",
"CAJA DE LUZ","FRONT LIT","FRONT LIT SIN LUZ","PVC 15MM + ACRILICO","PVC 15MM LAMINADO",
"PVC 3MM","PVC 5MM LAMINADO","SERVICIO DE CORTE 15MM","SERVICIO DE CORTE 9MM",
"SERVICIO GALVANIZADO","SERVICIO SS"
];
const OPERADORES=["Roberto","Ricardo","Carlos","Chico","Rubén","Marie Gabriela"];
let items=[];
let editId=null;

function $(id){return document.getElementById(id)}
function today(){return new Date().toISOString().slice(0,10)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim()}
function toast(msg){const t=$("toast");t.textContent=msg;t.style.display="block";clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.style.display="none",1800)}
function estadoClass(v){const n=norm(v);if(n==="solicitud")return"estado-solicitud";if(n==="en curso")return"estado-en-curso";if(n==="revisado")return"estado-revisado";if(n==="listo")return"estado-listo";return""}
function pagoClass(v){const n=norm(v);if(n==="pendiente")return"pago-pendiente";if(n==="abonado")return"pago-abonado";if(n==="pagado")return"pago-pagado";return""}
function id(){return Date.now()+Math.floor(Math.random()*1000)}

function load(){
  try{items=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]")}catch(e){items=[]}
}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(items))}

function fillSelect(id,values,first){
  const el=$(id); if(!el)return;
  el.innerHTML=(first?`<option value="">${first}</option>`:"")+values.map(v=>`<option>${esc(v)}</option>`).join("");
}
function init(){
  fillSelect("q_corporeo",CORPOREOS,"Corpóreo");
  fillSelect("f_corporeo",CORPOREOS,"Seleccionar...");
  fillSelect("q_operador",OPERADORES,"Operador");
  fillSelect("f_operador",OPERADORES,"Seleccionar...");
  fillSelect("filterOperador",OPERADORES,"Operador");
  $("q_fecha").value=today(); $("f_fecha").value=today();

  $("mobileMenuBtn").addEventListener("click",()=>$("authMenu").classList.toggle("open"));
  load(); render();
}

function clearQuick(){
  $("q_fecha").value=today();$("q_operador").value="";$("q_cliente").value="";$("q_descripcion").value="";
  $("q_cantidad").value="1";$("q_corporeo").value="";$("q_instalacion").value="Por definir";
  $("q_estatus").value="Solicitud";$("q_entrega").value="";$("q_pago").value="Pendiente";
}

function saveQuick(){
  const cliente=$("q_cliente").value.trim(), desc=$("q_descripcion").value.trim();
  if(!cliente){toast("Falta cliente");return}
  if(!desc){toast("Falta descripción");return}
  items.unshift({
    id:id(),fecha:$("q_fecha").value||today(),operador:$("q_operador").value,cliente,descripcion:desc,
    cantidad:$("q_cantidad").value||"1",corporeo:$("q_corporeo").value,instalacion:$("q_instalacion").value,
    estatus:$("q_estatus").value,entrega:$("q_entrega").value,pago:$("q_pago").value
  });
  save();clearQuick();render();toast("Pedido agregado");
}

function render(){
  const q=norm($("searchInput").value), st=$("filterStatus").value, pg=$("filterPago").value,
        op=$("filterOperador").value, fd=$("filterFechaDesde").value, fh=$("filterFechaHasta").value;
  const list=items.filter(x=>{
    const matchQ=!q||norm([x.cliente,x.descripcion,x.operador,x.corporeo,x.instalacion].join(" ")).includes(q);
    return matchQ && (!st||x.estatus===st) && (!pg||x.pago===pg) && (!op||x.operador===op) &&
           (!fd||x.fecha>=fd) && (!fh||x.fecha<=fh);
  });
  $("emptyState").style.display=list.length?"none":"block";
  $("orderTableBody").innerHTML=list.map((x,i)=>`
    <tr onclick="openModal('${x.id}')">
      <td>${i+1}</td>
      <td>${esc(x.fecha||"")}</td>
      <td>${esc(x.operador||"")}</td>
      <td>${esc(x.cliente||"")}</td>
      <td title="${esc(x.descripcion||"")}">${esc(x.descripcion||"")}</td>
      <td>${esc(x.cantidad||"")}</td>
      <td>${esc(x.corporeo||"")}</td>
      <td>${esc(x.instalacion||"")}</td>
      <td><select class="cell-select ${estadoClass(x.estatus)}" onclick="event.stopPropagation()" onchange="updateField('${x.id}','estatus',this.value);this.className='cell-select '+estadoClass(this.value)">
        ${["Solicitud","En curso","Revisado","Listo"].map(v=>`<option ${x.estatus===v?"selected":""}>${v}</option>`).join("")}
      </select></td>
      <td>${esc(x.entrega||"")}</td>
      <td><select class="cell-select ${pagoClass(x.pago)}" onclick="event.stopPropagation()" onchange="updateField('${x.id}','pago',this.value);this.className='cell-select '+pagoClass(this.value)">
        ${["Pendiente","Abonado","Pagado"].map(v=>`<option ${x.pago===v?"selected":""}>${v}</option>`).join("")}
      </select></td>
      <td><button class="action-btn" onclick="event.stopPropagation();openModal('${x.id}')">•••</button></td>
    </tr>`).join("");
}

function updateField(itemId,key,val){
  const x=items.find(i=>String(i.id)===String(itemId));if(!x)return;x[key]=val;save();
}

function openModal(itemId){
  editId=itemId||null;
  const x=items.find(i=>String(i.id)===String(itemId));
  $("modalTitle").textContent=x?"EDITAR PEDIDO":"NUEVO PEDIDO";
  $("f_fecha").value=x?.fecha||today();$("f_operador").value=x?.operador||"";$("f_cliente").value=x?.cliente||"";
  $("f_descripcion").value=x?.descripcion||"";$("f_cantidad").value=x?.cantidad||"1";$("f_corporeo").value=x?.corporeo||"";
  $("f_instalacion").value=x?.instalacion||"Por definir";$("f_estatus").value=x?.estatus||"Solicitud";
  $("f_entrega").value=x?.entrega||"";$("f_pago").value=x?.pago||"Pendiente";
  $("orderBackdrop").style.display="flex";
}
function closeModal(){$("orderBackdrop").style.display="none";editId=null}
function saveModal(){
  const data={fecha:$("f_fecha").value||today(),operador:$("f_operador").value,cliente:$("f_cliente").value.trim(),
    descripcion:$("f_descripcion").value.trim(),cantidad:$("f_cantidad").value||"1",corporeo:$("f_corporeo").value,
    instalacion:$("f_instalacion").value,estatus:$("f_estatus").value,entrega:$("f_entrega").value,pago:$("f_pago").value};
  if(!data.cliente){toast("Falta cliente");return} if(!data.descripcion){toast("Falta descripción");return}
  if(editId){const x=items.find(i=>String(i.id)===String(editId));Object.assign(x,data)}
  else items.unshift({id:id(),...data});
  save();closeModal();render();toast("Guardado");
}
document.addEventListener("DOMContentLoaded",init);
</script>
</body>
</html>
