<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Listado · Tuttovinilos</title>

<link rel="stylesheet" href="css/menu.css?v=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --blue:#2233cc;
  --blue-dark:#1628b0;
  --orange:#e85d20;
  --bg:#eef0f8;
  --card:#fff;
  --text:#111827;
  --muted:#6b7280;
  --border:#d9deea;
  --green:#16a34a;
  --red:#dc2626;
}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:95px;
}

.page{
  max-width:520px;
  margin:0 auto;
}

.header{
  position:sticky;
  top:0;
  z-index:40;
  background:linear-gradient(135deg,var(--blue),var(--blue-dark));
  padding:14px;
  box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.logo{
  color:#fff;
  font-size:22px;
  font-weight:900;
}

.logo span{color:var(--orange)}

.admin-btn{
  border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.14);
  color:#fff;
  border-radius:999px;
  padding:8px 12px;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
}

.search-wrap{position:relative}

.search{
  width:100%;
  border:none;
  border-radius:14px;
  padding:15px 42px;
  font-size:16px;
  font-weight:700;
  outline:none;
}

.search-icon{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
}

.clear{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  border:none;
  background:#eef0f8;
  width:28px;
  height:28px;
  border-radius:50%;
  font-weight:900;
  display:none;
}

.clear.show{display:block}

.section{padding:18px 14px 0}

.section-title{
  display:flex;
  gap:8px;
  align-items:center;
  margin-bottom:10px;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1.5px;
  font-weight:900;
  color:var(--muted);
}

.section-title span:first-child{color:var(--orange)}
.section-title .line{flex:1;height:1px;background:var(--border)}

.chips{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:6px;
}

.chip{
  min-width:135px;
  background:#fff;
  border-radius:13px;
  padding:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  flex:0 0 auto;
  cursor:pointer;
}

.chip.hot{
  background:var(--blue);
  color:#fff;
}

.chip-name{
  font-size:12px;
  font-weight:800;
  line-height:1.2;
}

.chip-price{
  margin-top:5px;
  font-size:18px;
  font-weight:900;
  color:var(--blue);
}

.chip.hot .chip-price{color:#fff}

.chip-price small{
  font-size:9px;
  color:var(--muted);
}

.chip.hot small{color:rgba(255,255,255,.6)}

.item{
  background:#fff;
  border-radius:15px;
  margin-bottom:9px;
  overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.item-head{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  cursor:pointer;
}

.item.expanded .item-head{
  background:var(--blue);
  color:#fff;
}

.item-info{flex:1;min-width:0}

.item-name{
  font-size:14px;
  font-weight:900;
}

.item-cat{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
  font-weight:700;
}

.item.expanded .item-cat{color:rgba(255,255,255,.6)}

.item-minimo{
  margin-top:4px;
  font-size:11px;
  font-weight:900;
  color:var(--orange);
}

.item.expanded .item-minimo{color:#ffb18d}

.price-box{text-align:right}

.price{
  color:var(--blue);
  font-size:21px;
  font-weight:900;
}

.item.expanded .price{color:#fff}

.unit{
  font-size:9px;
  color:var(--muted);
  font-weight:800;
  text-transform:uppercase;
}

.item.expanded .unit{color:rgba(255,255,255,.6)}

.detail{display:none;padding:14px}
.item.expanded .detail{display:block}

.note{
  background:#f8f9ff;
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px;
  font-size:12px;
  line-height:1.45;
  color:#475569;
  font-weight:600;
  margin-bottom:10px;
}

.copy-btn{
  width:100%;
  border:none;
  background:var(--blue);
  color:#fff;
  border-radius:12px;
  padding:12px;
  font-weight:900;
  font-size:13px;
  cursor:pointer;
}

.copy-btn:active{transform:scale(.98)}

.admin-panel{
  display:none;
  background:#fff;
  margin:14px;
  border-radius:16px;
  padding:14px;
  box-shadow:0 3px 14px rgba(0,0,0,.08);
}

.admin-panel.show{display:block}

.form-title{
  font-size:15px;
  font-weight:900;
  margin-bottom:12px;
}

.form-grid{
  display:grid;
  gap:9px;
}

label{
  font-size:10px;
  color:var(--muted);
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:1px;
}

input,select,textarea{
  width:100%;
  border:1px solid var(--border);
  border-radius:10px;
  padding:11px;
  font-family:'Inter';
  font-size:14px;
  font-weight:700;
  outline:none;
}

textarea{min-height:70px;resize:vertical}

.row2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.check-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:5px;
  font-size:13px;
  font-weight:800;
}

.check-row input{width:auto}

.actions{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.btn{
  flex:1;
  border:none;
  border-radius:11px;
  padding:12px;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
}

.btn-save{background:var(--blue);color:#fff}
.btn-clear{background:#e5e7eb;color:#111827}
.btn-danger{background:var(--red);color:#fff}

.empty{
  text-align:center;
  padding:40px 20px;
  color:var(--muted);
  font-weight:800;
}

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%) translateY(80px);
  background:#111827;
  color:#fff;
  padding:12px 18px;
  border-radius:999px;
  font-size:13px;
  font-weight:900;
  opacity:0;
  transition:.22s;
  z-index:300;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div id="menu"></div>

<div class="page">

  <header class="header">
    <div class="top">
      <div class="logo">TUTTO<span>▲</span></div>
      <button class="admin-btn" onclick="toggleAdmin()">⚙️ Administrar</button>
    </div>

    <div class="search-wrap">
      <span class="search-icon">🔎</span>
      <input id="search" class="search" placeholder="Buscar vinil, lona, barniz..." autocomplete="off">
      <button id="clearBtn" class="clear" onclick="clearSearch()">×</button>
    </div>
  </header>

  <section class="section" id="quickSection">
    <div class="section-title">
      <span>★</span>
      <b>Destacados</b>
      <span class="line"></span>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <section class="admin-panel" id="adminPanel">
    <div class="form-title" id="formTitle">Agregar ítem</div>

    <div class="form-grid">
      <div>
        <label>Nombre del ítem</label>
        <input id="fNombre" placeholder="Ej: Vinil holográfico con barniz">
      </div>

      <div>
        <label>Categoría</label>
        <input id="fCategoria" placeholder="Ej: Vinil adhesivo">
      </div>

      <div class="row2">
        <div>
          <label>Precio</label>
          <input id="fPrecio" type="number" step="0.01" placeholder="Ej: 23">
        </div>
        <div>
          <label>Unidad</label>
          <select id="fUnidad">
            <option value="m²">m²</option>
            <option value="unidad">unidad</option>
            <option value="pliego">pliego</option>
            <option value="metro lineal">metro lineal</option>
          </select>
        </div>
      </div>

      <div class="row2">
        <div>
          <label>Cantidad mínima</label>
          <input id="fMinimo" type="number" step="0.01" placeholder="Ej: 1">
        </div>
        <div>
          <label>Tipo mínimo</label>
          <select id="fTipoMinimo">
            <option value="m²">m²</option>
            <option value="unidad">unidad</option>
            <option value="pliego">pliego</option>
            <option value="metro lineal">metro lineal</option>
          </select>
        </div>
      </div>

      <div>
        <label>Palabras clave</label>
        <input id="fKeywords" placeholder="vinil sticker etiqueta barniz">
      </div>

      <div>
        <label>Nota</label>
        <textarea id="fNota" placeholder="Ej: Incluye impresión UV + barniz. Mínimo recomendado 1m²."></textarea>
      </div>

      <label class="check-row">
        <input type="checkbox" id="fDestacado">
        Mostrar en destacados
      </label>

      <label class="check-row">
        <input type="checkbox" id="fActivo" checked>
        Activo / visible
      </label>
    </div>

    <div class="actions">
      <button class="btn btn-save" onclick="saveItem()">Guardar</button>
      <button class="btn btn-clear" onclick="resetForm()">Limpiar</button>
      <button class="btn btn-danger" onclick="deleteEditingItem()">Eliminar</button>
    </div>
  </section>

  <section class="section">
    <div class="section-title">
      <span>01</span>
      <b>Listado de precios</b>
      <span class="line"></span>
    </div>

    <div id="results"></div>
  </section>

</div>

<div class="toast" id="toast">Guardado</div>

<script src="js/menu.js?v=1"></script>

<script>
const STORAGE_KEY = 'tutto_listado_items_v1';

let editingId = null;
let expandedId = null;
let query = '';

const defaultItems = [
  {
    id:'vinil-blanco-sb',
    nombre:'Vinil blanco sin barniz',
    categoria:'Vinil adhesivo',
    precio:15,
    unidad:'m²',
    cantidadMinima:1,
    tipoMinimo:'m²',
    nota:'Precio base por metro cuadrado.',
    keywords:'vinil blanco sticker etiqueta sin barniz',
    destacado:true,
    activo:true
  },
  {
    id:'vinil-blanco-cb',
    nombre:'Vinil blanco con barniz',
    categoria:'Vinil adhesivo',
    precio:20,
    unidad:'m²',
    cantidadMinima:1,
    tipoMinimo:'m²',
    nota:'Incluye impresión UV + barniz.',
    keywords:'vinil blanco sticker etiqueta barniz',
    destacado:true,
    activo:true
  },
  {
    id:'holografico-cb',
    nombre:'Vinil holográfico con barniz',
    categoria:'Vinil adhesivo',
    precio:23,
    unidad:'m²',
    cantidadMinima:1,
    tipoMinimo:'m²',
    nota:'Ideal para stickers premium.',
    keywords:'holografico holo sticker etiqueta barniz',
    destacado:true,
    activo:true
  },
  {
    id:'lona',
    nombre:'Lona impresa',
    categoria:'Lona / Banner',
    precio:15,
    unidad:'m²',
    cantidadMinima:1,
    tipoMinimo:'m²',
    nota:'Precio por metro cuadrado.',
    keywords:'lona banner pendon pancarta',
    destacado:true,
    activo:true
  }
];

let items = loadItems();

function loadItems(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved) return JSON.parse(saved);
  }catch(e){}
  return defaultItems;
}

function saveStorage(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}

function normalize(text){
  return String(text || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .trim();
}

function filteredItems(){
  return items.filter(item => {
    if(!item.activo) return false;
    if(!query) return true;

    const haystack = normalize(
      item.nombre + ' ' +
      item.categoria + ' ' +
      item.keywords + ' ' +
      item.nota
    );

    return query.split(/\s+/).every(t => haystack.includes(normalize(t)));
  });
}

function render(){
  renderChips();
  renderResults();
}

function renderChips(){
  const box = document.getElementById('chips');
  const destacados = items.filter(i => i.destacado && i.activo);

  if(!destacados.length){
    document.getElementById('quickSection').style.display = 'none';
    return;
  }

  document.getElementById('quickSection').style.display = query ? 'none' : '';

  box.innerHTML = destacados.map(item => `
    <div class="chip hot" onclick="openItem('${item.id}')">
      <div class="chip-name">${item.nombre}</div>
      <div class="chip-price">$${Number(item.precio || 0).toFixed(2)} <small>/${item.unidad}</small></div>
    </div>
  `).join('');
}

function renderResults(){
  const box = document.getElementById('results');
  const list = filteredItems();

  if(!list.length){
    box.innerHTML = `<div class="empty">No hay resultados</div>`;
    return;
  }

  box.innerHTML = list.map(item => `
    <div class="item ${expandedId === item.id ? 'expanded' : ''}">
      <div class="item-head" onclick="toggleItem('${item.id}')">
        <div class="item-info">
          <div class="item-name">${item.nombre}</div>
          <div class="item-cat">${item.categoria}</div>
          ${item.cantidadMinima ? `
            <div class="item-minimo">Mínimo: ${item.cantidadMinima} ${item.tipoMinimo || item.unidad}</div>
          ` : ''}
        </div>

        <div class="price-box">
          <div class="price">$${Number(item.precio || 0).toFixed(2)}</div>
          <div class="unit">/${item.unidad}</div>
        </div>
      </div>

      <div class="detail">
        ${item.nota ? `<div class="note">${item.nota}</div>` : ''}

        <button class="copy-btn" onclick="copyItem('${item.id}')">📋 Copiar para WhatsApp</button>

        <div class="actions" style="margin-top:10px">
          <button class="btn btn-clear" onclick="editItem('${item.id}')">Editar</button>
        </div>
      </div>
    </div>
  `).join('');
}

function toggleItem(id){
  expandedId = expandedId === id ? null : id;
  renderResults();
}

function openItem(id){
  expandedId = id;
  renderResults();

  setTimeout(() => {
    const el = [...document.querySelectorAll('.item')]
      .find(x => x.innerText.includes(items.find(i => i.id === id)?.nombre || ''));
    if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
  },80);
}

function toggleAdmin(){
  document.getElementById('adminPanel').classList.toggle('show');
}

function saveItem(){
  const item = {
    id: editingId || 'item-' + Date.now(),
    nombre: document.getElementById('fNombre').value.trim(),
    categoria: document.getElementById('fCategoria').value.trim(),
    precio: parseFloat(document.getElementById('fPrecio').value) || 0,
    unidad: document.getElementById('fUnidad').value,
    cantidadMinima: parseFloat(document.getElementById('fMinimo').value) || 0,
    tipoMinimo: document.getElementById('fTipoMinimo').value,
    keywords: document.getElementById('fKeywords').value.trim(),
    nota: document.getElementById('fNota').value.trim(),
    destacado: document.getElementById('fDestacado').checked,
    activo: document.getElementById('fActivo').checked
  };

  if(!item.nombre){
    alert('Coloca el nombre del ítem.');
    return;
  }

  if(editingId){
    items = items.map(i => i.id === editingId ? item : i);
  }else{
    items.push(item);
  }

  saveStorage();
  resetForm();
  render();
  showToast('Ítem guardado');
}

function editItem(id){
  const item = items.find(i => i.id === id);
  if(!item) return;

  editingId = id;

  document.getElementById('formTitle').textContent = 'Editando ítem';
  document.getElementById('adminPanel').classList.add('show');

  document.getElementById('fNombre').value = item.nombre || '';
  document.getElementById('fCategoria').value = item.categoria || '';
  document.getElementById('fPrecio').value = item.precio || '';
  document.getElementById('fUnidad').value = item.unidad || 'm²';
  document.getElementById('fMinimo').value = item.cantidadMinima || '';
  document.getElementById('fTipoMinimo').value = item.tipoMinimo || item.unidad || 'm²';
  document.getElementById('fKeywords').value = item.keywords || '';
  document.getElementById('fNota').value = item.nota || '';
  document.getElementById('fDestacado').checked = !!item.destacado;
  document.getElementById('fActivo').checked = item.activo !== false;

  window.scrollTo({top:0,behavior:'smooth'});
}

function resetForm(){
  editingId = null;
  document.getElementById('formTitle').textContent = 'Agregar ítem';

  ['fNombre','fCategoria','fPrecio','fMinimo','fKeywords','fNota'].forEach(id => {
    document.getElementById(id).value = '';
  });

  document.getElementById('fUnidad').value = 'm²';
  document.getElementById('fTipoMinimo').value = 'm²';
  document.getElementById('fDestacado').checked = false;
  document.getElementById('fActivo').checked = true;
}

function deleteEditingItem(){
  if(!editingId){
    alert('Primero selecciona un ítem para editar.');
    return;
  }

  if(!confirm('¿Seguro que deseas eliminar este ítem?')){
    return;
  }

  items = items.filter(i => i.id !== editingId);
  saveStorage();
  resetForm();
  render();
  showToast('Ítem eliminado');
}

function copyItem(id){
  const item = items.find(i => i.id === id);
  if(!item) return;

  const text =
`${item.nombre}
Precio: $${Number(item.precio || 0).toFixed(2)} / ${item.unidad}
${item.cantidadMinima ? `Mínimo: ${item.cantidadMinima} ${item.tipoMinimo || item.unidad}` : ''}
${item.nota ? `Nota: ${item.nota}` : ''}`;

  if(navigator.clipboard){
    navigator.clipboard.writeText(text);
  }else{
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }

  showToast('Copiado para WhatsApp');
}

function clearSearch(){
  document.getElementById('search').value = '';
  query = '';
  document.getElementById('clearBtn').classList.remove('show');
  render();
}

function showToast(msg){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');

  clearTimeout(showToast.t);
  showToast.t = setTimeout(() => {
    toast.classList.remove('show');
  },1600);
}

document.getElementById('search').addEventListener('input', e => {
  query = normalize(e.target.value);
  document.getElementById('clearBtn').classList.toggle('show', !!query);
  render();
});

render();
</script>

</body>
</html>
