<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Listado de Precios · Tuttovinilos</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --blue:#2233cc;
  --blue-dark:#1628b0;
  --blue-darker:#0f1d8c;
  --orange:#e85d20;
  --orange-light:#ff7a3d;
  --bg:#eef0f8;
  --card:#ffffff;
  --text:#0f1323;
  --muted:#8890b0;
  --muted-dark:#5e6586;
  --border:#dde0ef;
  --green:#1ab575;
  --red:#ef4444;
}

html,body{
  -webkit-tap-highlight-color:transparent;
}

body{
  background:var(--bg);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  max-width:520px;
  margin:0 auto;
  padding-bottom:90px;
  color:var(--text);
}

/* HEADER */
.header{
  background:linear-gradient(135deg,var(--blue),var(--blue-darker));
  padding:14px 16px 14px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 4px 20px rgba(34,51,204,.18);
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.logo{
  font-size:22px;
  font-weight:900;
  color:#fff;
  letter-spacing:-.7px;
  line-height:1;
}

.logo span{
  color:var(--orange-light);
}

.logo small{
  display:block;
  font-size:9px;
  margin-top:3px;
  font-weight:700;
  color:rgba(255,255,255,.55);
  text-transform:uppercase;
  letter-spacing:2px;
}

.header-pill{
  font-size:10px;
  color:#fff;
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.18);
  border-radius:999px;
  padding:7px 10px;
  font-weight:800;
}

/* SEARCH */
.search-box{
  position:relative;
}

.search-input{
  width:100%;
  background:#fff;
  border:2px solid transparent;
  border-radius:15px;
  padding:15px 44px 15px 43px;
  font-family:'Inter',sans-serif;
  font-size:16px;
  font-weight:700;
  color:var(--text);
  outline:none;
  box-shadow:0 5px 20px rgba(0,0,0,.10);
}

.search-input:focus{
  border-color:var(--orange);
}

.search-input::placeholder{
  color:var(--muted);
  font-weight:600;
}

.search-icon{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
}

.search-clear{
  position:absolute;
  right:11px;
  top:50%;
  transform:translateY(-50%);
  width:28px;
  height:28px;
  border-radius:50%;
  border:none;
  background:var(--bg);
  color:var(--muted-dark);
  display:none;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:900;
}

.search-clear.show{
  display:flex;
}

/* SECTION */
.section{
  padding:18px 14px 0;
}

.section-title{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:11px;
}

.section-title .num{
  color:var(--orange);
  font-size:10px;
  font-weight:900;
  letter-spacing:1.5px;
}

.section-title .label{
  color:var(--muted);
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:1.8px;
}

.section-title .line{
  flex:1;
  height:1px;
  background:var(--border);
}

/* CHIPS */
.chips{
  display:flex;
  gap:9px;
  overflow-x:auto;
  margin:0 -14px;
  padding:2px 14px 5px;
  scrollbar-width:none;
}

.chips::-webkit-scrollbar{
  display:none;
}

.chip{
  flex:0 0 auto;
  min-width:138px;
  background:#fff;
  border-radius:14px;
  padding:13px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
  border:2px solid transparent;
  cursor:pointer;
}

.chip:active{
  transform:scale(.97);
}

.chip.hot{
  background:var(--blue);
}

.chip.hot .chip-name{
  color:#fff;
}

.chip.hot .chip-price{
  color:#fff;
}

.chip-name{
  font-size:12px;
  font-weight:800;
  line-height:1.2;
  margin-bottom:5px;
}

.chip-price{
  font-size:18px;
  font-weight:900;
  color:var(--blue);
}

.chip-price small{
  font-size:9px;
  color:var(--muted);
  font-weight:800;
}

.chip.hot .chip-price small{
  color:rgba(255,255,255,.55);
}

/* RESULTS */
.result{
  background:#fff;
  border-radius:15px;
  margin-bottom:9px;
  overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.055);
}

.result-head{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 15px;
  cursor:pointer;
}

.result.expanded{
  box-shadow:0 7px 25px rgba(34,51,204,.16);
}

.result.expanded .result-head{
  background:var(--blue);
}

.result.expanded .res-name,
.result.expanded .res-price{
  color:#fff;
}

.result.expanded .res-cat,
.result.expanded .res-unit,
.result.expanded .res-chevron{
  color:rgba(255,255,255,.60);
}

.result.expanded .res-chevron{
  transform:rotate(180deg);
}

.res-info{
  flex:1;
  min-width:0;
}

.res-name{
  font-size:14px;
  font-weight:900;
  line-height:1.25;
}

.res-cat{
  font-size:10.5px;
  color:var(--muted);
  font-weight:700;
  margin-top:3px;
}

.res-tag{
  display:inline-block;
  background:var(--orange);
  color:#fff;
  font-size:9px;
  font-weight:900;
  padding:2px 6px;
  border-radius:5px;
  margin-left:5px;
}

.res-price-block{
  text-align:right;
  flex-shrink:0;
}

.res-price{
  font-size:21px;
  line-height:1;
  color:var(--blue);
  font-weight:900;
}

.res-price sup{
  font-size:11px;
  margin-right:1px;
}

.res-price.consult{
  font-size:13px;
  color:var(--orange);
  font-style:italic;
}

.res-unit{
  color:var(--muted);
  font-size:9px;
  font-weight:800;
  text-transform:uppercase;
  margin-top:3px;
}

.res-chevron{
  color:var(--muted);
  transition:.2s;
}

/* DETAIL */
.res-detail{
  display:none;
  background:#fff;
}

.result.expanded .res-detail{
  display:block;
  animation:show .18s ease;
}

@keyframes show{
  from{opacity:0;transform:translateY(-5px);}
  to{opacity:1;transform:translateY(0);}
}

.mode-toggle{
  display:flex;
  background:var(--bg);
  margin:14px 14px 0;
  padding:3px;
  border-radius:11px;
}

.mode-btn{
  flex:1;
  border:none;
  background:transparent;
  border-radius:9px;
  padding:10px 6px;
  font-family:'Inter';
  font-size:11px;
  font-weight:900;
  color:var(--muted-dark);
}

.mode-btn.active{
  background:#fff;
  color:var(--blue);
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.calc-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  padding:14px;
}

.calc-box{
  background:var(--bg);
  border-radius:11px;
  padding:10px 11px;
}

.calc-label{
  font-size:9px;
  font-weight:900;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:4px;
}

.calc-input{
  width:100%;
  border:none;
  background:transparent;
  outline:none;
  font-family:'Inter';
  font-size:20px;
  font-weight:900;
  color:var(--text);
}

.calc-suffix{
  font-size:10px;
  font-weight:800;
  color:var(--muted);
}

.calc-total{
  margin:0 14px 14px;
  background:linear-gradient(135deg,var(--blue),var(--blue-darker));
  border-radius:14px;
  padding:15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  color:#fff;
}

.calc-total-label{
  font-size:10px;
  color:rgba(255,255,255,.60);
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:1.5px;
}

.calc-total-val{
  font-size:28px;
  line-height:1;
  font-weight:900;
  letter-spacing:-1px;
}

.calc-breakdown{
  font-size:10px;
  color:rgba(255,255,255,.60);
  font-weight:700;
  margin-top:4px;
}

.copy-btn{
  background:rgba(255,255,255,.14);
  border:1.5px solid rgba(255,255,255,.24);
  color:#fff;
  border-radius:11px;
  padding:10px 12px;
  font-family:'Inter';
  font-size:11px;
  font-weight:900;
  cursor:pointer;
  white-space:nowrap;
}

.copy-btn.copied{
  background:var(--green);
  border-color:var(--green);
}

.extras{
  padding:0 14px 14px;
}

.extras-title{
  color:var(--muted);
  font-size:9px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:1.7px;
  margin-bottom:8px;
}

.extra-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:var(--bg);
  border-radius:10px;
  padding:10px 12px;
  margin-bottom:7px;
  cursor:pointer;
}

.extra-row.active{
  background:var(--orange);
  color:#fff;
}

.extra-name{
  font-size:12px;
  font-weight:900;
}

.extra-note{
  font-size:10px;
  color:var(--muted);
  font-weight:700;
  margin-top:2px;
}

.extra-row.active .extra-note{
  color:rgba(255,255,255,.70);
}

.extra-val{
  font-size:13px;
  color:var(--orange);
  font-weight:900;
}

.extra-row.active .extra-val{
  color:#fff;
}

.note-box{
  margin:0 14px 14px;
  background:#f8f9ff;
  border:1px solid var(--border);
  border-radius:11px;
  padding:11px;
  font-size:11px;
  color:var(--muted-dark);
  line-height:1.45;
  font-weight:700;
}

.no-results{
  text-align:center;
  padding:50px 20px;
  color:var(--muted);
}

.no-results-icon{
  font-size:35px;
  opacity:.35;
  margin-bottom:8px;
}

.no-results-text{
  font-size:14px;
  font-weight:900;
}

mark{
  background:rgba(232,93,32,.22);
  color:var(--orange);
  padding:0 2px;
  border-radius:3px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translateX(-50%) translateY(80px);
  opacity:0;
  background:var(--text);
  color:#fff;
  padding:12px 18px;
  border-radius:999px;
  font-size:13px;
  font-weight:900;
  box-shadow:0 8px 30px rgba(0,0,0,.25);
  transition:.25s;
  z-index:200;
  pointer-events:none;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media(max-width:390px){
  .res-price{
    font-size:18px;
  }

  .calc-total{
    align-items:flex-start;
    flex-direction:column;
  }

  .copy-btn{
    width:100%;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-top">
    <div class="logo">TUTTO<span>▲</span><small>Listado</small></div>
    <div class="header-pill">Precios rápidos</div>
  </div>

  <div class="search-box">
    <svg class="search-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.35-4.35"></path>
    </svg>

    <input id="search" class="search-input" type="text" placeholder="Buscar vinil, lona, barniz..." autocomplete="off">
    <button id="clearBtn" class="search-clear">×</button>
  </div>
</header>

<section class="section" id="quickSection">
  <div class="section-title">
    <span class="num">★</span>
    <span class="label">Más usados</span>
    <span class="line"></span>
  </div>
  <div class="chips" id="chips"></div>
</section>

<section class="section">
  <div class="section-title">
    <span class="num" id="resultsNum">01</span>
    <span class="label" id="resultsLabel">Listado de precios</span>
    <span class="line"></span>
  </div>

  <div id="results"></div>
</section>

<div class="toast" id="toast">Copiado</div>

<script>
const products = [
  {
    id:'vinil-blanco',
    cat:'Vinil adhesivo',
    name:'Vinil blanco sin barniz',
    price:15,
    unit:'m²',
    hot:true,
    keywords:'vinil blanco sticker etiqueta normal sin barniz mate brillante',
    extras:[
      {id:'troquel',name:'Troquel / Die-cut',val:5,unit:'m²',note:'Corte por forma'}
    ]
  },
  {
    id:'vinil-blanco-barniz',
    cat:'Vinil adhesivo',
    name:'Vinil blanco con barniz',
    price:20,
    unit:'m²',
    hot:true,
    keywords:'vinil blanco barniz sticker etiqueta uv',
    extras:[
      {id:'troquel',name:'Troquel / Die-cut',val:5,unit:'m²',note:'Corte por forma'}
    ]
  },
  {
    id:'holografico',
    cat:'Vinil adhesivo',
    name:'Vinil holográfico sin barniz',
    price:18,
    unit:'m²',
    hot:true,
    keywords:'holografico holo etiqueta sticker sin barniz',
    extras:[
      {id:'troquel',name:'Troquel / Die-cut',val:5,unit:'m²',note:'Corte por forma'}
    ]
  },
  {
    id:'holografico-barniz',
    cat:'Vinil adhesivo',
    name:'Vinil holográfico con barniz',
    price:23,
    unit:'m²',
    tag:'TOP',
    keywords:'holografico holo barniz etiqueta sticker',
    extras:[
      {id:'troquel',name:'Troquel / Die-cut',val:5,unit:'m²',note:'Corte por forma'}
    ]
  },
  {
    id:'clear',
    cat:'Vinil adhesivo',
    name:'Vinil clear transparente',
    consult:true,
    keywords:'clear transparente vinil sticker'
  },
  {
    id:'lona',
    cat:'Lona / Banner',
    name:'Lona impresa',
    price:15,
    unit:'m²',
    hot:true,
    keywords:'lona banner pendon pancarta',
    extras:[
      {id:'ojales',name:'Ojales metálicos',val:5,unit:'unidad',perUnit:true,note:'Precio por unidad'}
    ]
  },
  {
    id:'sulfato',
    cat:'Sulfato',
    name:'Pliego sulfato 70×100',
    price:14,
    unit:'pliego',
    hot:true,
    keywords:'sulfato pliego caja packaging 70x100',
    note:'Área imprimible aproximada 68×80 cm.',
    extras:[
      {id:'doble',name:'Doble cara',val:14,unit:'pliego',note:'Suma otro lado impreso'}
    ]
  },
  {
    id:'llaveros',
    cat:'Llaveros',
    name:'Llaveros con herraje',
    price:800,
    unit:'m²',
    keywords:'llavero llaveros acrilico herraje',
    note:'Precio calculado por m² de producción.'
  },
  {
    id:'barniz-selectivo',
    cat:'UV especial',
    name:'Barniz selectivo',
    consult:true,
    keywords:'barniz selectivo uv spot'
  },
  {
    id:'tinta-blanca',
    cat:'UV especial',
    name:'Tinta blanca UV',
    consult:true,
    keywords:'tinta blanca uv transparente base blanca'
  },
  {
    id:'relieve',
    cat:'UV especial',
    name:'Impresión relieve 2.5D',
    consult:true,
    keywords:'relieve 2.5d capas uv textura'
  }
];

let query = '';
let expanded = null;
let modes = {};
let calcs = {};

function normalizeText(txt){
  return String(txt || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'');
}

function scoreProduct(p,q){
  if(!q.trim()) return 1;

  const haystack = normalizeText(`${p.name} ${p.cat} ${p.keywords || ''}`);
  const tokens = normalizeText(q).split(/\s+/).filter(Boolean);

  let score = 0;

  for(const token of tokens){
    if(haystack.includes(token)){
      score += 1;
    }else{
      return 0;
    }
  }

  if(normalizeText(p.name).includes(normalizeText(q))) score += 2;
  if(p.hot) score += .3;

  return score;
}

function getFilteredProducts(){
  if(!query.trim()) return products;

  return products
    .map(p => ({p,score:scoreProduct(p,query)}))
    .filter(x => x.score > 0)
    .sort((a,b) => b.score - a.score)
    .map(x => x.p);
}

function highlight(text,q){
  if(!q.trim()) return text;

  let result = text;
  const tokens = q.split(/\s+/).filter(Boolean);

  tokens.forEach(token => {
    const safe = token.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const re = new RegExp(`(${safe})`,'gi');
    result = result.replace(re,'<mark>$1</mark>');
  });

  return result;
}

function renderChips(){
  const box = document.getElementById('chips');
  const hot = products.filter(p => p.hot);

  box.innerHTML = hot.map(p => `
    <div class="chip ${p.hot ? 'hot' : ''}" data-id="${p.id}">
      <div class="chip-name">${p.name}</div>
      <div class="chip-price">
        ${p.consult ? 'Consultar' : `$${p.price}<small>/${p.unit}</small>`}
      </div>
    </div>
  `).join('');

  box.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click',() => {
      expanded = chip.dataset.id;
      renderResults();

      setTimeout(() => {
        const card = document.querySelector(`.result[data-id="${expanded}"]`);
        if(card) card.scrollIntoView({behavior:'smooth',block:'center'});
      },60);
    });
  });
}

function renderResults(){
  const list = getFilteredProducts();
  const results = document.getElementById('results');
  const quickSection = document.getElementById('quickSection');
  const resultsNum = document.getElementById('resultsNum');
  const resultsLabel = document.getElementById('resultsLabel');

  quickSection.style.display = query.trim() ? 'none' : '';

  if(query.trim()){
    resultsNum.textContent = list.length;
    resultsLabel.textContent = list.length === 1 ? 'resultado' : 'resultados';
  }else{
    resultsNum.textContent = '01';
    resultsLabel.textContent = 'Listado de precios';
  }

  if(list.length === 0){
    results.innerHTML = `
      <div class="no-results">
        <div class="no-results-icon">∅</div>
        <div class="no-results-text">Sin resultados</div>
      </div>
    `;
    return;
  }

  results.innerHTML = list.map(renderProduct).join('');

  document.querySelectorAll('.result-head').forEach(head => {
    head.addEventListener('click',() => {
      const id = head.parentElement.dataset.id;
      expanded = expanded === id ? null : id;
      renderResults();
    });
  });

  attachHandlers();
}

function renderProduct(p){
  const isExpanded = expanded === p.id;
  const tag = p.tag ? `<span class="res-tag">${p.tag}</span>` : '';

  let priceHTML = '';

  if(p.consult){
    priceHTML = `<div class="res-price consult">Consultar</div>`;
  }else{
    priceHTML = `
      <div class="res-price"><sup>$</sup>${p.price}</div>
      <div class="res-unit">/ ${p.unit}</div>
    `;
  }

  return `
    <div class="result ${isExpanded ? 'expanded' : ''}" data-id="${p.id}">
      <div class="result-head">
        <div class="res-info">
          <div class="res-name">${highlight(p.name,query)} ${tag}</div>
          <div class="res-cat">${highlight(p.cat,query)}</div>
        </div>

        <div class="res-price-block">
          ${priceHTML}
        </div>

        <div class="res-chevron">▾</div>
      </div>

      <div class="res-detail">
        ${renderDetail(p)}
      </div>
    </div>
  `;
}

function renderDetail(p){
  if(p.consult){
    return `
      <div class="note-box">
        Este producto debe cotizarse según material, medida, cantidad y acabado.
      </div>
    `;
  }

  const mode = modes[p.id] || 'base';
  const c = calcs[p.id] || {w:10,h:10,qty:1,extras:{}};
  calcs[p.id] = c;

  const totalData = calculateTotal(p,c);

  return `
    <div class="mode-toggle">
      <button class="mode-btn ${mode === 'base' ? 'active' : ''}" data-mode="base" data-id="${p.id}">
        PRECIO BASE
      </button>
      <button class="mode-btn ${mode === 'calc' ? 'active' : ''}" data-mode="calc" data-id="${p.id}">
        CALCULAR
      </button>
    </div>

    ${mode === 'calc' ? renderCalculator(p,c) : ''}

    <div class="calc-total">
      <div>
        <div class="calc-total-label">${mode === 'calc' ? 'Total calculado' : 'Precio base'}</div>
        <div class="calc-total-val"><sup>$</sup>${mode === 'calc' ? totalData.total.toFixed(2) : p.price}</div>
        <div class="calc-breakdown">${mode === 'calc' ? totalData.breakdown : `por ${p.unit}`}</div>
      </div>

      <button class="copy-btn" data-copy="${p.id}" data-total="${mode === 'calc' ? totalData.total.toFixed(2) : p.price}">
        📋 WhatsApp
      </button>
    </div>

    ${renderExtras(p,c,mode)}

    ${p.note ? `<div class="note-box">ℹ️ ${p.note}</div>` : ''}
  `;
}

function renderCalculator(p,c){
  if(p.unit === 'pliego'){
    return `
      <div class="calc-grid" style="grid-template-columns:1fr;">
        <div class="calc-box">
          <div class="calc-label">Cantidad</div>
          <input class="calc-input" type="number" min="1" data-field="qty" data-id="${p.id}" value="${c.qty}">
          <div class="calc-suffix">pliegos</div>
        </div>
      </div>
    `;
  }

  return `
    <div class="calc-grid">
      <div class="calc-box">
        <div class="calc-label">Ancho</div>
        <input class="calc-input" type="number" min="0" data-field="w" data-id="${p.id}" value="${c.w}">
        <div class="calc-suffix">cm</div>
      </div>

      <div class="calc-box">
        <div class="calc-label">Alto</div>
        <input class="calc-input" type="number" min="0" data-field="h" data-id="${p.id}" value="${c.h}">
        <div class="calc-suffix">cm</div>
      </div>

      <div class="calc-box">
        <div class="calc-label">Cant.</div>
        <input class="calc-input" type="number" min="1" data-field="qty" data-id="${p.id}" value="${c.qty}">
        <div class="calc-suffix">und</div>
      </div>
    </div>
  `;
}

function renderExtras(p,c,mode){
  if(!p.extras || !p.extras.length) return '';

  return `
    <div class="extras">
      <div class="extras-title">Adicionales</div>

      ${p.extras.map(ex => {
        const active = !!c.extras[ex.id];

        return `
          <div class="extra-row ${mode === 'calc' && active ? 'active' : ''}" data-extra="${ex.id}" data-id="${p.id}">
            <div>
              <div class="extra-name">${ex.name}</div>
              ${ex.note ? `<div class="extra-note">${ex.note}</div>` : ''}
            </div>

            <div class="extra-val">+$${ex.val}${ex.perUnit ? ' c/u' : `/${ex.unit}`}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function calculateTotal(p,c){
  let total = 0;
  let breakdown = '';

  if(p.unit === 'm²'){
    const area = ((Number(c.w) || 0) * (Number(c.h) || 0)) / 10000;
    const qty = Number(c.qty) || 1;

    total = area * p.price * qty;
    breakdown = `${c.w}×${c.h} cm · ${qty} und · ${area.toFixed(3)} m² c/u`;

    if(p.extras){
      p.extras.forEach(ex => {
        if(c.extras[ex.id]){
          if(ex.perUnit){
            total += ex.val * qty;
          }else{
            total += area * ex.val * qty;
          }
        }
      });
    }
  }

  if(p.unit === 'pliego'){
    const qty = Number(c.qty) || 1;
    total = p.price * qty;
    breakdown = `${qty} pliego${qty > 1 ? 's' : ''}`;

    if(p.extras){
      p.extras.forEach(ex => {
        if(c.extras[ex.id]){
          total += ex.val * qty;
        }
      });
    }
  }

  return {total,breakdown};
}

function attachHandlers(){
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click',e => {
      e.stopPropagation();
      modes[btn.dataset.id] = btn.dataset.mode;
      renderResults();
    });
  });

  document.querySelectorAll('.calc-input').forEach(input => {
    input.addEventListener('click',e => e.stopPropagation());

    input.addEventListener('input',() => {
      const id = input.dataset.id;
      const field = input.dataset.field;

      calcs[id] = calcs[id] || {w:10,h:10,qty:1,extras:{}};
      calcs[id][field] = Number(input.value) || 0;

      const product = products.find(p => p.id === id);
      const detail = document.querySelector(`.result[data-id="${id}"] .res-detail`);

      if(detail && product){
        detail.innerHTML = renderDetail(product);
        attachHandlers();

        const nextInput = detail.querySelector(`.calc-input[data-field="${field}"]`);
        if(nextInput){
          nextInput.focus();
          nextInput.setSelectionRange(nextInput.value.length,nextInput.value.length);
        }
      }
    });
  });

  document.querySelectorAll('.extra-row[data-extra]').forEach(row => {
    row.addEventListener('click',e => {
      e.stopPropagation();

      const id = row.dataset.id;
      const extra = row.dataset.extra;

      calcs[id] = calcs[id] || {w:10,h:10,qty:1,extras:{}};
      calcs[id].extras[extra] = !calcs[id].extras[extra];

      renderResults();
    });
  });

  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click',e => {
      e.stopPropagation();

      const id = btn.dataset.copy;
      const product = products.find(p => p.id === id);
      const total = btn.dataset.total;
      const mode = modes[id] || 'base';
      const c = calcs[id] || {};

      let text = '';

      if(mode === 'calc' && product.unit === 'm²'){
        text = `${product.name}\nMedida: ${c.w}×${c.h} cm\nCantidad: ${c.qty}\nTotal: $${total}`;
      }else if(mode === 'calc' && product.unit === 'pliego'){
        text = `${product.name}\nCantidad: ${c.qty} pliego(s)\nTotal: $${total}`;
      }else{
        text = `${product.name}: $${product.price}/${product.unit}`;
      }

      copyText(text);

      btn.classList.add('copied');
      btn.textContent = '✓ Copiado';
      showToast('Copiado para WhatsApp');

      setTimeout(() => {
        btn.classList.remove('copied');
        btn.textContent = '📋 WhatsApp';
      },1500);
    });
  });
}

function copyText(text){
  if(navigator.clipboard){
    navigator.clipboard.writeText(text);
  }else{
    const area = document.createElement('textarea');
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand('copy');
    area.remove();
  }
}

function showToast(msg){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');

  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => {
    toast.classList.remove('show');
  },1800);
}

const search = document.getElementById('search');
const clearBtn = document.getElementById('clearBtn');

search.addEventListener('input',() => {
  query = search.value;
  expanded = null;
  clearBtn.classList.toggle('show',query.length > 0);
  renderResults();
});

clearBtn.addEventListener('click',() => {
  query = '';
  search.value = '';
  expanded = null;
  clearBtn.classList.remove('show');
  search.focus();
  renderResults();
});

document.addEventListener('keydown',e => {
  if(e.key === '/' && document.activeElement !== search){
    e.preventDefault();
    search.focus();
  }

  if(e.key === 'Escape'){
    expanded = null;
    renderResults();
  }
});

renderChips();
renderResults();
</script>

</body>
</html>
