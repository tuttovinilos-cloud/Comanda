<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Clientes · Comanda</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0d0f14;
  --panel:#13161d;
  --panel2:#181c26;
  --border:#1e2330;
  --border2:#2a3048;
  --text:#e2e8f0;
  --muted:#64748b;
  --muted2:#94a3b8;
  --accent:#3b82f6;
  --accent2:#60a5fa;
  --green:#30D158;
  --red:#FF3B30;
  --yellow:#FFD60A;
  --head:'Barlow Condensed',sans-serif;
  --body:'Barlow',sans-serif;
  --mono:'Share Tech Mono',monospace;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--body);
  min-height:100vh;
  padding-bottom:80px;
}

button,input,select,textarea{
  font:inherit;
}

button{
  touch-action:manipulation;
}

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:var(--panel);
  border-bottom:2px solid var(--accent);
  padding:10px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  box-shadow:0 4px 24px #0009;
}

.logo{
  font-family:var(--head);
  font-size:22px;
  font-weight:900;
  letter-spacing:3px;
  color:var(--accent2);
  text-transform:uppercase;
}

.logo small{
  color:var(--muted);
  font-size:11px;
  letter-spacing:1px;
  margin-left:6px;
}

.nav{
  display:flex;
  gap:6px;
  margin-left:auto;
  flex-wrap:wrap;
}

.nav a,
.nav button{
  font-family:var(--head);
  font-size:12px;
  font-weight:700;
  letter-spacing:1.3px;
  text-transform:uppercase;
  padding:8px 13px;
  border:1px solid var(--border2);
  background:transparent;
  color:var(--muted2);
  border-radius:7px;
  text-decoration:none;
  cursor:pointer;
}

.nav a.active{
  background:var(--accent);
  color:white;
  border-color:var(--accent);
}

.nav a:hover,
.nav button:hover{
  border-color:var(--accent);
  color:var(--accent2);
}

.main{
  padding:16px;
  display:grid;
  gap:16px;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
}

.search{
  flex:1;
  min-width:230px;
  background:var(--panel);
  border:1px solid var(--border2);
  border-radius:8px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:8px;
}

.search input{
  width:100%;
  background:transparent;
  border:0;
  outline:0;
  color:var(--text);
  font-family:var(--mono);
  font-size:13px;
}

.btn{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  background:var(--accent);
  color:white;
  cursor:pointer;
  font-family:var(--head);
  font-weight:800;
  font-size:12px;
  letter-spacing:1.3px;
  text-transform:uppercase;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  white-space:nowrap;
}

.btn:hover{
  filter:brightness(1.1);
}

.btn.secondary{
  background:transparent;
  color:var(--muted2);
  border:1px solid var(--border2);
}

.btn.success{
  background:#16a34a;
}

.btn.danger{
  background:#dc2626;
}

.fusion-tools{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}

.fusion-tools[hidden]{
  display:none!important;
}

.fusion-hint{
  color:var(--muted2);
  font-family:var(--head);
  font-size:12px;
  letter-spacing:1px;
  text-transform:uppercase;
  padding:8px 10px;
  border:1px solid var(--border2);
  border-radius:8px;
  background:#ffffff05;
}

.card{
  background:var(--panel);
  border:1px solid var(--border2);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 10px 30px #0005;
}

.card-header{
  padding:16px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}

.card-title{
  font-family:var(--head);
  font-size:22px;
  font-weight:900;
  letter-spacing:1.4px;
  text-transform:uppercase;
}

.card-sub{
  color:var(--muted2);
  font-size:13px;
  margin-top:2px;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  min-width:960px;
  border-collapse:collapse;
}

th{
  background:var(--panel2);
  color:var(--muted2);
  font-family:var(--head);
  font-size:11px;
  letter-spacing:1.4px;
  text-transform:uppercase;
  text-align:left;
  padding:11px 10px;
  border-bottom:1px solid var(--border2);
}

td{
  padding:10px;
  border-bottom:1px solid var(--border);
  vertical-align:middle;
  font-size:13px;
}

tr:hover td{
  background:#ffffff04;
}

.select-cell{
  width:48px;
  text-align:center;
}

.client-check,
.master-check{
  width:18px;
  height:18px;
  accent-color:var(--accent);
  cursor:pointer;
}

.client-name{
  font-family:var(--head);
  font-size:22px;
  line-height:1;
  font-weight:900;
  letter-spacing:.5px;
  color:var(--accent2);
  text-transform:uppercase;
  margin-bottom:6px;
}

.client-meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  color:var(--muted2);
  font-size:12px;
}

.client-meta span{
  background:#ffffff06;
  border:1px solid var(--border);
  border-radius:999px;
  padding:4px 7px;
}

.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:5px 9px;
  border-radius:999px;
  border:1px solid var(--border2);
  color:var(--muted2);
  font-family:var(--head);
  font-size:11px;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
  white-space:nowrap;
}

.badge.ok{
  color:var(--green);
  border-color:#30D15844;
  background:#30D15811;
}

.badge.off{
  color:var(--red);
  border-color:#FF3B3044;
  background:#FF3B3011;
}

.badge.type{
  color:var(--accent2);
  border-color:#3b82f644;
  background:#3b82f611;
}

.pedidos-btn{
  border:1px solid #3b82f644;
  background:#3b82f611;
  color:var(--accent2);
  border-radius:10px;
  padding:9px 12px;
  cursor:pointer;
  font-family:var(--head);
  font-size:13px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
  min-width:110px;
  text-align:center;
}

.pedidos-btn strong{
  display:block;
  color:white;
  font-size:22px;
  line-height:1;
}

.pedidos-btn small{
  display:block;
  color:var(--muted2);
  font-size:10px;
  margin-top:3px;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.mini-btn{
  border:1px solid var(--border2);
  background:transparent;
  color:var(--muted2);
  border-radius:7px;
  padding:8px 10px;
  cursor:pointer;
  font-family:var(--head);
  font-size:11px;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
  white-space:nowrap;
}

.mini-btn:hover{
  border-color:var(--accent);
  color:var(--accent2);
}

.mini-btn.del{
  color:var(--red);
  border-color:#FF3B3044;
  background:#FF3B3011;
}

.empty{
  color:var(--muted);
  text-align:center;
  padding:32px;
  font-family:var(--head);
  letter-spacing:1.4px;
  text-transform:uppercase;
}

.modal-backdrop{
  position:fixed;
  inset:0;
  background:#000b;
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  backdrop-filter:blur(4px);
}

.modal{
  width:100%;
  max-width:720px;
  max-height:88vh;
  overflow:auto;
  background:var(--panel);
  border:1px solid var(--border2);
  border-radius:14px;
  box-shadow:0 24px 80px #000d;
}

.modal-header{
  padding:16px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.modal-title{
  font-family:var(--head);
  font-size:20px;
  font-weight:900;
  letter-spacing:1.4px;
  text-transform:uppercase;
}

.modal-body{
  padding:16px;
  display:grid;
  gap:12px;
}

.modal-footer{
  padding:14px 16px;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:flex-end;
  gap:8px;
  flex-wrap:wrap;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.field label{
  display:block;
  color:var(--muted2);
  font-family:var(--head);
  font-size:12px;
  font-weight:800;
  letter-spacing:1.2px;
  text-transform:uppercase;
  margin-bottom:6px;
}

input,select,textarea{
  width:100%;
  background:var(--bg);
  border:1px solid var(--border2);
  color:var(--text);
  border-radius:8px;
  padding:10px 11px;
  outline:none;
  font-size:14px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 2px #3b82f633;
}

.full{
  grid-column:1/-1;
}

.history-item{
  border:1px solid var(--border2);
  border-radius:10px;
  padding:12px;
  background:#ffffff04;
  display:grid;
  gap:6px;
}

.history-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
  flex-wrap:wrap;
  color:var(--muted2);
  font-family:var(--mono);
  font-size:12px;
}

.history-desc{
  color:var(--text);
  line-height:1.45;
}

.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translateX(-50%);
  background:var(--panel2);
  border:1px solid var(--border2);
  color:var(--text);
  padding:12px 18px;
  border-radius:10px;
  box-shadow:0 10px 35px #000a;
  z-index:1000;
  font-family:var(--head);
  font-size:13px;
  letter-spacing:1px;
  display:none;
  text-align:center;
}

@media(max-width:700px){
  .header{
    align-items:flex-start;
  }

  .nav{
    width:100%;
    margin-left:0;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .nav a,
  .nav button{
    width:100%;
  }

  .main{
    padding:10px;
  }

  .toolbar{
    display:grid;
    grid-template-columns:1fr;
  }

  .search{
    min-width:100%;
  }

  .fusion-tools{
    display:grid;
    grid-template-columns:1fr;
  }

  .btn{
    width:100%;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  table{
    min-width:880px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">TUTTO VINILOS <small>Clientes</small></div>

  <nav class="nav">
    <a href="index.html">Comanda</a>
    <a href="clientes.html" class="active">Clientes</a>
    <a href="materiales.html">Materiales</a>
    <a href="estadisticas.html">Estadísticas</a>
    <a href="configuracion.html">Configuración</a>
    <button onclick="cerrarSesion()">Salir</button>
  </nav>
</header>

<main class="main">

  <section class="toolbar">
    <div class="search">
      <span>🔎</span>
      <input id="searchInput" type="search" placeholder="Buscar cliente, teléfono, correo o nota..." oninput="filtrarClientes()" />
    </div>

    <button class="btn" onclick="abrirModalCliente()">+ Añadir cliente</button>
    <button class="btn secondary" onclick="recargarTodo()">Recargar</button>

    <div id="fusionTools" class="fusion-tools" hidden>
      <button class="btn success" onclick="fusionarClientesSeleccionados()">Fusionar seleccionados</button>
      <button class="btn secondary" onclick="limpiarSeleccionClientes()">Limpiar selección</button>
      <button class="btn danger" onclick="deshacerUltimaFusionClientes()">↶ Deshacer última fusión</button>

  <section class="card">
    <div class="card-header">
      <div>
        <div class="card-title">Lista de clientes</div>

      </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th id="selectHeader" class="select-cell" style="display:none;">
              <input id="masterCheck" class="master-check" type="checkbox" onchange="toggleSeleccionVisible(this.checked)" />
            </th>
            <th>Cliente</th>
            <th>Tipo</th>
            <th>Contacto</th>
            <th>Pedidos</th>
            <th>Estado</th>
            <th>Notas</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="clientesBody">

            <td colspan="8" class="empty">Cargando...</td>
          </tr>

      </table>

</main>

<div id="clienteModal" class="modal-backdrop" onclick="cerrarModalSiFondo(event)">
  <div class="modal">
    <div class="modal-header">
      <div id="clienteModalTitle" class="modal-title">Nuevo cliente</div>
      <button class="mini-btn" onclick="cerrarModalCliente()">Cerrar</button>

    <div class="modal-body">
      <input id="clienteId" type="hidden" />

      <div class="form-grid">
        <div class="field full">
          <label>Nombre</label>
          <input id="clienteNombre" placeholder="Nombre del cliente" />
        </div>

        <div class="field">
          <label>Tipo de cliente</label>
          <select id="clienteTipo">
            <option>Cliente Standar</option>
            <option>Cliente VIP</option>
            <option>Cliente Básico</option>
            <option>Editado</option>
          </select>
        </div>

        <div class="field">
          <label>Activo</label>
          <select id="clienteActivo">
            <option value="true">Activo</option>
            <option value="false">Inactivo</option>
          </select>
        </div>

        <div class="field">
          <label>Teléfono</label>
          <input id="clienteTelefono" placeholder="Teléfono" />
        </div>

        <div class="field">
          <label>Correo</label>
          <input id="clienteCorreo" placeholder="Correo" />

    <div class="modal-footer">
      <button class="btn secondary" onclick="cerrarModalCliente()">Cancelar</button>
      <button class="btn" onclick="guardarClienteModal()">Guardar cliente</button>
    </div>
  </div>
</div>

<div id="historyModal" class="modal-backdrop" onclick="cerrarHistorialSiFondo(event)">
  <div class="modal">
    <div class="modal-header">
      <div id="historyTitle" class="modal-title">Historial</div>
      <button class="mini-btn" onclick="cerrarHistorial()">Cerrar</button>
    </div>
    <div id="historyBody" class="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>

<script>
/* =========================================================
   CLIENTES · COMANDA
   Fusionar solo para Roberto + limpiar selección oculta
   ========================================================= */

let clientesDB = [];
let pedidosDB = [];
let clientesFiltrados = [];
let clientesSeleccionados = new Set();

const FUSION_BACKUP_KEY = "tutto_clientes_ultima_fusion";

/* ---------- SUPABASE ---------- */

function db(){
  if(window.supabaseClient) return window.supabaseClient;
  if(window.supabase) return window.supabase;
  return null;
}

function validarSupabase(){
  if(!db()){
    alert("No se encontró conexión con Supabase. Revisa js/supabase.js");
    return false;
  }
  return true;
}

/* ---------- OPERADOR / PERMISOS ---------- */

function obtenerOperadorActual(){
  try{
    if(window.AUTH && typeof AUTH.getUser === "function"){
      const u = AUTH.getUser();
      if(u && (u.nombre || u.name || u.usuario)){
        return String(u.nombre || u.name || u.usuario).trim();
      }
    }

    const keys = [
      "tutto_user",
      "tutto_usuario",
      "usuario_actual",
      "operador_actual",
      "auth_user",
      "comanda_user"
    ];

    for(const k of keys){
      const raw = localStorage.getItem(k);
      if(!raw) continue;

      try{
        const obj = JSON.parse(raw);
        if(obj && (obj.nombre || obj.name || obj.usuario || obj.operador)){
          return String(obj.nombre || obj.name || obj.usuario || obj.operador).trim();
        }
      }catch(e){
        return String(raw).trim();
      }
    }
  }catch(e){}

  return "";
}

function normalizarTextoPermiso(txt){
  return String(txt || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .trim()
    .toLowerCase();
}

function operadorPuedeFusionarClientes(){
  const operador = normalizarTextoPermiso(obtenerOperadorActual());
  return operador === "roberto";
}

function aplicarPermisosFusion(){
  const puede = operadorPuedeFusionarClientes();

  const tools = document.getElementById("fusionTools");
  const selectHeader = document.getElementById("selectHeader");

  if(tools) tools.hidden = !puede;
  if(selectHeader) selectHeader.style.display = puede ? "" : "none";

  if(!puede){
    clientesSeleccionados.clear();
  }
}

/* ---------- HELPERS ---------- */

function normalizar(txt){
  return String(txt || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g," ")
    .trim()
    .toLowerCase();
}

function nombreBonito(txt){
  return String(txt || "")
    .replace(/\s+/g," ")
    .trim();
}

function escapeHtml(txt){
  return String(txt ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function mostrarToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => {
    t.style.display = "none";
  }, 2600);
}

function contarPedidosCliente(nombre){
  const n = normalizar(nombre);
  return pedidosDB.filter(p => normalizar(p.cliente) === n).length;
}

function mezclarDatosCliente(base, extra){
  return {
    nombre: base.nombre || extra.nombre || "",
    tipo_cliente: base.tipo_cliente || extra.tipo_cliente || "Cliente Standar",
    telefono: base.telefono || extra.telefono || "",
    correo: base.correo || extra.correo || "",
    notas: [base.notas, extra.notas]
      .filter(Boolean)
      .map(x => String(x).trim())
      .filter((v,i,a) => v && a.indexOf(v) === i)
      .join(" | "),
    activo: base.activo !== false && extra.activo !== false
  };
}

function cantidadDatosCliente(c){
  let total = 0;
  if(c?.telefono) total++;
  if(c?.correo) total++;
  if(c?.notas) total++;
  if(c?.tipo_cliente) total++;
  if(c?.activo === true) total++;
  return total;
}

/* ---------- CARGA ---------- */

async function inicializarClientes(){
  aplicarPermisosFusion();

  if(!validarSupabase()) return;

  await cargarPedidos();
  await cargarClientes();

  filtrarClientes();
}

async function cargarClientes(){
  const { data, error } = await db()
    .from("clientes")
    .select("*")
    .order("nombre", { ascending:true });

  if(error){
    console.error(error);
    alert("Error cargando clientes: " + error.message);
    return;
  }

  clientesDB = data || [];
}

async function cargarPedidos(){
  const { data, error } = await db()
    .from("pedidos")
    .select("*")
    .order("fecha", { ascending:false });

  if(error){
    console.error(error);
    alert("Error cargando pedidos: " + error.message);
    return;
  }

  pedidosDB = data || [];
}

async function recargarTodo(){
  limpiarSeleccionClientes(false);
  await cargarPedidos();
  await cargarClientes();
  filtrarClientes();
  mostrarToast("Datos recargados");
}

/* ---------- FILTRO / RENDER ---------- */

function filtrarClientes(){
  const q = normalizar(document.getElementById("searchInput").value);

  clientesFiltrados = clientesDB.filter(c => {
    const texto = [
      c.nombre,
      c.tipo_cliente,
      c.telefono,
      c.correo,
      c.notas
    ].join(" ");
    return normalizar(texto).includes(q);
  });

  limpiarSeleccionesOcultas();
  renderClientes();
}

function limpiarSeleccionesOcultas(){
  const visibles = new Set(clientesFiltrados.map(c => Number(c.id)));

  [...clientesSeleccionados].forEach(id => {
    if(!visibles.has(Number(id))){
      clientesSeleccionados.delete(Number(id));
    }
  });
}

function renderClientes(){
  aplicarPermisosFusion();

  const body = document.getElementById("clientesBody");
  const puedeFusionar = operadorPuedeFusionarClientes();

  document.getElementById("clientesSub").textContent =
    `${clientesFiltrados.length} clientes visibles · ${clientesDB.length} registrados`;

  actualizarContadorSeleccion();

  if(!clientesFiltrados.length){
    body.innerHTML = `
      <tr>
        <td colspan="8" class="empty">No hay clientes para mostrar</td>
      </tr>
    `;
    return;
  }

  body.innerHTML = clientesFiltrados.map(c => {
    const id = Number(c.id);
    const checked = clientesSeleccionados.has(id) ? "checked" : "";
    const pedidos = contarPedidosCliente(c.nombre);

    return `
      <tr>
        <td class="select-cell" style="${puedeFusionar ? "" : "display:none;"}">
          <input
            class="client-check"
            type="checkbox"
            data-id="${id}"
            ${checked}
            onchange="toggleClienteSeleccionado(${id}, this.checked)"
          />
        </td>

        <td>
          <div class="client-name">${escapeHtml(c.nombre || "Sin nombre")}</div>
          <div class="client-meta">
            ${c.id ? `<span>ID ${escapeHtml(c.id)}</span>` : ""}
            ${c.created_at ? `<span>${escapeHtml(String(c.created_at).slice(0,10))}</span>` : ""}
          </div>
        </td>

        <td>
          <span class="badge type">${escapeHtml(c.tipo_cliente || "Cliente Standar")}</span>
        </td>

        <td>
          <div>${escapeHtml(c.telefono || "—")}</div>
          <div style="color:var(--muted2);font-size:12px;">${escapeHtml(c.correo || "—")}</div>
        </td>

        <td>
          <button class="pedidos-btn" onclick="verHistorialCliente(${id})">
            <strong>${pedidos}</strong>
            <small>Pedidos</small>
          </button>
        </td>

        <td>
          ${
            c.activo === false
            ? `<span class="badge off">Inactivo</span>`
            : `<span class="badge ok">Activo</span>`
          }
        </td>

        <td style="max-width:260px;color:var(--muted2);line-height:1.35;">
          ${escapeHtml(c.notas || "—")}
        </td>

        <td>
          <div class="actions">
            <button class="mini-btn" onclick="editarCliente(${id})">Editar</button>
            <button class="mini-btn" onclick="verHistorialCliente(${id})">Historial</button>
            <button class="mini-btn del" onclick="eliminarCliente(${id})">Eliminar</button>
          </div>
        </td>
      </tr>
    `;
  }).join("");

  sincronizarMasterCheck();
}

/* ---------- SELECCIÓN ---------- */

function toggleClienteSeleccionado(id, checked){
  if(!operadorPuedeFusionarClientes()){
    clientesSeleccionados.clear();
    renderClientes();
    alert("Solo Roberto puede seleccionar clientes para fusionar.");
    return;
  }

  id = Number(id);

  if(checked){
    clientesSeleccionados.add(id);
  }else{
    clientesSeleccionados.delete(id);
  }

  actualizarContadorSeleccion();
  sincronizarMasterCheck();
}

function toggleSeleccionVisible(checked){
  if(!operadorPuedeFusionarClientes()) return;

  clientesFiltrados.forEach(c => {
    const id = Number(c.id);
    if(checked){
      clientesSeleccionados.add(id);
    }else{
      clientesSeleccionados.delete(id);
    }
  });

  renderClientes();
}

function limpiarSeleccionClientes(mostrarMensaje = true){
  clientesSeleccionados.clear();

  const master = document.getElementById("masterCheck");
  if(master) master.checked = false;

  document.querySelectorAll(".client-check").forEach(ch => {
    ch.checked = false;
  });

  actualizarContadorSeleccion();

  if(mostrarMensaje){
    mostrarToast("Selección limpiada");
  }
}

function actualizarContadorSeleccion(){
  const counter = document.getElementById("selectedCounter");
  if(counter){
    counter.textContent = `${clientesSeleccionados.size} seleccionados`;
  }
}

function sincronizarMasterCheck(){
  const master = document.getElementById("masterCheck");
  if(!master) return;

  if(!clientesFiltrados.length){
    master.checked = false;
    master.indeterminate = false;
    return;
  }

  const totalVisibles = clientesFiltrados.length;
  const seleccionadosVisibles = clientesFiltrados
    .filter(c => clientesSeleccionados.has(Number(c.id)))
    .length;

  master.checked = seleccionadosVisibles === totalVisibles;
  master.indeterminate = seleccionadosVisibles > 0 && seleccionadosVisibles < totalVisibles;
}

/* ---------- MODAL CLIENTE ---------- */

function abrirModalCliente(){
  document.getElementById("clienteModalTitle").textContent = "Nuevo cliente";
  document.getElementById("clienteId").value = "";
  document.getElementById("clienteNombre").value = "";
  document.getElementById("clienteTipo").value = "Cliente Standar";
  document.getElementById("clienteTelefono").value = "";
  document.getElementById("clienteCorreo").value = "";
  document.getElementById("clienteNotas").value = "";
  document.getElementById("clienteActivo").value = "true";

  document.getElementById("clienteModal").style.display = "flex";

  setTimeout(() => {
    document.getElementById("clienteNombre").focus();
  }, 100);
}

function editarCliente(id){
  const c = clientesDB.find(x => Number(x.id) === Number(id));

  if(!c){
    alert("No se encontró el cliente.");
    return;
  }

  document.getElementById("clienteModalTitle").textContent = "Editar cliente";
  document.getElementById("clienteId").value = c.id;
  document.getElementById("clienteNombre").value = c.nombre || "";
  document.getElementById("clienteTipo").value = c.tipo_cliente || "Cliente Standar";
  document.getElementById("clienteTelefono").value = c.telefono || "";
  document.getElementById("clienteCorreo").value = c.correo || "";
  document.getElementById("clienteNotas").value = c.notas || "";
  document.getElementById("clienteActivo").value = c.activo === false ? "false" : "true";

  document.getElementById("clienteModal").style.display = "flex";
}

function cerrarModalCliente(){
  document.getElementById("clienteModal").style.display = "none";
}

function cerrarModalSiFondo(event){
  if(event.target.id === "clienteModal"){
    cerrarModalCliente();
  }
}

async function guardarClienteModal(){
  if(!validarSupabase()) return;

  const id = document.getElementById("clienteId").value;
  const nombre = nombreBonito(document.getElementById("clienteNombre").value);

  if(!nombre){
    alert("Coloca el nombre del cliente.");
    return;
  }

  const datos = {
    nombre,
    tipo_cliente: document.getElementById("clienteTipo").value || "Cliente Standar",
    telefono: document.getElementById("clienteTelefono").value.trim(),
    correo: document.getElementById("clienteCorreo").value.trim(),
    notas: document.getElementById("clienteNotas").value.trim(),
    activo: document.getElementById("clienteActivo").value === "true"
  };

  const clienteOriginal = id
    ? clientesDB.find(c => Number(c.id) === Number(id))
    : null;

  const duplicado = clientesDB.find(c =>
    normalizar(c.nombre) === normalizar(nombre) &&
    Number(c.id) !== Number(id || 0)
  );

  try{
    let mensaje = "Cliente guardado";

    if(duplicado){
      const confirmar = confirm(
        `Ya existe un cliente con ese nombre:\n\n${duplicado.nombre}\n\n¿Quieres fusionarlo con este registro?`
      );

      if(!confirmar) return;

      const datosFusionados = mezclarDatosCliente(duplicado, datos);
      datosFusionados.nombre = nombre;

      const { error:updateError } = await db()
        .from("clientes")
        .update(datosFusionados)
        .eq("id", duplicado.id);

      if(updateError) throw updateError;

      if(clienteOriginal){
        await actualizarPedidosDeCliente(clienteOriginal.nombre, nombre);

        const { error:deleteError } = await db()
          .from("clientes")
          .delete()
          .eq("id", clienteOriginal.id);

        if(deleteError) throw deleteError;
      }

      await actualizarPedidosDeCliente(duplicado.nombre, nombre);
      mensaje = "Cliente fusionado y pedidos actualizados";

    }else if(id){
      const { error:updateError } = await db()
        .from("clientes")
        .update(datos)
        .eq("id", id);

      if(updateError) throw updateError;

      if(clienteOriginal && normalizar(clienteOriginal.nombre) !== normalizar(nombre)){
        await actualizarPedidosDeCliente(clienteOriginal.nombre, nombre);
        mensaje = "Cliente actualizado y pedidos renombrados";
      }

    }else{
      const { error:insertError } = await db()
        .from("clientes")
        .insert([datos]);

      if(insertError) throw insertError;
    }

    cerrarModalCliente();
    await cargarPedidos();
    await cargarClientes();
    filtrarClientes();

    mostrarToast(mensaje);
  }catch(error){
    console.error(error);
    alert("Error guardando cliente: " + (error.message || error));
  }
}

/* ---------- FUSIÓN ---------- */

async function actualizarPedidosDeCliente(nombreAnterior, nombreNuevo){
  if(!nombreAnterior || !nombreNuevo) return;

  const { error } = await db()
    .from("pedidos")
    .update({ cliente:nombreNuevo })
    .ilike("cliente", nombreAnterior);

  if(error) throw error;
}

function guardarBackupFusionClientes(backup){
  localStorage.setItem(FUSION_BACKUP_KEY, JSON.stringify({
    fecha:new Date().toISOString(),
    ...backup
  }));
}

function obtenerBackupFusionClientes(){
  const raw = localStorage.getItem(FUSION_BACKUP_KEY);
  if(!raw) return null;

  try{
    return JSON.parse(raw);
  }catch(e){
    return null;
  }
}

async function fusionarClientesSeleccionados(){
  if(!operadorPuedeFusionarClientes()){
    alert("Solo Roberto puede fusionar clientes.");
    return;
  }

  if(!validarSupabase()) return;

  const seleccionados = clientesDB.filter(c =>
    clientesSeleccionados.has(Number(c.id))
  );

  if(seleccionados.length < 2){
    alert("Marca al menos 2 clientes para fusionar.");
    return;
  }

  const resumen = seleccionados.map(c => `- ${c.nombre}`).join("\n");
  const sugerido = nombreBonito(seleccionados[0].nombre || "");

  const nombreFinalInput = prompt(
    `Vas a fusionar estos clientes:\n\n${resumen}\n\n¿Qué nombre final deseas colocarle?`,
    sugerido
  );

  const nombreFinal = nombreBonito(nombreFinalInput);

  if(!nombreFinal){
    alert("Debes colocar un nombre final.");
    return;
  }

  const confirmar = confirm(
    `Confirmar fusión:\n\n${resumen}\n\nNombre final:\n${nombreFinal}\n\nEsto actualizará todos los pedidos y dejará un solo registro.`
  );

  if(!confirmar) return;

  try{
    let principal = clientesDB.find(c =>
      normalizar(c.nombre) === normalizar(nombreFinal) &&
      !clientesSeleccionados.has(Number(c.id))
    );

    if(!principal){
      principal = seleccionados
        .slice()
        .sort((a,b) => cantidadDatosCliente(b) - cantidadDatosCliente(a))[0];
    }

    const todosAFusionar = [...seleccionados];

    if(!todosAFusionar.some(c => Number(c.id) === Number(principal.id))){
      todosAFusionar.push(principal);
    }

    const nombresAFusionar = todosAFusionar.map(c => normalizar(c.nombre));

    const pedidosOriginales = pedidosDB
      .filter(p => nombresAFusionar.includes(normalizar(p.cliente)))
      .map(p => ({
        id:p.id,
        cliente:p.cliente
      }));

    const backupFusion = {
      nombre_final:nombreFinal,
      principal_id:principal.id,
      principal_original:{...principal},
      clientes_originales:todosAFusionar.map(c => ({...c})),
      clientes_eliminados:todosAFusionar
        .filter(c => Number(c.id) !== Number(principal.id))
        .map(c => ({...c})),
      pedidos_originales:pedidosOriginales
    };

    for(const c of todosAFusionar){
      await actualizarPedidosDeCliente(c.nombre, nombreFinal);
    }

    let datosFusionados = {
      nombre:nombreFinal,
      tipo_cliente:"Cliente Standar",
      telefono:"",
      correo:"",
      notas:"",
      activo:true
    };

    for(const c of todosAFusionar){
      datosFusionados = mezclarDatosCliente(datosFusionados, c);
    }

    datosFusionados.nombre = nombreFinal;

    const { error:updateError } = await db()
      .from("clientes")
      .update(datosFusionados)
      .eq("id", principal.id);

    if(updateError) throw updateError;

    const idsEliminar = todosAFusionar
      .filter(c => Number(c.id) !== Number(principal.id))
      .map(c => c.id);

    if(idsEliminar.length){
      const { error:deleteError } = await db()
        .from("clientes")
        .delete()
        .in("id", idsEliminar);

      if(deleteError) throw deleteError;
    }

    guardarBackupFusionClientes(backupFusion);

    limpiarSeleccionClientes(false);

    await cargarPedidos();
    await cargarClientes();
    filtrarClientes();

    mostrarToast(`Clientes fusionados como ${nombreFinal}`);

  }catch(error){
    console.error(error);
    alert("Error fusionando clientes: " + (error.message || error));
  }
}

async function deshacerUltimaFusionClientes(){
  if(!operadorPuedeFusionarClientes()){
    alert("Solo Roberto puede deshacer fusiones.");
    return;
  }

  if(!validarSupabase()) return;

  const backup = obtenerBackupFusionClientes();

  if(!backup){
    alert("No hay una fusión reciente para deshacer.");
    return;
  }

  const confirmar = confirm(
    `¿Deshacer la última fusión?\n\nNombre fusionado: ${backup.nombre_final || "—"}\nFecha: ${backup.fecha || "—"}\n\nEsto intentará restaurar clientes y pedidos anteriores.`
  );

  if(!confirmar) return;

  try{
    if(backup.principal_original && backup.principal_original.id){
      const principal = {...backup.principal_original};
      const id = principal.id;
      delete principal.id;
      delete principal.created_at;

      const { error:updateError } = await db()
        .from("clientes")
        .update(principal)
        .eq("id", id);

      if(updateError) throw updateError;
    }

    if(Array.isArray(backup.clientes_eliminados)){
      for(const cliente of backup.clientes_eliminados){
        const restaurar = {...cliente};
        delete restaurar.created_at;

        const { error:insertError } = await db()
          .from("clientes")
          .upsert([restaurar], { onConflict:"id" });

        if(insertError){
          console.warn("No se pudo restaurar cliente:", cliente, insertError);
        }
      }
    }

    if(Array.isArray(backup.pedidos_originales)){
      for(const pedido of backup.pedidos_originales){
        const { error:pedidoError } = await db()
          .from("pedidos")
          .update({ cliente:pedido.cliente })
          .eq("id", pedido.id);

        if(pedidoError){
          console.warn("No se pudo restaurar pedido:", pedido, pedidoError);
        }
      }
    }

    localStorage.removeItem(FUSION_BACKUP_KEY);

    limpiarSeleccionClientes(false);

    await cargarPedidos();
    await cargarClientes();
    filtrarClientes();

    mostrarToast("Última fusión deshecha");

  }catch(error){
    console.error(error);
    alert("Error deshaciendo fusión: " + (error.message || error));
  }
}

/* ---------- ELIMINAR / HISTORIAL ---------- */

async function eliminarCliente(id){
  const cliente = clientesDB.find(c => Number(c.id) === Number(id));

  if(!cliente){
    alert("No se encontró el cliente.");
    return;
  }

  const pedidos = contarPedidosCliente(cliente.nombre);

  const confirmar = confirm(
    `¿Seguro que deseas eliminar este cliente?\n\nCliente: ${cliente.nombre}\nPedidos registrados: ${pedidos}\n\nEsto elimina el registro de clientes, pero NO borra sus pedidos.`
  );

  if(!confirmar) return;

  const { error } = await db()
    .from("clientes")
    .delete()
    .eq("id", id);

  if(error){
    console.error(error);
    alert("Error eliminando cliente: " + error.message);
    return;
  }

  clientesSeleccionados.delete(Number(id));

  await cargarClientes();
  filtrarClientes();

  mostrarToast("Cliente eliminado");
}

function verHistorialCliente(id){
  const cliente = clientesDB.find(c => Number(c.id) === Number(id));

  if(!cliente){
    alert("No se encontró el cliente.");
    return;
  }

  const nombreNorm = normalizar(cliente.nombre);
  const pedidos = pedidosDB.filter(p => normalizar(p.cliente) === nombreNorm);

  document.getElementById("historyTitle").textContent = `Historial · ${cliente.nombre}`;

  const body = document.getElementById("historyBody");

  if(!pedidos.length){
    body.innerHTML = `<div class="empty">Este cliente no tiene pedidos registrados</div>`;
  }else{
    body.innerHTML = pedidos.map(p => `
      <div class="history-item">
        <div class="history-top">
          <span>#${escapeHtml(p.id)} · ${escapeHtml(p.fecha || "")}</span>
          <span>${escapeHtml(p.estatus_trabajo || "")} / ${escapeHtml(p.estatus_pago || "")}</span>
        </div>
        <div class="history-desc">
          <strong>${escapeHtml(p.descripcion || "")}</strong><br>
          Cantidad: ${escapeHtml(p.cantidad || "")}<br>
          Material: ${escapeHtml(p.material || "")}<br>
          Impresión: ${escapeHtml(p.tipo_impresion || "")}<br>
          Entrega: ${escapeHtml(p.fecha_entrega || "—")}
        </div>
      </div>
    `).join("");
  }

  document.getElementById("historyModal").style.display = "flex";
}

function cerrarHistorial(){
  document.getElementById("historyModal").style.display = "none";
}

function cerrarHistorialSiFondo(event){
  if(event.target.id === "historyModal"){
    cerrarHistorial();
  }
}

/* ---------- SESIÓN ---------- */

function cerrarSesion(){
  try{
    localStorage.removeItem("tutto_user");
    localStorage.removeItem("tutto_usuario");
    localStorage.removeItem("usuario_actual");
    localStorage.removeItem("operador_actual");
    localStorage.removeItem("auth_user");
    localStorage.removeItem("comanda_user");
  }catch(e){}

  window.location.href = "login.html";
}
