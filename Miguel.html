<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generador de Prompt</title>
<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, Helvetica, sans-serif;
  background:#f2f4f8;
  color:#1f2937;
  padding:24px;
}

.contenedor{
  max-width:1100px;
  margin:auto;
}

.header{
  background:#111827;
  color:white;
  padding:28px;
  border-radius:22px;
  margin-bottom:22px;
  box-shadow:0 15px 35px rgba(0,0,0,.15);
}

.header h1{
  font-size:30px;
  margin-bottom:8px;
}

.header p{
  color:#d1d5db;
  font-size:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  box-shadow:0 8px 24px rgba(15,23,42,.08);
  border:1px solid #e5e7eb;
}

.card label{
  display:block;
  font-weight:700;
  margin-bottom:8px;
  color:#111827;
}

select,
input,
textarea{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:12px;
  padding:12px;
  font-size:15px;
  outline:none;
  background:#f9fafb;
}

textarea{
  min-height:160px;
  resize:vertical;
}

select:focus,
input:focus,
textarea:focus{
  border-color:#111827;
  background:white;
}

.full{
  grid-column:1 / -1;
}

.botones{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:18px;
}

button{
  border:0;
  padding:13px 18px;
  border-radius:14px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

.btn-principal{
  background:#111827;
  color:white;
}

.btn-secundario{
  background:#e5e7eb;
  color:#111827;
}

.btn-limpiar{
  background:#fee2e2;
  color:#991b1b;
}

button:hover{
  transform:translateY(-1px);
  opacity:.9;
}

.resultado{
  margin-top:22px;
  background:#ffffff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 8px 24px rgba(15,23,42,.08);
  border:1px solid #e5e7eb;
}

.resultado h2{
  margin-bottom:12px;
  font-size:22px;
}

.aviso{
  margin-top:10px;
  font-size:14px;
  color:#16a34a;
  font-weight:700;
  display:none;
}

@media(max-width:760px){
  body{
    padding:14px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .header{
    padding:22px;
  }

  .header h1{
    font-size:24px;
  }
}
</style>
</head>
<body>

<div class="contenedor">

  <div class="header">
    <h1>Generador de Prompt</h1>
    <p>Selecciona las opciones y genera un prompt listo para usar en IA de imágenes.</p>
  </div>

  <div class="grid">

    <div class="card">
      <label>Estilo visual:</label>
      <select id="estilo">
        <option value="">Seleccionar</option>
        <option>Realista</option>
        <option>Fotografía profesional</option>
        <option>Render 3D</option>
        <option>Minimalista</option>
        <option>Premium / lujo</option>
        <option>Industrial</option>
        <option>Moderno</option>
        <option>Infantil</option>
        <option>Futurista</option>
        <option>Vintage</option>
        <option>Publicitario</option>
        <option>Editorial</option>
        <option>Blanco y negro</option>
        <option>Cinemático</option>
        <option>Producto para catálogo</option>
        <option>Mockup comercial</option>
        <option>Diseño limpio tipo Apple</option>
      </select>
    </div>

    <div class="card">
      <label>Objeto / Producto:</label>
      <select id="producto">
        <option value="">Seleccionar</option>
        <option>Etiqueta adhesiva</option>
        <option>Sticker</option>
        <option>Caja de empaque</option>
        <option>Bolsa personalizada</option>
        <option>Frasco</option>
        <option>Botella</option>
        <option>Lata</option>
        <option>Taza</option>
        <option>Franela</option>
        <option>Gorra</option>
        <option>Acrílico cortado</option>
        <option>Letra corpórea</option>
        <option>Logo iluminado</option>
        <option>Caja de luz</option>
        <option>Stand publicitario</option>
        <option>Banner</option>
        <option>Display de mostrador</option>
        <option>Tarjeta de presentación</option>
        <option>Producto cosmético</option>
        <option>Producto alimenticio</option>
      </select>
    </div>

    <div class="card">
      <label>Iluminación:</label>
      <select id="iluminacion">
        <option value="">Seleccionar</option>
        <option>Luz suave</option>
        <option>Luz natural</option>
        <option>Luz de estudio</option>
        <option>Luz lateral</option>
        <option>Luz frontal</option>
        <option>Luz dramática</option>
        <option>Luz blanca fría</option>
        <option>Luz cálida</option>
        <option>Luz de neón</option>
        <option>Contraluz</option>
        <option>Reflejos brillantes</option>
        <option>Sombras suaves</option>
        <option>Iluminación premium</option>
        <option>Iluminación de catálogo</option>
        <option>Luz cenital</option>
      </select>
    </div>

    <div class="card">
      <label>Fondo:</label>
      <select id="fondo">
        <option value="">Seleccionar</option>
        <option>Blanco limpio</option>
        <option>Negro elegante</option>
        <option>Gris neutro</option>
        <option>Degradado suave</option>
        <option>Fondo de estudio</option>
        <option>Mesa de madera</option>
        <option>Mármol</option>
        <option>Cemento industrial</option>
        <option>Cocina moderna</option>
        <option>Oficina</option>
        <option>Tienda</option>
        <option>Supermercado</option>
        <option>Pared texturizada</option>
        <option>Fondo transparente</option>
        <option>Interior comercial</option>
      </select>
    </div>

    <div class="card">
      <label>Escala / Vista:</label>
      <select id="escala">
        <option value="">Seleccionar</option>
        <option>Primer plano</option>
        <option>Plano medio</option>
        <option>Vista completa</option>
        <option>Producto pequeño</option>
        <option>Producto grande</option>
        <option>Tamaño real</option>
        <option>Escala humana</option>
        <option>Sobre mesa</option>
        <option>En pared</option>
        <option>En fachada</option>
        <option>En vitrina</option>
        <option>En mano</option>
        <option>Vista frontal</option>
        <option>Vista 45 grados</option>
        <option>Vista superior</option>
        <option>Perspectiva isométrica</option>
      </select>
    </div>

    <div class="card">
      <label>Formato de salida:</label>
      <select id="formato">
        <option value="">Seleccionar</option>
        <option>Imagen cuadrada 1:1</option>
        <option>Vertical 9:16</option>
        <option>Horizontal 16:9</option>
        <option>Story Instagram</option>
        <option>Post Instagram</option>
        <option>Banner web</option>
        <option>Portada YouTube</option>
        <option>Mockup para cliente</option>
      </select>
    </div>

    <div class="card">
      <label>Nivel de detalle:</label>
      <select id="detalle">
        <option value="">Seleccionar</option>
        <option>Simple</option>
        <option>Detallado</option>
        <option>Muy realista</option>
        <option>Ultra detallado</option>
        <option>Limpio y comercial</option>
        <option>Sin texto</option>
        <option>Con espacio para texto</option>
        <option>Alta definición</option>
      </select>
    </div>

    <div class="card">
      <label>Uso del prompt:</label>
      <select id="uso">
        <option value="">Seleccionar</option>
        <option>Para vender</option>
        <option>Para presentar al cliente</option>
        <option>Para catálogo</option>
        <option>Para redes sociales</option>
        <option>Para fachada</option>
        <option>Para diseño interno</option>
        <option>Para idea inicial</option>
        <option>Para render final</option>
      </select>
    </div>

    <div class="card full">
      <label>Descripción adicional:</label>
      <input id="extra" type="text" placeholder="Ejemplo: colores blanco y dorado, marca elegante, sin personas, acabado brillante..." />
    </div>

  </div>

  <div class="botones">
    <button class="btn-principal" onclick="generarPrompt()">Generar prompt</button>
    <button class="btn-secundario" onclick="copiarPrompt()">Copiar prompt</button>
    <button class="btn-limpiar" onclick="limpiarTodo()">Limpiar</button>
  </div>

  <div class="resultado">
    <h2>Prompt generado</h2>
    <textarea id="promptFinal" placeholder="Aquí aparecerá el prompt generado..."></textarea>
    <div class="aviso" id="aviso">Prompt copiado correctamente.</div>
  </div>

</div>

<script>
function valor(id){
  return document.getElementById(id).value.trim();
}

function generarPrompt(){
  const estilo = valor('estilo');
  const producto = valor('producto');
  const iluminacion = valor('iluminacion');
  const fondo = valor('fondo');
  const escala = valor('escala');
  const formato = valor('formato');
  const detalle = valor('detalle');
  const uso = valor('uso');
  const extra = valor('extra');

  let partes = [];

  if(estilo) partes.push(`Estilo visual: ${estilo}`);
  if(producto) partes.push(`Objeto o producto principal: ${producto}`);
  if(iluminacion) partes.push(`Iluminación: ${iluminacion}`);
  if(fondo) partes.push(`Fondo: ${fondo}`);
  if(escala) partes.push(`Escala y vista: ${escala}`);
  if(formato) partes.push(`Formato de salida: ${formato}`);
  if(detalle) partes.push(`Nivel de detalle: ${detalle}`);
  if(uso) partes.push(`Uso de la imagen: ${uso}`);
  if(extra) partes.push(`Detalles adicionales: ${extra}`);

  let prompt = `Crea una imagen profesional con las siguientes características:\n\n${partes.join('.\n')}.
\nDebe verse limpia, atractiva, comercial, bien compuesta, con buena proporción, alta calidad visual y lista para presentar a un cliente.`;

  document.getElementById('promptFinal').value = prompt;
}

function copiarPrompt(){
  const texto = document.getElementById('promptFinal');
  texto.select();
  texto.setSelectionRange(0, 99999);
  document.execCommand('copy');

  const aviso = document.getElementById('aviso');
  aviso.style.display = 'block';
  setTimeout(() => aviso.style.display = 'none', 1800);
}

function limpiarTodo(){
  const campos = ['estilo','producto','iluminacion','fondo','escala','formato','detalle','uso'];
  campos.forEach(id => document.getElementById(id).value = '');
  document.getElementById('extra').value = '';
  document.getElementById('promptFinal').value = '';
}
</script>

</body>
</html>
