<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Organigrama · Tuttovinilos</title>
<style>
:root{
  --bg:#eef2f7;
  --panel:#ffffff;
  --text:#172033;
  --muted:#6b7280;
  --line:#7c8aa5;
  --blue:#1769ff;
  --orange:#ff8a1f;
  --danger:#d92d20;
  --shadow:0 10px 30px rgba(31,42,68,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea{font:inherit}
button{border:0;cursor:pointer}
.app{height:100dvh;display:flex;flex-direction:column}
.topbar{
  min-height:64px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.96);
  border-bottom:1px solid #dfe5ee;z-index:40
}
.brand{min-width:0;flex:1}
.brand strong{display:block;font-size:18px;line-height:1.1}
.brand span{font-size:12px;color:var(--muted)}
.icon-btn{
  width:42px;height:42px;border-radius:13px;background:#f3f6fa;color:#28354d;
  display:grid;place-items:center;font-size:21px;font-weight:800
}
.icon-btn.primary{background:var(--blue);color:#fff}
.icon-btn.orange{background:var(--orange);color:#fff}
.workspace-wrap{position:relative;flex:1;overflow:hidden}
.workspace{
  position:absolute;inset:0;overflow:hidden;touch-action:none;
  background:
    linear-gradient(#dfe6ef 1px,transparent 1px),
    linear-gradient(90deg,#dfe6ef 1px,transparent 1px);
  background-size:24px 24px;
}
.board{
  position:absolute;left:0;top:0;width:2400px;height:2400px;
  transform-origin:0 0;
}
.links{position:absolute;inset:0;width:2400px;height:2400px;overflow:visible;pointer-events:none}
.link-line{stroke:var(--line);stroke-width:3;fill:none}
.link-line.active{stroke:var(--orange);stroke-width:4}
.node{
  position:absolute;width:180px;min-height:92px;border-radius:18px;padding:14px 14px 12px;
  background:#fff;border:2px solid #d9e1ec;box-shadow:var(--shadow);
  user-select:none;touch-action:none
}
.node.selected{border-color:var(--blue);box-shadow:0 0 0 4px rgba(23,105,255,.15),var(--shadow)}
.node.connect-source{border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,138,31,.16),var(--shadow)}
.node-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.node-code{
  width:32px;height:32px;flex:none;border-radius:10px;background:#edf3ff;color:var(--blue);
  display:grid;place-items:center;font-weight:900;font-size:13px
}
.node-type{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.node-title{font-size:15px;line-height:1.25;font-weight:850;word-break:break-word}
.node-note{margin-top:7px;font-size:12px;line-height:1.35;color:var(--muted);word-break:break-word}
.node-dot{
  position:absolute;width:16px;height:16px;border-radius:50%;background:var(--orange);
  right:-8px;top:50%;transform:translateY(-50%);border:3px solid white
}
.node[data-color="blue"]{border-color:#b8d0ff}
.node[data-color="orange"]{border-color:#ffd0a3}
.node[data-color="green"]{border-color:#b6e8ca}
.node[data-color="purple"]{border-color:#d8c2ff}
.node[data-color="gray"]{border-color:#cfd6df}
.fab{
  position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom) + 82px);
  width:58px;height:58px;border-radius:18px;background:var(--blue);color:white;
  font-size:32px;line-height:1;box-shadow:0 14px 30px rgba(23,105,255,.33);z-index:30
}
.bottom-bar{
  min-height:70px;padding:9px 10px calc(env(safe-area-inset-bottom) + 9px);
  display:grid;grid-template-columns:repeat(5,1fr);gap:7px;background:#fff;border-top:1px solid #dfe5ee;z-index:45
}
.tool{
  min-height:50px;border-radius:13px;background:#f4f6f9;color:#39465d;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10px;font-weight:800
}
.tool b{font-size:18px;line-height:1}
.tool.active{background:#fff0e3;color:#b65300}
.sheet{
  position:fixed;left:0;right:0;bottom:-100%;z-index:100;background:#fff;
  border-radius:24px 24px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);
  box-shadow:0 -18px 50px rgba(31,42,68,.2);transition:.24s ease
}
.sheet.open{bottom:0}
.sheet h3{margin:0 0 14px;font-size:18px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:800;color:#4b5870;margin-bottom:6px}
.field input,.field textarea,.field select{
  width:100%;border:1px solid #d9e1ec;background:#f9fbfd;border-radius:13px;
  padding:12px 13px;outline:none;color:var(--text)
}
.field textarea{min-height:76px;resize:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:9px;margin-top:14px}
.btn{flex:1;padding:13px 14px;border-radius:13px;font-weight:850;background:#eef2f7;color:#26334b}
.btn.primary{background:var(--blue);color:#fff}
.btn.danger{background:#fff0ef;color:var(--danger)}
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.34);z-index:90;display:none}
.overlay.show{display:block}
.toast{
  position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 74px);transform:translateX(-50%);
  z-index:150;background:#182235;color:white;padding:10px 14px;border-radius:12px;
  font-size:12px;font-weight:750;opacity:0;pointer-events:none;transition:.2s
}
.toast.show{opacity:1}
.empty{
  position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;
  width:min(82%,320px);color:#6d788b;pointer-events:none
}
.empty strong{display:block;color:#33415a;font-size:18px;margin-bottom:6px}
.mini-menu{
  position:fixed;z-index:80;display:none;background:white;border:1px solid #dfe5ee;
  border-radius:15px;padding:6px;box-shadow:var(--shadow);min-width:170px
}
.mini-menu.show{display:block}
.mini-menu button{width:100%;padding:11px 12px;text-align:left;border-radius:10px;background:white;color:#27344b;font-weight:750}
.mini-menu button:active{background:#f2f5f9}
.status{
  position:absolute;left:12px;top:12px;z-index:20;background:rgba(255,255,255,.92);
  border:1px solid #dce3ed;border-radius:12px;padding:8px 10px;font-size:11px;color:#536078;
  box-shadow:0 5px 15px rgba(0,0,0,.06)
}
@media(min-width:700px){
  .app{max-width:520px;margin:auto;border-left:1px solid #dfe5ee;border-right:1px solid #dfe5ee}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <strong>Organigrama</strong>
      <span>Mapa de ideas y dependencias</span>
    </div>
    <button class="icon-btn" id="btnExport" title="Exportar">⇩</button>
    <button class="icon-btn orange" id="btnImport" title="Importar">⇧</button>
    <button class="icon-btn primary" id="btnAddTop" title="Agregar">＋</button>
  </header>

  <main class="workspace-wrap">
    <div class="workspace" id="workspace">
      <div class="status" id="status">Arrastra el fondo para moverte</div>
      <div class="board" id="board">
        <svg class="links" id="links"></svg>
      </div>
      <div class="empty" id="empty">
        <strong>Crea tu primera idea</strong>
        Pulsa el botón +, escribe el nombre y luego enlaza los cuadros.
      </div>
      <button class="fab" id="fab">＋</button>
    </div>
  </main>

  <nav class="bottom-bar">
    <button class="tool" id="toolSelect"><b>↖</b>Seleccionar</button>
    <button class="tool" id="toolConnect"><b>⛓</b>Conectar</button>
    <button class="tool" id="toolCenter"><b>◎</b>Centrar</button>
    <button class="tool" id="toolUndo"><b>↶</b>Deshacer</button>
    <button class="tool" id="toolClear"><b>⌫</b>Limpiar</button>
  </nav>
</div>

<div class="overlay" id="overlay"></div>

<section class="sheet" id="sheet">
  <h3 id="sheetTitle">Nueva idea</h3>
  <input type="hidden" id="nodeId">
  <div class="field">
    <label>Nombre del cuadro</label>
    <input id="nodeTitle" placeholder="Ej.: Letrero PVC">
  </div>
  <div class="field">
    <label>Nota o descripción</label>
    <textarea id="nodeNote" placeholder="Ej.: Utiliza PVC de 9 mm y puede llevar iluminación"></textarea>
  </div>
  <div class="row">
    <div class="field">
      <label>Tipo</label>
      <select id="nodeType">
        <option>Idea</option>
        <option>Producto</option>
        <option>Material</option>
        <option>Proceso</option>
        <option>Persona</option>
        <option>Área</option>
        <option>Decisión</option>
      </select>
    </div>
    <div class="field">
      <label>Color</label>
      <select id="nodeColor">
        <option value="blue">Azul</option>
        <option value="orange">Naranja</option>
        <option value="green">Verde</option>
        <option value="purple">Morado</option>
        <option value="gray">Gris</option>
      </select>
    </div>
  </div>
  <div class="actions">
    <button class="btn danger" id="btnDelete" style="display:none">Eliminar</button>
    <button class="btn" id="btnCancel">Cancelar</button>
    <button class="btn primary" id="btnSave">Guardar</button>
  </div>
</section>

<div class="mini-menu" id="miniMenu">
  <button data-action="edit">✏️ Editar cuadro</button>
  <button data-action="connect">⛓ Conectar desde aquí</button>
  <button data-action="duplicate">⧉ Duplicar</button>
  <button data-action="delete">🗑 Eliminar</button>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept=".json,application/json" hidden>

<script>
(() => {
  const KEY = 'organigrama_tuttovinilos_v1';
  const workspace = document.getElementById('workspace');
  const board = document.getElementById('board');
  const linksSvg = document.getElementById('links');
  const empty = document.getElementById('empty');
  const status = document.getElementById('status');
  const sheet = document.getElementById('sheet');
  const overlay = document.getElementById('overlay');
  const miniMenu = document.getElementById('miniMenu');

  let state = load() || {
    nodes: [],
    links: [],
    nextCode: 1,
    view: { x: -820, y: -820, scale: 1 }
  };

  let selectedId = null;
  let connectSource = null;
  let mode = 'select';
  let history = [];
  let drag = null;
  let pan = null;
  let longPressTimer = null;

  function save(pushHistory = false){
    if(pushHistory){
      history.push(JSON.stringify(state));
      if(history.length > 25) history.shift();
    }
    localStorage.setItem(KEY, JSON.stringify(state));
  }

  function load(){
    try{ return JSON.parse(localStorage.getItem(KEY)); }
    catch(e){ return null; }
  }

  function uid(){
    return 'n_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }

  function toast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 1800);
  }

  function applyView(){
    board.style.transform = `translate(${state.view.x}px,${state.view.y}px) scale(${state.view.scale})`;
  }

  function render(){
    [...board.querySelectorAll('.node')].forEach(n => n.remove());

    state.nodes.forEach(node => {
      const el = document.createElement('div');
      el.className = 'node';
      el.dataset.id = node.id;
      el.dataset.color = node.color || 'blue';
      el.style.left = node.x + 'px';
      el.style.top = node.y + 'px';
      if(node.id === selectedId) el.classList.add('selected');
      if(node.id === connectSource) el.classList.add('connect-source');

      el.innerHTML = `
        <div class="node-head">
          <div class="node-code">${String(node.code).padStart(2,'0')}</div>
          <div class="node-type">${escapeHtml(node.type || 'Idea')}</div>
        </div>
        <div class="node-title">${escapeHtml(node.title)}</div>
        ${node.note ? `<div class="node-note">${escapeHtml(node.note)}</div>` : ''}
        <div class="node-dot"></div>
      `;
      attachNodeEvents(el, node);
      board.appendChild(el);
    });

    renderLinks();
    empty.style.display = state.nodes.length ? 'none' : 'block';
    applyView();
    save();
  }

  function renderLinks(){
    linksSvg.innerHTML = `
      <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
          <path d="M0,0 L0,8 L9,4 z" fill="#7c8aa5"></path>
        </marker>
      </defs>
    `;
    state.links.forEach(link => {
      const a = state.nodes.find(n => n.id === link.from);
      const b = state.nodes.find(n => n.id === link.to);
      if(!a || !b) return;

      const x1 = a.x + 180;
      const y1 = a.y + 46;
      const x2 = b.x;
      const y2 = b.y + 46;
      const dx = Math.max(70, Math.abs(x2-x1)*0.45);
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d', `M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`);
      path.setAttribute('class','link-line');
      path.setAttribute('marker-end','url(#arrow)');
      linksSvg.appendChild(path);
    });
  }

  function attachNodeEvents(el, node){
    el.addEventListener('pointerdown', e => {
      e.stopPropagation();
      selectedId = node.id;

      if(mode === 'connect'){
        handleConnect(node.id);
        render();
        return;
      }

      el.setPointerCapture(e.pointerId);
      drag = {
        id: node.id,
        startX: e.clientX,
        startY: e.clientY,
        nodeX: node.x,
        nodeY: node.y,
        moved: false
      };

      clearTimeout(longPressTimer);
      longPressTimer = setTimeout(() => {
        if(drag && !drag.moved) showMiniMenu(node.id, e.clientX, e.clientY);
      }, 550);
      render();
    });

    el.addEventListener('pointermove', e => {
      if(!drag || drag.id !== node.id) return;
      const dx = (e.clientX - drag.startX) / state.view.scale;
      const dy = (e.clientY - drag.startY) / state.view.scale;
      if(Math.abs(dx) > 3 || Math.abs(dy) > 3){
        drag.moved = true;
        clearTimeout(longPressTimer);
      }
      node.x = Math.max(0, Math.min(2220, drag.nodeX + dx));
      node.y = Math.max(0, Math.min(2300, drag.nodeY + dy));
      el.style.left = node.x + 'px';
      el.style.top = node.y + 'px';
      renderLinks();
    });

    const endDrag = () => {
      clearTimeout(longPressTimer);
      if(drag && drag.id === node.id){
        if(drag.moved) save();
        drag = null;
      }
    };
    el.addEventListener('pointerup', endDrag);
    el.addEventListener('pointercancel', endDrag);

    el.addEventListener('dblclick', e => {
      e.stopPropagation();
      openEdit(node.id);
    });
  }

  function handleConnect(id){
    if(!connectSource){
      connectSource = id;
      status.textContent = 'Ahora toca el cuadro que depende de este';
      toast('Selecciona el cuadro de destino');
      return;
    }

    if(connectSource === id){
      connectSource = null;
      status.textContent = 'Conexión cancelada';
      return;
    }

    const exists = state.links.some(l => l.from === connectSource && l.to === id);
    if(exists){
      toast('Esa conexión ya existe');
    }else{
      history.push(JSON.stringify(state));
      state.links.push({ id: uid(), from: connectSource, to: id });
      save();
      toast('Cuadros conectados');
    }
    connectSource = null;
    mode = 'select';
    setToolState();
    status.textContent = 'Arrastra el fondo para moverte';
  }

  function setToolState(){
    document.querySelectorAll('.tool').forEach(b => b.classList.remove('active'));
    if(mode === 'connect') document.getElementById('toolConnect').classList.add('active');
    else document.getElementById('toolSelect').classList.add('active');
  }

  workspace.addEventListener('pointerdown', e => {
    if(e.target.closest('.node') || e.target.closest('button') || e.target.closest('.status')) return;
    hideMiniMenu();
    selectedId = null;
    if(mode === 'connect'){
      connectSource = null;
      mode = 'select';
      setToolState();
      status.textContent = 'Conexión cancelada';
      render();
      return;
    }
    workspace.setPointerCapture(e.pointerId);
    pan = { startX:e.clientX, startY:e.clientY, x:state.view.x, y:state.view.y };
    render();
  });

  workspace.addEventListener('pointermove', e => {
    if(!pan) return;
    state.view.x = pan.x + (e.clientX-pan.startX);
    state.view.y = pan.y + (e.clientY-pan.startY);
    applyView();
  });

  workspace.addEventListener('pointerup', () => {
    if(pan){ save(); pan = null; }
  });

  workspace.addEventListener('pointercancel', () => pan = null);

  function openSheet(node=null){
    hideMiniMenu();
    document.getElementById('sheetTitle').textContent = node ? 'Editar cuadro' : 'Nueva idea';
    document.getElementById('nodeId').value = node?.id || '';
    document.getElementById('nodeTitle').value = node?.title || '';
    document.getElementById('nodeNote').value = node?.note || '';
    document.getElementById('nodeType').value = node?.type || 'Idea';
    document.getElementById('nodeColor').value = node?.color || 'blue';
    document.getElementById('btnDelete').style.display = node ? 'block' : 'none';
    overlay.classList.add('show');
    sheet.classList.add('open');
    setTimeout(() => document.getElementById('nodeTitle').focus(), 220);
  }

  function closeSheet(){
    sheet.classList.remove('open');
    overlay.classList.remove('show');
  }

  function openEdit(id){
    const node = state.nodes.find(n => n.id === id);
    if(node) openSheet(node);
  }

  function addAtCenter(){
    openSheet();
  }

  function saveNode(){
    const id = document.getElementById('nodeId').value;
    const title = document.getElementById('nodeTitle').value.trim();
    if(!title){
      toast('Escribe un nombre');
      return;
    }

    history.push(JSON.stringify(state));
    const data = {
      title,
      note: document.getElementById('nodeNote').value.trim(),
      type: document.getElementById('nodeType').value,
      color: document.getElementById('nodeColor').value
    };

    if(id){
      Object.assign(state.nodes.find(n => n.id === id), data);
    }else{
      const centerX = (-state.view.x + workspace.clientWidth/2) / state.view.scale - 90;
      const centerY = (-state.view.y + workspace.clientHeight/2) / state.view.scale - 46;
      state.nodes.push({
        id:uid(),
        code:state.nextCode++,
        x:Math.max(20,Math.min(2200,centerX)),
        y:Math.max(20,Math.min(2300,centerY)),
        ...data
      });
    }
    save();
    closeSheet();
    render();
  }

  function deleteNode(id){
    if(!id) return;
    history.push(JSON.stringify(state));
    state.nodes = state.nodes.filter(n => n.id !== id);
    state.links = state.links.filter(l => l.from !== id && l.to !== id);
    selectedId = null;
    connectSource = null;
    save();
    closeSheet();
    hideMiniMenu();
    render();
    toast('Cuadro eliminado');
  }

  function showMiniMenu(id,x,y){
    selectedId = id;
    miniMenu.dataset.id = id;
    miniMenu.style.left = Math.min(window.innerWidth-185, Math.max(8,x-80)) + 'px';
    miniMenu.style.top = Math.min(window.innerHeight-230, Math.max(80,y-40)) + 'px';
    miniMenu.classList.add('show');
  }
  function hideMiniMenu(){ miniMenu.classList.remove('show'); }

  miniMenu.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    const id = miniMenu.dataset.id;
    const action = btn.dataset.action;
    const node = state.nodes.find(n => n.id === id);
    if(!node) return;

    if(action === 'edit') openEdit(id);
    if(action === 'connect'){
      mode = 'connect';
      connectSource = id;
      setToolState();
      status.textContent = 'Toca el cuadro que depende de este';
      hideMiniMenu();
      render();
    }
    if(action === 'duplicate'){
      history.push(JSON.stringify(state));
      state.nodes.push({...node,id:uid(),code:state.nextCode++,x:node.x+35,y:node.y+35,title:node.title+' copia'});
      save(); hideMiniMenu(); render(); toast('Cuadro duplicado');
    }
    if(action === 'delete') deleteNode(id);
  });

  document.getElementById('btnSave').onclick = saveNode;
  document.getElementById('btnCancel').onclick = closeSheet;
  overlay.onclick = closeSheet;
  document.getElementById('btnDelete').onclick = () => deleteNode(document.getElementById('nodeId').value);
  document.getElementById('fab').onclick = addAtCenter;
  document.getElementById('btnAddTop').onclick = addAtCenter;

  document.getElementById('toolSelect').onclick = () => {
    mode='select'; connectSource=null; setToolState(); status.textContent='Arrastra el fondo para moverte'; render();
  };
  document.getElementById('toolConnect').onclick = () => {
    mode='connect'; connectSource=null; setToolState(); status.textContent='Toca el cuadro de origen'; toast('Selecciona el cuadro de origen'); render();
  };
  document.getElementById('toolCenter').onclick = () => {
    if(!state.nodes.length){
      state.view={x:-820,y:-820,scale:1};
    }else{
      const avgX = state.nodes.reduce((s,n)=>s+n.x,0)/state.nodes.length;
      const avgY = state.nodes.reduce((s,n)=>s+n.y,0)/state.nodes.length;
      state.view.x = workspace.clientWidth/2 - (avgX+90)*state.view.scale;
      state.view.y = workspace.clientHeight/2 - (avgY+46)*state.view.scale;
    }
    save(); applyView();
  };
  document.getElementById('toolUndo').onclick = () => {
    if(!history.length){ toast('No hay cambios para deshacer'); return; }
    state = JSON.parse(history.pop());
    save(); render(); toast('Cambio deshecho');
  };
  document.getElementById('toolClear').onclick = () => {
    if(!state.nodes.length) return;
    if(confirm('¿Eliminar todos los cuadros y conexiones?')){
      history.push(JSON.stringify(state));
      state.nodes=[]; state.links=[]; state.nextCode=1;
      save(); render(); toast('Organigrama limpio');
    }
  };

  document.getElementById('btnExport').onclick = () => {
    const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'organigrama_'+new Date().toISOString().slice(0,10)+'.json';
    a.click();
    URL.revokeObjectURL(a.href);
  };

  document.getElementById('btnImport').onclick = () => document.getElementById('fileInput').click();
  document.getElementById('fileInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const imported = JSON.parse(reader.result);
        if(!Array.isArray(imported.nodes) || !Array.isArray(imported.links)) throw new Error();
        history.push(JSON.stringify(state));
        state = imported;
        if(!state.view) state.view={x:-820,y:-820,scale:1};
        save(); render(); toast('Organigrama importado');
      }catch(err){ toast('Archivo no válido'); }
    };
    reader.readAsText(file);
    e.target.value='';
  });

  function escapeHtml(text=''){
    return text.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  }

  setToolState();
  render();
})();
</script>
</body>
</html>
