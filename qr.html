<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tuttovinilos · Despacho QR</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0f2f9;color:#111827;font:16px system-ui,sans-serif}header{background:#172bd8;color:white;padding:18px;text-align:center;font-weight:800}main{max-width:480px;margin:auto;padding:16px}section{background:white;border-radius:18px;padding:18px;margin-bottom:12px}h2{font-size:20px;margin:0 0 12px}button,a.action{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:#153bff;color:white;font:700 16px system-ui;text-align:center;text-decoration:none;margin-top:10px;cursor:pointer}button.secondary{background:#e8ecf8;color:#172bd8}button:disabled{opacity:.5}#reader{overflow:hidden;border-radius:14px}#status{white-space:pre-wrap;color:#475569}dt{font-size:12px;color:#64748b;margin-top:12px}dd{margin:3px 0;font-weight:650;white-space:pre-wrap;overflow-wrap:anywhere}input{width:100%;padding:12px;border:1px solid #cbd3e6;border-radius:8px;font:inherit}[hidden]{display:none!important}
</style></head><body><header>TUTTOVINILOS · DESPACHO</header><main><section id="access"><p id="accessText">Verificando sesión…</p><a class="action" href="index.html" id="login" hidden>Ir a Comanda / iniciar sesión</a></section><section id="scan" hidden><h2>Escanear pedido</h2><div id="reader"></div><button id="start" type="button">Activar cámara</button><details><summary>Entrada manual o lector 2D</summary><input id="code" placeholder="TV-PEDIDO-123" autocomplete="off"><button id="lookup">Buscar pedido</button></details></section><section id="detail" hidden><h2 id="heading">Pedido encontrado</h2><dl><dt>Pedido</dt><dd id="orderId"></dd><dt>Fecha</dt><dd id="date"></dd><dt>Operador</dt><dd id="operator"></dd><dt>Cliente</dt><dd id="client"></dd><dt>Descripción</dt><dd id="description"></dd></dl><button id="confirm">OK · Confirmar entrega</button><button id="cancel" class="secondary">Cancelar / siguiente pedido</button></section><p id="status" role="status"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js?v=24"></script><script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script>
'use strict';const $=id=>document.getElementById(id);let db,scanner=null,starting=false,busy=false,current=null,allowed=false,epoch=0;const msg=t=>$('status').textContent=t;
async function authorize(){if(!db)throw Error('No se encontró la conexión de Comanda');const {data,error}=await db.auth.getUser();if(error||!data?.user)throw Error('Inicia sesión en Comanda primero.');const r=await db.rpc('comanda_mi_operador');if(r.error||!r.data?.some(o=>o.puede_pedidos))throw Error('Tu usuario no tiene permiso de pedidos.');}
async function stop(){epoch++;const s=scanner;scanner=null;if(s){try{await s.stop();}catch(e){}try{await s.clear();}catch(e){}}}
async function start(){if(!allowed||starting||scanner||busy)return;if(!window.isSecureContext||!window.Html5Qrcode){msg('La cámara necesita HTTPS y conexión a Internet.');return;}starting=true;const n=++epoch;let s;try{s=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE]});await s.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>{const size=Math.floor(Math.min(w,h)*.75);return {width:size,height:size};}},raw=>{if(n===epoch&&scanner===s)lookup(raw);},()=>{});if(n!==epoch){await s.stop();await s.clear();}else{scanner=s;$('start').hidden=true;msg('Apunta al QR del producto.');}}catch(e){try{await s?.clear();}catch(_){}msg('No se pudo abrir la cámara. Revisa el permiso y pulsa Activar cámara.');$('start').hidden=false;}finally{starting=false;}}
async function lookup(raw){if(!allowed||busy)return;const m=String(raw).trim().match(/^TV-PEDIDO-(\d{1,19})$/);if(!m){msg('QR no válido de Tuttovinilos.');return;}busy=true;try{await stop();await authorize();const id=m[1];const {data,error}=await db.from('pedidos').select('id,fecha,operador,cliente,descripcion').eq('id',id).maybeSingle();if(error||!data)throw Error('Pedido no encontrado o sin permiso.');const d=await db.from('pedidos_despachos').select('entregado_en').eq('pedido_id',id).maybeSingle();if(d.error)throw d.error;current=id;for(const [el,v] of Object.entries({orderId:id,date:data.fecha,operator:data.operador,client:data.cliente,description:data.descripcion}))$(el).textContent=v||'—';$('scan').hidden=true;$('detail').hidden=false;$('heading').textContent=d.data?'Pedido ya entregado':'Pedido encontrado';$('confirm').hidden=!!d.data;msg(d.data?'Entregado: '+new Date(d.data.entregado_en).toLocaleString():'Verifica la información antes de confirmar.');}catch(e){msg(e.message||'No se pudo consultar el pedido.');$('start').hidden=false;}finally{busy=false;}}
$('confirm').onclick=async()=>{if(busy||!current)return;busy=true;$('confirm').disabled=true;try{await authorize();const r=await db.from('pedidos_despachos').insert({pedido_id:current});if(r.error&&r.error.code!=='23505')throw r.error;const check=await db.from('pedidos_despachos').select('entregado_en').eq('pedido_id',current).single();if(check.error)throw check.error;$('heading').textContent='✓ Pedido entregado';$('confirm').hidden=true;msg('Entrega registrada: '+new Date(check.data.entregado_en).toLocaleString());}catch(e){msg('No se pudo confirmar: '+(e.message||'Error de conexión'));}finally{busy=false;$('confirm').disabled=false;}};
$('cancel').onclick=()=>{if(busy)return;current=null;$('detail').hidden=true;$('scan').hidden=false;$('start').hidden=false;$('code').value='';start();};$('start').onclick=start;$('lookup').onclick=()=>lookup($('code').value);$('code').onkeydown=e=>{if(e.key==='Enter')lookup(e.target.value);};window.addEventListener('pagehide',stop);
(async()=>{try{db=window.supabaseClient;await authorize();allowed=true;$('access').hidden=true;$('scan').hidden=false;await start();}catch(e){$('accessText').textContent=e.message;$('login').hidden=false;}})();
</script></body></html>
