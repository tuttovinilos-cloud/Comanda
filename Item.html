<!DOCTYPE html>
<html lang="es" class="loading-menu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Materia Prima · Proveedores · Tuttovinilos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/menu.css?v=34">

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f0f2f9;
  --panel:#ffffff;
  --panel2:#f8f9ff;
  --border:#d9deea;
  --border2:#cbd3e6;
  --text:#111827;
  --muted:#6b7280;
  --accent:#153bff;
  --accent2:#0b1f7a;
  --orange:#ff8616;
  --orange2:#fff3e8;
  --green:#16a34a;
  --red:#dc2626;
  --head:'Montserrat',Arial,sans-serif;
  --body:'Inter',Arial,sans-serif;
  --mono:'Roboto Mono',monospace;
}

html,body{
  background:var(--bg)!important;
  color:var(--text);
  font-family:var(--body);
  min-height:100vh;
  color-scheme:light;
}

button,input,select,textarea{font:inherit;color-scheme:light}

.main{
  padding:14px;
  max-width:1280px;
  margin:0 auto;
}

.page-head{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  padding:14px;
  box-shadow:0 8px 24px rgba(15,23,42,.055);
  margin-bottom:12px;
}

.page-title{
  font-family:var(--head);
  font-size:22px;
  font-weight:900;
  color:var(--accent2);
  text-transform:uppercase;
}

.page-sub{
  margin-top:4px;
  color:var(--muted);
  font-size:13px;
  font-weight:600;
}

.tools{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  margin-top:12px;
}

.search{
  min-height:40px;
  border:1px solid var(--border2);
  border-radius:14px;
  padding:0 13px;
  font-size:13px;
  outline:none;
  background:white;
  color:#111827;
}

.btn{
  border:0;
  background:linear-gradient(135deg,var(--accent),#0b1f7a);
  color:white;
  border-radius:14px;
  padding:0 16px;
  font-family:var(--head);
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.4px;
  cursor:pointer;
  min-height:40px;
  box-shadow:0 8px 18px rgba(21,59,255,.16);
}

.cats{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:12px 0 2px;
}

.cat{
  border:1px solid var(--border2);
  background:white;
  color:var(--accent2);
  border-radius:999px;
  padding:8px 13px;
  font-family:var(--head);
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  white-space:nowrap;
  cursor:pointer;
}

.cat.active{
  background:var(--orange);
  color:white;
  border-color:var(--orange);
  box-shadow:0 7px 16px rgba(255,134,22,.20);
}

.list{
  display:grid;
  gap:8px;
}

.item{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(15,23,42,.04);
}

.item-main{
  width:100%;
  border:0;
  background:white;
  display:grid;
  grid-template-columns:85px 1.35fr 105px 105px 115px 105px 28px;
  align-items:center;
  gap:8px;
  padding:8px 11px;
  text-align:left;
  cursor:pointer;
}

.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:#eef1ff;
  color:var(--accent);
  border:1px solid #c7d2fe;
  border-radius:999px;
  padding:5px 8px;
  font-size:9.5px;
  font-family:var(--head);
  font-weight:900;
  white-space:nowrap;
}

.name{
  min-width:0;
}

.name strong{
  display:block;
  font-family:var(--head);
  font-size:14px;
  font-weight:900;
  color:var(--accent2);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.name small{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.cell-mini{
  min-width:0;
}

.cell-mini small{
  display:block;
  font-family:var(--head);
  font-size:8.5px;
  font-weight:900;
  color:#818898;
  text-transform:uppercase;
  letter-spacing:.3px;
}

.cell-mini strong{
  display:block;
  margin-top:2px;
  font-family:var(--mono);
  font-size:13px;
  font-weight:800;
  color:#111827;
  white-space:nowrap;
}

.last-price strong{
  color:var(--accent);
  font-size:16px;
}

.range strong{
  color:var(--orange);
}

.cost-m2 strong{
  color:#0b1f7a;
}

.best strong{
  color:var(--green);
}

.arrow{
  width:27px;
  height:27px;
  border-radius:50%;
  background:#eef1ff;
  color:var(--accent);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  transition:transform .15s;
}

.item.open .arrow{
  transform:rotate(180deg);
  background:var(--orange2);
  color:var(--orange);
}

.item-details{
  display:none;
  border-top:1px solid var(--border);
  background:linear-gradient(180deg,#fff,#f8f9ff);
  padding:10px 12px 12px;
}

.item.open .item-details{
  display:block;
}

.provider-list{
  display:grid;
  gap:7px;
}

.provider-row{
  display:grid;
  grid-template-columns:1fr 90px 105px 90px;
  align-items:center;
  gap:8px;
  background:white;
  border:1px solid var(--border);
  border-radius:13px;
  padding:8px 10px;
}

.provider-name{
  font-family:var(--head);
  font-size:13px;
  font-weight:900;
  color:var(--accent2);
}

.provider-price{
  font-family:var(--mono);
  font-size:14px;
  font-weight:900;
  color:#111827;
  text-align:right;
}

.provider-m2{
  font-family:var(--mono);
  font-size:12px;
  font-weight:800;
  color:var(--muted);
  text-align:right;
}

.tag{
  justify-self:end;
  border-radius:999px;
  padding:5px 9px;
  font-family:var(--head);
  font-size:9px;
  font-weight:900;
  text-transform:uppercase;
  white-space:nowrap;
}

.tag.min{
  background:#dcfce7;
  color:#166534;
  border:1px solid #86efac;
}

.tag.max{
  background:#fee2e2;
  color:#991b1b;
  border:1px solid #fecaca;
}

.tag.normal{
  background:#eef1ff;
  color:var(--accent);
  border:1px solid #c7d2fe;
}

.detail-note{
  margin-top:8px;
  background:var(--orange2);
  border:1px solid #fed7aa;
  border-radius:13px;
  padding:9px;
  color:#9a3412;
  font-size:12px;
  font-weight:800;
}

.detail-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:10px;
}

.action{
  border:1px solid #c7d2fe;
  background:#eef1ff;
  color:var(--accent);
  border-radius:999px;
  padding:8px 12px;
  font-family:var(--head);
  font-size:10px;
  font-weight:900;
  cursor:pointer;
}

.action.orange{
  border-color:#fed7aa;
  background:var(--orange2);
  color:#c2410c;
}

.empty{
  background:white;
  border:1px dashed var(--border2);
  border-radius:18px;
  padding:28px;
  text-align:center;
  color:var(--muted);
  font-family:var(--head);
  font-weight:900;
  text-transform:uppercase;
  display:none;
}

@media(max-width:900px){
  .item-main{
    grid-template-columns:78px 1fr 92px 95px 28px;
  }

  .hide-tablet{
    display:none;
  }
}

@media(max-width:760px){
  .main{padding:10px}
  .page-title{font-size:18px}
  .tools{grid-template-columns:1fr}
  .btn{width:100%}

  .item-main{
    grid-template-columns:72px 1fr 82px 28px;
    gap:7px;
    padding:8px 9px;
  }

  .hide-mobile{
    display:none;
  }

  .name strong{
    font-size:13px;
  }

  .name small{
    font-size:10.5px;
  }

  .cell-mini strong{
    font-size:12px;
  }

  .provider-row{
    grid-template-columns:1fr 75px;
  }

  .provider-m2,
  .tag{
    display:none;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">
    <img src="Logo tutto1.svg" alt="Tutto Vinilos">
    <small>COMANDA</small>
  </div>

  <nav class="header-tabs" data-auth-menu id="authMenu"></nav>
</header>

<main class="main">

  <section class="page-head">
    <h1 class="page-title">Materia prima</h1>
    <p class="page-sub">Comparación compacta por proveedor: último precio, mínimo, máximo y costo por m².</p>

    <div class="tools">
      <input class="search" id="searchInput" placeholder="Buscar AR2, Vecxel, PVC, acrílico, 3mm...">
      <button class="btn" type="button" onclick="alert('Luego conectamos este botón a Supabase')">+ Añadir precio</button>
    </div>

    <div class="cats">
      <button class="cat active" type="button" onclick="setCat('TODOS', this)">Todos</button>
      <button class="cat" type="button" onclick="setCat('PVC', this)">PVC</button>
      <button class="cat" type="button" onclick="setCat('ACRILICO', this)">Acrílico</button>
      <button class="cat" type="button" onclick="setCat('VINIL', this)">Vinil</button>
      <button class="cat" type="button" onclick="setCat('LED', this)">Iluminación</button>
      <button class="cat" type="button" onclick="setCat('CONSUMIBLE', this)">Consumibles</button>
    </div>
  </section>

  <section class="list" id="materialList"></section>

  <div class="empty" id="emptyState">Sin materiales encontrados</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=24"></script>
<script src="js/auth.js?v=24"></script>
<script src="js/menu.js?v=11"></script>

<script>
const materiales = [
  {
    categoria:"ACRILICO",
    material:"Acrílico Transparente",
    espesor:"3mm",
    formato:"120 x 240 cm",
    area:2.88,
    nota:"Ejemplo real: AR2 y Vecxel tienen precios distintos para el mismo material.",
    proveedores:[
      {nombre:"AR2", precio:90, fecha:"2026-05-23"},
      {nombre:"Vecxel", precio:80, fecha:"2026-05-23"},
      {nombre:"Proveedor C", precio:95, fecha:"2026-05-10"}
    ]
  },
  {
    categoria:"ACRILICO",
    material:"Acrílico Transparente",
    espesor:"5mm",
    formato:"120 x 240 cm",
    area:2.88,
    nota:"Acrílico grueso. Revisar diferencias por marca y disponibilidad.",
    proveedores:[
      {nombre:"AR2", precio:140, fecha:"2026-05-23"},
      {nombre:"Vecxel", precio:132, fecha:"2026-05-23"},
      {nombre:"Proveedor C", precio:150, fecha:"2026-05-10"}
    ]
  },
  {
    categoria:"PVC",
    material:"PVC Blanco",
    espesor:"3mm",
    formato:"120 x 240 cm",
    area:2.88,
    nota:"Formato estándar. Ideal comparar rápido por proveedor.",
    proveedores:[
      {nombre:"AR2", precio:35, fecha:"2026-05-23"},
      {nombre:"Vecxel", precio:38, fecha:"2026-05-23"},
      {nombre:"Proveedor B", precio:42, fecha:"2026-05-10"}
    ]
  },
  {
    categoria:"PVC",
    material:"PVC Blanco",
    espesor:"5mm",
    formato:"120 x 240 cm",
    area:2.88,
    nota:"Opción intermedia para trabajos livianos.",
    proveedores:[
      {nombre:"AR2", precio:45, fecha:"2026-05-23"},
      {nombre:"Vecxel", precio:48, fecha:"2026-05-23"}
    ]
  },
  {
    categoria:"PVC",
    material:"PVC Blanco",
    espesor:"9mm",
    formato:"120 x 240 cm",
    area:2.88,
    nota:"Muy usado para logos corpóreos y bases.",
    proveedores:[
      {nombre:"AR2", precio:48, fecha:"2026-05-23"},
      {nombre:"Vecxel", precio:55, fecha:"2026-05-23"},
      {nombre:"Proveedor B", precio:58, fecha:"2026-05-10"}
    ]
  },
  {
    categoria:"PVC",
    material:"PVC Blanco",
    espesor:"15mm",
    formato:"120 x 240 cm",
    area:2.88,
    nota:"Usado en letras corpóreas con más grosor.",
    proveedores:[
      {nombre:"AR2", precio:68, fecha:"2026-05-23"},
      {nombre:"Vecxel", precio:72, fecha:"2026-05-23"},
      {nombre:"Proveedor B", precio:76, fecha:"2026-05-10"}
    ]
  },
  {
    categoria:"VINIL",
    material:"Vinil Adhesivo",
    espesor:"-",
    formato:"137 cm x 50 m",
    area:68.5,
    nota:"Cálculo por rollo completo.",
    proveedores:[
      {nombre:"AR2", precio:110, fecha:"2026-05-23"},
      {nombre:"Vecxel", precio:118, fecha:"2026-05-23"}
    ]
  },
  {
    categoria:"LED",
    material:"Módulos LED",
    espesor:"-",
    formato:"20 módulos",
    area:0,
    nota:"No calcula m². Se calcula por paquete.",
    proveedores:[
      {nombre:"AR2", precio:8, fecha:"2026-05-23"},
      {nombre:"Vecxel", precio:9, fecha:"2026-05-23"}
    ]
  }
];

let categoriaActual = "TODOS";

function precios(item){
  return item.proveedores.map(p => Number(p.precio || 0)).filter(p => p > 0);
}

function minPrecio(item){
  const arr = precios(item);
  return arr.length ? Math.min(...arr) : 0;
}

function maxPrecio(item){
  const arr = precios(item);
  return arr.length ? Math.max(...arr) : 0;
}

function ultimoPrecio(item){
  if(!item.proveedores.length) return 0;
  return item.proveedores[0].precio;
}

function mejorProveedor(item){
  const min = minPrecio(item);
  const found = item.proveedores.find(p => Number(p.precio) === min);
  return found ? found.nombre : "-";
}

function costoM2(precio, area){
  if(!area || area <= 0) return "-";
  return "$" + (Number(precio || 0) / area).toFixed(2);
}

function rango(item){
  const min = minPrecio(item);
  const max = maxPrecio(item);
  if(!min && !max) return "-";
  if(min === max) return "$" + min;
  return "$" + min + " → $" + max;
}

function setCat(cat, btn){
  categoriaActual = cat;
  document.querySelectorAll(".cat").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  render();
}

function toggleItem(index){
  const item = document.getElementById("item_" + index);
  if(item) item.classList.toggle("open");
}

function proveedorTag(item, precio){
  const min = minPrecio(item);
  const max = maxPrecio(item);

  if(Number(precio) === min && min !== max) return '<span class="tag min">Mejor</span>';
  if(Number(precio) === max && min !== max) return '<span class="tag max">Más alto</span>';
  return '<span class="tag normal">Normal</span>';
}

function render(){
  const q = document.getElementById("searchInput").value.toUpperCase().trim();

  const lista = materiales
    .map((item, originalIndex) => ({...item, originalIndex}))
    .filter(item => {
      const proveedoresTexto = item.proveedores.map(p => `${p.nombre} ${p.precio} ${p.fecha}`).join(" ");
      const texto = `${item.categoria} ${item.material} ${item.espesor} ${item.formato} ${item.nota} ${proveedoresTexto}`.toUpperCase();
      const okTexto = texto.includes(q);
      const okCat = categoriaActual === "TODOS" || item.categoria === categoriaActual;
      return okTexto && okCat;
    });

  document.getElementById("materialList").innerHTML = lista.map(item => `
    <article class="item" id="item_${item.originalIndex}">
      <button class="item-main" type="button" onclick="toggleItem(${item.originalIndex})">
        <span class="badge">${item.categoria}</span>

        <span class="name">
          <strong>${item.material}</strong>
          <small>${item.espesor} · ${item.formato}</small>
        </span>

        <span class="cell-mini last-price">
          <small>Último</small>
          <strong>$${ultimoPrecio(item)}</strong>
        </span>

        <span class="cell-mini range hide-mobile">
          <small>Min / Max</small>
          <strong>${rango(item)}</strong>
        </span>

        <span class="cell-mini cost-m2 hide-tablet">
          <small>Costo m²</small>
          <strong>${costoM2(minPrecio(item), item.area)}</strong>
        </span>

        <span class="cell-mini best hide-mobile">
          <small>Mejor prov.</small>
          <strong>${mejorProveedor(item)}</strong>
        </span>

        <span class="arrow">⌄</span>
      </button>

      <div class="item-details">
        <div class="provider-list">
          ${item.proveedores.map(p => `
            <div class="provider-row">
              <div class="provider-name">${p.nombre}</div>
              <div class="provider-price">$${p.precio}</div>
              <div class="provider-m2">${costoM2(p.precio, item.area)} m²</div>
              ${proveedorTag(item, p.precio)}
            </div>
          `).join("")}
        </div>

        <div class="detail-note">
          ${item.nota}
        </div>

        <div class="detail-actions">
          <button class="action" type="button" onclick="event.stopPropagation(); alert('Luego editamos este material')">Editar material</button>
          <button class="action orange" type="button" onclick="event.stopPropagation(); alert('Luego agregamos nuevo precio/proveedor')">+ Precio proveedor</button>
        </div>
      </div>
    </article>
  `).join("");

  document.getElementById("emptyState").style.display = lista.length ? "none" : "block";
}

document.getElementById("searchInput").addEventListener("input", render);

window.addEventListener("load", function(){
  document.documentElement.classList.remove("loading-menu");
  document.documentElement.classList.add("menu-ready");
});

render();
</script>

</body>
</html>
