
<!-- BLOQUE BOTONES ACCIONES v2 -->
<div class="material-actions">

  <button class="action-btn edit">
    Editar material
  </button>

  <button class="action-btn provider">
    + Precio proveedor
  </button>

  <button class="action-btn duplicate"
          onclick="duplicarMaterial(material.id)">
    Duplicar
  </button>

  <button class="action-btn delete">
    Eliminar
  </button>

</div>

<script>
/* =========================================================
   DUPLICAR MATERIAL
========================================================= */
async function duplicarMaterial(id){

  const material = materiales.find(x => x.id === id);

  if(!material) return;

  abrirModalMaterial();

  // AUTORELLENO
  document.getElementById("m_categoria").value =
    material.categoria || "";

  document.getElementById("m_nombre").value =
    (material.nombre || "") + " COPIA";

  document.getElementById("m_espesor").value =
    material.espesor || "";

  document.getElementById("m_ancho").value =
    material.ancho_cm || "";

  document.getElementById("m_alto").value =
    material.alto_cm || "";

  document.getElementById("m_notas").value =
    material.notas || "";

  // RECALCULAR M2
  calcularM2();

  // FOCUS AUTOMÁTICO
  setTimeout(()=>{
    const input = document.getElementById("m_nombre");
    input.focus();
    input.select();
  },120);

  mostrarToast("Material duplicado listo para editar");

}
</script>
