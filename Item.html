<!DOCTYPE html>
<html lang="es" class="loading-menu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Materia Prima · Tuttovinilos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/menu.css?v=34">

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f0f2f9;
  --panel:#ffffff;
  --panel2:#f8f9ff;
  --border:#d9deea;
  --border2:#cbd3e6;
  --text:#111827;
  --muted:#6b7280;
  --accent:#153bff;
  --accent2:#0b1f7a;
  --orange:#ff8616;
  --orange2:#fff3e8;
  --head:'Montserrat',Arial,sans-serif;
  --body:'Inter',Arial,sans-serif;
  --mono:'Roboto Mono',monospace;
}

html,body{
  background:var(--bg)!important;
  color:var(--text);
  font-family:var(--body);
  min-height:100vh;
  color-scheme:light;
}

button,input,select,textarea{font:inherit;color-scheme:light}

.main{
  padding:14px;
  max-width:1280px;
  margin:0 auto;
}

.page-head{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  padding:14px;
  box-shadow:0 8px 24px rgba(15,23,42,.055);
  margin-bottom:12px;
}

.page-title{
  font-family:var(--head);
  font-size:22px;
  font-weight:900;
  color:var(--accent2);
  text-transform:uppercase;
}

.page-sub{
  margin-top:4px;
  color:var(--muted);
  font-size:13px;
  font-weight:600;
}

.tools{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  margin-top:12px;
}

.search{
  min-height:40px;
  border:1px solid var(--border2);
  border-radius:14px;
  padding:0 13px;
  font-size:13px;
  outline:none;
  background:white;
  color:#111827;
}

.btn{
  border:0;
  background:linear-gradient(135deg,var(--accent),#0b1f7a);
  color:white;
  border-radius:14px;
  padding:0 16px;
  font-family:var(--head);
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.4px;
  cursor:pointer;
  min-height:40px;
  box-shadow:0 8px 18px rgba(21,59,255,.16);
}

.cats{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:12px 0 2px;
}

.cat{
  border:1px solid var(--border2);
  background:white;
  color:var(--accent2);
  border-radius:999px;
  padding:8px 13px;
  font-family:var(--head);
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  white-space:nowrap;
  cursor:pointer;
}

.cat.active{
  background:var(--orange);
  color:white;
  border-color:var(--orange);
  box-shadow:0 7px 16px rgba(255,134,22,.20);
}

.list{
  display:grid;
  gap:8px;
}

.item{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(15,23,42,.04);
}

.item-main{
  width:100%;
  border:0;
  background:white;
  display:grid;
  grid-template-columns:95px 1.4fr 80px 120px 105px 30px;
  align-items:center;
  gap:8px;
  padding:9px 12px;
  text-align:left;
  cursor:pointer;
}

.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:#eef1ff;
  color:var(--accent);
  border:1px solid #c7d2fe;
  border-radius:999px;
  padding:5px 8px;
  font-size:9.5px;
  font-family:var(--head);
  font-weight:900;
  white-space:nowrap;
}

.name{
  min-width:0;
}

.name strong{
  display:block;
  font-family:var(--head);
  font-size:14px;
  font-weight:900;
  color:var(--accent2);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.name small{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.cell-mini{
  min-width:0;
}

.cell-mini small{
  display:block;
  font-family:var(--head);
  font-size:8.5px;
  font-weight:900;
  color:#818898;
  text-transform:uppercase;
  letter-spacing:.3px;
}

.cell-mini strong{
  display:block;
  margin-top:2px;
  font-family:var(--mono);
  font-size:13px;
  font-weight:800;
  color:#111827;
  white-space:nowrap;
}

.cost-m2 strong{
  color:var(--orange);
  font-size:14px;
}

.arrow{
  width:28px;
  height:28px;
  border-radius:50%;
  background:#eef1ff;
  color:var(--accent);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  transition:transform .15s;
}

.item.open .arrow{
  transform:rotate(180deg);
  background:var(--orange2);
  color:var(--orange);
}

.item-details{
  display:none;
  border-top:1px solid var(--border);
  background:linear-gradient(180deg,#fff,#f8f9ff);
  padding:10px 12px 12px;
}

.item.open .item-details{
  display:block;
}

.detail-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.detail-box{
  background:white;
  border:1px solid var(--border);
  border-radius:13px;
  padding:9px;
}

.detail-box small{
  display:block;
  color:var(--muted);
  font-family:var(--head);
  font-size:9px;
  font-weight:900;
  text-transform:uppercase;
}

.detail-box strong{
  display:block;
  margin-top:4px;
  color:var(--accent2);
  font-size:13px;
  font-weight:900;
}

.detail-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:10px;
}

.action{
  border:1px solid #c7d2fe;
  background:#eef1ff;
  color:var(--accent);
  border-radius:999px;
  padding:8px 12px;
  font-family:var(--head);
  font-size:10px;
  font-weight:900;
  cursor:pointer;
}

.action.orange{
  border-color:#fed7aa;
  background:var(--orange2);
  color:#c2410c;
}

.empty{
  background:white;
  border:1px dashed var(--border2);
  border-radius:18px;
  padding:28px;
  text-align:center;
  color:var(--muted);
  font-family:var(--head);
  font-weight:900;
  text-transform:uppercase;
  display:none;
}

@media(max-width:760px){
  .main{padding:10px}
  .page-title{font-size:18px}
  .tools{grid-template-columns:1fr}
  .btn{width:100%}

  .item-main{
    grid-template-columns:78px 1fr 86px 28px;
    gap:7px;
    padding:8px 9px;
  }

  .hide-mobile{
    display:none;
  }

  .name strong{
    font-size:13px;
  }

  .name small{
    font-size:10.5px;
  }

  .cell-mini strong{
    font-size:12px;
  }

  .detail-grid{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">
    <img src="Logo tutto1.svg" alt="Tutto Vinilos">
    <small>COMANDA</small>
  </div>

  <nav class="header-tabs" data-auth-menu id="authMenu"></nav>
</header>

<main class="main">

  <section class="page-head">
    <h1 class="page-title">Materia prima</h1>
    <p class="page-sub">Lista compacta de precios. Toca un material para desplegar más información.</p>

    <div class="tools">
      <input class="search" id="searchInput" placeholder="Buscar PVC, acrílico, 3mm, formato, proveedor...">
      <button class="btn" type="button" onclick="alert('Luego conectamos este botón a Supabase')">+ Añadir material</button>
    </div>

    <div class="cats">
      <button class="cat active" type="button" onclick="setCat('TODOS', this)">Todos</button>
      <button class="cat" type="button" onclick="setCat('PVC', this)">PVC</button>
      <button class="cat" type="button" onclick="setCat('ACRILICO', this)">Acrílico</button>
      <button class="cat" type="button" onclick="setCat('VINIL', this)">Vinil</button>
      <button class="cat" type="button" onclick="setCat('LED', this)">Iluminación</button>
      <button class="cat" type="button" onclick="setCat('CONSUMIBLE', this)">Consumibles</button>
    </div>
  </section>

  <section class="list" id="materialList"></section>

  <div class="empty" id="emptyState">Sin materiales encontrados</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=24"></script>
<script src="js/auth.js?v=24"></script>
<script src="js/menu.js?v=11"></script>

<script>
const materiales = [
  { categoria:"PVC", material:"PVC Blanco", espesor:"3mm", formato:"120 x 240 cm", precio:35, area:2.88, proveedor:"Proveedor A", nota:"Formato estándar para router y letras pequeñas." },
  { categoria:"PVC", material:"PVC Blanco", espesor:"5mm", formato:"120 x 240 cm", precio:45, area:2.88, proveedor:"Proveedor A", nota:"Opción intermedia para trabajos livianos." },
  { categoria:"PVC", material:"PVC Blanco", espesor:"9mm", formato:"120 x 240 cm", precio:48, area:2.88, proveedor:"Proveedor B", nota:"Muy usado para logos corpóreos y bases." },
  { categoria:"PVC", material:"PVC Blanco", espesor:"15mm", formato:"120 x 240 cm", precio:68, area:2.88, proveedor:"Proveedor B", nota:"Usado en letras corpóreas con más grosor." },
  { categoria:"PVC", material:"PVC Blanco", espesor:"18mm", formato:"120 x 240 cm", precio:78, area:2.88, proveedor:"Proveedor B", nota:"Mayor cuerpo y rigidez." },
  { categoria:"ACRILICO", material:"Acrílico Transparente", espesor:"3mm", formato:"120 x 240 cm", precio:90, area:2.88, proveedor:"Proveedor C", nota:"Frontal, placas y detalles transparentes." },
  { categoria:"ACRILICO", material:"Acrílico Transparente", espesor:"5mm", formato:"120 x 240 cm", precio:140, area:2.88, proveedor:"Proveedor C", nota:"Más rígido para piezas premium." },
  { categoria:"ACRILICO", material:"Acrílico Transparente", espesor:"8mm", formato:"120 x 240 cm", precio:180, area:2.88, proveedor:"Proveedor C", nota:"Especial para bases gruesas o premium." },
  { categoria:"VINIL", material:"Vinil Adhesivo", espesor:"-", formato:"137 cm x 50 m", precio:110, area:68.5, proveedor:"Proveedor Vinil", nota:"Cálculo por rollo completo." },
  { categoria:"VINIL", material:"Vinil Holográfico", espesor:"-", formato:"137 cm x 50 m", precio:280, area:68.5, proveedor:"Proveedor Vinil", nota:"Producto especial para etiquetas." },
  { categoria:"LED", material:"Módulos LED", espesor:"-", formato:"20 módulos", precio:8, area:0, proveedor:"Proveedor LED", nota:"No calcula m². Se calcula por paquete." },
  { categoria:"CONSUMIBLE", material:"Cable", espesor:"-", formato:"Metro lineal", precio:1, area:0, proveedor:"General", nota:"Consumible por metro." }
];

let categoriaActual = "TODOS";

function costoM2(item){
  if(!item.area || item.area <= 0) return "-";
  return "$" + (item.precio / item.area).toFixed(2);
}

function setCat(cat, btn){
  categoriaActual = cat;
  document.querySelectorAll(".cat").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  render();
}

function toggleItem(index){
  const item = document.getElementById("item_" + index);
  if(item) item.classList.toggle("open");
}

function render(){
  const q = document.getElementById("searchInput").value.toUpperCase().trim();

  const lista = materiales
    .map((item, originalIndex) => ({...item, originalIndex}))
    .filter(item => {
      const texto = Object.values(item).join(" ").toUpperCase();
      const okTexto = texto.includes(q);
      const okCat = categoriaActual === "TODOS" || item.categoria === categoriaActual;
      return okTexto && okCat;
    });

  document.getElementById("materialList").innerHTML = lista.map(item => `
    <article class="item" id="item_${item.originalIndex}">
      <button class="item-main" type="button" onclick="toggleItem(${item.originalIndex})">
        <span class="badge">${item.categoria}</span>

        <span class="name">
          <strong>${item.material}</strong>
          <small>${item.espesor} · ${item.formato}</small>
        </span>

        <span class="cell-mini hide-mobile">
          <small>Formato</small>
          <strong>$${item.precio}</strong>
        </span>

        <span class="cell-mini cost-m2">
          <small>Costo m²</small>
          <strong>${costoM2(item)}</strong>
        </span>

        <span class="cell-mini hide-mobile">
          <small>Proveedor</small>
          <strong>${item.proveedor}</strong>
        </span>

        <span class="arrow">⌄</span>
      </button>

      <div class="item-details">
        <div class="detail-grid">
          <div class="detail-box">
            <small>Categoría</small>
            <strong>${item.categoria}</strong>
          </div>
          <div class="detail-box">
            <small>Material</small>
            <strong>${item.material}</strong>
          </div>
          <div class="detail-box">
            <small>Espesor</small>
            <strong>${item.espesor}</strong>
          </div>
          <div class="detail-box">
            <small>Formato</small>
            <strong>${item.formato}</strong>
          </div>
          <div class="detail-box">
            <small>Precio formato</small>
            <strong>$${item.precio}</strong>
          </div>
          <div class="detail-box">
            <small>Área</small>
            <strong>${item.area ? item.area + " m²" : "-"}</strong>
          </div>
          <div class="detail-box">
            <small>Costo m²</small>
            <strong>${costoM2(item)}</strong>
          </div>
          <div class="detail-box">
            <small>Proveedor</small>
            <strong>${item.proveedor}</strong>
          </div>
        </div>

        <div class="detail-box" style="margin-top:8px">
          <small>Nota</small>
          <strong>${item.nota}</strong>
        </div>

        <div class="detail-actions">
          <button class="action" type="button" onclick="event.stopPropagation(); alert('Luego editamos este material')">Editar</button>
          <button class="action orange" type="button" onclick="event.stopPropagation(); alert('Luego conectamos historial de precios')">Historial</button>
        </div>
      </div>
    </article>
  `).join("");

  document.getElementById("emptyState").style.display = lista.length ? "none" : "block";
}

document.getElementById("searchInput").addEventListener("input", render);

window.addEventListener("load", function(){
  document.documentElement.classList.remove("loading-menu");
  document.documentElement.classList.add("menu-ready");
});

render();
</script>

</body>
</html>
