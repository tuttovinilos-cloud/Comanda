<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Materia Prima · Tuttovinilos</title>

<style>
:root{
  --bg:#eef2f8;
  --panel:#ffffff;
  --text:#111827;
  --muted:#64748b;
  --blue:#0f6fff;
  --dark:#0f172a;
  --line:#dbe3ef;
  --green:#16a34a;
  --red:#dc2626;
  --yellow:#facc15;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
}
.header{
  background:var(--dark);
  color:white;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10;
}
.logo{
  font-weight:900;
  letter-spacing:.5px;
}
.menu{
  display:flex;
  gap:8px;
  overflow-x:auto;
}
.menu a{
  color:white;
  text-decoration:none;
  padding:8px 12px;
  border-radius:10px;
  background:rgba(255,255,255,.08);
  white-space:nowrap;
  font-size:14px;
}
.menu a.active{
  background:var(--blue);
}
.container{
  max-width:1200px;
  margin:auto;
  padding:18px;
}
.top-panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 8px 24px rgba(15,23,42,.06);
}
.title{
  font-size:24px;
  font-weight:900;
  margin-bottom:4px;
}
.subtitle{
  color:var(--muted);
  font-size:14px;
  margin-bottom:14px;
}
.filters{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
}
.search{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid var(--line);
  font-size:16px;
}
.btn{
  border:none;
  background:var(--blue);
  color:white;
  padding:13px 16px;
  border-radius:12px;
  font-weight:800;
  cursor:pointer;
}
.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin:14px 0;
}
.cat{
  border:none;
  background:white;
  border:1px solid var(--line);
  padding:10px 14px;
  border-radius:999px;
  font-weight:800;
  cursor:pointer;
  white-space:nowrap;
}
.cat.active{
  background:var(--dark);
  color:white;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:12px;
  margin-bottom:18px;
}
.card{
  background:white;
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  box-shadow:0 6px 18px rgba(15,23,42,.05);
}
.card h3{
  font-size:18px;
  margin-bottom:6px;
}
.card .meta{
  color:var(--muted);
  font-size:13px;
  margin-bottom:10px;
}
.price{
  display:flex;
  justify-content:space-between;
  align-items:end;
}
.big{
  font-size:24px;
  font-weight:900;
  color:var(--blue);
}
.small{
  color:var(--muted);
  font-size:13px;
}
.table-wrap{
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  overflow:auto;
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}
th,td{
  padding:12px;
  border-bottom:1px solid var(--line);
  text-align:left;
  font-size:14px;
}
th{
  background:#f8fafc;
  font-size:12px;
  text-transform:uppercase;
  color:#475569;
}
.badge{
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  background:#e0ecff;
  color:#0f6fff;
}
.actions button{
  border:none;
  padding:7px 10px;
  border-radius:9px;
  font-weight:800;
  cursor:pointer;
}
.edit{background:#e0ecff;color:#0f6fff}
.del{background:#ffe4e6;color:#dc2626}

@media(max-width:700px){
  .header{
    display:block;
  }
  .logo{
    margin-bottom:10px;
  }
  .filters{
    grid-template-columns:1fr;
  }
  .container{
    padding:12px;
  }
  .title{
    font-size:20px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">TUTTOVINILOS</div>
  <nav class="menu">
    <a href="#">Pedidos</a>
    <a href="#">Cotizador</a>
    <a href="#" class="active">Materia Prima</a>
    <a href="#">Clientes</a>
    <a href="#">Estadísticas</a>
    <a href="#">Configuración</a>
  </nav>
</header>

<main class="container">

  <section class="top-panel">
    <h1 class="title">Lista de precios de materia prima</h1>
    <p class="subtitle">Control por categoría, formato, precio de lámina y costo por m².</p>

    <div class="filters">
      <input class="search" id="search" placeholder="Buscar material, espesor, formato...">
      <button class="btn">+ Añadir material</button>
    </div>

    <div class="categories">
      <button class="cat active" onclick="filterCat('TODOS')">Todos</button>
      <button class="cat" onclick="filterCat('PVC')">PVC</button>
      <button class="cat" onclick="filterCat('ACRILICO')">Acrílico</button>
      <button class="cat" onclick="filterCat('VINIL')">Vinil</button>
      <button class="cat" onclick="filterCat('LED')">Iluminación</button>
      <button class="cat" onclick="filterCat('CONSUMIBLE')">Consumibles</button>
    </div>
  </section>

  <section class="grid" id="cards"></section>

  <section class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Categoría</th>
          <th>Material</th>
          <th>Espesor</th>
          <th>Formato</th>
          <th>Precio lámina</th>
          <th>Área</th>
          <th>Costo m²</th>
          <th>Proveedor</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="table"></tbody>
    </table>
  </section>

</main>

<script>
const materiales = [
  {
    categoria:"PVC",
    material:"PVC Blanco",
    espesor:"3mm",
    formato:"120 x 240 cm",
    precio:35,
    area:2.88,
    proveedor:"Proveedor A"
  },
  {
    categoria:"PVC",
    material:"PVC Blanco",
    espesor:"5mm",
    formato:"120 x 240 cm",
    precio:45,
    area:2.88,
    proveedor:"Proveedor A"
  },
  {
    categoria:"PVC",
    material:"PVC Blanco",
    espesor:"9mm",
    formato:"120 x 240 cm",
    precio:48,
    area:2.88,
    proveedor:"Proveedor B"
  },
  {
    categoria:"ACRILICO",
    material:"Acrílico Transparente",
    espesor:"3mm",
    formato:"120 x 240 cm",
    precio:90,
    area:2.88,
    proveedor:"Proveedor C"
  },
  {
    categoria:"ACRILICO",
    material:"Acrílico Transparente",
    espesor:"5mm",
    formato:"120 x 240 cm",
    precio:140,
    area:2.88,
    proveedor:"Proveedor C"
  },
  {
    categoria:"VINIL",
    material:"Vinil Adhesivo Blanco",
    espesor:"-",
    formato:"137 cm x 50 m",
    precio:110,
    area:68.5,
    proveedor:"Proveedor Vinil"
  },
  {
    categoria:"LED",
    material:"Módulos LED",
    espesor:"-",
    formato:"20 módulos",
    precio:8,
    area:0,
    proveedor:"Proveedor LED"
  }
];

let categoriaActual = "TODOS";

function costoM2(item){
  if(!item.area || item.area === 0) return "-";
  return "$" + (item.precio / item.area).toFixed(2);
}

function render(){
  const q = document.getElementById("search").value.toUpperCase();

  const filtrados = materiales.filter(item => {
    const texto = Object.values(item).join(" ").toUpperCase();
    const matchSearch = texto.includes(q);
    const matchCat = categoriaActual === "TODOS" || item.categoria === categoriaActual;
    return matchSearch && matchCat;
  });

  document.getElementById("cards").innerHTML = filtrados.map(item => `
    <div class="card">
      <h3>${item.material}</h3>
      <div class="meta">${item.categoria} · ${item.espesor} · ${item.formato}</div>
      <div class="price">
        <div>
          <div class="big">$${item.precio}</div>
          <div class="small">Precio formato completo</div>
        </div>
        <div>
          <div class="big">${costoM2(item)}</div>
          <div class="small">Costo m²</div>
        </div>
      </div>
    </div>
  `).join("");

  document.getElementById("table").innerHTML = filtrados.map(item => `
    <tr>
      <td><span class="badge">${item.categoria}</span></td>
      <td>${item.material}</td>
      <td>${item.espesor}</td>
      <td>${item.formato}</td>
      <td>$${item.precio}</td>
      <td>${item.area ? item.area + " m²" : "-"}</td>
      <td>${costoM2(item)}</td>
      <td>${item.proveedor}</td>
      <td class="actions">
        <button class="edit">Editar</button>
        <button class="del">Eliminar</button>
      </td>
    </tr>
  `).join("");
}

function filterCat(cat){
  categoriaActual = cat;
  document.querySelectorAll(".cat").forEach(btn => btn.classList.remove("active"));
  event.target.classList.add("active");
  render();
}

document.getElementById("search").addEventListener("input", render);
render();
</script>

</body>
</html>
