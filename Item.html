<!DOCTYPE html>
<html lang="es" class="loading-menu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Materia Prima · Tuttovinilos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/menu.css?v=34">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f9;--panel:#fff;--border:#d9deea;--border2:#cbd3e6;
  --text:#111827;--muted:#6b7280;--accent:#153bff;--accent2:#0b1f7a;
  --orange:#ff8616;--orange2:#fff3e8;--green:#16a34a;--red:#dc2626;
  --head:'Montserrat',Arial,sans-serif;--body:'Inter',Arial,sans-serif;--mono:'Roboto Mono',monospace;
}
html,body{background:var(--bg)!important;color:var(--text);font-family:var(--body);min-height:100vh;color-scheme:light}
button,input,select,textarea{font:inherit;color-scheme:light}
button{cursor:pointer}
.main{padding:12px;max-width:1280px;margin:0 auto}
.page-head{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:14px;box-shadow:0 8px 24px rgba(15,23,42,.055);margin-bottom:12px}
.page-title{font-family:var(--head);font-size:21px;font-weight:900;color:var(--accent2);text-transform:uppercase}
.page-sub{margin-top:4px;color:var(--muted);font-size:13px;font-weight:700;line-height:1.35}
.tools{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:12px}
.search{min-height:40px;border:1px solid var(--border2);border-radius:14px;padding:0 13px;font-size:13px;outline:none;background:white;color:#111827}
.btn{border:0;background:linear-gradient(135deg,var(--accent),#0b1f7a);color:white;border-radius:14px;padding:0 16px;font-family:var(--head);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.4px;min-height:40px;box-shadow:0 8px 18px rgba(21,59,255,.16)}
.btn.orange{background:linear-gradient(135deg,var(--orange),#c2410c);box-shadow:0 8px 18px rgba(255,134,22,.18)}
.btn.light{background:white;color:var(--accent);border:1px solid #c7d2fe;box-shadow:none}
.cats{display:flex;gap:7px;overflow-x:auto;padding:12px 0 2px}
.cat{border:1px solid var(--border2);background:white;color:var(--accent2);border-radius:999px;padding:8px 13px;font-family:var(--head);font-size:10px;font-weight:900;text-transform:uppercase;white-space:nowrap}
.cat.active{background:var(--orange);color:white;border-color:var(--orange);box-shadow:0 7px 16px rgba(255,134,22,.20)}

.catalog-preview{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(155px,1fr));
  gap:8px;
  margin:0 0 12px;
}
.catalog-card{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:10px;
  box-shadow:0 5px 16px rgba(15,23,42,.04);
}
.catalog-card small{
  display:block;
  font-family:var(--head);
  color:var(--muted);
  font-size:9px;
  font-weight:900;
  text-transform:uppercase;
}
.catalog-card strong{
  display:block;
  margin-top:3px;
  font-family:var(--head);
  color:var(--accent2);
  font-size:13px;
  font-weight:900;
}
.catalog-card button{
  margin-top:8px;
  width:100%;
  min-height:30px;
  border:1px solid #fed7aa;
  background:var(--orange2);
  color:#c2410c;
  border-radius:999px;
  font-family:var(--head);
  font-size:9px;
  font-weight:900;
  text-transform:uppercase;
}

.list{display:grid;gap:8px}
.item{background:white;border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 6px 18px rgba(15,23,42,.04)}
.item-main{
  width:100%;border:0;background:white;display:grid;
  grid-template-columns:92px 1fr 118px 110px 28px;
  align-items:center;gap:8px;padding:8px 11px;text-align:left;
}
.badge{display:inline-flex;align-items:center;justify-content:center;background:#eef1ff;color:var(--accent);border:1px solid #c7d2fe;border-radius:999px;padding:5px 8px;font-size:9.5px;font-family:var(--head);font-weight:900;white-space:nowrap}
.name{min-width:0}
.name strong{display:block;font-family:var(--head);font-size:15px;font-weight:900;color:var(--accent2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name small{display:block;margin-top:2px;color:var(--muted);font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-mini{min-width:0}
.cell-mini small{display:block;font-family:var(--head);font-size:8.5px;font-weight:900;color:#818898;text-transform:uppercase;letter-spacing:.3px}
.cell-mini strong{display:block;margin-top:2px;font-family:var(--mono);font-size:13px;font-weight:900;color:#111827;white-space:nowrap}
.lamina strong{color:var(--accent);font-size:14px}
.best strong{color:var(--green);font-size:13px}
.arrow{width:27px;height:27px;border-radius:50%;background:#eef1ff;color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:900;transition:transform .15s}
.item.open .arrow{transform:rotate(180deg);background:var(--orange2);color:var(--orange)}

.item-details{display:none;border-top:1px solid var(--border);background:linear-gradient(180deg,#fff,#f8f9ff);padding:10px 12px 12px}
.item.open .item-details{display:block}
.provider-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;color:var(--muted);font-family:var(--head);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.4px}
.provider-title span:last-child{color:var(--orange)}
.provider-list{display:grid;gap:7px}
.provider-row{display:grid;grid-template-columns:34px 1fr 88px 105px 80px 34px;align-items:center;gap:8px;background:white;border:1px solid var(--border);border-radius:13px;padding:8px 10px}
.provider-rank{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#eef1ff;color:var(--accent);font-family:var(--mono);font-size:11px;font-weight:900}
.provider-row:first-child .provider-rank{background:#dcfce7;color:#166534}
.provider-name{font-family:var(--head);font-size:13px;font-weight:900;color:var(--accent2)}
.provider-price{font-family:var(--mono);font-size:14px;font-weight:900;color:#111827;text-align:right}
.provider-m2{font-family:var(--mono);font-size:12px;font-weight:900;color:var(--orange);text-align:right}
.provider-date{font-family:var(--mono);font-size:10px;font-weight:800;color:var(--muted);text-align:right}
.icon-btn{width:30px;height:30px;border-radius:50%;border:1px solid #fed7aa;background:var(--orange2);color:#c2410c;font-weight:900}
.detail-note{margin-top:8px;background:var(--orange2);border:1px solid #fed7aa;border-radius:13px;padding:9px;color:#9a3412;font-size:12px;font-weight:800}
.detail-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;flex-wrap:wrap}
.action{border:1px solid #c7d2fe;background:#eef1ff;color:var(--accent);border-radius:999px;padding:8px 12px;font-family:var(--head);font-size:10px;font-weight:900}
.action.orange{border-color:#fed7aa;background:var(--orange2);color:#c2410c}
.empty{background:white;border:1px dashed var(--border2);border-radius:18px;padding:28px;text-align:center;color:var(--muted);font-family:var(--head);font-weight:900;text-transform:uppercase;display:none}

/* MODAL */
.backdrop{position:fixed;inset:0;background:rgba(17,24,39,.42);z-index:900;display:none;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(3px)}
.modal{width:100%;max-width:720px;max-height:92vh;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:20px;box-shadow:0 24px 80px rgba(17,24,39,.24)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-title{font-family:var(--head);font-size:16px;font-weight:900;color:var(--accent2);text-transform:uppercase}
.close{width:34px;height:34px;border-radius:50%;border:1px solid var(--border2);background:#fff;color:var(--muted);font-weight:900}
.modal-body{padding:14px;display:grid;gap:12px}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:var(--head);font-size:10px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border2);border-radius:13px;background:#fff;color:#111827;min-height:40px;padding:9px 11px;outline:none}
.field input[readonly]{background:#f8f9ff;color:var(--accent2);font-weight:900}
.field textarea{min-height:74px;resize:vertical}
.full{grid-column:1/-1}
.format-panel{
  grid-column:1/-1;
  border:1px solid var(--border);
  background:#f8f9ff;
  border-radius:16px;
  padding:10px;
}
.format-title{
  font-family:var(--head);
  font-size:11px;
  font-weight:900;
  color:var(--accent2);
  text-transform:uppercase;
  margin-bottom:8px;
}
.provider-editor{border:1px solid var(--border);border-radius:16px;background:#f8f9ff;padding:10px}
.provider-editor-title{font-family:var(--head);font-size:11px;font-weight:900;color:var(--accent2);text-transform:uppercase;margin-bottom:8px}
.provider-input-row{display:grid;grid-template-columns:1fr 105px 135px 38px;gap:7px;margin-bottom:7px}
.provider-input-row input{border:1px solid var(--border2);border-radius:12px;min-height:38px;padding:8px 10px}
.remove-provider{border:1px solid #fecaca;background:#fee2e2;color:#991b1b;border-radius:12px;font-weight:900}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 16px;border-top:1px solid var(--border);flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111827;color:white;border-radius:999px;padding:10px 16px;font-family:var(--head);font-size:12px;font-weight:900;text-transform:uppercase;z-index:999;display:none}

@media(max-width:760px){
  .main{padding:10px}
  .page-title{font-size:18px}
  .tools{grid-template-columns:1fr}.btn{width:100%}
  .item-main{grid-template-columns:78px 1fr 88px 28px;gap:7px;padding:8px 9px}
  .hide-mobile{display:none}
  .name strong{font-size:14px}.name small{font-size:10.5px}
  .cell-mini strong{font-size:12px}
  .provider-row{grid-template-columns:28px 1fr 70px 78px 30px}
  .provider-date{display:none}
  .provider-price{font-size:13px}
  .provider-m2{font-size:11px}
  .form-grid{grid-template-columns:1fr}
  .provider-input-row{grid-template-columns:1fr 82px 1fr 36px}
}
</style>
</head>

<body>
<header class="header">
  <div class="logo">
    <img src="Logo tutto1.svg" alt="Tutto Vinilos">
    <small>COMANDA</small>
  </div>
  <nav class="header-tabs" data-auth-menu id="authMenu"></nav>
</header>

<main class="main">
  <section class="page-head">
    <h1 class="page-title">Materia prima</h1>
    <p class="page-sub">Catálogo base + materiales nuevos. El formato tiene ancho y largo en cm, y calcula m² automático.</p>

    <div class="tools">
      <input class="search" id="searchInput" placeholder="Buscar transparente, AR2, Vecxel, PVC, 3mm...">
      <button class="btn" type="button" onclick="openMaterialModal()">+ Añadir material</button>
      <button class="btn light" type="button" onclick="resetDemo()">Reset demo</button>
    </div>

    <div class="cats">
      <button class="cat active" type="button" onclick="setCat('TODOS', this)">Todos</button>
      <button class="cat" type="button" onclick="setCat('PVC', this)">PVC</button>
      <button class="cat" type="button" onclick="setCat('ACRILICO', this)">Acrílico</button>
      <button class="cat" type="button" onclick="setCat('VINIL', this)">Vinil</button>
      <button class="cat" type="button" onclick="setCat('LED', this)">Iluminación</button>
      <button class="cat" type="button" onclick="setCat('CONSUMIBLE', this)">Consumibles</button>
    </div>
  </section>

  <section class="catalog-preview" id="catalogPreview"></section>
  <section class="list" id="materialList"></section>
  <div class="empty" id="emptyState">Sin materiales encontrados</div>
</main>

<div class="backdrop" id="materialBackdrop" onclick="backdropClick(event)">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">Añadir material</div>
      <button class="close" type="button" onclick="closeMaterialModal()">✕</button>
    </div>

    <div class="modal-body">
      <div class="form-grid">
        <div class="field">
          <label>Categoría</label>
          <select id="f_categoria">
            <option>PVC</option>
            <option>ACRILICO</option>
            <option>VINIL</option>
            <option>LED</option>
            <option>CONSUMIBLE</option>
          </select>
        </div>

        <div class="field">
          <label>Nombre / acabado</label>
          <input id="f_nombre" placeholder="Ej: Blanco, Transparente, Opal">
        </div>

        <div class="field">
          <label>Espesor</label>
          <input id="f_espesor" placeholder="Ej: 3mm, 5mm, -">
        </div>

        <div class="format-panel">
          <div class="format-title">Formato / medidas en cm</div>
          <div class="form-grid">
            <div class="field">
              <label>Ancho cm</label>
              <input id="f_ancho_cm" type="number" step="0.01" placeholder="Ej: 120">
            </div>

            <div class="field">
              <label>Largo cm</label>
              <input id="f_largo_cm" type="number" step="0.01" placeholder="Ej: 240">
            </div>

            <div class="field">
              <label>Área m² automático</label>
              <input id="f_area" type="number" step="0.0001" readonly placeholder="0.0000">
            </div>

            <div class="field full">
              <label>Formato visible</label>
              <input id="f_formato" placeholder="Se genera automático: 120 × 240 cm">
            </div>
          </div>
        </div>

        <div class="field full">
          <label>Nota</label>
          <textarea id="f_nota" placeholder="Ej: Usado para logos corpóreos, base, impresión, etc."></textarea>
        </div>
      </div>

      <div class="provider-editor">
        <div class="provider-editor-title">Proveedores y precios</div>
        <div id="providerInputs"></div>
        <button class="action orange" type="button" onclick="addProviderInput()">+ Añadir proveedor</button>
      </div>
    </div>

    <div class="modal-foot">
      <button class="btn light" type="button" onclick="closeMaterialModal()">Cancelar</button>
      <button class="btn orange" type="button" onclick="saveMaterial()">Guardar material</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=24"></script>
<script src="js/auth.js?v=24"></script>
<script src="js/menu.js?v=11"></script>

<script>
const STORAGE_KEY = "tutto_materia_prima_demo_v2";

const catalogoBase = [
  {categoria:"PVC", nombre:"Blanco", espesor:"3mm", ancho_cm:120, largo_cm:240, nota:"PVC blanco estándar."},
  {categoria:"PVC", nombre:"Blanco", espesor:"5mm", ancho_cm:120, largo_cm:240, nota:"PVC blanco intermedio."},
  {categoria:"PVC", nombre:"Blanco", espesor:"9mm", ancho_cm:120, largo_cm:240, nota:"PVC blanco para corpóreos."},
  {categoria:"ACRILICO", nombre:"Transparente", espesor:"3mm", ancho_cm:120, largo_cm:240, nota:"Acrílico transparente."},
  {categoria:"ACRILICO", nombre:"Transparente", espesor:"5mm", ancho_cm:120, largo_cm:240, nota:"Acrílico transparente grueso."},
  {categoria:"VINIL", nombre:"Adhesivo Blanco", espesor:"-", ancho_cm:137, largo_cm:5000, nota:"Rollo de vinil adhesivo."}
];

const demoMateriales = [
  {
    categoria:"ACRILICO", nombre:"TRANSPARENTE", espesor:"3mm", ancho_cm:120, largo_cm:240, formato:"120 × 240 cm", area:2.88,
    nota:"Los proveedores se muestran ordenados de menor a mayor precio.",
    proveedores:[
      {nombre:"Vecxel", precio:80, fecha:"2026-05-23"},
      {nombre:"AR2", precio:90, fecha:"2026-05-23"},
      {nombre:"Proveedor C", precio:95, fecha:"2026-05-10"}
    ]
  },
  {
    categoria:"PVC", nombre:"BLANCO", espesor:"3mm", ancho_cm:120, largo_cm:240, formato:"120 × 240 cm", area:2.88,
    nota:"PVC blanco estándar para router y letras pequeñas.",
    proveedores:[
      {nombre:"AR2", precio:35, fecha:"2026-05-23"},
      {nombre:"Vecxel", precio:38, fecha:"2026-05-23"},
      {nombre:"Proveedor B", precio:42, fecha:"2026-05-10"}
    ]
  }
];

let materiales = loadMateriales();
let categoriaActual = "TODOS";
let editIndex = null;

function loadMateriales(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? JSON.parse(saved) : structuredClone(demoMateriales);
  }catch(e){
    return structuredClone(demoMateriales);
  }
}

function persist(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(materiales));
}

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=> el.style.display = "none", 2200);
}

function calcArea(anchoCm, largoCm){
  const a = Number(anchoCm || 0);
  const l = Number(largoCm || 0);
  if(!a || !l) return 0;
  return (a / 100) * (l / 100);
}

function formatoFromCm(anchoCm, largoCm){
  if(!anchoCm || !largoCm) return "";
  return `${Number(anchoCm)} × ${Number(largoCm)} cm`;
}

function proveedoresOrdenados(item){
  return [...(item.proveedores || [])].sort((a,b)=>Number(a.precio||0)-Number(b.precio||0));
}

function minPrecio(item){
  const prov = proveedoresOrdenados(item);
  return prov.length ? Number(prov[0].precio || 0) : 0;
}

function maxPrecio(item){
  const prov = proveedoresOrdenados(item);
  return prov.length ? Number(prov[prov.length-1].precio || 0) : 0;
}

function mejorProveedor(item){
  const prov = proveedoresOrdenados(item);
  return prov.length ? prov[0].nombre : "-";
}

function costoM2(precio, area){
  if(!area || area<=0) return "-";
  return "$" + (Number(precio || 0) / area).toFixed(2);
}

function rangoLamina(item){
  const min = minPrecio(item), max = maxPrecio(item);
  if(!min && !max) return "-";
  return min === max ? "$" + min : "$" + min + " – $" + max;
}

function setCat(cat, btn){
  categoriaActual = cat;
  document.querySelectorAll(".cat").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  render();
}

function toggleItem(index){
  const item = document.getElementById("item_" + index);
  if(item) item.classList.toggle("open");
}

function openMaterialModal(index = null){
  editIndex = index;
  document.getElementById("modalTitle").textContent = index === null ? "Añadir material" : "Editar material";

  const item = index === null ? {
    categoria:"PVC", nombre:"", espesor:"", ancho_cm:"", largo_cm:"", formato:"", area:"", nota:"", proveedores:[]
  } : materiales[index];

  document.getElementById("f_categoria").value = item.categoria || "PVC";
  document.getElementById("f_nombre").value = item.nombre || "";
  document.getElementById("f_espesor").value = item.espesor || "";
  document.getElementById("f_ancho_cm").value = item.ancho_cm || "";
  document.getElementById("f_largo_cm").value = item.largo_cm || "";
  document.getElementById("f_formato").value = item.formato || "";
  document.getElementById("f_area").value = item.area || "";
  document.getElementById("f_nota").value = item.nota || "";

  const providerBox = document.getElementById("providerInputs");
  providerBox.innerHTML = "";
  (item.proveedores || []).forEach(p => addProviderInput(p));
  if(!(item.proveedores || []).length) addProviderInput();

  document.getElementById("materialBackdrop").style.display = "flex";
}

function openFromCatalog(i){
  const c = catalogoBase[i];
  openMaterialModal();
  document.getElementById("f_categoria").value = c.categoria;
  document.getElementById("f_nombre").value = c.nombre;
  document.getElementById("f_espesor").value = c.espesor;
  document.getElementById("f_ancho_cm").value = c.ancho_cm;
  document.getElementById("f_largo_cm").value = c.largo_cm;
  document.getElementById("f_nota").value = c.nota;
  autoFormatoYArea();
}

function closeMaterialModal(){
  document.getElementById("materialBackdrop").style.display = "none";
}

function backdropClick(e){
  if(e.target.id === "materialBackdrop") closeMaterialModal();
}

function addProviderInput(provider = {}){
  const box = document.getElementById("providerInputs");
  const row = document.createElement("div");
  row.className = "provider-input-row";
  row.innerHTML = `
    <input class="p_nombre" placeholder="Proveedor" value="${provider.nombre || ""}">
    <input class="p_precio" type="number" step="0.01" placeholder="$" value="${provider.precio || ""}">
    <input class="p_fecha" type="date" value="${provider.fecha || new Date().toISOString().slice(0,10)}">
    <button class="remove-provider" type="button" onclick="this.closest('.provider-input-row').remove()">✕</button>
  `;
  box.appendChild(row);
}

function autoFormatoYArea(){
  const ancho = Number(document.getElementById("f_ancho_cm").value || 0);
  const largo = Number(document.getElementById("f_largo_cm").value || 0);
  const area = calcArea(ancho, largo);

  document.getElementById("f_formato").value = formatoFromCm(ancho, largo);
  document.getElementById("f_area").value = area ? area.toFixed(4) : "";
}

document.addEventListener("input", function(e){
  if(["f_ancho_cm","f_largo_cm"].includes(e.target.id)) autoFormatoYArea();
});

function saveMaterial(){
  const anchoCm = Number(document.getElementById("f_ancho_cm").value || 0);
  const largoCm = Number(document.getElementById("f_largo_cm").value || 0);
  const area = calcArea(anchoCm, largoCm);

  const proveedores = [...document.querySelectorAll(".provider-input-row")].map(row => {
    return {
      nombre: row.querySelector(".p_nombre").value.trim(),
      precio: Number(row.querySelector(".p_precio").value || 0),
      fecha: row.querySelector(".p_fecha").value || new Date().toISOString().slice(0,10)
    };
  }).filter(p => p.nombre && p.precio > 0);

  const item = {
    categoria: document.getElementById("f_categoria").value,
    nombre: document.getElementById("f_nombre").value.trim().toUpperCase(),
    espesor: document.getElementById("f_espesor").value.trim(),
    ancho_cm: anchoCm,
    largo_cm: largoCm,
    formato: document.getElementById("f_formato").value.trim(),
    area: Number(area.toFixed(4)),
    nota: document.getElementById("f_nota").value.trim(),
    proveedores
  };

  if(!item.nombre){ toast("Falta nombre"); return; }
  if(!item.ancho_cm || !item.largo_cm){ toast("Falta ancho o largo en cm"); return; }
  if(!item.proveedores.length){ toast("Agrega al menos un proveedor"); return; }

  if(editIndex === null){
    materiales.unshift(item);
    toast("Material agregado");
  }else{
    materiales[editIndex] = item;
    toast("Material actualizado");
  }

  persist();
  closeMaterialModal();
  render();
}

function deleteMaterial(index){
  if(!confirm("¿Eliminar este material?")) return;
  materiales.splice(index, 1);
  persist();
  render();
  toast("Material eliminado");
}

function addPriceToMaterial(index){
  openMaterialModal(index);
  setTimeout(()=> addProviderInput(), 100);
}

function resetDemo(){
  if(!confirm("¿Resetear demo y borrar materiales guardados en este navegador?")) return;
  localStorage.removeItem(STORAGE_KEY);
  materiales = structuredClone(demoMateriales);
  render();
  toast("Demo reiniciada");
}

function renderCatalog(){
  document.getElementById("catalogPreview").innerHTML = catalogoBase.map((c, i)=>{
    const area = calcArea(c.ancho_cm, c.largo_cm);
    return `
      <div class="catalog-card">
        <small>${c.categoria} · ${c.espesor}</small>
        <strong>${c.nombre}</strong>
        <small style="margin-top:4px">${c.ancho_cm} × ${c.largo_cm} cm · ${area.toFixed(2)} m²</small>
        <button type="button" onclick="openFromCatalog(${i})">Usar catálogo</button>
      </div>
    `;
  }).join("");
}

function render(){
  renderCatalog();

  const q = document.getElementById("searchInput").value.toUpperCase().trim();

  const lista = materiales.map((item, originalIndex)=>({...item, originalIndex})).filter(item=>{
    const proveedoresTexto = (item.proveedores || []).map(p=>`${p.nombre} ${p.precio} ${p.fecha}`).join(" ");
    const texto = `${item.categoria} ${item.nombre} ${item.espesor} ${item.formato} ${item.nota} ${proveedoresTexto}`.toUpperCase();
    return texto.includes(q) && (categoriaActual === "TODOS" || item.categoria === categoriaActual);
  });

  document.getElementById("materialList").innerHTML = lista.map(item=>{
    const proveedores = proveedoresOrdenados(item);

    return `
      <article class="item" id="item_${item.originalIndex}">
        <button class="item-main" type="button" onclick="toggleItem(${item.originalIndex})">
          <span class="badge">${item.categoria}</span>

          <span class="name">
            <strong>${item.nombre}</strong>
            <small>${item.espesor || "-"} · ${item.formato} · ${Number(item.area || 0).toFixed(2)} m²</small>
          </span>

          <span class="cell-mini lamina">
            <small>Lámina</small>
            <strong>${rangoLamina(item)}</strong>
          </span>

          <span class="cell-mini best hide-mobile">
            <small>Mejor prov.</small>
            <strong>${mejorProveedor(item)}</strong>
          </span>

          <span class="arrow">⌄</span>
        </button>

        <div class="item-details">
          <div class="provider-title">
            <span>Proveedores de menor a mayor</span>
            <span>Precio lámina · Precio m²</span>
          </div>

          <div class="provider-list">
            ${proveedores.map((p, idx)=>`
              <div class="provider-row">
                <div class="provider-rank">${idx + 1}</div>
                <div class="provider-name">${p.nombre}</div>
                <div class="provider-price">$${p.precio}</div>
                <div class="provider-m2">${costoM2(p.precio, item.area)} /m²</div>
                <div class="provider-date">${p.fecha || "-"}</div>
                <button class="icon-btn" type="button" onclick="event.stopPropagation(); openMaterialModal(${item.originalIndex})">✎</button>
              </div>
            `).join("")}
          </div>

          ${item.nota ? `<div class="detail-note">${item.nota}</div>` : ""}

          <div class="detail-actions">
            <button class="action" type="button" onclick="event.stopPropagation(); openMaterialModal(${item.originalIndex})">Editar material</button>
            <button class="action orange" type="button" onclick="event.stopPropagation(); addPriceToMaterial(${item.originalIndex})">+ Precio proveedor</button>
            <button class="action" type="button" onclick="event.stopPropagation(); deleteMaterial(${item.originalIndex})">Eliminar</button>
          </div>
        </div>
      </article>
    `;
  }).join("");

  document.getElementById("emptyState").style.display = lista.length ? "none" : "block";
}

document.getElementById("searchInput").addEventListener("input", render);

window.addEventListener("load", function(){
  document.documentElement.classList.remove("loading-menu");
  document.documentElement.classList.add("menu-ready");
});

render();
</script>
</body>
</html>
