<!DOCTYPE html>
<html lang="es" class="loading-menu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Materia Prima · Tuttovinilos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/menu.css?v=34">

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f0f2f9;
  --panel:#ffffff;
  --panel2:#f8f9ff;
  --border:#d9deea;
  --border2:#cbd3e6;
  --text:#111827;
  --muted:#6b7280;
  --accent:#153bff;
  --accent2:#0b1f7a;
  --head:'Montserrat',Arial,sans-serif;
  --body:'Inter',Arial,sans-serif;
  --mono:'Roboto Mono',monospace;
}

html,body{
  background:var(--bg)!important;
  color:var(--text);
  font-family:var(--body);
  min-height:100vh;
  color-scheme:light;
}

button,input,select,textarea{font:inherit;color-scheme:light}

.main{
  padding:18px;
  max-width:1280px;
  margin:0 auto;
}

.page-head{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:22px;
  padding:18px;
  box-shadow:0 8px 24px rgba(15,23,42,.06);
  margin-bottom:14px;
}

.page-title{
  font-family:var(--head);
  font-size:24px;
  font-weight:900;
  color:var(--accent2);
  text-transform:uppercase;
}

.page-sub{
  margin-top:5px;
  color:var(--muted);
  font-size:14px;
  font-weight:600;
}

.tools{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  margin-top:16px;
}

.search{
  min-height:44px;
  border:1px solid var(--border2);
  border-radius:14px;
  padding:0 14px;
  font-size:14px;
  outline:none;
  background:white;
  color:#111827;
}

.btn{
  border:0;
  background:var(--accent);
  color:white;
  border-radius:14px;
  padding:0 18px;
  font-family:var(--head);
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.5px;
  cursor:pointer;
  min-height:44px;
}

.cats{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:14px 0 4px;
}

.cat{
  border:1px solid var(--border2);
  background:white;
  color:var(--accent2);
  border-radius:999px;
  padding:10px 15px;
  font-family:var(--head);
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  white-space:nowrap;
  cursor:pointer;
}

.cat.active{
  background:var(--accent);
  color:white;
  border-color:var(--accent);
}

.summary{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
  margin-bottom:14px;
}

.summary-card{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  box-shadow:0 6px 18px rgba(15,23,42,.045);
}

.summary-card small{
  color:var(--muted);
  font-family:var(--head);
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
}

.summary-card strong{
  display:block;
  margin-top:4px;
  color:var(--accent2);
  font-family:var(--mono);
  font-size:20px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:12px;
  margin-bottom:14px;
}

.card{
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  padding:15px;
  box-shadow:0 6px 18px rgba(15,23,42,.045);
}

.card-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:flex-start;
}

.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:#eef1ff;
  color:var(--accent);
  border:1px solid #c7d2fe;
  border-radius:999px;
  padding:5px 9px;
  font-size:10px;
  font-family:var(--head);
  font-weight:900;
  white-space:nowrap;
}

.card h3{
  font-family:var(--head);
  font-size:17px;
  color:var(--accent2);
  margin-bottom:5px;
}

.meta{
  color:var(--muted);
  font-size:13px;
  font-weight:600;
}

.prices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.pricebox{
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:14px;
  padding:10px;
}

.pricebox small{
  color:var(--muted);
  font-size:11px;
  font-weight:800;
}

.pricebox strong{
  display:block;
  margin-top:4px;
  font-family:var(--mono);
  font-size:18px;
  color:var(--accent);
}

.table-wrap{
  background:white;
  border:1px solid var(--border);
  border-radius:20px;
  overflow:auto;
  box-shadow:0 8px 24px rgba(15,23,42,.05);
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:980px;
}

th{
  background:#eef1ff;
  color:#5b6474;
  font-family:var(--head);
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.5px;
  padding:12px;
  text-align:left;
  white-space:nowrap;
}

td{
  padding:12px;
  border-bottom:1px solid #e5e7f0;
  font-size:13px;
  font-weight:600;
  color:#111827;
}

tr:nth-child(even) td{
  background:#f8f9ff;
}

.action{
  border:1px solid #c7d2fe;
  background:#eef1ff;
  color:var(--accent);
  border-radius:999px;
  padding:7px 11px;
  font-family:var(--head);
  font-size:10px;
  font-weight:900;
  cursor:pointer;
}

.empty{
  background:white;
  border:1px dashed var(--border2);
  border-radius:18px;
  padding:28px;
  text-align:center;
  color:var(--muted);
  font-family:var(--head);
  font-weight:900;
  text-transform:uppercase;
  display:none;
}

@media(max-width:760px){
  .main{padding:12px}
  .page-title{font-size:19px}
  .tools{grid-template-columns:1fr}
  .btn{width:100%}
  .cards{grid-template-columns:1fr}
  table{min-width:850px}
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">
    <img src="Logo tutto1.svg" alt="Tutto Vinilos">
    <small>COMANDA</small>
  </div>

  <nav class="header-tabs" data-auth-menu id="authMenu"></nav>
</header>

<main class="main">

  <section class="page-head">
    <h1 class="page-title">Materia prima</h1>
    <p class="page-sub">Lista de precios por categoría, formato, costo de lámina y costo por m².</p>

    <div class="tools">
      <input class="search" id="searchInput" placeholder="Buscar PVC, acrílico, 3mm, formato, proveedor...">
      <button class="btn" type="button" onclick="alert('Luego conectamos este botón a Supabase')">+ Añadir material</button>
    </div>

    <div class="cats">
      <button class="cat active" type="button" onclick="setCat('TODOS', this)">Todos</button>
      <button class="cat" type="button" onclick="setCat('PVC', this)">PVC</button>
      <button class="cat" type="button" onclick="setCat('ACRILICO', this)">Acrílico</button>
      <button class="cat" type="button" onclick="setCat('VINIL', this)">Vinil</button>
      <button class="cat" type="button" onclick="setCat('LED', this)">Iluminación</button>
      <button class="cat" type="button" onclick="setCat('CONSUMIBLE', this)">Consumibles</button>
    </div>
  </section>

  <section class="summary">
    <div class="summary-card">
      <small>Materiales visibles</small>
      <strong id="sumItems">0</strong>
    </div>
    <div class="summary-card">
      <small>Categoría activa</small>
      <strong id="sumCat">TODOS</strong>
    </div>
    <div class="summary-card">
      <small>Promedio m²</small>
      <strong id="sumAvg">$0</strong>
    </div>
  </section>

  <section class="cards" id="cards"></section>

  <div class="empty" id="emptyState">Sin materiales encontrados</div>

  <section class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Categoría</th>
          <th>Material</th>
          <th>Espesor</th>
          <th>Formato</th>
          <th>Precio formato</th>
          <th>Área</th>
          <th>Costo m²</th>
          <th>Proveedor</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=24"></script>
<script src="js/auth.js?v=24"></script>
<script src="js/menu.js?v=11"></script>

<script>
const materiales = [
  { categoria:"PVC", material:"PVC Blanco", espesor:"3mm", formato:"120 x 240 cm", precio:35, area:2.88, proveedor:"Proveedor A" },
  { categoria:"PVC", material:"PVC Blanco", espesor:"5mm", formato:"120 x 240 cm", precio:45, area:2.88, proveedor:"Proveedor A" },
  { categoria:"PVC", material:"PVC Blanco", espesor:"9mm", formato:"120 x 240 cm", precio:48, area:2.88, proveedor:"Proveedor B" },
  { categoria:"PVC", material:"PVC Blanco", espesor:"15mm", formato:"120 x 240 cm", precio:68, area:2.88, proveedor:"Proveedor B" },
  { categoria:"PVC", material:"PVC Blanco", espesor:"18mm", formato:"120 x 240 cm", precio:78, area:2.88, proveedor:"Proveedor B" },
  { categoria:"ACRILICO", material:"Acrílico Transparente", espesor:"3mm", formato:"120 x 240 cm", precio:90, area:2.88, proveedor:"Proveedor C" },
  { categoria:"ACRILICO", material:"Acrílico Transparente", espesor:"5mm", formato:"120 x 240 cm", precio:140, area:2.88, proveedor:"Proveedor C" },
  { categoria:"ACRILICO", material:"Acrílico Transparente", espesor:"8mm", formato:"120 x 240 cm", precio:180, area:2.88, proveedor:"Proveedor C" },
  { categoria:"VINIL", material:"Vinil Adhesivo", espesor:"-", formato:"137 cm x 50 m", precio:110, area:68.5, proveedor:"Proveedor Vinil" },
  { categoria:"VINIL", material:"Vinil Holográfico", espesor:"-", formato:"137 cm x 50 m", precio:280, area:68.5, proveedor:"Proveedor Vinil" },
  { categoria:"LED", material:"Módulos LED", espesor:"-", formato:"20 módulos", precio:8, area:0, proveedor:"Proveedor LED" },
  { categoria:"CONSUMIBLE", material:"Cable", espesor:"-", formato:"Metro lineal", precio:1, area:0, proveedor:"General" }
];

let categoriaActual = "TODOS";

function costoM2(item){
  if(!item.area || item.area <= 0) return "-";
  return "$" + (item.precio / item.area).toFixed(2);
}

function numCostoM2(item){
  if(!item.area || item.area <= 0) return null;
  return item.precio / item.area;
}

function setCat(cat, btn){
  categoriaActual = cat;
  document.querySelectorAll(".cat").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  render();
}

function render(){
  const q = document.getElementById("searchInput").value.toUpperCase().trim();

  const lista = materiales.filter(item => {
    const texto = Object.values(item).join(" ").toUpperCase();
    const okTexto = texto.includes(q);
    const okCat = categoriaActual === "TODOS" || item.categoria === categoriaActual;
    return okTexto && okCat;
  });

  document.getElementById("cards").innerHTML = lista.map(item => `
    <article class="card">
      <div class="card-top">
        <div>
          <h3>${item.material}</h3>
          <div class="meta">${item.espesor} · ${item.formato}</div>
        </div>
        <span class="badge">${item.categoria}</span>
      </div>

      <div class="prices">
        <div class="pricebox">
          <small>Precio formato</small>
          <strong>$${item.precio}</strong>
        </div>
        <div class="pricebox">
          <small>Costo m²</small>
          <strong>${costoM2(item)}</strong>
        </div>
      </div>
    </article>
  `).join("");

  document.getElementById("tableBody").innerHTML = lista.map(item => `
    <tr>
      <td><span class="badge">${item.categoria}</span></td>
      <td>${item.material}</td>
      <td>${item.espesor}</td>
      <td>${item.formato}</td>
      <td>$${item.precio}</td>
      <td>${item.area ? item.area + " m²" : "-"}</td>
      <td>${costoM2(item)}</td>
      <td>${item.proveedor}</td>
      <td><button class="action" type="button">Editar</button></td>
    </tr>
  `).join("");

  const costos = lista.map(numCostoM2).filter(v => v !== null);
  const promedio = costos.length ? costos.reduce((a,b)=>a+b,0) / costos.length : 0;

  document.getElementById("sumItems").textContent = lista.length;
  document.getElementById("sumCat").textContent = categoriaActual;
  document.getElementById("sumAvg").textContent = costos.length ? "$" + promedio.toFixed(2) : "-";
  document.getElementById("emptyState").style.display = lista.length ? "none" : "block";
}

document.getElementById("searchInput").addEventListener("input", render);

window.addEventListener("load", function(){
  document.documentElement.classList.remove("loading-menu");
  document.documentElement.classList.add("menu-ready");
});

render();
</script>

</body>
</html>
