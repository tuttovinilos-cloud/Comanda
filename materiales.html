<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Materiales - Comanda</title>

  <style>
    body{
      margin:0;
      background:#090d14;
      color:#e8eefc;
      font-family:Arial, sans-serif;
      padding:24px;
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:24px;
    }

    a, button{
      background:#2563eb;
      color:white;
      border:none;
      padding:10px 14px;
      border-radius:8px;
      text-decoration:none;
      cursor:pointer;
      font-weight:700;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:#101623;
      border:1px solid #26324a;
      border-radius:10px;
      overflow:hidden;
    }

    th, td{
      padding:12px;
      border-bottom:1px solid #26324a;
      text-align:left;
    }

    th{
      color:#8ea6d9;
      font-size:12px;
      text-transform:uppercase;
    }

    input, select{
      background:#090d14;
      color:#e8eefc;
      border:1px solid #2c3854;
      border-radius:6px;
      padding:8px;
      width:100%;
    }

    .actions{
      display:flex;
      gap:8px;
    }

    .danger{
      background:#b91c1c;
    }

    .success{
      background:#16a34a;
    }
  </style>
</head>

<body>
  <div class="top">
    <div>
      <h1>Materiales</h1>
      <p>Administración de materiales y precios base</p>
    </div>

    <div class="actions">
      <a href="index.html">⬅ Volver a pedidos</a>
      <button onclick="nuevoMaterial()">+ Nuevo material</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Precio base</th>
        <th>Activo</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody id="materialesBody"></tbody>
  </table>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/materiales.js"></script>
</body>
</html>
