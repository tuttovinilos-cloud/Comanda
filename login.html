<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>COMANDA · Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#0b0f17;
      color:#e2e8f0;
      font-family:'Barlow',Arial,sans-serif;
    }
    .shell{
      width:min(520px, 92vw);
      padding:22px;
      border:1px solid #1e293b;
      border-radius:14px;
      background:#0f172a;
      box-shadow:0 30px 90px rgba(0,0,0,.55);
    }
    .brand{
      display:flex;
      align-items:baseline;
      gap:10px;
      font-family:'Barlow Condensed',Arial,sans-serif;
      letter-spacing:2px;
      text-transform:uppercase;
    }
    .brand b{font-size:26px;color:#60a5fa}
    .brand small{font-size:12px;color:#94a3b8}
    .hint{margin-top:10px;color:#94a3b8;font-size:13px;line-height:1.35}
  </style>
</head>
<body>
  <div class="shell">
    <div class="brand"><b>COMANDA</b><small>Acceso</small></div>
    <div class="hint">Ingresa con tu operador y clave para continuar.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
